/* 결산서 원문을 올린다 — 자료실 「회계 · 지출」에도 함께 등록된다 */
async function finUp(file){
  const Y = finCur(); if(!Y || !file) return;
  if(FIN.busy) return;
  FIN.busy = true;
  const pct = p => { const e = document.getElementById("fin-pct");
    if(e) e.textContent = p < 100 ? `올리는 중입니다 · ${p}%` : "거의 다 됐습니다"; };
  const v = await hubPull("arc_seq", null);
  ARC_SEQ = Math.max(ARC_SEQ, (+v || 0)) + 1;
  const id = `AR-${new Date().getFullYear()}-${String(ARC_SEQ).padStart(3,"0")}`;
  const r = await hubUploadBig(file, hubPath("arc", id), pct);
  if(!r.ok){ FIN.busy = false; render(); alert(r.why || "올리지 못했습니다."); return; }
  const d = new Date(), z = x => String(x).padStart(2,"0");
  const now = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;
  const rec = {
    id, cat:"acct", title:`${Y.y}년 결산서`, sub:"총회 승인 결산",
    file:file.name, size:file.size, path:r.path, parts:r.parts || null,
    at:`${Y.y}-12-31 00:00`, upAt:now, by:S.name, state:"pending", index:[]
  };
  ARC_DOCS.push(rec);
  Y.docId = id;
  FIN.busy = false;
  await hubPush("arc_seq", ARC_SEQ, S.name);
  render();
  const ok = await arcSave(`${Y.y}년 결산서 원문`);
  await finSave(true);
  /* ★ 2026-09-22 — 자료 등록 때와 같이 AI 가 바로 질문을 뽑는다.
     여기서 올린 자료만 이 걸음이 빠져 있었다. */
  arcDraft(rec);
  if(ok) alert(`올렸습니다.\n\n자료실 「회계 · 지출」에 「${Y.y}년 결산서」로 등록했습니다.\n`
    + `★ 질문 뽑기와 검수는 자료 등록 화면에서 하십시오.`);
}

       그런데 hub.js 648줄에 이렇게 적혀 있다.

         「슬래시를 쓰지 않는다. 폴더처럼 나누면 주소에서 %2F 로 바뀌는데,
           임시 주소를 만들 때와 열 때 경로가 어긋나 InvalidSignature 가 난다.」

       ★ 올리기는 된다. **주소를 못 받아 사진이 안 뜬다.**
         조합원 화면에 자리만 잡히고 그림이 비었다.

       ★ hubPath() 를 쓰면 __ 로 평평하게 이어 준다.
         있는 것을 두고 새로 만들었다가 그 함정을 그대로 밟았다. */
    const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [".jpg"])[0].toLowerCase();
    const path = hubPath("news", Date.now() + "-" + n) + ext;
    const box = document.getElementById("nwPicBox");
    if(box) box.innerHTML = `<p class="hint">올리는 중입니다…</p>`;
    const r = await hubUpload(f, path);
    if(!r || !r.ok){
      alert("사진을 올리지 못했습니다.\n\n" + ((r && r.why) || "다시 해보십시오."));
      render(); return;
    }
    /* ★ 가로세로를 재 둔다. 폰에서 자리를 미리 잡아
       사진이 뜰 때 글이 아래로 밀리지 않게 한다. */
    const sz = await nwPicSize(f);
    NW.pics.push({path, name:f.name, w:sz.w, h:sz.h});
    render();
  };
  inp.click();
}

/* 사진의 가로세로를 잰다 */
function nwPicSize(file){
  return new Promise(res => {
    try{
      const u = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { res({w:im.naturalWidth, h:im.naturalHeight});
        URL.revokeObjectURL(u); };
      im.onerror = () => { res({w:0,h:0}); URL.revokeObjectURL(u); };
      im.src = u;
    }catch(e){ res({w:0,h:0}); }
  });
}

/* 직원 화면의 사진을 채운다 (2026-09-19).
   ★ 여기 보이면 길이 맞는 것이다. 조합원 화면에서 안 보이면
     그때는 **길이 아니라 다른 데** 문제가 있다는 뜻이다. */
async function nwPicShow(){
  try{
    for(const el of document.querySelectorAll("[data-nwadm]")){
      if(el.src) continue;
      const u = await hubFileUrl(el.dataset.nwadm, 600);
      if(u) el.src = u;
      else { const b = el.closest(".nwpv"); if(b) b.classList.add("bad"); }
    }
  }catch(e){}
}

function nwPicDel(i){
  const p = NW.pics[i]; if(!p) return;
  if(!confirm(`[사진${i+1}] 을 지웁니다.\n${p.name}\n\n`
    + "★ 본문에 적으신 [사진…] 번호가 밀립니다.\n계속하시겠습니까?")) return;
  NW.pics.splice(i, 1);
  render();

/* 본문 커서 자리에 [사진N] 을 넣어 드린다 */
function nwPicPut(i){
  const el = document.getElementById("nw-body");
  if(!el) return;
  const mark = `\n[사진${i+1}]\n`;
  const a = el.selectionStart, b = el.selectionEnd;
  el.value = el.value.slice(0,a) + mark + el.value.slice(b);
  NW.body = el.value;
  el.focus();
  try{ el.setSelectionRange(a + mark.length, a + mark.length); }catch(e){}
  nwLive("body", el.value);
}

function nwEdit(id){
  const x = NEWS_LIST.find(y=>y.id===id); if(!x) return;
  NW.edit=id; NW.kind=x.kind; NW.t=x.t; NW.d=x.d; NW.body=x.body; NW.urgent=x.urgent;
  NW.tag=x.tag||""; NW.sub=x.sub||""; NW.home=x.home!==false;
  NW.docId = x.docId || ""; NW.fromDoc = !!x.docId; NW.pics=(x.pics||[]).slice();     /* ★ 표 사진도 함께 (2026-09-18) */
  render();
  /* ★ 2026-09-19 — 누르신 뒤 왼쪽 칸이 보이게 한다.
     화면이 1760px 로 넓어 목록은 오른쪽 끝에 있다.
     맨 위로만 올리면 **왼쪽에서 무엇이 바뀌었는지** 모르신다.
     제목 칸으로 데려가 커서까지 놓아 드린다. */
  setTimeout(() => {

       agendas     ← DEMO_MEETING.agendas

/* ★ 2026-08-31 — 총회가 여럿이 됐다.
   서버(meetings 표)에서 고른 하나를 돌려준다.
   표가 없거나 비었으면 roster-demo.js 의 예시 총회를 돌려준다. */
const MT  = () => (typeof mtCur !== "undefined") ? mtCur()
                : (typeof DEMO_MEETING !== "undefined") ? DEMO_MEETING : null;
const AGS = () => MT() ? MT().agendas : [];
const VT  = () => (typeof DEMO_VOTES !== "undefined") ? DEMO_VOTES : [];
const WD  = () => (typeof DEMO_WITHDRAWALS !== "undefined") ? DEMO_WITHDRAWALS : [];
const STATUS_KO = {draft:"대기", open:"진행중", closed:"마감"};

/* 가결 판정 : 안건의 기준에 따라 모수가 달라진다 */
function verdict(a){
  const t = tallyAgenda(a.agenda_id);
  /* 모수를 문자열로 판단하지 말 것. "출석 조합원 과반수"도 걸려서 틀린다. */
  const base = a.quorum_base === "members" ? t.total : t.join;
  const need = Math.floor(base / 2) + 1;
  const attendNeed = Math.ceil(t.total * a.quorum_attend / 100);
  return {t, need, base, attendNeed,
          passVote: t.yes >= need, passAttend: t.join >= attendNeed};
}

/* 목록의 「의결 기록」 칸.
   ★ 「1건 넘어감」만 적으면 아직 안 넣은 것이 가려진다.

     조합원 앱에는 한 건만 나가 있는데 다 끝난 줄 아신다. */
function mtDecCell(m){
  const nv = (m.agendas || []).filter(a => a.is_vote).length;
  if(!nv) return `<span style="color:var(--muted)">의결 없음</span>`;
  const left = (typeof agWaiting !== "undefined") ? agWaiting(m).length : 0;
  if(m.status !== "closed" && left === nv)
    return `<span style="color:var(--muted)">회의 뒤</span>`;
  if(left) return `<span style="color:var(--amber);font-weight:700">${
    nv - left}/${nv}건 · ${left}건 남음</span>`;
  return `<b>${nv}건</b> 넘어감`;
}

     「정보몽땅에 다 나오는 자료들」이라고 하셨다. 틀린 말이 아니다.

     ★ 정보몽땅이 못 하는 것은 둘뿐이다.

      조합원이 금방 알아채고, 그때부터 아무도 안 봅니다.</p></div>`;

async function mtTellOn(){
  const m = MT(); if(!m || MT_BUSY) return;
  if(!String(m.headline || "").trim()){ alert("한 줄 요약을 적어 주십시오."); return; }
  /* ★ 먼저 저장한다. 화면에 친 것이 서버에 없는 채로 알리면
     조합원에게 빈 소식이 나간다. */
  MT_BUSY = true;
  let r = await meetingSave(m.meeting_id, m, S.name);
  if(r.ok) r = await meetingTell(m.meeting_id, true, S.name);
  MT_BUSY = false;
  if(!r.ok){ alert("알리지 못했습니다.\n\n" + (r.why || "")); return; }
  alert("조합원 앱에 올렸습니다.\n\n"
    + "자료 → 회의록 · 소식 화면에서 보입니다.\n"
    + "수정하시면 수정한 내용이 바로 반영됩니다.");
  render();
}
async function mtTellOff(){
  const m = MT(); if(!m) return;
  if(!confirm("조합원 앱에서 이 소식을 내립니다.\n\n"
    + "★ 이미 보신 분들이 있습니다. 잘못 쓴 것을 수정하실 때만 쓰십시오.\n"
    + "내렸다 올렸다 하면 「숨긴다」는 말이 나옵니다.\n\n계속하시겠습니까?")) return;
  const r = await meetingTell(m.meeting_id, false, S.name);
  if(!r.ok){ alert("내리지 못했습니다.\n\n" + (r.why || "")); return; }
  render();
}

/* ★ 총원이 어디서 온 수인지 밝힌다 (2026-08-31).
   직원이 대의원 104분을 다 넣으셨는데 총원이 25 로 남아 있어
   「총원 25 · 참석 81」 이라는 기록이 만들어진 일이 있었다.
   숫자만 보여 주면 그것이 어디서 온 것인지 알 수 없다. */
function mtBaseNote(kind){
  const dec = mtK(kind).dec;
  const gap = (typeof decBaseGap !== "undefined") ? decBaseGap(dec) : null;
  if(gap) return `<span style="color:var(--amber);font-weight:700">
    · 명단은 ${gap.now}분입니다</span>`;
  const set = (typeof DEC_BASE !== "undefined") ? +(DEC_BASE[dec]||0) : 0;
  if(set) return `<span style="color:var(--muted);font-weight:400">· 손으로 정한 값</span>`;
  const src = dec === "mtg" ? "조합원 명부" : dec === "del" ? "대의원 명단" : "임원 명단";
  return `<span style="color:var(--muted);font-weight:400">· ${src}에서</span>`;
}

/* ★ 정관이 정한 수와 실제 명단이 맞는지 짚어 준다 (2026-08-31).
   제24조 ② 대의원은 100인 이상 120인 이하.
   범위를 벗어난 채로 의결하면 나중에 정족수 다툼거리가 된다. */
function mtOrgWarn(kind){
  if(typeof ruleOrgCheck === "undefined") return "";
  const c = ruleOrgCheck(mtK(kind).dec);
  if(!c || c.ok) return "";
  return `<div class="warn"><b>${mtK(kind).who} 수가 정관과 맞지 않습니다</b>
    <p>지금 명단 <b>${c.n}분</b> · ${c.why}<br>
      ${RULEBOOK.org[mtK(kind).dec]
        ? `<span style="white-space:pre-line">${RULEBOOK.org[mtK(kind).dec].note}</span>` : ""}<br>
      ★ 이대로 의결하시면 나중에 <b>정족수 다툼거리</b>가 됩니다.
      사무실 · 임원 화면에서 명단을 맞춰 주십시오.</p></div>`;
}

/* 안건 하나의 가결 판정 — 의결 기록과 같은 셈법을 쓴다 */
function mtAgCalc(m, a){
  const total = +a.total || mtBaseOf(m.kind) || 0;
  /* ★ 반대표는 a.nay 다. a.no 는 안건 번호다. */
  const att = +a.att||0, yes = +a.yes||0, no = +a.nay||0, abs = +a.abs||0;
  const rule = agRule(a);
  /* ★ 의결 기록과 같은 셈법을 쓴다. DEC_RULE 은 tenant-demo.js 에 있다.
     여기서 따로 셈하면 두 화면이 다른 답을 내고, 그때는 어느 쪽이
     맞는지 아무도 모른다. */
  const need = (typeof DEC_RULE !== "undefined" && DEC_RULE[rule])
    ? DEC_RULE[rule].need(att, total)
    : Math.floor(att/2)+1;
  return {total, att, yes, no, abs, need, ok:yes >= need,
    rate: att ? Math.round(yes/att*1000)/10 : 0};
}

/* ── 여닫기 ────────────────────────────────────────────────── */
function mtOpen(id){
  if(typeof mtPickOne !== "undefined") MT_CUR = id;
  MTV = "detail"; render(); scrollTo(0,0);
}

/* 총회 정보 고치기 — 미리보기만 갈아 끼워 커서가 튀지 않게 한다.
   ★ 서버에는 [저장]을 누르실 때 한 번만 보낸다.
     한 글자마다 보내면 총회명을 치는 동안 스무 번이 나간다. */
function mtLive(k, v){
  const m = MT(); if(!m) return;
  m[k] = v;
  const box = document.querySelector('.pv-side .ph-b');
  if(box) box.innerHTML = meetPhone();
}
function mtSet(k, v){
  const m = MT(); if(!m) return;
  m[k] = v;
  /* ★ 종류를 바꾸면 차수와 이름이 함께 바뀐다.
     대의원회를 정기총회로 바꿨는데 「제2026-4차」가 남아 있으면 안 된다. */
  if(k === "kind"){
    const K = mtK(v);
    if(!K.seq) m.seq = null;
    else if(!m.seq) m.seq = mtNextSeq(v, m.year);
  }
  m.title = mtTitleOf(m.kind, m.year, m.seq);
  render();
}

async function mtSaveNow(){
  const m = MT(); if(!m || MT_BUSY) return;
  if(!m.meet_date){ alert("개최일을 넣어 주십시오."); return; }
  if(!String(m.title || "").trim()){ alert("총회명을 적어 주십시오."); return; }
  MT_BUSY = true;
  const r = await meetingSave(m.meeting_id, m, S.name);
  MT_BUSY = false;
  if(!r.ok){ alert("저장하지 못했습니다.\n\n" + (r.why || "")); return; }
  render();
}

/* 새 총회 — 만들면 바로 상세로 넘어간다 */
/* 새 회의 — 지금 보고 계신 갈래로 만든다.
   ★ 차수는 그 해 마지막 것 다음으로 저절로 매긴다.
     손으로 치면 제3차가 둘 생긴다. */
async function mtNew(){
  if(!MT_DB_ON()){ alert(MT_NODB.why); return; }
  const today = new Date().toISOString().slice(0, 10);
  const y = +today.slice(0, 4);
  const K = mtK(MT_KIND);
  const seq = K.seq ? mtNextSeq(MT_KIND, y) : null;

  if(MT_KIND === "정기총회" && mtAll("정기총회").some(x => +x.year === y)
     && !confirm(`${y}년 정기총회가 이미 있습니다.\n\n`
       + `정기총회는 한 해에 한 번입니다.\n그래도 만드시겠습니까?`)) return;

  const r = await meetingAdd({kind:MT_KIND, year:y, seq:seq,
    meet_date:today, meet_time:"", place:"",
    vote_open:"", vote_close:""}, S.name);
  if(!r.ok){ alert("만들지 못했습니다.\n\n" + (r.why || "")); return; }
  MTV = "detail"; render(); scrollTo(0, 0);
}

async function addAgenda(){
  const m = MT(); if(!m) return;
  if(!MT_DB_ON() || m.demo){ alert(MT_NODB.why); return; }
  const K = mtK(m.kind);
  const r = await agendaAdd(m.meeting_id, {
    no:agNextNo(m), title:"새 안건", is_vote:true, detail:"", memo:"",
    quorum_pass:`출석 ${K.who} 과반수 찬성`, quorum_base:"attendees",
    /* 직접출석 요건은 총회에만 있다 */
    quorum_attend:K.vote ? 10 : null, law_ref:null});
  if(!r.ok){ alert("안건을 넣지 못했습니다.\n\n" + (r.why || "")); return; }
  /* ★ 넣자마자 고치는 화면을 연다. 「새 안건」이 그대로 남아 있으면
     조합원 앱에 「새 안건」이라고 나간다. */
  render();
  const m2 = MT();
  if(m2) agEdit((m2.agendas || []).length - 1);
}

/* 안건 고치기 — 한 줄씩 묻는다.
   ★ 칸이 여섯이라 상자를 따로 띄우면 화면이 무거워진다.
     안건은 총회 한 번에 대여섯 건이라 이 편이 빠르다. */
/* ═══════════════════════════════════════════════════════════
   안건 고치기 — 한 화면에 모았다 (2026-08-31)
   ───────────────────────────────────────────────────────────
   ★ 예전에는 prompt() 로 한 칸씩 물었다.
     여섯 번 물어보는 동안 앞에 뭘 넣었는지 안 보이고,
     중간에 [취소]를 누르면 앞의 것이 다 날아갔다.

   ★ 표결 수치도 여기서 함께 받는다.
     안건과 수치가 다른 화면에 있으면 직원이 회의록을 들고
     두 화면을 오가야 한다. 한 자리에서 끝낸다.

   ★★★ 저장하면 의결 기록으로 곧바로 들어간다 ★★★
     안건 정보는 agendas 표에, 표결 수치는 decision 표에 담긴다.
     한 안건에 의결 기록은 하나뿐이라 서버가 두 번을 막는다.
   ═══════════════════════════════════════════════════════════ */
let AGF = null;      /* 수정하고 있는 안건 · null 이면 폼이 닫혀 있다 */

function agEdit(i){
  const m = MT(); if(!m) return;
  const a = (m.agendas || [])[i]; if(!a) return;
  if(m.demo){ alert(MT_NODB.why); return; }
  AGF = {
    i:i, id:a.agenda_id, no:a.no, title:a.title, detail:a.detail || "",
    is_vote:a.is_vote, quorum_pass:a.quorum_pass || "",
    quorum_base:a.quorum_base || "attendees", quorum_attend:a.quorum_attend || "",
    memo:a.memo || "", law_ref:a.law_ref || "",
    /* 정관 조항 열쇠 — law_ref 에 「제26조 ①」처럼 담긴 것을 되짚는다 */
    ruleKey:(RULEBOOK.items.find(r => r.art === a.law_ref) || {}).key || "",
    total:a.total || mtBaseOf(m.kind) || "",
    /* ★ 반대표는 nay 다. no 는 안건 번호라 겹치면 안 된다. */
    att:(a.att != null ? a.att : ""), yes:(a.yes != null ? a.yes : ""),
    nay:(a.nay != null ? a.nay : ""), abs:(a.abs != null ? a.abs : ""),
    busy:false
  };
  MTV = "agenda"; render(); scrollTo(0, 0);
}
function agClose(){ AGF = null; MTV = "detail"; render(); scrollTo(0, 0); }

/* 폼의 칸을 읽어 둔다.
   ★ render() 를 부르는 함수는 화면의 모든 칸을 먼저 읽어야 한다.
     하나라도 빠지면 다시 그릴 때 그 칸이 소리 없이 지워진다.
     (2026-08-31 대의원 명단이 그렇게 사라졌다) */
function agKeep(){
  if(!AGF) return;
  const g = id => { const e = document.getElementById(id); return e ? e.value : null; };
  [["ag-no","no"],["ag-ti","title"],["ag-de","detail"],["ag-pass","quorum_pass"],
   ["ag-base","quorum_base"],["ag-att%","quorum_attend"],["ag-memo","memo"],
   ["ag-total","total"],["ag-att","att"],["ag-yes","yes"],["ag-nay","nay"],
   ["ag-abs","abs"],["ag-rk","ruleKey"]].forEach(([id,k]) => {
    const v = g(id); if(v !== null) AGF[k] = v;
  });
  const t = g("ag-vote"); if(t !== null) AGF.is_vote = (t === "의결 안건");
}
function agLive(k, v){
  if(!AGF) return;
  AGF[k] = v;
  const box = document.getElementById("ag-sum");
  if(box) box.innerHTML = agSum();
}
function agSet(k, v){ agKeep(); AGF[k] = v; render(); }

/* ═══════════════════════════════════════════════════════════
   ★ 정관에서 요건을 끌어온다 (2026-08-31 · rulebook.js)
   ───────────────────────────────────────────────────────────
   ★ 예전에는 직원이 안건마다 가결 기준을 **손으로 쳤다.**
     「출석 대의원 과반수 찬성」이라고 쳐 놓고 모수를 「전체」로
     고르면 정족수가 통째로 달라지고, 가결이 부결로 뒤집힌다.

   ★ 정관에 다 적혀 있는 것을 사람이 옮겨 적을 이유가 없다.
   ★ 그래도 고치실 수는 있다. 정관 해석에 다툼이 있을 수 있어
     직접 넣는 길을 막지 않는다. 대신 화면에 조항을 적어 둔다. */
function agRulePick(key){
  agKeep();
  AGF.ruleKey = key;
  const r = ruleOne(key);
  if(r){
    AGF.quorum_pass   = r.pass;
    AGF.quorum_base   = r.base;
    AGF.quorum_attend = (r.att == null) ? "" : r.att;
    AGF.law_ref       = r.art;
  }
  render();
}

/* 고르신 안건 종류의 정관 설명 */
function agRuleNote(){
  const r = ruleOne(AGF.ruleKey);
  if(!r) return `<p class="note" style="margin-top:0">
    안건 종류를 고르시면 가결 기준 · 모수 · 직접출석 요건이 저절로 채워집니다.
    직접 넣으셔도 됩니다.</p>`;
  const m = MT();
  const base = mtBaseOf(m.kind) || 0;
  /* 여는 요건(정족수)도 함께 짚어 드린다.
     ★ 열지 못한 회의의 의결은 무효다. 찬성 수만 봐서는 안 된다. */
  const att = +AGF.att || 0;
  let openWarn = "";
  if(base && att){
    const needOpen = /3분의 2/.test(r.open) ? Math.ceil(base*2/3)
                   : /과반수/.test(r.open)  ? Math.floor(base/2)+1 : 0;
    if(needOpen) openWarn = att >= needOpen
      ? `<br><b style="color:var(--ok)">참석 ${att}명 · 여는 요건 ${needOpen}명 충족</b>`
      : `<br><b style="color:var(--red)">참석 ${att}명 · 여는 요건 ${needOpen}명 미달 —
         이 회의는 열 수 없습니다</b>`;
  }
  return `<div class="warn" style="margin:0 0 12px">
    <b>${r.name} · 정관 ${r.art}</b>
    <p><b>여는 요건</b> · ${r.open}<br>
       <b>가결 요건</b> · ${r.pass}${
       r.att != null ? `<br><b>직접출석</b> · 조합원의 ${r.att}%` : ""}${openWarn}<br>
       <span style="white-space:pre-line">${r.note}</span></p></div>`;
}

/* 넣으신 숫자가 서로 맞는지 그 자리에서 셈해 보인다 */
function agSum(){
  const m = MT(); if(!m || !AGF) return "";
  if(!AGF.is_vote) return `<span style="color:var(--muted)">보고 안건은 표결이 없습니다.</span>`;
  const t = +AGF.total||0, a = +AGF.att||0, y = +AGF.yes||0,
        n = +AGF.nay||0, b = +AGF.abs||0;
  if(!a) return `<span style="color:var(--muted)">참석 인원을 넣으시면 셈해 드립니다.</span>`;
  const sum = y + n + b;
  const c = mtAgCalc(m, {total:t, att:a, yes:y, no:n, abs:b,
    quorum_base:AGF.quorum_base, quorum_pass:AGF.quorum_pass});
  return `${y} + ${n} + ${b} = <b>${sum}</b> · 참석 <b>${a}</b>
    ${sum === a ? `<span style="color:var(--ok)">맞습니다</span>`
      : sum > a ? `<span style="color:var(--red);font-weight:800">참석보다 ${sum-a}명 많습니다</span>`
      : `<span style="color:var(--amber);font-weight:800">참석보다 ${a-sum}명 적습니다</span>`}
    <br>의결 요건 <b>${c.need}명</b> ·
    <b style="color:${c.ok?"var(--ok)":"var(--red)"}">${c.ok?"가결":"부결"}</b>
    · 찬성 ${c.rate}%`;
}

async function agSaveNow(){
  const m = MT(); if(!m || !AGF || AGF.busy) return;
  agKeep();
  if(!String(AGF.title).trim()){ alert("안건 이름을 적어 주십시오."); return; }
  const locked = m.status === "closed";

  /* ── 숫자 검사 ── */
  let rec = null;
  if(AGF.is_vote && String(AGF.att).trim() !== ""){
    const t = +AGF.total||0, a = +AGF.att||0, y = +AGF.yes||0,
          n = +AGF.nay||0, b = +AGF.abs||0;
    if(!t){ alert(`${mtK(m.kind).who} 총원을 넣어 주십시오.`); return; }
    if(a > t){ alert(`참석(${a}명)이 총원(${t}명)보다 많습니다.\n회의록을 다시 확인해 주십시오.`); return; }
    if(y + n + b > a){
      alert(`찬성 ${y} + 반대 ${n} + 기권·무효 ${b} = ${y+n+b}명이\n`
        + `참석(${a}명)보다 많습니다.\n회의록을 다시 확인해 주십시오.`); return; }
    if(y + n + b < a && !confirm(`찬성 ${y} + 반대 ${n} + 기권·무효 ${b} = ${y+n+b}명으로\n`
      + `참석 ${a}명보다 ${a-y-n-b}명 적습니다.\n\n`
      + `그대로 올리시겠습니까?`)) return;
    /* ★ no 는 안건 번호, nay 는 반대표. 한 덩이에 no 를 두 번 쓰면
       뒤엣것이 앞엣것을 덮어 안건 번호가 반대표로 바뀐다. */
    rec = agToDecision(m, {no:+AGF.no||1, title:AGF.title.trim(),
      quorum_pass:AGF.quorum_pass, quorum_base:AGF.quorum_base,
      memo:AGF.memo, law_ref:AGF.law_ref, agenda_id:AGF.id,
      total:t, att:a, yes:y, nay:n, abs:b});
  }

  AGF.busy = true; render();

  /* ① 안건 정보 — 마감한 회의는 서버가 막으므로 건너뛴다 */
  if(!locked){
    const r = await agendaSave(AGF.id, m.meeting_id, {
      no:+AGF.no||1, title:AGF.title.trim(), detail:AGF.detail,
      is_vote:AGF.is_vote, quorum_pass:AGF.quorum_pass,
      quorum_base:AGF.quorum_base, quorum_attend:+AGF.quorum_attend||null,
      law_ref:AGF.law_ref, memo:AGF.memo});
    if(!r.ok){ AGF.busy = false; render();
      alert("안건을 수정하지 못했습니다.\n\n" + (r.why||"")); return; }
  }

  /* ② 표결 수치 → 의결 기록 */
  if(rec && typeof decisionAdd !== "undefined"){
    const old = (typeof DECISION !== "undefined")
      ? DECISION.find(d => d.agId === AGF.id) : null;
    const rr = old && old.id ? await decisionSet(old.id, rec, S.name)
                             : await decisionAdd(rec, S.name);
    if(!rr.ok){ AGF.busy = false; render();
      alert("표결 수치를 담지 못했습니다.\n\n" + (rr.why||"")
        + "\n\n안건 내용은 저장됐습니다."); return; }
    if(typeof decisionSync !== "undefined") await decisionSync();
    if(typeof meetingSync !== "undefined") await meetingSync();
  }

  AGF.busy = false;
  agClose();
}

async function agDelNow(){
  const m = MT(); if(!m || !AGF) return;
  if(!confirm(`제${AGF.no}호 · ${AGF.title}\n\n`
    + `이 안건을 지웁니다.\n`

  const r = await agendaDel(AGF.id);

  agClose();
}

/* ══════════════════════════════════════════════════════════
   현장 접수 (2026-08-23 새벽)
   ──────────────────────────────────────────────────────────
   자세한 것은 roster-demo.js 의 ATTEND 주석 · 인수인계서 39번 절
   ══════════════════════════════════════════════════════════ */
const DESK = {q:"", hit:null, how:"direct", id:"rrc",
              proxy:"", sign:false, busy:false,
              dupWarn:null,          /* 중복이 걸렸을 때 화면에 붉게 */
              syncAt:0};             /* 마지막으로 서버를 읽은 시각 */

function deskType(v){
  DESK.q = v; DESK.hit = null;
  if(IME_ON) return;                     /* 한글 조합 중 (37번 절) */
  /* ★ 딱 한 분만 걸리면 바로 편다 (2026-08-23 새벽).
     접수 데스크에는 줄이 서 있다. 한 명뿐인데 한 번 더 누르게 하면
     하루 종일 그 한 번이 쌓인다.
     ★ 두 글자 이상 치셨을 때만. 「0」 한 글자로 열리면 놀라신다.
     ★ 이미 접수됐거나 의결권이 없는 분은 안 편다. 목록에서 딱지를 보셔야 한다. */
  if(v.trim().length >= 2){
    const c = findMembers(v);
    if(c.length === 1 && !attOf(c[0].r.no) && c[0].r.rep !== false){
      deskTake(c[0].r.no); return;
    }
  }
  render();
  const e = document.getElementById('dk-q');
  if(e){ e.focus(); e.setSelectionRange(v.length, v.length); }
}
async function deskTake(no){
  DESK.hit = ROSTER.find(r => r.no === no) || null;
  if(DESK.hit) DESK.q = `${String(DESK.hit.no).padStart(4,"0")} ${DESK.hit.name}`;
  DESK.how = "direct"; DESK.id = "rrc"; DESK.proxy = ""; DESK.sign = false;
  DESK.dupWarn = null;
  render();

  /* ★ 고르는 순간 서버를 읽어 다른 데스크 접수를 확인한다 (2026-08-23).
     직원이 「이미 접수」를 보시면 애초에 안 누르신다.
     누르고 막히는 것보다 미리 보시는 편이 낫다.
     ★ 5초 안에 이미 읽었으면 다시 읽지 않는다. 요청이 쌓이지 않게. */
  if(!DESK.hit) return;
  const now = Date.now();
  if(now - DESK.syncAt < 5000) { deskDupCheck(); return; }
  DESK.syncAt = now;
  await attSync();
  deskDupCheck();
  render();
}

/* 지금 고른 분이 이미 접수됐는지 본다 */
function deskDupCheck(){
  if(!DESK.hit){ DESK.dupWarn = null; return; }
  const d = attWho(DESK.hit.no);
  DESK.dupWarn = d ? {name:DESK.hit.name, ...d} : null;
}
function deskClear(){ Object.assign(DESK,
  {q:"", hit:null, how:"direct", id:"rrc", proxy:"", sign:false, dupWarn:null});
  render(); }
function deskHow(v){ deskKeep(); DESK.how = v; render(); }
function deskId(v){ deskKeep(); DESK.id = v; render(); }
function deskSign(){ deskKeep(); DESK.sign = !DESK.sign; render(); }
function deskKeep(){
  /* ★ 칸이 화면에 없을 때는 담아 둔 값을 지우지 않는다.
     위임을 고르셨다가 다른 것을 누르시면 칸이 사라지는데,
     그때 e.value 로 덮어쓰면 적어 두신 대리인 이름이 날아간다. */
  const e = document.getElementById("dk-proxy");
  if(e && typeof e.value === "string") DESK.proxy = e.value;
}

/* ★ 데스크 수 늘리고 줄이기 (2026-08-23)
   ★ 기록이 있는 번호 아래로는 못 줄인다.
     5번에 12건이 있는데 4로 줄이면 그 12명이 집계에서 빠지고
     출석이 갑자기 줄어 정족수가 미달로 바뀐다. 총회가 무효가 될 수 있다. */
function attN(d){
  const r = attSetN(ATT_N + d);
  if(!r.ok){
    alert(`${r.used}번 데스크에 접수 기록이 있습니다.\n\n`
      + `${r.used}대 아래로는 줄이실 수 없습니다.\n\n`
      + `줄이면 그 기록이 집계에서 빠지고\n`
      + `출석 인원이 갑자기 줄어듭니다.`);
    return; }
  render();
}

async function deskSave(){
  deskKeep();
  const r = DESK.hit;
  if(!r){ alert("조합원을 먼저 찾아 주십시오."); return; }
  if(DESK.busy) return;

  /* ★ 의결권 없는 분은 접수할 수 없다.
     공유 물건은 대표 1인만 의결권을 가진다(절대 규칙 ⑦).
     여기서 안 막으면 정족수가 부풀려진다. */
  if(r.rep === false){
    alert(`${r.name} 님은 공유 물건의 비대표 조합원이라\n의결권이 없습니다.\n\n`
      + `대표조합원께서 오셔야 합니다.`); return; }

  /* ★★★ 누르는 그 순간 서버를 다시 읽는다 (2026-08-23) ★★★
     화면에 보이는 것은 최대 15초 낡은 것이다.
     그 사이에 다른 데스크가 같은 분을 접수했으면 용지가 두 장 나간다.
     되돌릴 수 없는 사고라 여기서 반드시 막아야 한다. */
  DESK.busy = true; render();
  const synced = await attSync();
  DESK.busy = false;
  if(!synced){
    render();
    alert("서버를 확인하지 못했습니다.\n\n"
      + "다른 데스크에서 이미 접수했는지 알 수 없어\n"
      + "접수를 진행하지 않았습니다.\n\n"
      + "★ 인터넷을 확인하고 다시 눌러 주십시오.\n"
      + "확인 없이 접수하면 용지가 두 장 나갈 수 있습니다.");
    return;
  }

  /* ★ 두 번 접수를 막는다. 용지가 두 장 나가면 되돌릴 수 없다. */
  const dup = attWho(r.no);
  if(dup){
    DESK.dupWarn = {name:r.name, rec:dup.rec, desk:dup.desk};
    render();
    alert(`⛔ 중복 접수를 막았습니다\n\n`
      + `${r.name} 님은 이미 `
      + `${dup.desk ? dup.desk + "번 데스크" : "다른 곳"}에서 접수하셨습니다.\n\n`
      + `접수번호 ${dup.rec.serial}\n`
      + `${ATT_HOW[dup.rec.how]} · ${dup.rec.at}${dup.rec.by ? " · " + dup.rec.by : ""}\n\n`
      + `★ 투표용지를 이미 받아 가셨습니다.\n`
      + `두 번 드리면 표가 두 장 들어가고 되돌릴 수 없습니다.\n\n`
      + `잘못된 것이라면 `
      + `${dup.desk ? dup.desk + "번 데스크에서" : "그 데스크에서"} 취소해 주십시오.`);
    return; }

  /* ★ 위임은 대리인 이름과 정관 한도를 본다 */
  if(DESK.how === "proxy"){
    if(!DESK.proxy.trim()){ alert("대리인 성함을 적어 주십시오.\n위임장에 적힌 그대로입니다."); return; }
    const n = proxyN(DESK.proxy);
    if(n >= PROXY_MAX){
      alert(`${DESK.proxy} 님은 이미 ${n}분을 대리하고 계십니다.\n\n`
        + `조합 정관에서 대리인 1인당 ${PROXY_MAX}명까지로 정하고 있습니다.\n`
        + `더 받으시면 그 표가 무효가 될 수 있습니다.`); return; }
  }

  /* ★ 종이 서명이 없으면 접수하지 않는다. 이것이 진짜 방어선이다. */
  if(!DESK.sign){
    alert("종이 참석부에 본인 서명을 먼저 받아 주십시오.\n\n"
      + "나중에 「나는 그날 가지 않았다」고 하시면\n"
      + "화면 기록이 아니라 본인 서명이 답이 됩니다."); return; }

  DESK.busy = true; render();
  /* ★ 접수번호는 방금 attSync 에서 함께 받아왔다.
     접수번호에 데스크가 들어간다. A1-0001 · A2-0001
     나중에 「어느 데스크에서 접수했나」에 답할 수 있다. */
  const serial = "A" + ATT_DESK + "-" + String(++ATT_SEQ).padStart(4,"0");
  const d = new Date(), z = v => String(v).padStart(2,"0");
  const at = `${z(d.getHours())}:${z(d.getMinutes())}`;

  const before = JSON.parse(JSON.stringify(ATT_BOX[ATT_DESK] || []));
  attAdd({serial, voter_id:r.no, voter_name:r.name,
    addr:(r.addr||""), how:DESK.how, id:DESK.id,
    proxy_name: DESK.how === "proxy" ? DESK.proxy.trim() : "",
    sign:true, status:"active", by:S.name, desk:ATT_DESK, at,
    date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`});

  const ok = await attendPut(S.name);
  DESK.busy = false;
  if(!ok){
    ATT_BOX[ATT_DESK] = before; ATT_SEQ--;
    render();
    alert("서버에 저장하지 못했습니다.\n\n"
      + "접수를 되돌렸습니다. 인터넷을 확인하시고 다시 눌러 주십시오.");
    return;
  }

  const t = attTally();
  alert(`접수했습니다.\n\n${serial} · ${r.name} · ${ATT_HOW[DESK.how]}\n`
    + (DESK.how === "written" ? "서면결의는 용지를 드리지 않습니다.\n" : "투표용지를 드리십시오.\n")
    + `\n출석 ${t.total}명 / 의결권자 ${t.voters}명\n`
    + `정족수 ${t.need}명 ${t.ok ? `충족 (${t.gap}명 초과)` : `미달 (${-t.gap}명 부족)`}`);
  deskClear();
}

/* ★ 취소는 지우지 않는다. 남기고 집계에서만 뺀다 (절대 규칙 ①) */
async function deskCancel(serial){
  const f = attFind(serial);
  if(!f || f.rec.status !== "active") return;
  /* ★ 다른 데스크에서 접수한 것은 여기서 못 고친다.
     고치면 그쪽 PC 가 다음에 자기 칸을 올릴 때 도로 살아난다.
     그 데스크에서 취소하시게 해야 한다. */
  if(f.desk !== ATT_DESK && f.desk !== 0){
    alert(`${serial} 은 ${f.desk}번 데스크에서 접수한 것입니다.\n\n`
      + `그 데스크에서 취소해 주십시오.\n\n`
      + `여기서 취소하면 잠시 뒤 도로 살아납니다.`); return; }
  const a = f.rec;
  const why = prompt(`${a.serial} · ${a.voter_name} · ${ATT_HOW[a.how]}\n\n`
    + `접수를 취소합니다. 왜 취소하십니까?\n\n`
    + `★ 기록은 지워지지 않고 「취소됨」으로 남습니다.\n`
    + `지울 수 있으면 「출석을 조작했다」는 말이 나옵니다.`, "");
  if(why === null) return;
  if(!why.trim()){ alert("사유를 적어 주십시오."); return; }

  const before = JSON.parse(JSON.stringify(ATT_BOX[ATT_DESK] || []));
  const d = new Date(), z = v => String(v).padStart(2,"0");
  a.status = "cancelled"; a.cancel_why = why.trim(); a.cancel_by = S.name;
  a.cancel_at = `${z(d.getHours())}:${z(d.getMinutes())}`;

  const ok = await attendPut(S.name);
  if(!ok){ ATT_BOX[ATT_DESK] = before; render();
    alert("서버에 저장하지 못했습니다. 취소를 되돌렸습니다."); return; }
  render();
  alert(`취소했습니다.\n\n`
    + `투표용지를 이미 드렸으면 반드시 회수하십시오.\n`
    + `회수하지 못하면 그 용지가 투표함에 들어갑니다.`);
}

function deskProxyMax(){
  const v = prompt("조합 정관에서 정한 대리인 1인당 위임 한도\n\n"
    + "★ 법은 「정관으로 정한다」고만 하고 실제 숫자는 정관에 있습니다.\n"
    + "정관을 확인하고 넣어 주십시오.", String(PROXY_MAX));
  if(v === null) return;
  const n = parseInt(String(v).replace(/[^0-9]/g,""), 10);
  if(!n){ alert("숫자로 적어 주십시오."); return; }
  PROXY_MAX = n; attendPut(S.name); render();
}

/* ═══════════════════════════════════════════════════════════
   ★★★ 한글이 조합되는 중에는 다시 그리지 않는다 (2026-08-22 밤) ★★★
   ───────────────────────────────────────────────────────────
   ★ 무엇이 잘못됐나

     찾기 칸이 한 글자 칠 때마다 render() 로 화면을 다시 그렸다.
     그런데 한글은 「ㅅ → 서 → 섳 → 서우」처럼
     **여러 번의 입력을 거쳐 한 글자가 만들어진다.**

     그 도중에 칸을 통째로 새로 만들어 버리면 조합이 끊기고
     지금까지 친 자모가 낱개로 떨어진다.

       치는 것        ㅅ ㅓ ㅇ ㅜ ㅇ ㅡ ㄴ
       화면에 남는 것  ㅅㅓㅇㅜㅇㅡㄴ      ← 「서우은」이 안 된다

     그 상태로 찾으니 당연히 못 찾는다.
     36번 절에서 normalize("NFC") 를 넣었는데도 안 되던 이유가 이것이다.
     **애초에 완성된 글자가 만들어지지 않았으므로 골라 봐야 소용이 없다.**

   ★ 어떻게 고쳤나

     브라우저가 조합 중임을 알려 주는 신호가 있다.

       compositionstart   한글 조합 시작
       compositionend     한 글자 완성

     조합 중에는 값만 담아 두고 **다시 그리지 않는다.**
     조합이 끝나면 그때 그린다.

   ★ 영문 · 숫자는 조합이 없어 곧바로 그린다. 느려지지 않는다.

   ★ 이 문제는 오류가 안 난다. 그냥 「못 찾음」이 나올 뿐이다.
     한글로 실제로 쳐 봐야 안다. 값을 붙여넣기로 시험하면 안 걸린다.
   ═══════════════════════════════════════════════════════════ */
let IME_ON = false;
function imeWatch(el){
  if(!el || el.dataset.ime) return;
  el.dataset.ime = "1";
  el.addEventListener("compositionstart", () => { IME_ON = true; });
  el.addEventListener("compositionend", e => {
    IME_ON = false;
    /* 조합이 끝났으니 그때 한 번 그린다 */
    if(typeof el.oninput === "function") el.oninput(e);
    else el.dispatchEvent(new Event("input"));
  });
}
/* 화면을 그린 뒤 찾기 칸들에 붙인다 */
function imeBind(){
  ["b-q","pp-q","r-q","arc-q","ix-q","ix-kw","ix-a","dk-q","dk-proxy"].forEach(id => {
    imeWatch(document.getElementById(id));
  });
}

function balType(v){
  BAL.q = v; BAL.hit = null; BAL.pick = {}; BAL.force = false;
  if(IME_ON) return;                 /* 한글 조합 중 — 끝나면 그린다 */
  render();
  const e = document.getElementById('b-q');
  if(e){ e.focus(); e.setSelectionRange(v.length, v.length); }
}
function balTake(no){

}
async function balSave(){
  const votable = AGS().filter(a=>a.is_vote);
  const miss = votable.filter(a=>!BAL.pick[a.agenda_id]);
  if(!BAL.hit){ alert("조합원을 먼저 조회하십시오."); return; }
  if(miss.length){ alert("선택하지 않은 안건이 있습니다 : 제"+miss.map(a=>a.no).join(", 제")+"호"); return; }
  if(BAL.busy) return;

  /* ★ 접수번호를 서버에서 먼저 받아온다 (2026-08-22 밤).
     총회 당일에는 두 사람이 나눠 친다. 각자 화면 안 개수로 번호를 매기면
     같은 번호가 두 번 나오고 표가 겹친다.
     동의서 접수번호에서 이미 겪은 것이다(8번 절). */
  BAL.busy = true; render();
  if(typeof hubPull !== "undefined"){
    const v = await hubPull("vote_seq", null);
    if(v){ VOTE_SEQ.w = Math.max(VOTE_SEQ.w||0, v.w||0);
           VOTE_SEQ.o = Math.max(VOTE_SEQ.o||0, v.o||0); }
    /* ★ 표 목록도 바로 앞서 받아온다 (2026-08-23 새벽).
       총회 당일 두 사람이 서면결의를 나눠 치면, 각자 자기 화면 목록에
       한 건을 더해 통째로 올리므로 나중에 올린 쪽이 앞의 것을 지운다.
       올리기 직전에 받아 오면 겹칠 틈이 15초에서 1초 이하로 줄어든다.

       ★ 접수(현장 접수)는 데스크마다 칸을 나눠 아예 겹칠 수 없게 했다.
         투표 입력은 자료 구조가 하나라 이 방법으로 좁히기만 한다.
         Auth 를 붙일 때 서버에서 한 줄씩 넣는 방식으로 바꾼다. */
    const vs = await hubPull("votes", null);
    if(Array.isArray(vs) && vs.length >= DEMO_VOTES.length){
      DEMO_VOTES.length = 0; DEMO_VOTES.push(...vs);
    }
    const ws = await hubPull("wdraws", null);
    if(Array.isArray(ws) && ws.length >= DEMO_WITHDRAWALS.length){
      DEMO_WITHDRAWALS.length = 0; DEMO_WITHDRAWALS.push(...ws);
    }
  }
  const isW = BAL.type === "written";
  const seq = isW ? (++VOTE_SEQ.w) : (++VOTE_SEQ.o);
  const serial = (isW ? "W-2026-" : "O-2026-") + String(seq).padStart(4,"0");

  const d = new Date(), z = v => String(v).padStart(2,"0");
  const now = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
    + `${z(d.getHours())}:${z(d.getMinutes())}`;

  /* ★ 되돌릴 수 있게 원래 모습을 담아 둔다.
     서버 저장이 실패하면 그대로 되돌린다. 반쯤 들어간 표를 남기지 않는다. */
  const before  = JSON.parse(JSON.stringify(DEMO_VOTES));
  const beforeW = JSON.parse(JSON.stringify(DEMO_WITHDRAWALS));

  if(BAL.force){
    VT().filter(v=>v.voter_id===BAL.hit.no && v.status==="active")
        .forEach(v=>{ v.status="withdrawn"; v.replaced_by=serial; });
    WD().push({withdrawal_id:"R-"+Date.now(),
      serial:"R-2026-"+String(WD().length+5).padStart(4,"0"),
      meeting_id:MT().meeting_id, voter_id:BAL.hit.no, voter_name:BAL.hit.name,
      from_vote:"", to_vote:serial, sign_verified:true, id_verified:true,
      approved_by:"조합장", scan_status:"pending", scan_due:"",
      entered_by:S.name, verified_by:"", created_at:now});
  }
  votable.forEach(a=>VT().push({
    vote_id: serial+"-"+a.agenda_id, meeting_id:MT().meeting_id, agenda_id:a.agenda_id,
    voter_id:BAL.hit.no, voter_name:BAL.hit.name, vote_type:BAL.type,
    choice:BAL.pick[a.agenda_id], serial, status:"active",
    entered_by:S.name, verified_by:"", created_at:now}));

  const ok = await votesPut(S.name);
  BAL.busy = false;

  if(!ok){
    /* ★ 되돌린다. 화면에만 남으면 다음에 열 때 사라져 두 번 치시게 된다. */
    DEMO_VOTES.length = 0;       DEMO_VOTES.push(...before);
    DEMO_WITHDRAWALS.length = 0; DEMO_WITHDRAWALS.push(...beforeW);
    if(isW) VOTE_SEQ.w--; else VOTE_SEQ.o--;
    render();
    alert("서버에 저장하지 못했습니다.\n\n"
      + "접수한 것을 되돌렸습니다. 반쯤 들어간 표는 남지 않았습니다.\n"
      + "인터넷을 확인하시고 다시 접수해 주십시오.\n\n"
      + "고르신 것은 화면에 그대로 있습니다.");
    return;
  }

  alert(`접수했습니다.\n\n접수번호 ${serial}\n`
    + `${BAL.hit.name} · 제 ${String(BAL.hit.no).padStart(4,"0")} 호\n`
    + `${isW?"서면":"현장"} · ${votable.length}개 안건\n\n`
    + `집계에 바로 반영됩니다.`
    + (BAL.force ? `\n\n★ 앞서 하신 전자투표는 철회 처리했습니다.\n`
      + `본인 서명이 있는 철회신청서를 반드시 보관하십시오.` : ""));
  balClear(); cur="tally"; render();
}

    + `총무이사 → 조합장 순으로 올라갑니다.\n승인되면 징구를 시작하실 수 있습니다.`);
  CFM.on=false; CFM.f=null; render();
}

/* 서식 자체를 결재에 올린다 */
function cfmToApproval(f){
  const d = new Date(), z = v => String(v).padStart(2,"0");
  const at = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
    + `${z(d.getHours())}:${z(d.getMinutes())}`;
  const docs = (typeof hubLoad !== "undefined") ? hubLoad("docs", []) : [];
  const n = docs.filter(x => x.code === "CSN"
    && String(x.no).indexOf("CSN-" + d.getFullYear()) === 0).length + 1;
  const no = `CSN-${d.getFullYear()}-${String(n).padStart(3,"0")}`;
  const q = f.quorum || ruleOf(f.step);
  docs.push({
    no, code:"CSN", title:`${f.name} 서식 승인의 건`,
    amount:"", drafted:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,
    drafter:S.name, status:"pending", formId:f.id,
    body:`1. ${f.name} 서식을 아래와 같이 승인하고자 품의합니다.
  가. 근거 법령 : ${f.law}
  나. 의결 요건 : ${q.desc} (${q.law})
  다. 징구 기간 : ${f.from || "미정"} ~ ${f.to || "미정"}`
      + (f.meetingNeed ? `
  라. 총회 의결 : ${f.meetingAt || "미정"} ${f.meetingNo || ""}` : "")
      + `
2. 서식 본문
${f.body.map(x=>`  ${x[0]}\n     ${x[1] || "(미기재)"}`).join("\n")}
3. 승인 후 징구를 시작하며, 징구 중에는 문구를 수정하지 않습니다.`,
    files:[],
    line:[
      {step:1, role:"담당자",   approver:S.name,  status:"ok",   acted_at:at, comment:null},
      {step:2, role:"총무이사", approver:"박총무",   status:"wait", acted_at:null, comment:null},
      {step:3, role:"조합장",   approver:"김조합장", status:"wait", acted_at:null, comment:null}
    ]
  });
  if(typeof hubPush !== "undefined") hubPush("docs", docs, S.name);
  return no;
}

/* ── 서면 접수 동작 ─────────────────────────────────────── */
function papKeep(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const a=g('pp-addr'), f=g('cb-from'), t=g('cb-to');
  if(a!==null) PAP.addr=a;
  if(f!==null) PAP.from=f; if(t!==null) PAP.to=t;
}
/* 치는 대로 후보를 보여 준다 */
function papType(v){
  PAP.q = v;
  PAP.hit = null;
  if(IME_ON) return;                 /* 한글 조합 중 */
  render();
  const e = document.getElementById('pp-q');
  if(e){ e.focus(); e.setSelectionRange(v.length, v.length); }
}
/* 후보에서 고르면 확정 */
function papTake(no){
  papKeep();
  PAP.hit = ROSTER.find(r => r.no === no) || null;
  if(PAP.hit){
    const ps = propsOf(PAP.hit.no);
    PAP.addr = ps.length ? ps.map(p=>p.addr).join(" · ") : PAP.hit.addr;
    PAP.q = `${String(PAP.hit.no).padStart(4,"0")} ${PAP.hit.name}`;
  }
  PAP.choice = null;
  render();
}
function papPick(v){ papKeep(); PAP.choice = v; render(); }

/* ── 서식 배율 기억하기 ──────────────────────────────────
   ★ 자동으로 맞추기는 하지만 직원분이 보시고 손보실 수 있어야 한다.
     한 번 맞춰 두시면 그 서식은 계속 그 배율로 나온다.
     다른 동의서를 새로 등록하시면 그때 다시 맞추신다.

   ★ 서식마다 따로 담는다. 조합설립 동의서와
     사업시행계획 변경 동의서는 본문 길이가 다르다. */
let SHEET_SCALE = (typeof hubLoad !== "undefined") ? hubLoad("sheet_scale", {}) : {};
function papScaleSave(formId, k){
  SHEET_SCALE[formId] = Math.round(k * 1000) / 1000;
  if(typeof hubPush !== "undefined") hubPush("sheet_scale", SHEET_SCALE, S.name);
  render();
}
function papScaleClear(formId){
  delete SHEET_SCALE[formId];
  if(typeof hubPush !== "undefined") hubPush("sheet_scale", SHEET_SCALE, S.name);
  render();
}
if(typeof hubPull !== "undefined")
  hubPull("sheet_scale", v => { SHEET_SCALE = v || {}; });

   ══════════════════════════════════════════════════════════ */

  const d = new Date();

<script>
/* ★ 자동으로 맞추되, 직원분이 보시고 손보실 수 있게 한다.
   [이 크기로 고정하기]를 누르시면 그 서식은 계속 그 크기로 나온다.
   다른 동의서를 새로 등록하시면 그때 다시 맞추신다. */
var FORM = "${f.id}";
var FIXED = ${fixed ? fixed : "null"};
var pg = document.getElementById("pg");
var pct = document.getElementById("pct");
var st = document.getElementById("st");
/* A4 높이에서 위아래 여백을 뺀다. 브라우저 머리글·바닥글이 켜져 있으면
   그만큼 더 먹으므로 4mm 를 미리 빼 둔다. */
var LIMIT = (297 - 22 - 4) / 25.4 * 96;
var K = 1;

function put(k){
  K = Math.min(1.15, Math.max(0.6, k));
  pg.style.transform = K === 1 ? "" : "scale(" + K + ")";
  pg.style.width = K === 1 ? "" : (100 / K) + "%";
  pct.textContent = Math.round(K * 100) + "%";
  var over = pg.getBoundingClientRect().height > LIMIT + 2;
  st.innerHTML = (over
    ? "<b style='color:#8C3A12'>두 장으로 나옵니다</b> · 작게 눌러 주십시오"
    : "<b>한 장에 담깁니다</b>")
    + (FIXED ? "<br>고정해 두신 크기입니다" : "<br>자동으로 맞춘 크기입니다");
}
function measure(){
  pg.style.transform = ""; pg.style.width = "";
  var h = pg.getBoundingClientRect().height;
  return h <= LIMIT ? 1 : Math.max(0.72, LIMIT / h);
}
function zoom(d){ FIXED = null; put(K + d * 0.02); }
function lock(){
  try { window.opener.papScaleSave(FORM, K); FIXED = K; put(K);
    alert("이 크기로 고정했습니다.\\n\\n다음부터 이 서식은 " + Math.round(K*100)
      + "% 로 나옵니다.\\n다른 동의서는 따로 맞추시면 됩니다.");
  } catch(e){ alert("관리자 창이 닫혀 있어 저장하지 못했습니다."); }
}
function auto(){
  try { window.opener.papScaleClear(FORM); } catch(e){}
  FIXED = null; put(measure());
}
put(FIXED || measure());
window.addEventListener("beforeprint", function(){ put(K); });
<\/script>
</body></html>`;
}

/* ★ 접수번호를 먼저 매기고 그것이 찍힌 서식을 뽑는다.
     현장에서 그 자리에 서명하고 가시는 것만 다루므로
     번호를 나중에 붙일 일이 없다. 라벨을 잘라 붙이는 수고가 사라진다.

   ★ 이 시점에는 아직 '접수 대기'다.
     조합원이 동의·부동의를 표시하고 서명하셔야 접수가 끝난다.
     그래서 대장에는 아직 들어가지 않는다. */
function papPrint(){
  papKeep();
  if(!PAP.hit){ alert("조합원을 먼저 조회하십시오."); return; }
  if(!PAP.hit.rep){
    alert("공유 물건의 대표조합원이 아닙니다.\n대표로 지정된 분께 서식을 드리십시오."); return; }

  const w = window.open("", "_blank");
  if(!w){ alert("팝업이 막혀 있습니다.\n주소창 오른쪽의 팝업 차단을 풀어 주십시오."); return; }

  /* 번호를 지금 매긴다 */
  const d = new Date();
  const no = "CS-" + d.getFullYear() + "-" + String(++CONSENT_SEQ).padStart(4,"0");
  PAP.serial = no;
  if(typeof consentPut !== "undefined") consentPut(S.name);   /* 번호만 먼저 올린다 */

  w.document.write(papSheet(PAP.hit, consentOf(CSF), no, SHEET_SCALE[CSF] || null));
  w.document.close();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 400);
  render();
}

/* 접수가 끝난 뒤 — 종이 오른쪽 위에 붙일 접수번호 */
/* ★ 이미 접수한 건의 서식을 다시 뽑는다.
     종이를 잃어버리셨거나 인쇄가 잘못 나왔을 때 쓴다.
     번호는 새로 매기지 않고 그때 매긴 번호를 그대로 쓴다.
     번호가 두 개가 되면 대장이 어긋난다. */
function papReprint(serial){
  const x = CONSENT_LOG.find(y => y.serial === serial); if(!x) return;
  const r = ROSTER.find(m => m.no === x.voter);
  if(!r){ alert("명부에서 찾지 못했습니다."); return; }
  const w = window.open("", "_blank");
  if(!w){ alert("팝업이 막혀 있습니다.\n주소창 오른쪽의 팝업 차단을 풀어 주십시오."); return; }
  w.document.write(papSheet(r, consentOf(x.form), x.serial, SHEET_SCALE[x.form] || null));
  w.document.close();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 400);
}
function papSave(){
  papKeep();
  if(!PAP.hit){ alert("조합원을 먼저 조회하십시오."); return; }
  if(!PAP.hit.rep){ alert("공유 물건의 대표조합원이 아닙니다.\n대표로 지정된 분이 내셔야 합니다."); return; }
  if(!PAP.serial){
    alert("먼저 서식을 출력해 주십시오.\n출력할 때 접수번호가 매겨집니다."); return; }
  if(!PAP.choice){ alert("동의 여부를 골라 주십시오.\n조합원이 종이에 표시하신 대로 넣으십시오."); return; }
  /* ★ 같은 분이 이미 접수 대기 중이면 막는다.
     한 분이 두 번 세어지면 동의율이 부풀려지고 인가가 반려된다. */
  const dup = CONSENT_LOG.find(x => x.form === CSF && x.voter === PAP.hit.no
    && x.status === "draft" && x.serial !== PAP.serial);
  if(dup){
    alert(`${mask(PAP.hit.name)} 님은 이미 접수하셨습니다.\n\n`
      + `접수번호 ${dup.serial} · ${dup.choice} · ${dup.paperDate}\n\n`
      + `결재 대기 중입니다. 수정하셔야 하면 그 건을 취소하고 다시 받으십시오.`);
    return;
  }
  const done = CONSENT_LOG.find(x => x.form === CSF && x.voter === PAP.hit.no
    && x.status === "active");
  if(done && !confirm(`${mask(PAP.hit.name)} 님은 이미 대장에 올라 계십니다.\n\n`
    + `접수번호 ${done.serial} · ${done.choice}\n\n`
    + `다시 받으시면 앞의 것은 대체됨으로 남고 지워지지 않습니다.\n계속하시겠습니까?`)) return;
  const today = new Date().toISOString().slice(0,10);
  const r = consentPaper(CSF, PAP.hit, PAP.choice, PAP.addr, today, S.name, PAP.serial);
  alert(`접수를 마쳤습니다 (시연)\n\n접수번호 ${r.rec.serial}\n`
    + `${mask(PAP.hit.name)} · ${PAP.choice} · ${today}\n\n`
    + `스캔을 올리시면 결재를 올릴 수 있습니다.\n`
    + `조합장 승인 전까지는 대장에 반영되지 않습니다.`);
  PAP.q=""; PAP.hit=null; PAP.choice=null; PAP.addr=""; PAP.serial=null;
  render();
}
/* ★ 실제로 파일을 올린다.
     예전에는 파일명만 지어 붙이고 아무것도 올라가지 않았다.
     결재 올릴 때 "스캔이 붙었나" 검사도 그 가짜 이름을 보고 판단했다.
     조합장이 명단만 보고 승인하시는 것과
     스캔을 직접 확인하고 승인하시는 것은 다르다. */
const SCAN_OK   = ["application/pdf","image/jpeg","image/png","image/heic"];
const SCAN_MAX  = 20 * 1024 * 1024;      /* 한 장 20MB — 넘으면 스캔 설정이 잘못된 것 */

function papScan(no){
  const x = CONSENT_LOG.find(y=>y.serial===no); if(!x) return;
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".pdf,.jpg,.jpeg,.png,.heic,application/pdf,image/*";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > SCAN_MAX){
      alert(`파일이 너무 큽니다 (${hubSize(f.size)})\n\n`
        + `한 장에 20MB까지입니다.\n`
        + `스캐너에서 해상도를 200~300dpi 로 낮추시거나\n흑백으로 뜨시면 크게 줄어듭니다.`);
      return;
    }
    const t = (f.type || "").toLowerCase();
    if(t && !SCAN_OK.includes(t) && !/\.(pdf|jpe?g|png|heic)$/i.test(f.name)){
      alert("PDF · JPG · PNG 만 올리실 수 있습니다.\n\n" + f.name); return;
    }
    const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0].toLowerCase();
    const path = hubPath(x.form, no) + ext;
    alert(`올리는 중입니다.\n\n${f.name} · ${hubSize(f.size)}\n\n잠시 기다려 주십시오.`);
    const r = await hubUpload(f, path);
    if(!r.ok){ alert(r.why); return; }
    const d = new Date(), z = v => String(v).padStart(2,"0");
    x.scan     = f.name;
    x.scanPath = r.path;
    x.scanSize = r.size;
    x.scanAt   = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
               + `${z(d.getHours())}:${z(d.getMinutes())}`;
    x.scanBy   = S.name;
    if(typeof usageStore !== "undefined") usageStore(r.size / 1024 / 1024);
    if(typeof consentPut !== "undefined") consentPut(S.name);
    alert(`스캔을 붙였습니다.\n\n${f.name} · ${hubSize(f.size)}\n\n`
      + `원본은 조합이 보관하시고, 인가 신청 때 구청에 내십시오.\n`
      + `여기 올린 것은 결재와 대조용입니다.`);
    render();
  };
  inp.click();
}

/* 붙인 스캔을 열어 본다. 한 시간짜리 임시 주소를 받아서 연다. */
async function papScanOpen(no){
  const x = CONSENT_LOG.find(y=>y.serial===no); if(!x || !x.scanPath) return;
  /* ★ 예전에 슬래시가 든 경로로 올린 것은 열리지 않는다.
     주소에서 %2F 로 바뀌며 서명이 어긋난다.
     그때는 다시 올리시라고 안내한다. */
  if(x.scanPath.indexOf("/") >= 0){
    alert("예전 방식으로 올라간 스캔이라 열 수 없습니다.\n\n"
      + "옆의 [바꾸기]를 눌러 같은 파일을 다시 올려 주십시오.\n"
      + "한 번만 하시면 됩니다.");
    return;
  }
  const u = await hubFileUrl(x.scanPath, 3600);
  if(!u){
    alert("스캔을 열지 못했습니다.\n\n"
      + "잠시 뒤 다시 눌러 보시고, 그래도 안 되면\n[바꾸기]로 다시 올려 주십시오.");
    return;
  }
  window.open(u, "_blank");
}

/* 잘못 올리셨을 때 — 결재 전에만 */
async function papScanDel(no){
  const x = CONSENT_LOG.find(y=>y.serial===no); if(!x || !x.scanPath) return;
  if(x.batch){ alert("결재에 올라간 건은 스캔을 떼실 수 없습니다.\n먼저 결재를 회수하십시오."); return; }
  if(!confirm(`${x.serial}\n\n붙이신 스캔을 떼시겠습니까?\n${x.scan}`)) return;
  /* ★ 지워졌는지 확인한다 (2026-08-22 오후).
     예전에는 결과를 보지 않고 화면에서만 지웠다.
     저장소 규칙에 delete 가 빠져 있으면 파일은 그대로 남는데
     화면에서는 떨어진 것으로 보인다.
     조합원 서명이 든 파일이 지워진 줄 알고 계시게 된다. */
  const gone = await hubFileDel(x.scanPath);
  if(!gone && !confirm(
      "저장소에서 파일을 지우지 못했습니다.\n\n"
    + "목록에서만 떼면 파일은 서버에 그대로 남습니다.\n"
    + "조합원 서명이 든 파일이라 남겨 두시면 안 됩니다.\n\n"
    + "그래도 목록에서 떼시겠습니까?\n"
    + "(떼신 뒤 운영자에게 파일 삭제를 알려 주십시오)")) return;
  x.scan = null; x.scanPath = null; x.scanSize = 0; x.scanAt = null; x.scanBy = null;
  if(typeof consentPut !== "undefined") consentPut(S.name);
  render();
}
function papBatch(){
  papKeep();
  const dr = paperDrafts(CSF);
  const from = PAP.from || dr.reduce((a,x)=>!a||x.paperDate<a?x.paperDate:a, "");
  const to   = PAP.to   || dr.reduce((a,x)=>!a||x.paperDate>a?x.paperDate:a, "");
  const r = consentBatch(CSF, from, to, S.name);
  if(!r.ok){ alert(r.why); return; }
  const docNo = papToApproval(r.batch);        /* 전자결재로 보낸다 */
  alert(`결재를 올렸습니다 (시연)\n\n`
    + `문서번호 ${docNo}\n묶음 ${r.batch.no}\n`
    + `서면 ${r.batch.paperN}건 + 전자 ${r.batch.elecN}건\n\n`
    + `총무이사 → 조합장 순으로 올라갑니다.\n`
    + `전자결재 화면에서 진행 상황을 보실 수 있습니다.`);
  render();
}

/* ★ 결재 문서를 만들어 전자결재로 보낸다.
     예전에는 여기서 바로 승인해 버렸다. 실제로는 총무이사 검토와
     조합장 승인을 거쳐야 하고, 그 기록이 남아야 한다.
     동의서는 소송에서 가장 치열하게 다투는 서류다. */
function papToApproval(batch){
  const f = consentOf(batch.form);
  const d = new Date(), z = v => String(v).padStart(2,"0");
  const at = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
    + `${z(d.getHours())}:${z(d.getMinutes())}`;
  const docs = (typeof hubLoad !== "undefined") ? hubLoad("docs", []) : [];
  /* 문서번호 — 같은 해 CSN 문서 수 + 1 */
  const n = docs.filter(x => x.code === "CSN"
    && String(x.no).indexOf("CSN-" + d.getFullYear()) === 0).length + 1;
  const no = `CSN-${d.getFullYear()}-${String(n).padStart(3,"0")}`;

  docs.push({
    no, code:"CSN", title:`${f.name} 징구 명단 승인의 건`,
    amount:"", drafted:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,
    drafter:S.name, status:"pending",
    body: consentBatchBody(batch),
    batch: batch.no,                    /* 어느 묶음인지 이어 둔다 */
    /* ★ 조합장이 폰에서 스캔을 직접 열어 보실 수 있어야 한다.
       명단만 보고 승인하시는 것과 스캔을 확인하고 승인하시는 것은 다르다.
       나중에 다투게 되면 "실제로 보고 승인했다"는 기록이 필요하다. */
    files: [{name:`동의자 통합명단 (${batch.paperN + batch.elecN}명)`,
             size:"—", kind:"통합 명단", required:true}]
      .concat(CONSENT_LOG.filter(x => x.batch === batch.no && x.scanPath)
        .map(x => ({name:`${x.serial} ${mask(x.name)}`,
                    size:hubSize(x.scanSize), kind:"서면 스캔",
                    required:true, path:x.scanPath}))),
    line:[
      {step:1, role:"담당자",   approver:S.name,  status:"ok",   acted_at:at, comment:null},
      {step:2, role:"총무이사", approver:"박총무",   status:"wait", acted_at:null, comment:null},
      {step:3, role:"조합장",   approver:"김조합장", status:"wait", acted_at:null, comment:null}
    ]
  });
  if(typeof hubPush !== "undefined") hubPush("docs", docs, S.name);
  batch.doc = no;
  if(typeof consentPut !== "undefined") consentPut(S.name);
  return no;
}

/* 올린 결재를 회수한다 */
function papCancel(no){
  const b = CONSENT_BATCH.find(x=>x.no===no); if(!b) return;
  if(!confirm(`${b.no}${b.doc?` · ${b.doc}`:""}\n\n`
    + `올리신 결재를 회수합니다.\n`
    + `서면 ${b.paperN}건이 다시 접수 대기로 돌아갑니다.\n\n`
    + `계속하시겠습니까?`)) return;
  const r = consentBatchCancel(no, S.name);
  if(!r.ok){ alert(r.why); return; }
  /* 전자결재 문서도 회수 표시 */
  if(b.doc && typeof hubLoad !== "undefined"){
    const docs = hubLoad("docs", []);
    const x = docs.find(y => y.no === b.doc);
    if(x && x.status === "pending"){
      x.status = "cancelled";
      x.cancelledBy = S.name;
      if(typeof hubPush !== "undefined") hubPush("docs", docs, S.name);
    }
  }
  alert(`회수했습니다 (시연)\n\n서면 ${r.n}건이 접수 대기로 돌아갔습니다.`);
  render();
}
function papApprove(no){
  const b = CONSENT_BATCH.find(x=>x.no===no); if(!b) return;
  if(!confirm(`${b.no}\n\n조합장 승인으로 처리합니다.\n`
    + `서면 ${b.paperN}건이 대장에 확정됩니다. 계속하시겠습니까?`)) return;
  const r = consentBatchApprove(no);
  const t = consentTally(CSF);
  alert(`승인했습니다 (시연)\n\n확정 ${r.n}건\n`
    + `대장 ${t.submitted}건 · 동의 ${t.yes}명\n`
    + `사람 수 ${t.yes}/${t.needOwner} ${t.okOwner?"충족":"미달"}\n`
    + `면적 ${t.areaYes}/${t.needArea}㎡ ${t.okArea?"충족":"미달"}`);
  render();
}

function quorumCard(label, now, need, ok, nowN, needN){

function pctBar(now, need, ok){
  const p = need ? Math.min(100, Math.round(now / need * 100)) : 0;
  return `<div style="display:flex;align-items:center;gap:9px">
    <div class="bar-o" style="flex:1;margin:0;${p?'':'opacity:.45'}">
      <i style="width:${p}%;background:${ok?'var(--ok)':'var(--amber)'}"></i></div>
    <span class="mono" style="width:42px;text-align:right;font-size:.76rem;
      color:${p?'var(--ink)':'#C6CEDA'}">${p}%</span></div>`;
}

function csvConsent(){
  const f = consentOf(CSF);
  const rows = [["다알아 · 전자동의서 제출 명세"], [f.name, f.law], [],
    ["접수번호","조합원번호","성명","소유 부동산","면적","동의여부","본인확인","제출시각","서명값","상태"]];
  CONSENT_LOG.filter(x=>x.form===CSF).forEach(x=>rows.push([
    x.serial, String(x.voter).padStart(4,"0"), x.name, x.addr, x.land,
    x.choice, x.how.toUpperCase(), x.at, x.sign,
    x.status==="active"?"유효":"대체됨"]));
  const t = consentTally(CSF);
  rows.push([], ["의결권자", t.total], ["제출", t.submitted], ["동의", t.yes], ["부동의", t.no],
    ["사람 수 요건", t.needOwner, t.okOwner?"충족":"미달"],
    ["면적 요건", t.needArea, t.okArea?"충족":"미달"]);
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join(String.fromCharCode(13,10)) + String.fromCharCode(13,10);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `동의서명세_${f.code}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

function qaToDoc(id){

const QTO = {on:false, ask:"", q:""};
function qaToClose(){ QTO.on = false; render(); }

function qaToRows(){
  const q = QTO.q.trim();
  const L = ARC_DOCS
    .filter(d => d.state !== "hidden")
    .filter(d => !q || String(d.title||"").includes(q) || String(d.sCase||"").includes(q))
    .sort((a,b) => String(b.at||"").localeCompare(String(a.at||"")))
    .slice(0, 60);
  if(!L.length) return `<p class="note" style="padding:16px;text-align:center">
    찾으시는 자료가 없습니다.</p>`;
  return L.map(d => `<button type="button" class="caserow" onclick="qaToPut('${d.id}')">
    <span class="nm">${d.title}</span>
    <span class="mt">${(ARCHIVE.find(c=>c.key===d.cat)||{}).name||d.cat}${
      d.sCase?` · ${d.sCase}`:""} · 질문 ${(d.index||[]).length}개 · ${
      d.state==="verified"?"검수 완료":"검수 대기"}</span>
  </button>`).join("");
}
async function qaToPut(docId){
  const x = ASKLOG.find(y => y.id === QTO.ask); if(!x) return;
  const d = ARC_DOCS.find(y => y.id === docId); if(!d) return;
  const now = (() => { const t = new Date(), z = v => String(v).padStart(2,"0");
    return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())} `
         + `${z(t.getHours())}:${z(t.getMinutes())}`; })();
  d.index = d.index || [];
  d.index.push({
    q: String(x.body||"").trim().replace(/\s+/g," "),

function qaSend(id){
  const e = document.getElementById("qa-r");
  const v = e ? e.value.trim() : "";
  if(v.length < 3){ alert("답변을 적어 주십시오."); return; }
  const pub = document.getElementById("qa-pub");
  const wantPub = pub ? pub.checked : false;
  const x = ASKLOG.find(y=>y.id===id); if(!x) return;
  const d = new Date(), z = n => String(n).padStart(2,"0");
  x.reply = v; x.replyBy = S.name; x.state = "done";
  x.replyAt = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
    + `${z(d.getHours())}:${z(d.getMinutes())}`;
  askPut(S.name);
  let more = "";
  if(wantPub){
    const rec = faqAdd(id, S.name);
    if(rec) more = `\n\n자주 묻는 질문에도 올렸습니다 (${rec.id}).\n`
      + `이름은 빠지고 질문과 답만 나갑니다.`;
  }
  alert(`답변을 보냈습니다.\n\n${mask(x.name)} 님의 [내 문의 내역]에 바로 나타납니다.` + more);

}

/* ══════════════════════════════════════════════════════════

     틀린 숫자가 조합원께 나가면 그것으로 다툰다.

const DCF = {kind:"mtg", date:"", meeting:"", no2:"", title:"", rule:"all2",
  total:"", att:"", yes:"", no:"", abs:"", note:"", edit:null,
  file:null, busy:false,
  ap:false, apAt:"", apBy:"",        /* 조합장 결재 */
  link:"",                            /* 총회 안건 · 동의서 연결 */
  /* ★ 총회에서 불러오면 붙는다 (2026-08-31 · 014).
     붙어 있으면 한 안건에 의결 기록은 하나뿐이라 서버가 두 번을 막는다. */
  mtId:null, agId:null,
  tab:"all", from:"", to:""};                       /* 기간 조회 */

function dcKeep(){
  /* ★★★ 2026-09-20 고침 (110절) ★★★
     「제○호」와 「반대」 칸이 **이름(id)이 둘 다 dc-no** 였다.
     getElementById 는 앞의 것만 찾으므로 반대 표 수에 **안건 번호가** 들어갔다.
     제3호 안건이면 반대 3표로 저장됐다. 반대 칸에 치신 숫자는 버려졌다.
     ★ 반대 칸을 dc-nay 로 바꿨다. 총회 안건 화면(ag-nay)과 같은 이름이다. */
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  [["dc-date","date"],["dc-mt","meeting"],["dc-no","no2"],["dc-title","title"],
   ["dc-rule","rule"],["dc-total","total"],["dc-att","att"],
   ["dc-yes","yes"],["dc-nay","no"],["dc-abs","abs"],
   ["dc-note","note"],["dc-link","link"]].forEach(([i,k])=>{
    const v=g(i); if(v!==null) DCF[k]=v;
  });
}
function dcRule(v){ dcKeep(); DCF.rule=v; render(); }
/* ═══════════════════════════════════════════════════════════
   ★ 마감한 총회의 안건을 불러온다 (2026-08-31)
   ───────────────────────────────────────────────────────────
   ★ 왜 이 자리인가

     예전에는 총회에서 안건 이름을 적고, 여기서 **같은 이름을 또 쳤다.**
     두 번 치면 한 글자씩 달라지고, 나중에
     「이게 그 안건이 맞나」로 다툰다.

   ★ 왜 수치까지 자동으로 안 채우나

     표결 수치는 **회의록 원문과 대조를 마친 것만** 들어가야 한다.
     총회 마감 버튼 자리에서 함께 받으면 확인 전 숫자가 그대로 남는다.
     날짜 · 총회명 · 제○호 · 안건 이름 · 요건까지만 채우고,
     숫자는 사람이 회의록을 보고 넣는다. (절대규칙 ④)

   ★ 한 안건에 의결 기록은 하나뿐이다.
     두 번 넘기면 같은 안건이 「가결」과 「부결」로 둘 다 남는다.
     서버에 하나만 붙도록 막아 두었다.
   ═══════════════════════════════════════════════════════════ */
/* ★ 여기와 회의 화면 둘 다 같은 것을 넣는 자리다 (2026-08-31).

       회의 메뉴    앞으로 열리는 회의 — 회의명·날짜가 저절로 붙는다
       이 화면      지난 기록을 옮겨 담을 때 · 전체를 기간으로 찾아볼 때 */
function dcElsewhere(){

      여기는 <b>지난 기록을 옮겨 담거나</b>, 전체를 기간으로 찾아보는 자리입니다.</p>
    <div style="margin-top:10px">

function dcWaiting(){

  meetingList().filter(m => m.status === "closed" && !m.demo)

  return out.sort((x, y) => (y.m.meet_date||"").localeCompare(x.m.meet_date||"")
                         || (x.a.no||0) - (y.a.no||0));

function dcWaitBox(){

    ${W.length > 12 ? `<p style="margin-top:8px">앞의 12건만 보입니다.

function dcTakeAgenda(mid, aid){
  const m = (typeof meetingList !== "undefined")
    ? meetingList().find(x => x.meeting_id === mid) : null;
  const a = m ? (m.agendas||[]).find(x => x.agenda_id === aid) : null;
  if(!m || !a){ alert("그 안건을 찾지 못했습니다.\n화면을 새로 불러와 주십시오."); return; }
  const d = agToDecision(m, a);

/* ★ 회의 종류를 바꾸면 모수와 요건이 함께 바뀐다 (2026-08-23).

function dcKind(k){
  dcKeep();
  DCF.kind = k;
  const K = DEC_KINDS[k] || DEC_KINDS.mtg;
  if(!K.rules.includes(DCF.rule)) DCF.rule = K.rules[0];
  /* 아직 아무것도 안 치셨거나 다른 회의 기본값이 그대로면 바꾼다 */
  const cur = +DCF.total || 0;
  const others = Object.keys(DEC_KINDS).map(x => decBaseOf(x));
  if(!cur || others.includes(cur)) DCF.total = String(decBaseOf(k) || "");
  render();
}
/* 회의별 총원 기본값 수정 — 정관에서 정한다 */
async function dcBase(k){
  const K = DEC_KINDS[k] || DEC_KINDS.mtg;
  const v = prompt(`${K.name} 총원 (모수)\n\n`
    + `★ 법은 「정관으로 정한다」고만 하고 실제 숫자는 정관에 있습니다.\n`
    + `정관을 확인하고 넣어 주십시오.\n\n`
    + (k === "mtg" ? `비워 두시면 의결권자 수(${VOTER_N()}명)를 씁니다.` : ""),
    String(DEC_BASE[k] || ""));
  if(v === null) return;
  DEC_BASE[k] = parseInt(String(v).replace(/[^0-9]/g,""), 10) || 0;
  await decBasePut(S.name, k);
  if(DCF.kind === k) DCF.total = String(decBaseOf(k) || "");
  render();
}

     조합장이 확인했다는 표시가 있어야 「누가 이 숫자를 확정했나」에 답할 수 있다. */
async function dcApprove(i){
  const d = DECISION[i]; if(!d) return;
  const c = decCalc(d);
  if(d.ap){
    if(!confirm(`${d.title}\n\n결재를 되돌리시겠습니까?\n`
      + `${d.apAt||""} · ${d.apBy||""}`)) return;
    const r0 = await decisionApprove(d.id, false, S.name);
    if(!r0.ok){ alert(r0.why || "되돌리지 못했습니다."); return; }
    render(); return;
  }
  if(!confirm(`${d.title}\n\n`
    + `${c.kindName} · ${d.date}\n`
    + `${c.ok?"가결":"부결"} · 찬성 ${c.yes} 반대 ${c.no}`
    + `${c.abs?` 기권 ${c.abs}`:""}\n\n`
    + `조합장 결재 완료로 표시하시겠습니까?\n\n`
    + `★ 회의록 원문과 숫자를 대조하셨습니까?\n`
    + `표시하시면 조합원 앱에 「조합장 확인」으로 나갑니다.`)) return;
  const r1 = await decisionApprove(d.id, true, S.name);

function dcFindQuick(n){
  const d=new Date(), z=v=>String(v).padStart(2,"0");
  const to=`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  const f=new Date(d.getTime() - n*86400000);
  DCF.from=`${f.getFullYear()}-${z(f.getMonth()+1)}-${z(f.getDate())}`;
  DCF.to=to; render();
}

const dcRows = () => DECISION.slice()

async function dcAdd(){
  dcKeep();
  if(!DCF.date){ alert("의결한 날짜를 넣어 주십시오."); return; }
  if(!DCF.title.trim()){ alert("안건 이름을 적어 주십시오."); return; }
  const t=+DCF.total||0, a=+DCF.att||0, y=+DCF.yes||0, n=+DCF.no||0, ab=+DCF.abs||0;
  const K = DEC_KINDS[DCF.kind] || DEC_KINDS.mtg;
  if(!t || !a){ alert(`${K.name} 총원과 참석 인원을 넣어 주십시오.`); return; }

  /* ★ 숫자가 서로 맞는지 본다. 틀린 숫자가 나가면 그것으로 다툰다. */
  if(a > t){ alert(`참석(${a}명)이 ${K.name} 총원(${t}명)보다 많습니다.\n\n`
    + `★ 회의 종류가 맞습니까? ${K.name} 총원은 ${decBaseOf(DCF.kind)||"미설정"}명입니다.\n`
    + `회의록을 다시 확인해 주십시오.`); return; }
  if(y + n + ab > a){
    alert(`찬성 ${y} + 반대 ${n}${ab?` + 기권 ${ab}`:""} = ${y+n+ab}명이\n`
      + `참석(${a}명)보다 많습니다.\n회의록을 다시 확인해 주십시오.`); return; }
  if(y + n + ab < a && !confirm(`찬성 ${y} + 반대 ${n}${ab?` + 기권 ${ab}`:""} = ${y+n+ab}명으로\n`
    + `참석 ${a}명보다 ${a-y-n-ab}명 적습니다.\n\n`
    + `무효표가 있었다면 맞습니다.\n그대로 올리시겠습니까?`)) return;

  const old = (DCF.edit !== null) ? DECISION[DCF.edit] : null;
  const rec = {kind:DCF.kind,
    date:DCF.date, meeting:DCF.meeting.trim(), no2:+DCF.no2||0,
    title:DCF.title.trim(), rule:DCF.rule, total:t, att:a, yes:y, no:n, abs:ab,
    note:DCF.note.trim(), link:(DCF.link||"").trim(), by:S.name,
    mtId:DCF.mtId||null, agId:DCF.agId||null,
    /* ★ 숫자를 고치면 결재가 풀린다.
       조합장이 확인한 것과 다른 숫자가 「조합장 확인」으로 나가면 안 된다. */
    ap:(old && old.ap && old.total===t && old.att===a && old.yes===y
        && old.no===n && (old.abs||0)===ab
        && old.rule===DCF.rule && (old.kind||"mtg")===DCF.kind) ? true : false,
    apAt:(old&&old.apAt)||"", apBy:(old&&old.apBy)||"",
    /* 수정하실 때 예전 회의록은 그대로 둔다 */
    path:(old&&old.path)||"", file:(old&&old.file)||"", size:(old&&old.size)||0};

  /* ★ 회의록 원본을 함께 올린다 (2026-08-22 밤).
     숫자만 남기면 「그 숫자가 어디서 나왔냐」에 답할 수 없다. */
  if(DCF.file){
    DCF.busy = true; render();
    const ext = (DCF.file.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0].toLowerCase();
    const key = `${DCF.date}__${rec.no2||0}__${Date.now()}`;
    const r = await hubUpload(DCF.file, hubPath("dec", key) + ext);
    DCF.busy = false;
    if(!r.ok){ render(); alert(r.why); return; }
    rec.path = r.path; rec.file = DCF.file.name; rec.size = r.size;
    if(typeof usageStore !== "undefined") usageStore(r.size / 1024 / 1024);
  }

  /* ★★★ 정식 표에 한 줄씩 넣고 고친다 (2026-08-23) ★★★
     app_state 처럼 목록을 통째로 갈아 끼우지 않는다.
     결재가 붙는 순간 조합장과 직원이 동시에 손을 대기 때문이다.
     ★ 숫자를 고치면 DB 트리거가 결재를 푼다. 화면에서도 같은 계산을 하지만
       DB 가 최종이다. 화면 코드는 고쳐질 수 있어도 DB 는 아니다. */
  DCF.busy = true; render();
  const rr = (DCF.edit !== null && old && old.id)
    ? await decisionSet(old.id, rec, S.name)
    : await decisionAdd(rec, S.name);
  DCF.busy = false;
  if(!rr.ok){ render(); alert(rr.why || "저장하지 못했습니다."); return; }

  if(old && old.ap && !rec.ap){
    alert("숫자가 바뀌어 조합장 결재를 풀었습니다.\n\n"
      + "조합장께서 확인하신 것과 다른 숫자가\n「조합장 확인」으로 나가면 안 됩니다.\n\n"
      + "다시 결재를 받아 주십시오.");
  }
  const c = decCalc(rr.row ? decFromRow(rr.row) : rec);
  alert(`${DCF.edit!==null?"고쳤습니다":"올렸습니다"}.\n\n`
    + `${rec.title}\n${c.ok?"가결":"부결"} · 찬성 ${c.yes}(${c.yesRate}%) `
    + `반대 ${c.no}(${c.noRate}%)\n의결 요건 · ${c.ruleName} ${c.need}명 `
    + `${c.ok?"충족":"미달"}\n\n조합원 앱 자료실에 바로 나타납니다.`);
  dcClear();
  /* ★ 예산 안건이면 그 자리에서 차수를 만들지 여쭙는다.
     나중에 예산 갈래에서 다시 치시게 하면 빠뜨린다. */
  if(typeof budAskFromDec !== "undefined") budAskFromDec(rec);
}

/* ★ 연결한 안건 · 동의서가 실제로 있는지 짚어 준다 (2026-08-23).
   손으로 친 번호가 틀리면 아무 데도 안 이어진다. 오류도 안 난다. */
function dcLinkHint(){
  const v = (DCF.link||"").trim();
  if(!v) return `<p class="note" style="margin-top:5px">
    총회 안건 번호나 동의서 서식을 적어 두시면 나중에 서로 찾아갈 수 있습니다.</p>`;
  const forms = (typeof allForms !== "undefined") ? allForms() : [];
  const f = forms.find(x => x.id === v || (x.name||"").indexOf(v) >= 0);
  const ags = (typeof AGS !== "undefined") ? AGS() : [];
  const a = ags.find(x => String(x.agenda_id) === v || `제${x.no}호` === v);
  if(f) return `<p class="note" style="margin-top:5px;color:var(--ok)">
    ↔ 동의서 <b>${f.name}</b> 과 이어집니다</p>`;
  if(a) return `<p class="note" style="margin-top:5px;color:var(--ok)">
    ↔ 총회 안건 <b>제${a.no}호 · ${a.title}</b> 와 이어집니다</p>`;
  return `<p class="note" style="margin-top:5px;color:var(--amber)">
    그 번호로 된 안건이나 동의서를 찾지 못했습니다.
    적어 두시는 것은 괜찮지만 서로 찾아가지는 않습니다.</p>`;
}

/* ══════════════════════════════════════════════════════════
   조합 사무실 · 임원 · 대의원   (2026-08-21)
   ──────────────────────────────────────────────────────────
   ★ 조합원이 정말 필요한 것은 주소와 전화번호다.
     어르신들께 주소만 드리면 못 찾아오신다.

   ★ 임원 개인 휴대폰은 넣지 않는다.
     조합장 번호가 500분께 공개되면 밤낮없이 전화가 온다.
     결국 안 받으시게 되고, 그때부터 전화를 피한다는 말이 나온다.
   ══════════════════════════════════════════════════════════ */
function ofKeep(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  [["of-name","name"],["of-addr","addr"],["of-addr2","addr2"],["of-tel","tel"],
   ["of-fax","fax"],["of-hours","hours"],["of-way","way"]].forEach(([i,k])=>{
    const v=g(i); if(v!==null) OFFICE[k]=v;
  });
  const a=g("dl-at"), t=g("dl-term");
  if(a!==null) DELEGATE.at=a; if(t!==null) DELEGATE.term=t;
  /* ★★★ 2026-08-31 — 여기에 이름칸이 빠져 있었다 ★★★

     예전에는 이름칸(dl-names)을 dlKeep() 만 읽었고,
     그 dlKeep() 은 [대의원 저장] 버튼에서만 불렸다.

     그런데 ofKeep() 뒤에는 거의 늘 render() 가 따라온다.
     render() 는 이름칸을 DELEGATE.names 로 다시 그린다.
     그래서 이름을 쳐 넣고 [저장하고 앱에 반영] · [+ 임원 더하기] ·
     임원 줄의 [↑][↓][×] 를 누르면, 치신 이름이 읽히지 않은 채
     화면이 다시 그려지면서 **그 자리에서 지워졌다.**
     오류도 안 나고 그냥 없어져서 「저장이 안 된다」로만 보인다.

     104분을 치고 다른 버튼을 한 번만 눌러도 통째로 날아갔다.
     이제 여기서 함께 읽는다. */
  const dn=g("dl-names");
  if(dn!==null) DELEGATE.names = dn.split(/[\n,·]+/).map(x=>x.trim()).filter(Boolean);
  OFFICER.forEach((x,i)=>{
    const r=g("ofr-r"+i), o=g("ofr-o"+i), n=g("ofr-n"+i);
    /* ★ 「그 밖」이면 옆 칸에 치신 것을 쓴다.
       고르는 칸만 보면 「그 밖」이 그대로 직책이 되어 버린다. */
    if(r !== null) x.role = (r === "그 밖") ? (o !== null ? o : (x.role||"")) : r;
    else if(o !== null) x.role = o;
    if(n !== null) x.name = n;
  });
}

/* 직책을 고르면 「그 밖」일 때만 옆 칸이 펴진다 */
function ofRole(i, v){
  ofKeep();
  OFFICER[i].role = (v === "그 밖")
    ? (OFFICER_ROLES.includes((OFFICER[i].role||"").trim()) ? "" : OFFICER[i].role)
    : v;
  render();
  if(v === "그 밖"){ const e = document.getElementById("ofr-o"+i); if(e) e.focus(); }
}
/* ══════════════════════════════════════════════════════════
   역대 임원 이력 (2026-08-23)
   자세한 것은 tenant-demo.js 의 OFF_HIST 주석 · 인수인계서 43번 절
   ══════════════════════════════════════════════════════════ */

/* ★ 지금 화면의 임원진을 한 기수로 굳힌다.
   손으로 다시 치게 하면 아무도 안 한다. 지금 있는 것을 그대로 옮긴다. */
function histNew(){
  ofKeep();
  const list = OFFICER.filter(x => (x.name||"").trim())
                      .map(x => ({role:(x.role||"").trim(), name:x.name.trim()}));
  if(!list.length){
    alert("가운데 칸에 임원 성함을 먼저 채워 주십시오.\n\n"
      + "지금 있는 임원진이 그대로 한 기수로 들어갑니다."); return; }

  const gi = prompt("몇 기입니까?\n\n숫자만 적어 주십시오.", String(histNextGi()));
  if(gi === null) return;
  const g = parseInt(String(gi).replace(/[^0-9]/g,""), 10);
  if(!g){ alert("기수를 숫자로 적어 주십시오."); return; }

  const term = prompt(`제${g}기 임기\n\n「2026.03 ~ 2029.03」처럼 적어 주십시오.`,
    DELEGATE.term || "");
  if(term === null) return;
  const [f, t] = String(term).split(/[~-−]/).map(x => x.trim());

  const by = prompt(`제${g}기 선출 근거\n\n`
    + `어느 총회 몇 호 안건인지 적어 주십시오.\n`
    + `구청이 「무슨 근거로 선임됐냐」고 물을 때 답이 됩니다.`,
    DELEGATE.at ? DELEGATE.at + " 제○호 안건" : "2026-03-20 정기총회 제○호 안건");
  if(by === null) return;

  OFF_HIST.push({id:"H"+Date.now(), gi:g, from:f||"", to:t||"",
    by:(by||"").trim(), list, memo:"", now:true, at:new Date().toISOString().slice(0,10)});
  /* ★ 「현재」는 한 기수뿐이다. 새로 넣으면 앞의 것은 지난 기수가 된다. */
  OFF_HIST.forEach(h => { if(h.id !== OFF_HIST[OFF_HIST.length-1].id) h.now = false; });
  officePut(S.name); render();
  alert(`제${g}기를 이력에 넣었습니다.\n\n`
    + `임원 ${list.length}분 · ${f||"?"} ~ ${t||"?"}\n\n`
    + `조합원 앱 사무실·임원에서도 보입니다.`);
}

function histNow2(id){
  const h = OFF_HIST.find(x => x.id === id); if(!h) return;
  if(!confirm(`제${h.gi}기를 현재 임원진으로 바꾸시겠습니까?\n\n`
    + `지금 「현재」인 기수는 지난 기수가 됩니다.\n`
    + `조합원 앱에도 이 기수가 현재로 나갑니다.`)) return;
  histSetNow(id, S.name); render();
}

function histEdit(id){
  const h = OFF_HIST.find(x => x.id === id); if(!h) return;
  const term = prompt(`제${h.gi}기 임기`, `${h.from||""} ~ ${h.to||""}`);
  if(term === null) return;
  const [f, t] = String(term).split(/[~-−]/).map(x => x.trim());
  const by = prompt(`제${h.gi}기 선출 근거`, h.by || "");
  if(by === null) return;
  const names = prompt(`제${h.gi}기 임원 명단\n\n`
    + `「직책 성명」을 한 줄에 하나씩 적어 주십시오.\n예 · 조합장 김철수`,
    (h.list||[]).map(m => `${m.role||""} ${m.name||""}`.trim()).join("\n"));
  if(names === null) return;
  const memo = prompt(`덧붙임 (없어도 됩니다)\n\n`
    + `예 · 2027.05 조합장 해임, 총무이사 직무대행`, h.memo || "");
  if(memo === null) return;

  h.from = f||""; h.to = t||""; h.by = (by||"").trim(); h.memo = (memo||"").trim();
  h.list = String(names).split(/\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\s+/);
    return p.length > 1 ? {role:p[0], name:p.slice(1).join(" ")} : {role:"", name:p[0]};
  });
  officePut(S.name); render();
}

/* ★ 삭제는 되도록 막는다. 임기가 끝난 것은 남기는 것이 맞다. */
function histDel(id){
  const h = OFF_HIST.find(x => x.id === id); if(!h) return;
  if(!confirm(`제${h.gi}기 (${h.from||"?"} ~ ${h.to||"?"})\n\n`
    + `★ 임기가 끝났다고 지우지 마십시오.\n`
    + `소송에서 「그때 누가 결재했나」를 다툽니다.\n`
    + `해임되신 분도 남기셔야 「숨겼다」는 말이 안 나옵니다.\n\n`
    + `잘못 넣으신 것이 아니라면 그대로 두시는 편이 낫습니다.\n\n`
    + `정말 지우시겠습니까?`)) return;
  OFF_HIST = OFF_HIST.filter(x => x.id !== id);
  officePut(S.name); render();
}

function ofAdd(){ ofKeep(); OFFICER.push({role:"이사", name:""}); render();
  const e=document.getElementById("ofr-n"+(OFFICER.length-1)); if(e) e.focus(); }
function ofDel(i){ ofKeep(); OFFICER.splice(i,1); render(); }
function ofMove(i,d){ ofKeep(); const j=i+d;
  if(j<0||j>=OFFICER.length) return;
  const t=OFFICER[i]; OFFICER[i]=OFFICER[j]; OFFICER[j]=t; render(); }

/* ═══════════════════════════════════════════════════════════
   대의원 명단 — 다섯 분씩 (2026-08-31)
   ───────────────────────────────────────────────────────────
   ★ 왜 다섯 분씩인가

     대의원이 100분 넘는 조합이 흔하다. 한 줄에 한 분씩 두면
     104줄이 되어 화면을 계속 굴려야 하고, 「몇 번째 분인가」를
     세려면 처음부터 세어 내려와야 한다.

     다섯 분씩이면 104분이 21줄로 줄고,
     **줄 수 × 5** 로 몇 번째인지 바로 나온다.

   ★ 담기는 것은 그대로 이름 목록이다.
     보이는 모양만 다섯씩 묶는 것이고, 조합원 앱과 서버에는
     예전과 똑같이 이름 하나씩 들어간다. 자료 모양은 바뀌지 않았다.

   ★ 나누는 글자는 가운뎃점(·)을 쓴다.
     쉼표는 엑셀에서 붙여 넣을 때 이름에 딸려 오는 일이 있다.
     읽어들일 때는 줄바꿈 · 쉼표 · 가운뎃점을 모두 받는다.
   ═══════════════════════════════════════════════════════════ */
const DL_PER = 5;

/* 이름 목록 → 이름칸에 넣을 글 (다섯씩 한 줄) */
function dlText(names){
  const out = [];
  for(let i = 0; i < names.length; i += DL_PER)
    out.push(names.slice(i, i + DL_PER).join(" · "));
  return out.join("\n");
}

/* 저장된 명단을 번호 붙여 다섯 칸으로 보여 준다.
   ★ 이름칸은 고치는 자리고, 이것은 확인하는 자리다.
     이름칸 안에는 번호를 넣을 수 없다. 넣으면 그 숫자까지
     이름으로 읽혀 「1」이라는 대의원이 생긴다. */
function dlGrid(names){
  if(!names.length) return "";
  return `<div class="sec" style="margin-top:16px;font-size:.84rem">
    담긴 명단 <em>${names.length}분</em></div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:5px">
    ${names.map((x, i) => `<div style="display:flex;align-items:baseline;gap:5px;
      border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;
      font-size:.82rem;min-width:0">
      <span class="mono" style="color:var(--muted);font-size:.68rem;flex:0 0 auto">${i+1}</span>
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x}</span>
    </div>`).join("")}
  </div>`;
}

/* ★ 치시는 동안 몇 분인지 그 자리에서 센다.
   104분을 넣고 세어 보려면 스크롤을 끝까지 내려야 했다.
   ★ render() 를 부르지 않는다. 화면을 다시 그리면 커서가 튄다.
     줄 맞추기도 여기서 하지 않는다. 치는 도중에 글이 움직이면
     쓰던 자리를 잃는다. 저장하실 때 한 번에 맞춘다. */
function dlCount(){
  const e = document.getElementById("dl-names");
  const c = document.getElementById("dl-cnt");
  if(!e || !c) return;
  const n = e.value.split(/[\n,·]+/).map(x=>x.trim()).filter(Boolean).length;
  c.textContent = ` — 지금 ${n}분 · 저장 안 됨`;
  c.style.color = "var(--amber)";
}

/* 대의원은 이름만 받는다. 지번이나 연락처는 명부이고, 명부는 공개 대상이 아니다.
   ★ 읽는 일은 ofKeep() 이 함께 한다. 여기서는 부르기만 한다.
     두 군데서 따로 읽으면 한쪽을 고칠 때 다른 쪽을 빠뜨린다.
     실제로 그렇게 빠뜨려서 이름이 지워지는 일이 있었다. */
function dlKeep(){ ofKeep(); }

async function dlSave(){
  ofKeep();
  const n = (DELEGATE.names||[]).length;
  if(!n && !confirm("이름칸이 비어 있습니다.\n\n"
    + "그대로 저장하시면 조합원 앱에서 대의원이 없어집니다.\n계속하시겠습니까?")) return;

  /* ★ 겹치는 이름을 짚어 드린다. 대의원 명단에 같은 이름이 두 번 들어가면
     정족수가 한 사람만큼 부풀려진다. 지우지는 않는다 — 동명이인일 수 있다. */
  const seen = {}, dup = [];
  (DELEGATE.names||[]).forEach(x => { if(seen[x]) { if(dup.indexOf(x)<0) dup.push(x); } seen[x]=1; });

  const r = await officePut(S.name);
  if(!r.ok){ alert("저장하지 못했습니다.\n\n" + (r.why||"") 
    + "\n\n치신 이름은 화면에 그대로 있습니다.\n다시 [대의원 저장]을 눌러 주십시오."); return; }

  alert(`대의원 ${n}분을 저장했습니다.`
    + (dup.length ? `\n\n★ 같은 이름이 두 번 들어간 것이 ${dup.length}건 있습니다.\n`
        + `  ${dup.slice(0,5).join(" · ")}${dup.length>5?" 외":""}\n\n`
        + `동명이인이면 그대로 두시고, 아니면 한 줄을 지워 주십시오.\n`
        + `대의원 수가 정족수 계산에 그대로 쓰입니다.` : ""));
  render();
}

function msgTest(){
  alert("나에게만 보냈습니다 (시연)\n\n받은 내용을 확인하신 뒤 전체 발송하십시오.");
}
function msgDo(later){
  const n = msgPicked().length;
  const c = msgChOf(MSG.ch);
  const t = msgTplOf(MSG.tpl);
  const body = c.tpl ? msgFill(t.body, MSG.vars, "심○자") : MSG.text;
  const real = realChannel(MSG.ch, body);
  const title = c.tpl ? t.name : (MSG.title || "제목 없음");
  if(later){
    alert(`내일 아침 ${MSG_QUIET.to}시에 나가도록 예약했습니다 (시연)\n\n`
      + `${title} · ${n}명`);
    MSG.step = "who"; pickReset("all"); render(); return;
  }
  const before = msgLeft(msgChOf(real).pk);
  const r = msgSend(real, title, n, S.name);
  MSG.done = {n, title, ch:real, ...r, before};
  MSG.step = "done"; render(); scrollTo(0,0);
}

  </div>`;

function csvUsage(){
  const code = (typeof TENANT_CODE !== "undefined") ? TENANT_CODE : "MIA-002";
  const b = billOf(code);
  const rows = [["다알아 · 이용 명세서"], [code, `${BILLQ.from} ~ ${BILLQ.to}`], [],
    ["항목","사용 건수","기본 제공량","초과","청구액"]];
  b.lines.forEach(l=>rows.push([l.name, l.used, l.incl, l.over, l.amount]));
  rows.push([], ["기본 이용료","","","",b.base], ["초과 사용 요금","","","",b.overSum],
    ["공급가액","","","",b.supply], ["부가세","","","",b.vat], ["합계","","","",b.total]);
  const csv = "﻿" + rows.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join(String.fromCharCode(13,10)) + String.fromCharCode(13,10);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `이용명세_${BILLQ.from}_${BILLQ.to}.csv`; a.click(); URL.revokeObjectURL(a.href);
}
/* ★ 품의 내용을 주소에 실어 보낸다.
   직원이 금액을 손으로 옮겨 적으면 오타가 난다.
   전자결재 화면이 이 값을 받아 기안 칸을 미리 채운다. */
function toExpense(){
  const code = (typeof TENANT_CODE !== "undefined") ? TENANT_CODE : "MIA-002";
  const b = billOf(code);
  const q = new URLSearchParams({
    tpl  : "T1",                                   /* 일반 지출 품의서 */
    title: `다알아 플랫폼 이용료 (${BILLQ.from} ~ ${BILLQ.to})`,
    amount: String(b.total),
    item : "기타",
    payee: "다알아 운영사",
    body : `1. 조합 운영 시스템 이용료 지급을 품의합니다.\n`
         + `  가. 기 간 : ${BILLQ.from} ~ ${BILLQ.to}\n`
         + `  나. 기본료 : ${wonB(b.base)}원\n`
         + `  다. 초과 사용 : ${wonB(b.overSum)}원\n`
         + `  라. 부가세 : ${wonB(b.vat)}원\n`
         + `  마. 합 계 : ${wonB(b.total)}원\n`
         + `2. 예산 과목 : 조합운영비 - 기타\n`
         + `3. 붙임 : 이용 명세서 1부`
  });
  window.open("approval.html?" + q.toString(), "_blank");
}

/* ── 새 설문 · 편집 ────────────────────────────────────── */
function svNew(tid){
  const t = SV_TEMPLATES.find(x=>x.id===tid); if(!t) return;
  SVW.draft = {
    id:svNo(), title:t.title || "", from:"", to:"", status:"draft",
    anon:true, once:true, openResult:false, note:"", quorumNeed:0,
    items: t.items.map((x,i)=>({id:"q"+(i+1), q:x.q, t:x.t, req:x.req, opts:x.opts.slice()}))
  };
  SVW.step = "edit"; render(); scrollTo(0,0);
}
function svEdit(id){
  const s = svById(id); if(!s) return;
  SVW.draft = JSON.parse(JSON.stringify(s)); SVW.step = "edit"; render(); scrollTo(0,0);
}
function svBack(){ SVW.step="list"; SVW.draft=null; SVW.id=null; render(); scrollTo(0,0); }

/* 편집 동작 */
function svKeep(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const d=SVW.draft; if(!d) return;
  const a=g('sv-title'), b=g('sv-note'), c=g('sv-from'), e=g('sv-to'), f=g('sv-need');
  if(a!==null) d.title=a; if(b!==null) d.note=b;
  if(c!==null) d.from=c; if(e!==null) d.to=e; if(f!==null) d.quorumNeed=Number(f)||0;
}
function svSet(k,v){ svKeep(); SVW.draft[k]=v; render(); }
function svQ(i,v){

  if(typeof svPut !== "undefined") svPut(S.name);

}

}

  return `

       이미 나간 돈이면 <b>추인</b>, 앞으로 쓸 것이면 <b>변경</b>으로 차수를 올리십시오.
       예산을 넘긴 채 결산총회에 가면 그 자리에서 다투게 됩니다.</p></div>`:""}

  <div class="sec">예산과목별 <em>제${rev.ord}차 기준</em></div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th>예산과목</th><th style="width:210px">쓰인 계정과목</th>
      <th style="width:150px">예산액 (원)</th><th style="width:110px">집행액</th>
      <th style="width:105px">잔액</th><th style="width:74px">집행률</th>
    </tr></thead><tbody>
    ${BUDGET.map(k=>{
      const bud  = BUDGET_PLAN[k]||0;
      const list = rows.filter(x=>x.item===k);
      const use  = list.reduce((a,x)=>a+x.amount,0);
      const codes = [...new Set(list.map(x=>x.acct).filter(Boolean))];
      return `<tr>
        <td><b>${k}</b></td>
        <td>${codes.length?codes.map(c=>`<span class="pill p-blue" style="margin:1px 2px 1px 0">${c} ${acctName(c)}</span>`).join("")
          :`<span class="tiny" style="color:var(--muted)">아직 집행 없음</span>`}</td>
        <td><input type="number" value="${bud}" onchange="budSet('${k}',this.value)"
          style="width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;
          font-size:.8rem;text-align:right;font-family:ui-monospace,monospace;outline:none"></td>
        <td class="mono" style="text-align:right;font-weight:700">${wonKR(use)}</td>
        <td class="mono" style="text-align:right;color:${bud-use<0?'var(--amber)':'var(--muted)'}">
          ${wonKR(bud-use)}</td>
        <td style="text-align:right">${bud?`<span class="pill ${use/bud>1?'p-warn':use/bud>0.8?'p-blue':'p-wait'}">
