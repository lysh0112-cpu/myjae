<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<meta name="robots" content="noindex,nofollow">
<title>다알아 관리 · 조합 직원</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════════════════════════════════════════════════════
   다알아 (Da-Ara) — 조합 직원용 관리 화면
   ───────────────────────────────────────────────────────────
   ★ PC 전용. 조합 사무실에서 쓰는 화면이다.
   ★ 조합원용 index.html 과 완전히 분리돼 있다.
     조합원 앱 소스에는 이 파일의 코드가 한 줄도 들어가지 않는다.

   ★ 직원 권한의 한계 (설계 원칙)
     · 구역 전환 불가        — 자기 구역만 본다 (크로스테넌트 차단)
     · 조합원 명부 열람 불가  — 조합장 결재 필요
     · 감정평가 자료 열람 불가 — 조합장 결재 필요
     · 계정·권한 변경 불가    — console.html(운영자)에서만

   ※ 지금은 시연용이다. 로그인은 화면 안에서만 확인하며 실제 보안이 아니다.
     Supabase Auth 로 옮기기 전까지는 조합 자료를 실제로 올리지 말 것.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#0B1F3A; --navy:#12365F; --blue:#2563EB; --amber:#F26419;
  /* ★ 2026-09-16 밤 — 테두리가 너무 흐려 안 보인다는 말씀.
     #E2E7EE 는 흰 바탕 위에서 거의 사라진다. 특히 밝은 사무실 화면에서.
     ★ 두 단계로 나눈다 —
       --line   칸을 가르는 얇은 줄 (표 · 목록)
       --edge   상자를 두르는 진한 줄 (박스 · 입력칸)
     둘을 같은 색으로 두면 「무엇이 한 덩이인지」가 안 보인다. */
  --paper:#FFF; --mist:#F5F7FA; --line:#A9B7C8; --edge:#8695AA; --muted:#5F6B7A;
  --ok:#0EA97A; --side:#0B1F3A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* 로그인 */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate-box{width:360px;background:var(--paper);border-radius:16px;padding:32px 30px;
  border:1px solid var(--line)}
.gate-box h1{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.gate-box p.sub{font-size:.82rem;color:var(--muted);margin-bottom:22px}
.f{margin-bottom:12px}
.f label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.f input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-size:.9rem;font-family:inherit;outline:none}
.f input:focus{border-color:var(--navy)}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border-radius:10px;
  padding:13px;font-size:.9rem;font-weight:700;text-align:center}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:.82rem}
.err{font-size:.78rem;color:var(--amber);margin-top:10px;min-height:18px}

/* 레이아웃 */
.wrap{display:none;min-height:100vh}
.wrap.on{display:flex}
aside{width:210px;background:var(--side);flex-shrink:0;padding:18px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;color:#fff;font-size:1rem;font-weight:800}
.brand span{display:block;color:#8FA3BA;font-size:.76rem;margin-top:3px}
nav{padding:6px 0 16px;flex:1;overflow-y:auto}
/* ★ 갈래 이름은 눌러도 아무 일이 없지만, 어디에 무엇이 있는지 알려 주는 표지다.
   너무 흐리면 표지 노릇을 못 한다. 하위 메뉴보다 밝게 두고
   위쪽에 선과 여백을 넉넉히 주어 한 덩어리임을 보인다. */
.ngr{color:#D7E3F2;font-size:.78rem;font-weight:800;letter-spacing:.3px;
  padding:9px 18px 7px;margin-top:16px;
  border-top:1px solid rgba(255,255,255,.14)}
/* ★ 갈래에 속한 것은 안으로 들여 쓴다. 위아래가 한눈에 갈린다. */
nav button.sub{padding-left:30px;font-size:.83rem}
nav button.sub.on{padding-left:30px}
/* 독립 메뉴는 위쪽에 붙여 두고 아래 갈래와 사이를 띄운다 */
.ntop{padding-bottom:2px}
nav button{display:block;width:100%;text-align:left;color:#B9C9DD;font-size:.84rem;
  padding:9px 18px;border-left:3px solid transparent;line-height:1.4}
nav button:hover{color:#fff;background:rgba(255,255,255,.06)}
nav button.on{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--amber);font-weight:700}
.who{padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.12)}
.who b{display:block;color:#C3D3E5;font-size:.8rem;font-weight:700}
.who span{display:block;color:#5F7B99;font-size:.74rem;margin-top:3px}
.who button{color:#8FA3BA;font-size:.74rem;margin-top:10px;text-decoration:underline}

main{flex:1;padding:26px 30px;min-width:0;max-width:920px}

/* ── 두 칸으로 쓰는 화면 (2026-08-22 오후) ───────────────
   ★ 920px 는 글을 읽는 폭이다. 눈이 왼쪽 끝에서 오른쪽 끝까지
     오갈 일이 없어야 한다. 그 규칙은 그대로 둔다.
     다만 왼쪽에 입력, 오른쪽에 목록을 놓는 화면은 그 폭으로 둘 다 못 담는다.
     운영자 콘솔의 deal · apt 화면에서 이미 쓰고 있는 방식이다. */
main.wide{max-width:1420px}

/* ★ 왼쪽은 460px 로 고정한다.
     입력칸은 넓어질 이유가 없다. 「보통 입력칸 420px」 규칙이 있고,
     제목 한 칸이 화면을 가로지르면 읽기가 나쁘다.
   ★ 오른쪽이 남는 폭을 다 쓴다.
     지금 「처리」 칸이 좁아 단추 다섯 개가 두 줄로 접혀 있다.
     목록은 넓을수록 좋다. */
.two{display:grid;grid-template-columns:460px minmax(0,1fr);gap:18px;align-items:start}
/* ★ 왼쪽에 표가 들어가는 화면은 조금 더 준다 (동의서 징구).
   「인가 요건」은 기준·동의·필요·판정·진행 다섯 칸이라 460px 로는 눌린다. */
.two.w560{grid-template-columns:560px minmax(0,1fr)}
@media(max-width:1180px){.two,.two.w560{grid-template-columns:1fr}}
.two > .col{min-width:0}
/* ★ 자료 등록은 세 칸이다 — 쓰는 칸 · 목록 · 폰 (2026-09-20 · 112절)
   예전에는 .two(두 칸) 안에 폰을 셋째로 넣어 **폰이 아래로 떨어졌다.**
   1920px 모니터 100% 기준 · 460 + 847 + 290 */
.two.w3{grid-template-columns:460px minmax(0,1fr) 290px}
@media(max-width:1500px){.two.w3{grid-template-columns:460px minmax(0,1fr)}
  .two.w3 > .pv-side{grid-column:1 / -1;width:100%;position:static;
    max-height:none;display:block;margin-top:6px}
  .two.w3 > .pv-side .phone{max-width:300px;margin:0 auto}
  .two.w3 > .pv-side .phone .ph-b{max-height:520px}}
@media(max-width:1180px){.two.w3{grid-template-columns:1fr}}
/* ④ 올리기 칸 */
.catb.allb{border-style:dashed;font-weight:700}
/* ★ 폰을 아래로 내리는 자리 (2026-09-22) */
/* ★★ 연도별 결산 화면 (2026-09-22)
   표가 아주 넓다(세목까지 있다). flex 로 두면 표가 밀고 나와
   **폰 미리보기 위를 덮었다.**
   → 오른쪽 320px 를 먼저 떼어 두고, 표는 그 안에서 옆으로 민다. */
.finwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.finwrap > .pv-main{min-width:0;overflow:hidden}
.finwrap .tblscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.finwrap .tblscroll .tbl{min-width:760px}
@media(max-width:1400px){.finwrap{grid-template-columns:1fr}
  .finwrap > .pv-side{position:static;width:100%;max-height:none;margin-top:16px}
  .finwrap > .pv-side .phone{max-width:320px}}
.pv-wrap.pv-wide{display:block}
.pv-wrap.pv-wide > .pv-side{width:100%;position:static;max-height:none;margin-top:16px}
.pv-wrap.pv-wide > .pv-side .phone{max-width:320px}
/* ★ AI 가 채운 칸 · 세목 (2026-09-22) */
tr.finai input{background:#FFF6EC;border-color:var(--amber)}
tr.finsub td{background:#FAFBFC}

/* ★★ 연도별 결산 표 (2026-09-23 정돈)
   칸마다 네모를 그리면 격자무늬가 되어 숫자가 안 읽힌다. 밑줄만 둔다. */
.fintbl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
/* ★ 사건 고르는 창 (2026-09-23) */
/* ★ 파일 / 링크 고르개 (2026-09-23) */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:12px;
  background:var(--mist);margin:14px 0 4px}
.seg2 button{padding:9px;border-radius:9px;font-size:.84rem;font-weight:700;
  color:var(--muted);font-family:inherit}
.seg2 button.on{background:var(--navy);color:#fff}
.casewrap{position:fixed;inset:0;z-index:150;background:rgba(16,32,58,.45);
  display:flex;align-items:center;justify-content:center;padding:20px}
.casebox{background:#fff;border-radius:16px;width:min(520px,100%);max-height:80vh;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(16,32,58,.3)}
.casehd{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.casehd b{font-size:.98rem;color:var(--navy)}
.casex{margin-left:auto;width:30px;height:30px;border-radius:9px;color:var(--muted)}
.casex:hover{background:var(--mist)}
.casebd{padding:14px 18px 16px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.casebd > input{width:100%;border:1.5px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:.88rem;font-family:inherit}
.casesk{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.caselist{overflow-y:auto;margin:6px -6px 0;padding:0 6px;min-height:0}
.caserow{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;
  border-bottom:1px solid var(--line)}
.caserow:hover{background:var(--mist)}
.caserow .nm{display:block;font-size:.88rem;font-weight:700;color:var(--ink)}
.caserow .mt{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.casefoot{display:flex;gap:10px;align-items:center;padding-top:13px;margin-top:10px;
  border-top:1px solid var(--line)}
.finhd,.finrw{display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1.2fr) 132px 132px 104px 74px;
  gap:10px;align-items:center;padding:9px 14px}
.finhd{background:var(--mist);border-bottom:1px solid var(--line);
  font-size:.74rem;color:var(--muted)}
.finhd .r{text-align:right}
.finrw{border-bottom:1px solid var(--line)}
.finrw.ai{background:#FFFCF6}
.finrw input,.finsrw input{border:0;border-bottom:1px solid var(--line);border-radius:0;
  background:transparent;padding:5px 2px;font-size:.82rem;font-family:inherit;min-width:0}
.finrw input:focus,.finsrw input:focus{border-bottom:1.5px solid var(--blue);outline:none}
.finrw input.r,.finsrw input.r{text-align:right;font-variant-numeric:tabular-nums}
.finrw.ai input{border-bottom-color:var(--amber);background:#FFF8EE}
.fincalc{text-align:right;font-size:.74rem;color:var(--muted);line-height:1.35}
.fincalc b{display:block;font-size:.82rem;color:var(--blue)}
.fincalc b.off{color:var(--muted)}
.finact{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.finx{width:24px;height:24px;border-radius:7px;color:var(--muted);font-size:.86rem;
  line-height:1;flex:none}
.finx:hover{background:#FDEEEE;color:#C0392B}
.finsb{background:#FAFBFC;border-bottom:1px solid var(--line);padding:4px 14px 8px}
.finsb .t{font-size:.74rem;color:var(--muted);padding:4px 0}
.finfold{font-size:.74rem;color:var(--blue);font-weight:700;font-family:inherit}
.finsrw{display:grid;grid-template-columns:minmax(0,1fr) 132px 132px 74px;gap:10px;
  align-items:center;padding:3px 0 3px 20px}
.fintot{display:grid;grid-template-columns:minmax(0,2.7fr) 132px 132px 104px 74px;gap:10px;
  align-items:center;padding:12px 14px;background:var(--navy);color:#fff;font-weight:800;
  font-size:.84rem}
.fintot .n{text-align:right;font-variant-numeric:tabular-nums}
tr.finper input:first-child{background:#FFF6EC;border-color:var(--amber)}
.arcgo{border:2px solid var(--blue);border-radius:12px;padding:13px 15px;background:#fff}
/* ★ 수정 중에 ④ 칸이 화면 위로 지나가면 떠 있는 막대가 대신한다
   (2026-09-21 · 121절). 목록이 왼쪽 칸보다 훨씬 길어서
   아래쪽 자료를 고르시면 [저장]이 화면에서 사라졌다.
   ★ sticky 로는 안 된다 — 왼쪽 칸 자체가 화면을 지나가면 붙을 자리가 없다. */
/* ★ AI 진행 창 (2026-09-21 · 122절) */
.aiwait{position:fixed;inset:0;z-index:200;background:rgba(16,32,58,.42);
  display:flex;align-items:center;justify-content:center}
.aiwait .aiwrap{background:#fff;border-radius:18px;padding:30px 38px;text-align:center;
  box-shadow:0 18px 50px rgba(16,32,58,.3);min-width:320px}
.aiwait b{display:block;font-size:1.02rem;color:var(--navy);margin-top:16px}
.aiwait p{margin:7px 0 0;font-size:.82rem;color:var(--muted);line-height:1.6}
.aiwait .aitick{display:inline-block;margin-top:12px;font-size:.76rem;font-weight:700;
  color:var(--blue);background:#EFF5FF;border-radius:20px;padding:4px 13px}
.aidia{width:42px;height:42px;margin:0 auto;background:var(--blue);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);animation:aispin 1.25s linear infinite}
@keyframes aispin{to{transform:rotate(360deg)}}
.arcbar{display:none}
@media(min-width:1181px){
  .arcbar.on{display:flex;position:fixed;left:240px;bottom:18px;width:460px;z-index:60;
    align-items:center;gap:9px;background:#fff;border:2px solid var(--blue);border-radius:12px;
    padding:10px 13px;box-shadow:0 8px 26px rgba(16,32,58,.18)}
  .arcbar b{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arcbar .btn{width:auto;flex:none;padding:7px 15px;font-size:.78rem;margin:0}
}
.arcgo .ck{font-size:.82rem;line-height:1.85}
.arcgo .ck .no{color:var(--amber);font-weight:700}
.arcgo .ck .soft{color:#B7791F}
.arcgo .btn{width:100%;margin-top:10px}
.stick{position:sticky;top:74px}

/* ── 세 칸 (2026-08-22 오후 · 동의서 징구) ────────────────
   ★ 왼쪽 요건·접수 / 가운데 결재 / 오른쪽 제출 내역.
     동의서는 「요건을 본다 · 접수한다 · 결재한다 · 대장을 본다」가
     한 화면에서 함께 돈다. 두 칸으로는 결재와 대장이 위아래로 겹친다.

   ★ 이 화면만 1760px 이다.
     세 칸이 되면 제출 내역이 들어갈 자리가 모자란다.
       1420px 일 때   1360 − 380 − 440 − 여백 = 504px
       제출 내역이 필요로 하는 폭        약 670px (칸 여덟 개)
     본문 920px 규칙은 그대로 살아 있고 이 화면만 예외다. */
main.xwide{max-width:1760px}
.three{display:grid;gap:18px;align-items:start;
  grid-template-columns:380px 440px minmax(0,1fr)}
/* ★ 사무실·임원 화면은 가운데가 넓어야 한다.
   임원이 열 분 넘게 들어가고 직책·성명·단추가 한 줄에 있어야 한다. */
.three.wmid{grid-template-columns:340px 540px minmax(0,1fr)}
.three > .col{min-width:0}

/* ★ 좁아지면 제출 내역을 아래로 내려 전체 폭을 준다.
   세 칸을 우겨넣어 글자가 잘리는 것보다,
   내려가서 넓어지는 편이 낫다. 노트북에서 여실 때를 위한 것이다. */
@media(max-width:1620px){
  .three{grid-template-columns:400px minmax(0,1fr)}
  .three > .col.c3{grid-column:1 / -1}
}
@media(max-width:1080px){
  .three{grid-template-columns:1fr}
  .three > .col.c3{grid-column:auto}
}

/* ── 고정 머리띠 ─────────────────────────────────────────
   ★ 올리기 단추를 찾으러 스크롤을 내리지 않아도 되게 한다.
     main 의 좌우 여백(30px)만큼 음수 여백을 줘서 끝까지 채운다. */
.pghd{position:sticky;top:0;z-index:20;background:var(--paper);
  margin:-26px -30px 18px;padding:15px 30px 13px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pghd .pgL{min-width:0}
.pghd .pgR{display:flex;align-items:center;gap:12px}

/* ── 접어 두는 안내문 ────────────────────────────────────
   ★ 왜 그렇게 했는지는 지우지 않는다. 접어 둘 뿐이다.
     매일 쓰는 분께는 방해가 되고, 처음 오는 분께는 꼭 필요하다. */
.fold{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.fold > summary{padding:9px 13px;font-size:.79rem;font-weight:700;color:var(--navy);
  cursor:pointer;background:var(--mist);list-style:none;display:flex;align-items:center;gap:7px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::before{content:"▸";color:var(--muted);font-size:.72rem}
.fold[open] > summary::before{content:"▾"}
.fold > summary:hover{background:#EDF1F6}
.fold > summary .sm{margin-left:auto;font-weight:600;font-size:.74rem;color:var(--muted)}
.fold .fb{padding:11px 14px 13px;font-size:.77rem;color:#41576B;line-height:1.7}
.fold .fb b{color:var(--navy)}
.fold.warnf > summary{background:#FFF4EC;color:#8C3A12}
.fold.warnf > summary:hover{background:#FFEBDC}
.fold.warnf{border-color:#F3C7AC}
.fold.warnf > summary .sm{color:#A9613C}

/* ── 좁은 칸에서 쓰는 목록 (2026-08-22 오후) ─────────────
   ★ 표를 버리고 목록으로 바꾼 자리다.

     「결재 대기 중인 서면」은 칸이 일곱이었다.
       접수번호 · 조합원 · 소유 부동산 · 종이 제출일 · 동의 · 스캔 · 재출력
     세 칸 배치에서 가운데는 440px 뿐이라
     머리글이 세로로 쪼개져 「접수/번호」 「조/합/원」 「서/식/다/시/출/력」
     처럼 한 글자씩 떨어졌다. 읽을 수가 없다.

   ★ 좁은 자리에 표를 우겨넣지 않는다. 줄로 쌓는다.
       윗줄   접수번호 · 동의 여부 · [서식 다시 출력]
       가운뎃줄 이름 · 지번 · 종이 제출일
       아랫줄  [스캔 보기] [바꾸기] · 크기와 시각
     칸이 몇 개든 폭에 맞춰 접히고, 무엇이 무엇인지 알 수 있다.

   ★ 스캔이 없는 건은 배경을 달리한다.
     스캔이 다 붙어야 결재를 올릴 수 있어서 한눈에 보여야 한다. */
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.drow.noscan{background:#FFFBF7;border-color:#F3C7AC}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtop b{color:var(--navy);font-size:.82rem}
.dtop .rep{margin-left:auto;color:var(--blue);font-weight:700;font-size:.74rem;white-space:nowrap}
.dsub{font-size:.79rem;margin-top:5px}
.dact{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.dmeta{font-size:.7rem;color:var(--muted)}

/* ══ 검수 대기열 (2026-08-22 밤 · 고밀도로 다시 만듦) ══════
   ★ 예전에는 한 항목이 여섯 줄이었다.
     질문 / 답 / 자리 / 이렇게도 / 단추 줄이 세로로 쌓이고
     「없음 · 눌러서 적어 주십시오」 같은 안내가 줄마다 붙었다.
     열두 개만 되어도 화면 세 배를 넘겨야 다 본다.

   ★ 한 항목을 두 줄로 줄였다.
       왼쪽   체크 · 질문 · 답 · 낱말
       오른쪽  쪽수 · 자리 / 확인 / ✕
     안내 문구는 title 로 옮겼다. 마우스를 올리면 나온다.
     화면에 늘 떠 있을 글이 아니다.

   ★ 확인한 것과 안 한 것을 색으로 가른다.
     안 한 것은 흰 바탕에 주황 왼쪽 선 — 눈에 걸린다.
     확인한 것은 회색으로 가라앉는다 — 볼 일이 끝난 것이다.
     훑었을 때 「처리할 것」만 도드라져야 한다. */
.qlist{display:flex;flex-direction:column;gap:0;
  border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.qrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;
  gap:11px;align-items:start;padding:10px 13px;
  border-bottom:1px solid var(--line);border-left:3px solid var(--amber);
  background:#fff}
.qrow:last-child{border-bottom:0}
.qrow.ok{border-left-color:var(--ok);background:#FAFBFC}
.qrow.ok .qq{color:var(--muted)}
.qrow.ok .qa{color:#7C8A99}
.qrow:hover{background:#F6F9FD}
.qrow.open{background:#F4F8FD;border-left-color:var(--navy)}

.ckbox{width:22px;height:22px;border-radius:6px;margin-top:1px;
  border:1.5px solid #C6CEDA;background:#fff;color:transparent;
  font-size:.85rem;font-weight:800;line-height:1;flex:0 0 auto}
.ckbox.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ckbox:hover{border-color:var(--navy)}

.qmain{min-width:0;display:flex;flex-direction:column;gap:3px}
.qq{font-size:.84rem;font-weight:700;color:var(--ink);cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qq:hover{color:var(--blue)}
.qa{font-size:.79rem;color:#41576B;line-height:1.55;cursor:pointer;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qa:hover{color:var(--blue)}
.qa.empty{color:#C0C9D4;font-style:italic}
.qkw{display:flex;gap:4px;flex-wrap:wrap;cursor:pointer;margin-top:1px}
.qkw em{font-style:normal;font-size:.68rem;color:var(--muted);
  background:var(--mist);border-radius:5px;padding:2px 7px}
.qkw em.empty{background:transparent;border:1px dashed #C6CEDA;color:#B4BEC9}
.qkw:hover em{color:var(--navy)}

.qside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
/* ★★★ 2026-09-19 — 자리 이름표가 길면 질문을 밀어냈다 ★★★
   「도시 및 주거환경정비법 제29조 제4항 · 2~3쪽」처럼 길어지면
   오른쪽 칸이 통째로 넓어져 **질문과 답이 찌그러진다.**
   ★ 폭을 200px 로 막고 넘치면 … 로 줄인다.
     마우스를 올리시면(title) 온전히 보인다. */
.qpg{font-size:.74rem;font-weight:700;color:var(--navy);white-space:nowrap;
  border:1px solid var(--line);border-radius:7px;padding:4px 10px;background:#fff;
  max-width:200px;overflow:hidden;text-overflow:ellipsis;display:block}
.qpg:hover{border-color:var(--navy);background:var(--mist)}
.qpg.empty{color:#B4BEC9;border-style:dashed}
.qbtns{display:flex;gap:4px}
.qb{font-size:.7rem;font-weight:700;border:1px solid var(--line);
  border-radius:6px;padding:3px 8px;color:var(--muted);background:#fff;white-space:nowrap}
.qb:hover{border-color:var(--navy);color:var(--navy)}
.qb.yes{border-color:#9FD9C3;color:var(--ok)}
.qb.yes:hover{background:#E9F7F1}
.qb.del{border-color:#EEDADA;color:#C98B8B}
.qb.del:hover{background:#FDF2F2;color:var(--red)}

/* 답 고치는 칸 — 카드 안에서 그 자리에 펴진다 */
.qedit{grid-column:1 / -1;margin-top:8px;padding-top:9px;
  border-top:1px dashed var(--line)}
.qedit textarea{width:100%;max-width:100%;border:1px solid var(--navy);border-radius:8px;
  padding:9px 11px;font-size:.83rem;line-height:1.7;font-family:inherit;resize:vertical}
.qedit textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.qeb{display:flex;gap:7px;margin-top:7px;align-items:center}

/* 자료 등록 — 낮춘 드롭존 */
.drop.slim{padding:16px;display:flex;align-items:center;justify-content:center;gap:11px}
.drop.slim b{font-size:.84rem}
.drop.slim span{font-size:.74rem}

/* ── 긴 목록 (2026-08-22 오후) ───────────────────────────
   ★ 동의서 제출 내역은 수천 건이 된다.
     조합원 500명이 각각 한 번씩만 내도 500줄이고,
     다시 내신 분은 「대체됨」으로 남아 줄이 더 늘어난다.
     화면에 그대로 풀어 놓으면 아래 단추가 저 멀리 내려가고
     스크롤 막대가 화면 높이의 몇십 분의 일이 된다.

   ★ 표 안쪽만 구른다. 머리행은 붙어 있는다.
     스무 줄쯤 내려가면 「이 칸이 면적이었나 동의였나」를 알 수 없다.
     position:sticky 로 머리행을 표 위에 붙여 둔다. */
.tallbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:0;overflow:auto;max-height:min(62vh, 720px)}
.tallbox table{margin:0}
.tallbox thead th{position:sticky;top:0;z-index:2;background:var(--mist);
  box-shadow:inset 0 -1px 0 var(--line)}

/* ★ 입력칸을 내용에 맞게 잡는다.
   지번 한 줄 넣는 칸이 화면 끝까지 늘어나면 엉성해 보이고
   눈이 왼쪽 끝에서 오른쪽 끝까지 오가야 해서 읽기도 나쁘다. */
.f input,.f select,.f textarea{max-width:420px}
.f.wide input,.f.wide select,.f.wide textarea{max-width:100%}
.f.mini input,.f.mini select{max-width:170px}
.f.half input,.f.half select{max-width:280px}
.g2 .f input,.g2 .f select,.g3 .f input,.g3 .f select{max-width:100%}

/* 한 줄에 나란히 놓는 입력 묶음
   ★★★ 이 두 줄이 사라져 있었다 (2026-08-22 오후 복구) ★★★

     admin.html 은 class="g2" 를 여덟 곳, class="g3" 를 여섯 곳에서 쓰는데
     **규칙이 정의되어 있지 않았다.** console.html 과 approval.html 에는 있다.
     파일을 나누다 지워진 것으로 보인다. 바로 윗줄(.g2 .f input …)만
     남아 있고 정작 .g2 자체가 없었다.

     그래서 나란히 놓으려던 것이 전부 위아래로 흘러내렸다.
     자료 등록 화면은 왼쪽·오른쪽이 이미 나뉘어 있는데도
     세로로 길게 늘어져 오른쪽 절반이 내내 비어 있었다.

     한 줄이 열네 곳을 한꺼번에 고친다.
     소식 · 의결 기록 · 사무실 · 단체 문자 · 설문 · 명부 · 이용요금이
     모두 이 규칙을 쓴다.

   ★ 화면이 좁으면 한 칸으로 접는다. 노트북에서 글자가 잘리면 안 된다. */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}

/* ★ 두 칸 화면의 왼쪽 안에서는 g2 를 다시 나누지 않는다.
   560px 안에서 또 반으로 쪼개면 「1단계 · 표준 서식 내려받기」 같은
   글자가 두 글자씩 접힌다. 칸 안의 칸은 세로로 쌓는 편이 낫다. */
.g2.stack{grid-template-columns:1fr}
/* ── 폰 미리보기 ─────────────────────────────────────────
   ★ 만들면서 바로 보여야 한다.
     등록한 뒤에야 확인되면 고치러 다시 들어와야 한다.
     특히 설문은 문항 유형이 여덟 가지라
     폰에서 어떻게 나오는지 안 보고 만들면 반드시 다시 손댄다. */
.pv-wrap{display:flex;gap:20px;align-items:flex-start}
.pv-main{flex:1;min-width:0}
/* ★★★ 2026-09-20 — 폰을 화면 높이만큼 편다 ★★★
   ───────────────────────────────────────────────────────────
   예전에는 .ph-b 가 **520px 에서 잘렸다.**
   안에서 스크롤은 되지만 **한눈에 안 들어온다.**
   조합원 폰은 실제로 800px 쯤 된다.

   ★ 화면 높이만큼 쓰고 **스크롤을 따라온다**(sticky).
     왼쪽에서 글을 쓰며 내려가셔도 폰이 함께 온다.
   ★ 화면이 낮으면(노트북) 그만큼만 보이고 안에서 스크롤된다.
   ★ 길이 제한을 아예 없애면 **직원 화면이 3~4배로 길어져**
     오른쪽 목록과 높이가 안 맞는다. 그래서 sticky 를 쓴다. */
.pv-side{width:290px;flex-shrink:0;position:sticky;top:22px;
  max-height:calc(100vh - 44px);display:flex;flex-direction:column}
.pv-side .cap{font-size:.78rem;color:var(--muted);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center}
.phone{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 2px 14px rgba(11,31,58,.07)}
.phone .ph-h{background:var(--navy);color:#fff;padding:11px 14px;
  font-size:.86rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.phone .ph-h em{font-style:normal;font-size:.72rem;font-weight:400;color:#B9C9DD}
/* ★ 520px 제한을 걷었다 (2026-09-20). 폰 상자가 남는 높이를 다 쓴다. */
.phone{display:flex;flex-direction:column;min-height:0}
.phone .ph-h{flex:0 0 auto}
.phone .ph-b{padding:13px 14px;overflow-y:auto;flex:1;min-height:0}
/* ★ 붙박이 칸 안에서 폰이 남는 높이를 차지한다 */
.pv-side .phone{flex:1;min-height:0}
.pv-side .cap{flex:0 0 auto}
.phone .ph-b::-webkit-scrollbar{width:5px}
.phone .ph-b::-webkit-scrollbar-thumb{background:#D8DEE6;border-radius:9px}
@media(max-width:1240px){
  .pv-wrap{display:block}
  /* ★ 좁아지면 붙박이를 푼다. 높이 제한도 푼다 (2026-09-20).
     세로로 쌓이는데 높이를 묶어 두면 **폰이 눌려 찌그러진다.** */
  .pv-side{width:100%;position:static;margin-top:20px;max-height:none;display:block}
  .pv-side .phone{max-width:300px;margin:0 auto}
  .phone .ph-b{max-height:520px}
  /* ★ 소식 화면은 세 칸이다 (2026-09-18). 좁아지면 함께 세로로 쌓인다. */
  .nwcol{width:100%;position:static;max-height:none;margin-top:20px}
}

/* 폰 안쪽 조각들 */
.pn-urgent{background:#FFF0E6;border:1px solid var(--amber);border-radius:11px;
  padding:11px 12px;margin-bottom:11px}
.pn-urgent b{display:block;font-size:.72rem;font-weight:800;color:#8C3A12}
.pn-urgent p{margin:3px 0 0;font-size:.82rem;font-weight:700;color:var(--ink);line-height:1.45}
.pn-row{display:flex;gap:10px;margin-bottom:13px}
.pn-line{width:2px;background:var(--line);border-radius:2px;position:relative;flex-shrink:0}
.pn-dot{position:absolute;top:2px;left:-4px;width:10px;height:10px;border-radius:50%}
.pn-b{flex:1;min-width:0}
.pn-b .h{display:flex;justify-content:space-between;gap:8px}
.pn-b .h em{font-style:normal;font-size:.72rem;font-weight:700}
.pn-b .h span{font-size:.72rem;color:#B9C0C9}
.pn-b .t{font-size:.82rem;font-weight:700;margin-top:2px;line-height:1.5;word-break:keep-all}
/* ★ 본문을 두 줄로 자르지 않는다.
   조합원이 앱에서 보는 것은 제목이 아니라 내용이다.
   "장소가 어디로 바뀌었는지" 를 알아야 하는데
   제목만 보이면 다시 눌러 들어가야 한다. */
.pn-b .d{font-size:.76rem;color:var(--muted);line-height:1.7;margin-top:4px;
  white-space:pre-wrap;word-break:keep-all}
.pn-ag{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px}
.pn-ag .n{font-size:.72rem;color:var(--blue);font-weight:700}
.pn-ag .t{font-size:.82rem;font-weight:700;margin-top:2px;line-height:1.45}
.pn-ag .r{font-size:.74rem;color:var(--muted);margin-top:3px}
.pn-pick{display:flex;gap:6px;margin-top:9px}
.pn-pick span{flex:1;border:1px solid var(--line);border-radius:8px;
  padding:7px 0;text-align:center;font-size:.76rem;color:var(--muted)}
.pn-q{font-size:.82rem;font-weight:700;line-height:1.5;margin-bottom:8px;word-break:keep-all}
.pn-q i{font-style:normal;color:var(--amber)}
.pn-o{display:flex;gap:9px;align-items:center;border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;font-size:.8rem;margin-bottom:6px}
.pn-o .rd{width:15px;height:15px;border-radius:50%;border:1.5px solid #D8DEE6;flex-shrink:0}
.pn-o .rd.sq{border-radius:4px}
.pn-in{border:1px solid var(--line);border-radius:9px;padding:10px 11px;
  font-size:.78rem;color:#B9C0C9;margin-bottom:6px}
.pn-sc{display:flex;gap:6px}
.pn-sc span{flex:1;border:1px solid var(--line);border-radius:8px;
  padding:9px 0;text-align:center;font-size:.78rem}
.pn-btn{background:var(--navy);color:#fff;text-align:center;border-radius:10px;
  padding:12px;font-size:.84rem;font-weight:700;margin-top:12px}

.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.frow .f{margin-bottom:0}
.frow .grow{flex:1;min-width:220px}
.frow .grow input{max-width:100%}

/* 고른 조합원을 보여주는 줄 */
.pick-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  border:1px solid var(--navy);background:#F0F5FB;border-radius:11px;
  padding:12px 14px;margin-bottom:12px;max-width:640px}
.pick-row .num{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--navy)}
.pick-row .nm{font-weight:800}
.pick-row .sub{font-size:.78rem;color:var(--muted)}
.pick-row .sp{margin-left:auto;display:flex;gap:8px;align-items:center}

/* 후보 목록 */
/* ── 조합원 찾기 후보 (2026-08-23 새벽 · 크게 다시 만듦) ──
   ★ 총회 접수 데스크는 줄이 서 있는 자리다.
     직원이 화면을 들여다보며 눈을 찌푸릴 여유가 없다.
     이름을 한눈에 읽고 바로 누를 수 있어야 한다. */
.cand{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.cand button{display:flex;gap:15px;align-items:center;width:100%;text-align:left;
  padding:15px 18px;border:0;background:#fff}
.cand button+button{border-top:1px solid var(--line)}
.cand button:hover{background:#F4F8FD}
.cand .n{font-family:ui-monospace,Menlo,monospace;flex:0 0 auto;min-width:58px;
  color:var(--blue);font-weight:800;font-size:1.05rem}
.cand .b{flex:1;min-width:0}
.cand .b b{display:block;font-size:1.28rem;font-weight:800;letter-spacing:-.01em;
  line-height:1.25;color:var(--ink)}
.cand .b span{display:block;font-size:.82rem;color:var(--muted);margin-top:3px}

/* ── 찾기 칸 — 크고 눈에 띄게 ─────────────────────────── */
.findbox{position:relative;margin-top:14px;margin-bottom:12px}
.findbox label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:6px}
.findbox input{width:100%;max-width:100%;font-size:1.15rem;font-weight:700;
  padding:15px 44px 15px 18px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.findbox input::placeholder{font-weight:400;color:#B4BEC9;font-size:1rem}
.findbox input:focus{border-color:var(--navy);outline:none;
  box-shadow:0 0 0 4px rgba(18,54,95,.08)}
.findx{position:absolute;right:12px;bottom:12px;width:28px;height:28px;
  border-radius:8px;color:var(--muted);font-size:.9rem;background:var(--mist)}
.findx:hover{background:#E4EAF2;color:var(--ink)}

/* ── 고른 분 — 이름을 크게 ──────────────────────────── */
.whobar{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.whobar .wno{font-family:ui-monospace,Menlo,monospace;font-size:1.05rem;
  font-weight:800;color:var(--blue);background:var(--mist);border-radius:9px;padding:7px 13px}
.whobar .wtx{flex:1;min-width:0}
.whobar .wtx b{display:block;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.whobar .wtx span{display:block;font-size:.84rem;color:var(--muted);margin-top:3px}

/* ── 정족수 카드 ─────────────────────────────────────── */
.qcards{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
@media(max-width:900px){.qcards{grid-template-columns:repeat(2,1fr)}}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.qcard > span{display:block;font-size:.76rem;color:var(--muted)}
.qcard > b{display:block;font-size:1.9rem;font-weight:800;line-height:1.15;margin-top:2px}
.qcard > em{display:block;font-style:normal;font-size:.73rem;color:var(--muted);margin-top:3px}
.qcard.good > b{color:var(--ok)}
.qcard.good{border-color:#9FD9C3;background:#F7FCFA}
.qcard.bad > b{color:var(--red)}
.qcard.bad{border-color:#F0C4C4;background:#FEF9F9}
.qbar{height:5px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.qbar > i{display:block;height:100%;background:var(--navy);border-radius:99px}
.qcard.good .qbar > i{background:var(--ok)}
.qcard.bad  .qbar > i{background:var(--amber)}

/* ── 데스크 고르기 (2026-08-23 새벽) ──────────────────
   ★ 총회 당일 PC 를 여러 대 놓는다.
     각 PC 가 자기 번호를 골라야 접수가 서로 덮어써지지 않는다.
     자세한 것은 roster-demo.js 의 ATT_BOX 주석. */
.deskpick{display:flex;gap:4px;background:var(--mist);border-radius:10px;padding:3px}
.deskpick button{width:34px;height:32px;border-radius:8px;font-size:.86rem;
  font-weight:800;color:var(--muted);background:transparent}
.deskpick button.on{background:var(--navy);color:#fff}
.deskpick button:hover:not(.on){background:#E4EAF2;color:var(--ink)}

/* 데스크 수 늘리고 줄이기 */
.desknum{display:flex;align-items:center;gap:2px;background:var(--mist);
  border-radius:10px;padding:3px}
.desknum button{width:28px;height:30px;border-radius:8px;font-size:1rem;
  font-weight:800;color:var(--muted);background:transparent}
.desknum button:hover:not(:disabled){background:#E4EAF2;color:var(--navy)}
.desknum button:disabled{color:#CBD3DC}
.desknum span{font-size:.78rem;font-weight:700;color:var(--muted);padding:0 5px}

/* ── 전체 합계 머리 ─────────────────────────────────────
   ★ 「출석 계」라고만 하면 이 PC 것인지 전체인지 헷갈린다.
     총회장에서 정족수를 잘못 읽으면 총회가 무효가 된다. */
.sumhd{font-size:.86rem;font-weight:800;color:var(--navy);
  margin:16px 0 8px;display:flex;align-items:baseline;gap:8px}
.sumhd em{font-style:normal;font-size:.74rem;font-weight:400;color:var(--muted)}

/* ── 데스크별 현황 (2026-08-23) ────────────────────────
   ★ 어느 데스크에 사람이 몰리는지 보여야 직원을 옮기실 수 있다.
   ★ 안 쓰는 자리도 기록이 있으면 보인다. 줄여도 세기 때문이다. */
.dkrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  margin-top:11px;padding:10px 12px;background:var(--mist);border-radius:11px}
.dklbl{font-size:.74rem;color:var(--muted);font-weight:700;flex:0 0 auto}
.dkchip{display:flex;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--line);border-radius:9px;padding:6px 11px}
.dkchip b{font-size:.76rem;font-weight:800;color:var(--muted)}
.dkchip span{font-size:.88rem;font-weight:800;color:var(--ink)}
.dkchip em{font-style:normal;font-size:.66rem;font-weight:700;color:var(--blue);
  background:#E8F0FB;border-radius:5px;padding:2px 6px}
.dkchip .dot{width:6px;height:6px;border-radius:99px;background:var(--ok)}
.dkchip.me{border-color:var(--navy);border-width:1.5px}
.dkchip.me b{color:var(--navy)}
.dkchip.off{opacity:.6;background:#F7F8FA}
.dkchip.off em{color:var(--muted);background:var(--line)}
.dkchip:hover:not(.off){border-color:var(--navy)}
.dkhint{margin-left:auto;font-size:.74rem;color:var(--muted)}

/* ── 역대 임원 이력 (2026-08-23) ─────────────────────────
   ★ 지금 기수와 지난 기수를 색으로 가른다.
     조합원이 「지금 조합장이 누구냐」를 물으실 때
     한눈에 보여야 한다. */
.hlist{display:flex;flex-direction:column;gap:9px}
.hrow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  border-left:3px solid var(--line)}
.hrow.now{border-left-color:var(--ok);background:#F8FCFA;border-color:#9FD9C3}
.htop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.htop > b{font-size:.95rem;font-weight:800;color:var(--navy)}
.hterm{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--muted)}
.hact{margin-left:auto;display:flex;gap:5px}
.hact button{font-size:.7rem;font-weight:700;border:1px solid var(--line);
  border-radius:6px;padding:3px 9px;color:var(--muted);background:#fff;white-space:nowrap}
.hact button:hover{border-color:var(--navy);color:var(--navy)}
.hact button.del{border-color:#EEDADA;color:#C98B8B}
.hact button.del:hover{background:#FDF2F2;color:var(--red)}
.hby{font-size:.74rem;color:var(--blue);margin-top:6px}
.hnames{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hnames > span{font-size:.79rem;background:var(--mist);border-radius:7px;padding:4px 10px}
.hnames > span b{font-weight:700;color:var(--navy);margin-right:5px;font-size:.72rem}
.hnames > span.none{background:transparent;color:#B4BEC9;padding-left:0}
.hmemo{font-size:.75rem;color:#8C3A12;background:#FFF6F0;border-radius:7px;
  padding:6px 10px;margin-top:8px}

/* ── 의결 기록 탭 (2026-08-23) ───────────────────────────
   ★ 회의 종류마다 모수와 요건이 다르다.
     대의원회 기록에 총회 총원 97을 넣으면 정족수가 통째로 틀린다. */
.dtabs{display:flex;gap:6px;margin:14px 0 0;flex-wrap:wrap}
.dtabs button{display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 16px;font-size:.86rem;font-weight:700;color:var(--muted)}
.dtabs button span{font-size:.72rem;font-weight:800;color:#B4BEC9;
  background:var(--mist);border-radius:6px;padding:1px 7px}
.dtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dtabs button.on span{background:rgba(255,255,255,.18);color:#fff}
.dtabs button:hover:not(.on){border-color:var(--navy);color:var(--navy)}

/* 탭별 요건 안내 */
.dguide{margin-top:11px;background:var(--mist);border-radius:11px;padding:12px 15px}
.dguide > b{font-size:.86rem;color:var(--navy)}
.dguide .base{font-size:.74rem;color:var(--blue);margin-left:8px}
.dguide p{font-size:.78rem;color:#41576B;line-height:1.7;margin:5px 0 0}
.dguide .tot{display:inline-block;font-size:.78rem;color:var(--muted);margin-top:7px}
.dguide .tot b{color:var(--navy);font-size:.92rem}
.dguide .tot button,.kbase button{font-size:.72rem;font-weight:700;color:var(--blue);
  border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:6px;background:#fff}

/* 등록 폼의 회의 종류 고르기 */
.kindpick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kindpick button{border:1px solid var(--line);background:#fff;border-radius:9px;
  padding:8px 16px;font-size:.83rem;font-weight:400;color:var(--muted)}
.kindpick button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.kindpick .kbase{margin-left:auto;font-size:.76rem;color:var(--muted)}

/* ── 임원 한 줄 (2026-08-23 다시 만듦) ────────────────────
   ★ 예전에는 .frow 를 썼는데 flex-wrap:wrap 이라
     가운데 칸 안에서 직책 · 성명 · 단추가 줄줄이 접혔다.
     「조합장(직무대행)」 아래에 「정찬경」이 따로 떨어져
     짝이 어긋나 보였고, 직원이 「등록이 안 된다」고 하셨다.
     실제로는 저장되고 있었는데 화면이 그렇게 보인 것이다.

   ★ 직책은 골라서 넣는다.
     손으로 치게 두면 「조합장」 「조합 장」 「조합장(직무대행)」이 섞인다.
     조합원 앱은 정확히 「조합장」인 것만 위에 펼쳐 보여 주므로
     한 글자만 달라도 아래 접힌 자리로 내려간다.
     정작 조합장이 안 보이고 이사가 위에 뜬다.
     ★ 정관에 없는 직책은 「그 밖」을 고르시고 옆 칸에 직접 치신다.

   ★ 이름 칸을 크게 한다.
     직원이 눈으로 확인하는 곳이고, 어르신 성함에는
     비슷한 글자가 많다(정찬경 · 정찬정). 작으면 잘못 보신다. */
.ofrow{display:grid;grid-template-columns:132px minmax(0,1fr) auto;
  gap:8px;align-items:center;margin-bottom:8px}
/* 「그 밖」을 고르시면 직접 치는 칸이 한 자리 더 생긴다 */
.ofrow.own{grid-template-columns:132px 128px minmax(0,1fr) auto}

.ofrow select.orole{width:100%;max-width:100%;border:1px solid var(--line);
  border-radius:9px;padding:11px 10px;font-size:.88rem;font-weight:700;
  color:var(--navy);background:var(--mist);font-family:inherit}
.ofrow select.orole:focus{border-color:var(--navy);outline:none;background:#fff}

.ofrow input{width:100%;max-width:100%;border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;background:#fff;font-family:inherit}
.ofrow input:focus{border-color:var(--navy);outline:none;
  box-shadow:0 0 0 3px rgba(18,54,95,.08)}

/* ★ 성명 — 크고 굵게 */
.ofrow .oname{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.ofrow .oname::placeholder{font-size:.92rem;font-weight:400;color:#B4BEC9}
/* 직접 치는 직책 */
.ofrow .oown{font-size:.86rem;font-weight:700;color:var(--navy)}
.ofrow .oown::placeholder{font-weight:400;color:#B4BEC9;font-size:.8rem}

.obtn{display:flex;gap:3px;flex:0 0 auto}
.obtn button{width:30px;height:38px;border:1px solid var(--line);border-radius:8px;
  color:var(--muted);background:#fff;font-size:.86rem;font-weight:700}
.obtn button:hover:not(.off){border-color:var(--navy);color:var(--navy)}
.obtn button.off{color:#D5DBE3;border-color:#EDF0F4}
.obtn button.del{border-color:#EEDADA;color:#C98B8B}
.obtn button.del:hover{background:#FDF2F2;color:var(--red)}

/* ── 중복 접수 경고 (2026-08-23) ─────────────────────────
   ★ 용지가 두 장 나가면 되돌릴 수 없다.
     총회장은 시끄럽고 급하다. 흐린 주황으로는 지나친다.
     붉은 바탕에 큰 글씨로 걸음을 멈추게 한다. */
.dupbox{margin-top:12px;border:2px solid var(--red);border-radius:12px;
  background:#FDF3F3;padding:14px 16px}
.dupbox .dupt{font-size:1.08rem;font-weight:800;color:var(--red);
  letter-spacing:-.01em;margin-bottom:7px}
.dupbox p{font-size:.82rem;color:#6B3A3A;line-height:1.7;margin:0 0 5px}
.dupbox p b{color:var(--red)}
.dupbox p:last-of-type{margin-bottom:0}
.cand .b b{font-size:.86rem}
.cand .b span{display:block;font-size:.76rem;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seg{max-width:420px}
.btn.sm{max-width:none}
h2.pt{font-size:1.2rem;font-weight:800;margin-bottom:3px}
p.pd{font-size:.83rem;color:var(--muted);margin-bottom:20px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.card{background:var(--paper);border-radius:12px;padding:15px 17px;border:1px solid var(--line)}
.card span{display:block;font-size:.78rem;color:var(--muted)}
.card b{display:block;font-size:1.6rem;font-weight:800;margin-top:3px}
.sec{font-size:.9rem;font-weight:800;margin:22px 0 10px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px dashed var(--line);font-size:.84rem}
.row:last-child{border-bottom:0}
.row span{color:var(--muted)}
.row b{font-weight:700}

table{width:100%;border-collapse:collapse;font-size:.84rem}
th{background:var(--mist);color:var(--muted);font-size:.78rem;font-weight:700;
  text-align:left;padding:10px 12px;border-bottom:2px solid var(--edge)}
td{padding:11px 12px;border-top:1px solid var(--line)}
tr.tap:hover{background:#EEF3FA}

/* ── 테두리에 힘을 준다 (2026-09-16 밤) ──────────────────
   ★ 「외곽 테두리가 너무 희미해서 안 보인다」는 말씀.
     칸을 가르는 줄(--line)과 상자를 두르는 줄(--edge)을 갈랐다.

   ★ 표는 한 줄 걸러 옅게 깐다. 줄이 열 개를 넘으면
     눈이 옆줄로 새어 **다른 자료의 상태를 본다.** */
tbody tr:nth-child(even) > td{background:#FAFCFE}
tbody tr:nth-child(even):hover > td{background:#EEF3FA}
.box{border:1px solid var(--edge) !important}
.f input,.f select,.f textarea{border-color:var(--edge) !important}
.f input:focus,.f select:focus,.f textarea:focus{
  border-color:var(--navy) !important;box-shadow:0 0 0 3px rgba(18,54,95,.12)}
.btn.ghost,.chipb,.btn.sm{border-color:var(--edge)}
/* ★ 딱지 글자가 두 줄로 깨지면 표가 흉해진다 */
.pill{display:inline-block;white-space:nowrap;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}

/* ── 자리 고르기 · 고른 것을 확실히 (2026-09-16 밤) ──────
   ★ 예전에는 색만 진해졌다. 여덟 개가 나란히 있으면
     「내가 무엇을 골랐더라」가 된다.
     잘못된 자리에 올리면 조합원 화면의 엉뚱한 갈래에 들어간다.
   ★ 셋을 함께 준다 — 체크 표시 · 굵은 테두리 · 담는 상자
   ★ 고른 것을 글로도 한 번 더 적는다. 색맹이신 분도 계신다. */
.catpick{display:flex;gap:7px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:12px;padding:9px;background:#FAFBFD}
.catb{border:1px solid var(--line);background:#fff;color:var(--muted);
  border-radius:99px;padding:7px 13px;font-size:.8rem;font-weight:400;cursor:pointer}
.catb:hover{border-color:var(--navy);color:var(--navy)}
.catb.on{border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;
  box-shadow:0 0 0 3px rgba(18,54,95,.14)}
.catnow{margin:8px 2px 10px;font-size:.79rem;color:var(--muted)}
.catnow b{color:var(--navy);font-weight:800}

/* ── 고치는 중인 줄 (2026-09-16 밤) ──────────────────────
   ★ 옅은 바탕만으로는 어느 줄을 고치는 중인지 안 보인다.
     왼쪽에 굵은 띠를 세우고 테두리를 두른다. */
tr.editing > td{background:#FFF6EC !important;border-top:2px solid var(--amber);
  border-bottom:2px solid var(--amber)}
tr.editing > td:first-child{border-left:5px solid var(--amber)}
tr.editing > td:last-child{border-right:2px solid var(--amber)}
.p-ok{background:rgba(14,169,122,.13);color:var(--ok)}
.p-wait{background:#EEE;color:var(--muted)}
.p-warn{background:#FFF0E6;color:#A85B33}
.p-live{background:var(--ok);color:#fff}

.bar{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.lg{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.warn{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;padding:13px 15px;margin-top:16px}
/* ★ 제목만 줄을 바꾼다.
   본문 안의 강조까지 block 이면 문장이 토막 나서 읽기 나쁘다.
       다시 제출하시면 앞의 것은
       대체됨
       으로 남고 …
   이렇게 끊긴다. 강조가 오히려 방해가 된다. */
.warn > b:first-child{display:block;font-size:.84rem;color:#8C3A12;margin-bottom:4px}
.warn p{font-size:.8rem;color:#A85B33;line-height:1.75}
.warn p b{font-weight:800;color:#8C3A12}
.note{font-size:.8rem;color:var(--muted);line-height:1.7;margin-top:12px}
.drop{border:1.5px dashed #C6CEDA;border-radius:12px;padding:34px;text-align:center;
  background:var(--paper)}
.drop b{display:block;font-size:.9rem;font-weight:700}
.drop span{display:block;font-size:.8rem;color:var(--muted);margin-top:5px}
.lock{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:30px;text-align:center}
.lock b{display:block;font-size:.95rem;font-weight:800;margin-bottom:6px}
.lock p{font-size:.83rem;color:var(--muted);line-height:1.7}
.vt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.vt button{padding:14px 0;border-radius:11px;border:1.5px solid var(--line);
  background:#fff;font-weight:700;font-size:.9rem}
.vt button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sample{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;
  padding:12px 15px;margin-bottom:18px}
.sample > b:first-child{display:block;font-size:.84rem;color:#8C3A12;margin-bottom:3px}
.sample p b{font-weight:800;color:#8C3A12}
.sample p{font-size:.8rem;color:#A85B33;line-height:1.6}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
/* ── 설문 양식 카드 (2026-08-22 오후 · 컴팩트로 다시 만듦) ──
   ★ 예전에는 두 칸짜리 큰 상자 여섯 개가 화면 절반을 먹었다.
     설문은 앞으로 수십 개를 만드셔야 하는데, 매번 스크롤을 내려야
     양식이 보였다. 그래서 위로 올리고 크기를 줄였다.

   ★ 칸 수를 고정하지 않는다 (auto-fill).
     모니터가 넓으면 네 개, 좁으면 세 개가 저절로 들어간다.
     3개로 못 박아 두면 좁은 화면에서 글자가 잘린다.

   ★ 줄여도 「무엇인지」와 「몇 문항인지」는 남긴다.
     이름만 있으면 어느 양식이 무거운지 몰라 열어 보고 되돌아 나온다. */
.svg2{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:8px}
.svc{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;
  width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;
  column-gap:8px;align-items:baseline}
.svc:hover{border-color:var(--navy);background:#F8FAFD}
.svc b{display:block;font-size:.82rem;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc .n{font-size:.7rem;font-weight:700;color:var(--blue);white-space:nowrap}
.svc em{grid-column:1/-1;font-style:normal;font-size:.72rem;color:var(--muted);
  margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc.blank{border:1px dashed #C6CEDA;background:#FBFCFE}
.svc.blank b{color:var(--navy)}
.svc.blank .n{color:#8FA3BA;font-size:.9rem;line-height:1}
.qcard{border:1px solid var(--line);border-radius:11px;padding:12px 13px;
  margin-bottom:9px;background:#FBFCFE}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.qhead em{font-style:normal;font-size:.76rem;color:var(--blue);font-weight:700}
.qhead div button{font-size:.76rem;color:var(--muted);margin-left:9px}
.qhead div button:hover{color:var(--navy)}
.qrow{display:flex;gap:9px;margin-bottom:9px}
.qrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
  font-size:.82rem;outline:none}
.qrow select{width:132px;border:1px solid var(--navy);border-radius:7px;padding:8px 10px;
  font-size:.82rem;background:#fff;outline:none}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:.78rem}
.opt button{color:var(--muted);margin-left:6px}
.optadd{border:1px dashed #C6CEDA;color:var(--navy);border-radius:99px;padding:6px 12px;
  font-size:.78rem;font-weight:700}
.tadd{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.tadd button{border:1px dashed #C6CEDA;color:#41576B;border-radius:8px;
  padding:9px 13px;font-size:.78rem}
.tadd button:hover{border-color:var(--navy);color:var(--navy)}
.bar-o{height:8px;background:#F0F3F7;border-radius:99px;margin-bottom:10px}
.bar-o i{display:block;height:8px;border-radius:99px;background:var(--navy)}
.txtlist{border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  font-size:.8rem;color:#41576B;line-height:1.9}
.updrop{border:1.5px dashed var(--navy);background:#F8FAFD;border-radius:11px;
  padding:22px 16px;text-align:center;cursor:pointer}
.updrop:hover{background:#F0F5FB}
.updrop b{display:block;font-size:.86rem;font-weight:700;margin-top:6px}
.updrop p{font-size:.78rem;color:var(--muted);margin-top:3px}
tr.err{background:#FFF6F1}
tr.wrn{background:#FFFBF7}
td.e{color:var(--red)}
td.w{color:#8C3A12}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:.76rem}
.diff s{color:var(--muted);text-decoration:line-through}
.diff b{color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .f input,.grid2 .f select,.grid3 .f input,.grid3 .f select{max-width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:.86rem;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy)}
.f textarea{min-height:140px;line-height:1.8;resize:vertical}
.f label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px}
.f.on input{border-color:var(--navy)}
.seg{display:flex;gap:8px}
/* ★ 27행의 button{text-align:left} 때문에 글자가 왼쪽에 붙는다.
     가로로 나란히 놓인 고르기 버튼은 가운데로 되돌린다.
     또 "부동의"가 "부동 / 의"로 쪼개지지 않도록 줄바꿈을 막는다. */
.seg button{flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 14px;
  font-size:.84rem;font-weight:700;background:#fff;color:var(--ink);
  text-align:center;white-space:nowrap;min-width:78px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rd{display:inline-block;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);
  background:#fff;cursor:pointer;vertical-align:middle}
.rd.y{background:var(--navy);border-color:var(--navy)}
.rd.n{background:var(--amber);border-color:var(--amber)}
.rd.a{background:#B9C0C9;border-color:#B9C0C9}
.pbar{display:flex;height:11px;border-radius:99px;overflow:hidden;margin:12px 0 7px}
.plg{display:flex;gap:16px;font-size:.8rem;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.chk i{flex-shrink:0;width:20px;height:20px;border-radius:5px;background:var(--ok);color:#fff;
  font-style:normal;font-size:.78rem;display:grid;place-items:center}
.chk span{flex:1;font-size:.82rem}
.tiny{font-size:.74rem;color:var(--muted)}
tr.warn-row{background:#FFFBF7}

/* ── 발송 확인 팝업 ────────────────────────────────────────
   ★ 100명에게 잘못 나가면 되돌릴 수 없다.
     보내기 직전에 화면을 덮어 한 번 더 눈으로 보게 한다.
     흐린 배경을 눌러도 닫히지 않는다. 실수로 닫으면 안 된다. */
.ov{position:fixed;inset:0;background:rgba(11,31,58,.42);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px}
.ov-b{background:#fff;border-radius:16px;max-width:520px;width:100%;
  max-height:86vh;overflow:auto;padding:24px 26px;
  box-shadow:0 18px 50px rgba(11,31,58,.28)}
.ov-t{font-size:1.12rem;font-weight:800;color:var(--ink);margin-bottom:4px}
.ov-d{font-size:.84rem;color:var(--muted);margin-bottom:16px}
.ov-n{font-size:2.1rem;font-weight:800;color:var(--navy);line-height:1.15}
.ov-w{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:10px;
  padding:12px 14px;margin-top:14px}
.ov-w b{display:block;font-size:.86rem;color:#8C3A12;margin-bottom:3px}
.ov-w p{font-size:.8rem;color:#A85B33;line-height:1.7}
.ov-tag{display:inline-block;font-size:.78rem;font-weight:700;
  border-radius:99px;padding:5px 12px;margin:3px 5px 3px 0}

/* ★ 한 줄에 여러 칸을 두 곳에서 쓴다. admin 에는 .w90 만 있었다. */
.w110{width:110px}.w150{width:150px}

/* ── 우리 구역 설정 화면이 쓰는 모양 (2026-09-17) ─────────
   ★ zone-admin.js 하나를 운영자 콘솔과 직원 화면이 함께 읽는다.
     화면 코드는 한 벌인데 **모양(CSS)은 각 화면에 있어야** 한다.
     여기 없으면 글자만 줄줄이 나오고 상자도 폰 미리보기도 안 그려진다.
   ★ 콘솔에서 그대로 옮겨 온 것이다. 고칠 때는 양쪽을 함께 본다. */
.tight .sec{margin:16px 0 8px;font-size:.84rem}
.tight .sec:first-child{margin-top:0}
.tight .box{padding:13px 15px}
.tight .f{margin-bottom:11px}
.tight .f:last-child{margin-bottom:0}
.tight .f label{font-size:.74rem;margin-bottom:4px}
.tight .f input{padding:9px 11px;font-size:.85rem}
.hero{border:1.5px dashed var(--navy);background:#F8FAFD;border-radius:11px;
  padding:15px;text-align:center;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:11px}
.hero:hover{background:#F1F6FC}
.hero b{font-size:.83rem}
.hero span{font-size:.74rem;color:var(--muted)}
.rowf{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rowf .f{margin:0}
.rowf .f label{font-size:.7rem;margin-bottom:3px}
.rowf .f input,.rowf .f select{padding:8px 10px;font-size:.82rem}
.w90{width:90px}
.hint{font-size:.72rem;color:var(--muted);margin-top:7px;line-height:1.55}
.hint b{color:var(--navy)}
.gubar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.gub{border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 13px;font-size:.82rem;font-weight:700;
  text-align:center;display:flex;align-items:center;gap:6px;cursor:pointer}
.gub:hover{border-color:var(--navy)}
.gub em{font-style:normal;font-family:ui-monospace,Menlo,monospace;
  font-size:.68rem;color:var(--muted);font-weight:600}
.gub.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gub.on em{color:#A9C0DA}
.gub.more{color:var(--blue);border-style:dashed}
.gub.sm2{padding:6px 11px;font-size:.78rem;font-weight:400}
.gub.sm2.on{font-weight:700}
.lnk{background:none;border:0;color:var(--blue);font-size:.78rem;
  font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.p-blue{background:#E8EEF7;color:var(--navy)}
.pv{width:330px;margin:0 auto;border:1px solid var(--edge);
  border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 3px 14px rgba(11,31,58,.09)}
.pv-hero{height:156px;position:relative;background-size:cover;background-position:center}
.pv-credit{position:absolute;right:9px;bottom:9px;font-size:.6rem;
  color:rgba(255,255,255,.8)}
.pv-txt{position:absolute;left:12px;bottom:12px;color:#fff}
.pv-eye{display:inline-block;font-size:.6rem;background:rgba(255,255,255,.22);
  padding:2px 8px;border-radius:99px}
.pv-h1{font-size:.95rem;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.pv-sub{font-size:.62rem;opacity:.9;margin-top:2px}
.pv-prog{position:relative;z-index:2;margin:-22px 11px 11px;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;
  box-shadow:0 4px 16px rgba(11,31,58,.1)}
.pv-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.pv-top>b{font-size:.72rem;font-weight:800;letter-spacing:-.02em;
  word-break:keep-all;flex:1;padding-top:2px}
.pv-dd{text-align:right;flex:none}
.pv-dd b{display:block;font-size:.8rem;font-weight:800;color:var(--amber)}
.pv-dd span{font-size:.55rem;color:var(--muted)}
.pv-scroll{overflow-x:auto;margin:0 -2px;padding:0 2px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.pv-scroll::-webkit-scrollbar{display:none}
.pv-line{min-width:100%;position:relative;padding-top:2px}
.pv-trk{position:absolute;top:5px;height:3px;background:var(--line);
  border-radius:99px;overflow:hidden}
.pv-trk i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#FFB27A,#F26419)}
.pv-dots{display:flex;position:relative;z-index:2}
.pv-cell{flex:1;display:flex;justify-content:center;min-width:0}
.pv-dot{width:9px;height:9px;border-radius:50%;background:#fff;
  border:2px solid var(--line);display:block}
.pv-dot.done{background:#F26419;border-color:#F26419}
.pv-dot.now{background:#fff;border-color:#F26419;box-shadow:0 0 0 4px rgba(242,100,25,.18)}
.pv-labs{display:flex;margin-top:7px}
.pv-labs span{flex:1;min-width:0;text-align:center;font-size:.52rem;
  color:#98A9BC;font-weight:600;line-height:1.3}
.pv-labs span.on{color:var(--navy)}
.pv-foot{display:flex;gap:14px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--line)}
.pv-foot b{display:block;font-size:.76rem;font-weight:800;letter-spacing:-.02em}
.pv-foot span{font-size:.55rem;color:var(--muted)}
.stagerow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.stagerow::-webkit-scrollbar{display:none}
.stagerow{scrollbar-width:none;-ms-overflow-style:none}
.stageb{flex:none;white-space:nowrap;border:1px solid var(--edge);background:#fff;
  color:var(--muted);border-radius:99px;padding:8px 14px;font-size:.8rem;
  font-weight:400;cursor:pointer}
.stageb:hover{border-color:var(--navy);color:var(--navy)}
.stageb.on{border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;
  box-shadow:0 0 0 3px rgba(18,54,95,.14)}
.stagebox{border:2px solid var(--navy) !important}
.stagenow{margin-top:8px;font-size:.79rem;color:var(--muted);
  display:flex;align-items:center;gap:10px}
.stagenow b{color:var(--navy);font-weight:800}
.stagenow em{margin-left:auto;font-style:normal;font-size:.73rem;color:#A9B6C6}

/* ── 사진 자리 잡기 (2026-09-17) ─────────────────────────
   ★ 십자 화살표는 걷어냈다. 사진을 직접 끄는 것으로 바꿨다. */
.heropos{margin-top:10px}
.hpt{font-size:.82rem;font-weight:700;color:var(--navy);
  display:flex;align-items:center;gap:10px}
.hpt span{margin-left:auto;font-weight:400;font-size:.76rem;color:var(--muted)}

/* ── 우리 구역 설정 전용 이름 (2026-09-17) ────────────────
   ★ .two · .lock 은 두 화면에서 **다른 것**을 가리키고 있었다.
     직원 화면의 .lock 은 잠금 안내용 큰 상자(padding:30px)라
     「읽기 전용」 석 자가 큰 상자가 됐다.
   ★ CSS 이름도 겹친다. 자바스크립트 이름만 세면 놓친다.
     → ztwo · zlock 으로 갈라 양쪽에 같은 것을 둔다. */
.ztwo{display:grid;grid-template-columns:390px minmax(0,1fr);gap:20px;align-items:start}
.ztwo.rev{grid-template-columns:minmax(0,1fr) 372px}
@media(max-width:1180px){.ztwo,.ztwo.rev{grid-template-columns:1fr}}
.zlock{font-size:.68rem;font-weight:700;color:#8C3A12;background:#FFE6D6;
  border-radius:99px;padding:2px 8px;margin-left:6px}

/* ── 단계 칸 좌우 화살표 (2026-09-17) ─────────────────────
   ★ 예전에는 「◀ 옆으로 밀어 보십시오 ▶」가 **그냥 글자**였다.
     화살표처럼 생겼으니 눌러 보시는 것이 당연한데 아무 일이 없다. */
.stagear{margin-left:auto;display:flex;align-items:center;gap:7px}
.stagear button{border:1px solid var(--edge);background:#fff;border-radius:7px;
  width:26px;height:24px;font-size:.7rem;color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.stagear button:hover{background:var(--mist);border-color:var(--navy)}
.stagear .sm{font-size:.73rem;color:#A9B6C6}

/* ── 사진을 끌어서 자리 잡기 (2026-09-17 고침) ─────────────
   ★ 화살표 단추 다섯 개를 없애고 사진을 직접 끌게 했다.
     여섯 번 누를 것을 한 번 끌면 된다.
   ★ 밝은 자리가 폰에 나올 데다. 나머지는 어둡게 덮어
     「여기가 잘립니다」가 눈에 보이게 한다. */
.hdwrap{margin-top:10px}
.hdbox{position:relative;width:100%;height:190px;border-radius:12px;
  overflow:hidden;background:#0B1F3A;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none}
.hdbox.dragging{cursor:grabbing}
.hdbox img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;pointer-events:none}
/* 폰에 나올 자리만 남기고 좌우를 덮는다. 폰은 세로로 길어 가운데가 좁다. */
.hdmask{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(11,31,58,.62) 0%,rgba(11,31,58,.62) 31%,
    rgba(11,31,58,0) 31%,rgba(11,31,58,0) 69%,
    rgba(11,31,58,.62) 69%,rgba(11,31,58,.62) 100%)}
.hdframe{position:absolute;top:0;bottom:0;left:31%;right:31%;
  border:2px solid #fff;border-radius:6px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(11,31,58,.35)}
.hdframe span{position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-size:.62rem;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hdhand{position:absolute;left:0;right:0;top:8px;text-align:center;
  font-size:.7rem;color:#fff;font-weight:700;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hdfoot{display:flex;align-items:flex-start;gap:12px;margin-top:10px}
.hdfoot .hint{flex:1;margin:0}

/* ── 사진 확대 · 축소 (2026-09-17 저녁) ───────────────────
   ★ 「좌우 조절이 안 된다」 하셨다. 당길 데가 없어서였다.
     조감도는 가로가 아주 길어 폰 자리에 맞추면 좌우에 남는 데가 없다.
     크기를 키워야 그때 좌우로도 밀 수 있다.
   ★ 막대로 크게 움직이고, ＋ － 로 미세하게 맞춘다. */
.hdzoom{display:flex;align-items:center;gap:9px;margin-top:10px}
.hdzoom input[type=range]{flex:1;min-width:0;height:22px;cursor:pointer;
  accent-color:var(--navy)}
.hzb{flex:none;width:30px;height:28px;border:1px solid var(--edge);background:#fff;
  border-radius:8px;font-size:.9rem;font-weight:700;color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hzb:hover{background:var(--mist);border-color:var(--navy)}
.hdzoom #hdZoomT{flex:none;width:44px;text-align:right;
  font-size:.78rem;font-weight:700;color:var(--navy)}
/* 사진은 100%일 때 전체가 보이도록 아래 색을 깐다 */
.hdbox img{transform-origin:center center}

/* ═══════════════════════════════════════════════════════════
   ★★★ 세 곳의 가로세로비를 하나로 (2026-09-17 밤) ★★★
   ───────────────────────────────────────────────────────────
   「폰에 나오는 자리와 실제 폰 화면과 조절 화면이 서로 다르다」

   ★ 재 보니 정말 제각각이었다.

       조합원 화면(실제)   폰마다 달랐다 → 480/300 으로 못 박음
       폰 미리보기          330 x 156  →  2.12   더 납작하다
       조절 상자의 밝은 네모 198 x 190  →  1.04   세로로 길다

     맞춰 놓은 자리가 폰에서 **다른 데**로 나오니 맞출 수가 없다.

   ★ 실제 조합원 화면(1.55)에 나머지 둘을 맞춘다.
     기준은 늘 **조합원이 보는 것**이어야 한다.

   ★ 비율은 aspect-ratio 로 못 박는다. 높이를 손으로 적으면
     폭이 바뀔 때 또 어긋난다.
   ═══════════════════════════════════════════════════════════ */
.pv-hero{height:auto !important;aspect-ratio:480 / 300}
.hdbox{height:auto !important;aspect-ratio:480 / 300}
/* 밝은 네모 = 상자 전체. 조합원 화면이 이 비율 그대로 꽉 채우기 때문이다. */
.hdmask{background:none !important}
.hdframe{left:0 !important;right:0 !important;
  border:2px solid rgba(255,255,255,.9) !important;border-radius:12px !important}

/* ★ 미리보기 조감도도 <img> 로 바꿨다 (2026-09-17 밤).
   조합원 화면 · 조절 상자와 같은 셈법을 쓰려면 같은 방식이어야 한다. */
.pv-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.pv-hero{overflow:hidden}
.pv-credit,.pv-txt{z-index:2}
/* 조합원 화면처럼 위아래를 어둡게 덮어 글자가 읽히게 한다 */
/* ★ 조합원 화면(.shot:before)과 **똑같은 값**을 쓴다 (2026-09-17 밤).
   비슷하게 하면 미리보기가 더 밝아 보여 「사진이 다르다」가 된다. */
.pv-hero:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(11,31,58,.6) 0%,rgba(11,31,58,.1) 34%,rgba(11,31,58,.5) 66%,rgba(11,31,58,.92) 100%)}
/* ★ 조절 상자에도 같은 층을 씌운다. 폰에서 어떻게 보일지 그대로 알 수 있다. */
.hdbox:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,31,58,.6) 0%,rgba(11,31,58,.1) 34%,rgba(11,31,58,.5) 66%,rgba(11,31,58,.92) 100%)}

/* ═══════════════════════════════════════════════════════════
   홈 세 덩이 채우기 (2026-09-17 밤)
   ★ 우리 구역 한눈에 · 이번 고시 변경 · 궁금한 것
   ★ 흐린 글씨(placeholder)가 예시다. 조합원 화면에는 안 나간다.
   ═══════════════════════════════════════════════════════════ */
.hbbox{padding:12px 13px}
.hbhd{display:flex;align-items:center;gap:10px}
.hbt{font-size:.8rem;color:var(--muted);flex:1;min-width:0}
.hbsw{flex:none;width:38px;height:21px;border-radius:99px;border:0;

.hbsw.on{background:var(--navy)}
.hbsw i{position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:left .15s;display:block}
.hbsw.on i{left:19px}
.hbst{flex:none;font-size:.74rem;font-weight:700;color:var(--muted);width:30px}
.hbst.on{color:var(--navy)}
.hbcard{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#FAFCFE}
.hbrow2{display:flex;gap:7px}
.hbline{display:flex;align-items:flex-start;gap:9px;padding:9px 0;
  border-top:1px solid var(--line)}
.hbno{flex:none;width:18px;text-align:center;font-size:.74rem;font-weight:700;
  color:var(--muted);padding-top:22px}
.hbgrid{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px}
.hbgrid .f{flex:1;min-width:110px;margin-bottom:0}
.hbgrid .f.wide{flex-basis:100%}
.hbact{flex:none;display:flex;gap:4px;padding-top:22px}
.hbact button{width:26px;height:26px;border:1px solid var(--edge);background:#fff;
  border-radius:7px;font-size:.7rem;color:var(--muted);cursor:pointer}
.hbact button:hover{border-color:var(--navy);color:var(--navy)}
.hbact button.del:hover{border-color:var(--red);color:var(--red)}
.hbplus{width:100%;margin-top:9px;border:1px dashed var(--edge);background:#fff;
  border-radius:9px;padding:9px;font-size:.82rem;font-weight:700;
  color:var(--blue);cursor:pointer}
.hbplus:hover{background:#F2F7FD;border-color:var(--blue)}
.hbplus.sm{padding:6px;font-size:.78rem;margin-top:5px}
.hbq{border-top:1px solid var(--line);padding:11px 0}
.hbans{margin:9px 0 0 27px;padding:10px 12px;background:#F6F9FC;
  border:1px solid var(--line);border-radius:10px}
.hbat{font-size:.76rem;font-weight:700;color:var(--navy)}
.hbta{width:100%;border:1px solid var(--edge);border-radius:9px;padding:9px 11px;
  font-size:.82rem;font-family:inherit;line-height:1.7;resize:vertical;margin-top:6px}
.hbta:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,54,95,.12)}
.w60{max-width:60px}

/* ── 폰 미리보기의 아랫부분 ───────────────────────────────── */
.pv-more{padding:0 11px 12px}
.pv-sec{font-size:.72rem;font-weight:800;color:var(--ink);margin:11px 0 6px}
.pv-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pv-kpi{border:1px solid var(--line);border-radius:9px;padding:7px 6px;text-align:left}
.pv-kpi span{display:block;font-size:.54rem;color:var(--muted)}
.pv-kpi b{display:block;font-size:.76rem;font-weight:800;margin-top:2px}
.pv-kpi b i{font-size:.52rem;font-weight:600;color:var(--muted);font-style:normal}
.pv-kpi em{display:block;font-size:.52rem;font-style:normal;color:var(--amber);

.pv-scroll2{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;

.pv-hc{flex:none;width:96px;border:1px solid var(--line);border-radius:9px;padding:7px 8px}
.pv-hc span{display:block;font-size:.54rem;color:var(--muted)}
.pv-hc b{display:block;font-size:.66rem;font-weight:800;margin-top:2px}
.pv-hc b i{font-size:.56rem;font-weight:600;color:var(--muted);font-style:normal}
.pv-hc em{display:block;font-size:.5rem;font-style:normal;color:var(--amber);
  font-weight:700;margin-top:2px}
.pv-faq{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pv-fq{display:flex;align-items:center;gap:6px;padding:8px 9px;
  border-bottom:1px solid var(--line)}
.pv-fq:last-child{border-bottom:0}
.pv-fq.gray span{color:var(--muted)}
.pv-fq span{flex:1;min-width:0;font-size:.64rem;font-weight:600;

.pv-fq i{flex:none;color:#C3CEDC;font-style:normal}

/* ── 우리집 딱지 (2026-09-17) ─────────────────────────────
   ★ 시세 단지 · 비교 아파트 · 지분 실거래를 하나로 묶었다.
     왼쪽 메뉴가 길어지지 않게 안에서 딱지로 넘긴다. */
.mhtabs{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.mhb{flex:1;min-width:150px;border:1px solid var(--edge);background:#fff;
  border-radius:12px;padding:11px 13px;text-align:left;cursor:pointer}
.mhb:hover{border-color:var(--navy)}
.mhb b{display:block;font-size:.88rem;font-weight:700;color:var(--muted)}
.mhb em{display:block;font-size:.72rem;font-style:normal;color:#A9B6C6;margin-top:3px}
.mhb.on{border:2px solid var(--navy);background:var(--navy);

/* ── 지분 실거래 한 건씩 빼기 (2026-09-17) ────────────────
   ★ 기본은 다 나간다. 이상한 것만 체크를 풀어 뺀다.
     6,568건을 하나씩 켤 수는 없다. */
.dchk{width:16px;height:16px;cursor:pointer;accent-color:var(--navy)}
.dchk:disabled{cursor:not-allowed;opacity:.35}
tr.dealoff > td{background:#FFF4EC !important;color:#C08B6B}
tr.dealoff > td .pill{opacity:.45}
tr.dealoff > td.mono{text-decoration:line-through;text-decoration-color:#E0A883}

/* ── 우리집 폰 미리보기 (2026-09-17) ──────────────────────
   ★ 조합원 화면(calcView)의 여덟 줄을 줄여 그린다.
     직원이 넣는 것은 ④ 비례율과 ⑦ 분양가뿐이라
     나머지는 「조합원이 넣음 · 자동」으로만 보여 준다. */
.pvtabs{display:flex;gap:4px;padding:10px 11px 0}
.pvtabs span{flex:1;font-size:.54rem;text-align:center;padding:5px 2px;
  border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pvtabs span.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.pvbody{padding:11px}
.pvt{font-size:.68rem;font-weight:800;margin-bottom:8px}
.pvr{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;margin-bottom:5px;font-size:.6rem;font-weight:600}
.pvr.in{border:1.5px solid var(--navy)}
.pvr.org{border:1.5px solid #A9E0CD;background:#F2FAF6}
.pvr.auto{background:var(--mist);border-color:transparent;color:var(--muted)}
.pvr.lock{background:#FFF7F1;border-color:#F7DCC8;color:#A85B33}
.pvn{flex:none;width:13px;height:13px;border-radius:50%;background:var(--navy);
  color:#fff;font-size:.45rem;font-weight:800;display:flex;
  align-items:center;justify-content:center}
.pvr.auto .pvn,.pvr.lock .pvn{background:#C3CEDC;color:#5B6C80}
.pvr b{margin-left:auto;font-size:.66rem;font-weight:800;color:var(--navy)}
.pvr em{margin-left:auto;font-style:normal;font-size:.54rem;color:#A9B6C6;font-weight:600}
.pvgreen{background:#F2FAF6;border:1px solid #A9E0CD;border-radius:9px;
  padding:7px 9px;margin:-2px 0 6px;font-size:.56rem;color:#0A6E51;line-height:1.7}
.pvgreen b{font-weight:800}
.pvgreen span{display:inline-block;margin-right:8px}
.pvgreen i{display:block;font-style:normal;color:#5AA98C;margin-top:3px}
.pvfin{display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;
  border-radius:9px;padding:9px 10px;font-size:.64rem;font-weight:800}
.pvfin .pvn{background:rgba(255,255,255,.22)}
.pvfin em{margin-left:auto;font-style:normal;font-size:.54rem;opacity:.75;font-weight:600}
.pvcap{text-align:center;font-size:.72rem;color:var(--muted);margin-top:8px}

   ★ 예전에는 폰 미리보기 **아래**에 있었다.
     오른쪽이 텅 비어 있는데 고치시려면 한참 내려가야 했다.
   ★ 날짜순으로 둔다. 긴급을 위로 올리지 않는다.
     목록은 **찾는 자리**다. 방금 올린 것이 어디 있는지 좇기 쉬워야 한다.
   ★ 줄을 누르면 곧바로 고치기. [수정] 석 자를 겨누실 까닭이 없다. */

.p-gray{background:var(--mist);color:var(--muted)}
.nwside{width:360px}
@media(max-width:1180px){ .nwside{width:100%} }

.nwrow.on{border:2px solid var(--amber);background:#FFF6EC}

.nwk{font-size:.72rem;font-weight:800}
.nwd{font-size:.72rem;color:var(--muted)}
.nwt{font-size:.83rem;font-weight:700;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nwr2{display:flex;align-items:center;gap:8px;margin-top:7px}
.nwb{border:1px solid var(--edge);background:#fff;border-radius:7px;
  padding:4px 10px;font-size:.73rem;font-weight:700;color:var(--blue);cursor:pointer}
.nwb:hover{border-color:var(--blue);background:#F2F7FD}
.nwb.del{color:var(--muted);margin-left:auto}
.nwb.del:hover{border-color:var(--red);color:var(--red);background:#FFF5F5}

/* ★ 홈 새 소식 건수 고르기 (2026-09-18) */
.nwn{display:flex;gap:6px;margin-top:4px}
.nwnb{flex:1;border:1px solid var(--edge);background:#fff;border-radius:9px;
  padding:9px 2px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer}
.nwnb:hover{border-color:var(--navy);color:var(--navy)}
.nwnb.on{border:2px solid var(--navy);background:var(--navy);color:#fff;
  box-shadow:0 0 0 3px rgba(18,54,95,.14)}

/* ═══════════════════════════════════════════════════════════
   소식 목록 — 셋째 칸 (2026-09-18)
   ★ 소식은 조합이 있는 한 계속 쌓인다. 3년이면 수백 건이다.
     찾기 칸 + 처음 20건 + 「더 보기」로 다룬다.
   ★ 홈에 올릴 것은 **직원이 체크**로 고른다.
   ═══════════════════════════════════════════════════════════ */
.nwcol{width:400px;flex-shrink:0;position:sticky;top:22px;

@media(max-width:1500px){ .nwcol{width:100%;position:static;max-height:none} }
.nwhd{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.nwhd b{font-size:.95rem;font-weight:800}
.nwhd span{font-size:.78rem;color:var(--muted)}
.nwsum{background:#F2F7FD;border:1px solid #BFD8F2;border-radius:11px;
  padding:10px 12px;margin-bottom:9px}
.nwsum b{display:block;font-size:.84rem;color:#12365F}
.nwsum p{margin:4px 0 0;font-size:.77rem;color:#1D5FA8;line-height:1.65}
.nwsum.zero{background:#FFF4EC;border-color:#F7C9A8}
.nwsum.zero b{color:#8C3A12}
.nwsum.zero p{color:#A85B33}
.nwq{width:100%;border:1px solid var(--edge);border-radius:10px;
  padding:10px 13px;font-size:.84rem;font-family:inherit;margin-bottom:9px}
.nwq:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,54,95,.12)}
.nwlist{display:flex;flex-direction:column;gap:7px;overflow-y:auto;
  flex:1;min-height:0;padding-right:2px}
.nwrow{display:grid;grid-template-columns:26px 1fr;grid-template-rows:auto auto;
  gap:2px 8px;border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;background:#fff;cursor:pointer}
.nwrow:hover{border-color:var(--navy)}
.nwrow.on{border:2px solid var(--amber);background:#FFF6EC}
.nwrow.onhome{background:#F7FBFF;border-color:#BFD8F2}
.nwrow.onhome.on{background:#FFF6EC;border-color:var(--amber)}
.nwck{grid-row:1 / span 2;display:flex;align-items:flex-start;padding-top:2px}
.nwck input{width:17px;height:17px;cursor:pointer;accent-color:var(--navy)}
.nwbody{min-width:0}
.nwr1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.nwk{font-size:.72rem;font-weight:800}
.nwd{font-size:.72rem;color:var(--muted)}
.nwt{font-size:.83rem;font-weight:700;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nwr2{grid-column:2;display:flex;align-items:center;gap:7px;margin-top:6px}
.nwb{border:1px solid var(--edge);background:#fff;border-radius:7px;
  padding:4px 10px;font-size:.73rem;font-weight:700;color:var(--blue);cursor:pointer}
.nwb:hover{border-color:var(--blue);background:#F2F7FD}
.nwb.del{color:var(--muted);margin-left:auto}
.nwb.del:hover{border-color:var(--red);color:var(--red);background:#FFF5F5}
.nwmore{width:100%;margin-top:9px;border:1px dashed var(--edge);background:#fff;
  border-radius:10px;padding:10px;font-size:.82rem;font-weight:700;
  color:var(--blue);cursor:pointer}
.nwmore:hover{background:#F2F7FD;border-color:var(--blue)}
.nwmore em{display:block;font-style:normal;font-size:.72rem;
  color:var(--muted);font-weight:400;margin-top:2px}
.p-amber{background:#FFE6D6;color:#8C3A12}

/* ── 소식에 표 사진 올리기 (2026-09-18) ──────────────────── */
.nwpadd{width:100%;border:1px dashed var(--edge);background:#fff;border-radius:11px;
  padding:14px;cursor:pointer}
.nwpadd:hover{background:#F2F7FD;border-color:var(--blue)}
.nwpadd b{display:block;font-size:.88rem;color:var(--blue)}
.nwpadd span{display:block;font-size:.76rem;color:var(--muted);margin-top:3px}
.nwpics{display:flex;flex-direction:column;gap:8px;margin-bottom:9px}
.nwpic{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#FAFCFE}
.nwpn{font-size:.8rem;font-weight:800;color:var(--navy)}
.nwpf{font-size:.76rem;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwpa{display:flex;gap:7px;margin-top:8px}
.nwpw{margin:8px 0 0;font-size:.74rem;color:#8C3A12;background:#FFF4EC;
  border:1px solid #F7C9A8;border-radius:8px;padding:7px 9px;line-height:1.6}

/* ── 쓰고 계신 것을 맨 위에 (2026-09-19) ──────────────────
   ★ 긴급 공지 본문이 길면 미리보기를 가득 채워
     **쓰고 계신 것이 아래로 밀린다.** 제목을 쳐도 변화가 없어
     「안 된다」고 여기신다. 지금 보셔야 하는 것을 맨 위에 둔다. */
.pn-draft{border:2px dashed var(--blue);border-radius:12px;padding:10px;
  margin-bottom:12px;background:#F7FBFF}
.pn-dh{font-size:.72rem;font-weight:800;color:var(--blue);margin-bottom:7px}
.pn-dn{margin:8px 0 0;font-size:.71rem;color:var(--muted);line-height:1.6}
.pn-dn b{color:var(--navy)}
/* ★ 이미 올라간 긴급 공지는 넉 줄까지만. 조합원 폰에서는 다 나온다. */
.pn-cut{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;
  overflow:hidden}

/* ★ 올린 표를 직원 화면에서 바로 보여 드린다 (2026-09-19).

.nwpv{width:100%;max-height:140px;overflow:hidden;border-radius:8px;

function arcCaseSet(n){ ARC.sCase = n || ""; CASEP.on = false; render(); }

/* ═══════════════════════════════════════════════════════════
   ★★ 사건 고르는 창 (2026-09-23)
   ───────────────────────────────────────────────────────────
   알약으로 늘어놓으면 사건이 늘수록 화면을 덮는다.
   ★ 찾는 칸 · 갈래 거르기 · 자료 수와 마지막 날짜를 함께 보여 준다.
   ★ 그 자리에서 새 사건을 만들 수 있다.
   ═══════════════════════════════════════════════════════════ */
const CASEP = {on:false, q:"", sk:"", to:null};
function caseOpen(to){ CASEP.on = true; CASEP.q = ""; CASEP.sk = ARC.skind || ""; CASEP.to = to || null; render(); }
function caseClose(){ CASEP.on = false; render(); }
function caseSet(n){
  if(CASEP.to && typeof CASEP.to === "function") CASEP.to(n);
  else arcCaseSet(n);
  CASEP.on = false; render();
}
function caseNew(){
  const kind = {civil:"민원", hot:"사안"}[CASEP.sk] || "사건";
  const v = prompt(`새 ${kind} 이름을 지어 주십시오.\n\n`
    + `★ 이름은 조합원도 보십니다.\n`
    + `  실명 대신 직책 · 업체명으로 적으십시오.`, "");
  if(v === null) return;
  const n = String(v).trim();
  if(!n){ alert("이름을 적어 주십시오."); return; }
  caseSet(n);
}
/* 사건 목록 — 자료 수 · 마지막 날 · 갈래 */
function caseList(){
  const m = {};
  ARC_DOCS.filter(d => d.cat === "suit" && String(d.sCase||"").trim())
    .forEach(d => {
      const k = String(d.sCase).trim();
      const c = m[k] || (m[k] = {name:k, n:0, last:"", sk:""});
      c.n++;
      const day = String(d.at||"").slice(0,10);
      if(day > c.last) c.last = day;
      if(d.skind && !c.sk) c.sk = d.skind;
    });
  return Object.values(m).sort((a,b) => String(b.last).localeCompare(String(a.last)));
}
function casePick(){
  if(!CASEP.on) return "";
  const q = CASEP.q.trim();
  const all = caseList();
  const L = all
    .filter(c => !CASEP.sk || (c.sk||"") === CASEP.sk)
    .filter(c => !q || c.name.includes(q));
  const kind = {civil:"민원", hot:"사안"}[CASEP.sk] || "사건";
  return `
  <div class="casewrap" onclick="if(event.target===this) caseClose()">
    <div class="casebox">
      <div class="casehd">
        <b>${kind} 고르기</b>
        <button type="button" onclick="caseClose()" class="casex">✕</button>
      </div>
      <div class="casebd">
        <input id="case-q" value="${CASEP.q.replace(/"/g,"&quot;")}" autofocus
          placeholder="이름으로 찾기" oninput="CASEP.q=this.value;casePaint()">
        <div class="casesk">
          ${[["","전체"]].concat(ARC_SK).map(([k,t]) => `<button type="button"
            class="btn ghost sm ${CASEP.sk===k?"on":""}" style="padding:4px 11px;font-size:.75rem;${
              CASEP.sk===k?"background:#EFF5FF;border:1.5px solid #2563EB;color:#1D4ED8;font-weight:800":""}"
            onclick="CASEP.sk='${k}';render()">${t} ${
              all.filter(c => !k || (c.sk||"") === k).length}</button>`).join("")}
        </div>
        <div id="case-list" class="caselist">${caseRows(L)}</div>
        <div class="casefoot">
          <button type="button" class="btn sm" onclick="caseNew()">+ 새 ${kind} 만들기</button>
          <button type="button" style="font-size:.78rem;color:var(--muted);text-decoration:underline"
            onclick="caseSet('')">${kind} 없이 등록</button>
        </div>
      </div>
    </div>
  </div>`;
}
function caseRows(L){
  if(!L.length) return `<p class="note" style="padding:16px;text-align:center">
    찾으시는 것이 없습니다. 아래에서 새로 만드십시오.</p>`;
  return L.map(c => `<button type="button" class="caserow"
    onclick="caseSet(${JSON.stringify(c.name).replace(/"/g,"&quot;")})">
    <span class="nm">${c.name}</span>
    <span class="mt">${c.sk ? skName(c.sk) + " · " : ""}자료 ${c.n}건${
      c.last ? " · 마지막 " + c.last : ""}</span>
  </button>`).join("");
}
/* 찾는 칸을 칠 때는 목록만 다시 그린다 — 다시 그리면 커서가 빠진다 */
function casePaint(){
  const el = document.getElementById("case-list"); if(!el) return;
  const q = CASEP.q.trim();
  el.innerHTML = caseRows(caseList()
    .filter(c => !CASEP.sk || (c.sk||"") === CASEP.sk)
    .filter(c => !q || c.name.includes(q)));
}

/* ★★ 사건 · 민원 · 사안 이름을 그 이름으로 올라간 자료 **전부**에서 바꾼다
   (2026-09-22). 한 자료만 고치면 조합원 화면에서 사건이 둘로 쪼개진다. */
async function arcCaseRename(){
  arcKeep();
  const old = String(ARC.sCase || "").trim();
  if(!old){ alert("바꿀 이름이 비어 있습니다."); return; }
  const mine = ARC_DOCS.filter(x => x.cat === "suit" && String(x.sCase||"").trim() === old);
  if(!mine.length){ alert("이 이름으로 올라간 자료가 없습니다."); return; }
  const kind = {civil:"민원", hot:"사안"}[ARC.skind] || "사건";
  const v = prompt(`「${old}」\n\n이 ${kind} 이름을 무엇으로 바꿀까요?\n`
    + `자료 ${mine.length}건의 이름이 한 번에 바뀝니다.\n\n`
    + `★ 이름은 조합원도 보십니다. 실명 대신 직책 · 업체명으로 적으십시오.`, old);
  if(v === null) return;
  const nw = String(v).trim();
  if(!nw){ alert("이름을 비워 두실 수 없습니다."); return; }
  if(nw === old) return;
  const dup = ARC_DOCS.some(x => x.cat === "suit" && String(x.sCase||"").trim() === nw);
  if(dup && !confirm(`「${nw}」은(는) 이미 있는 이름입니다.\n\n`
    + `두 ${kind}이 하나로 합쳐집니다. 그래도 바꿀까요?`)) return;
  if(!confirm(`자료 ${mine.length}건의 이름을\n\n「${old}」\n  →  「${nw}」\n\n`
    + `로 바꿉니다. 조합원 화면에도 바로 바뀝니다.`)) return;
  mine.forEach(x => { x.sCase = nw; });
  ARC.sCase = nw;
  render();
  const ok = await arcSave(`사건 이름 (${mine.length}건)`);
  if(ok) alert(`바꿨습니다. 자료 ${mine.length}건에 반영했습니다.`);
}

    suit:  ["예) 고소장 · 답변서 · 결정문", "예) 서울북부지방법원 · 접수 · 처분 내용 한 줄"],

    <b>정관이 공개하도록 정한 자료입니다</b>
    <p>제65조 ① 7호 · 회계감사보고서는 작성 · 변경 후
      <b>15일 이내에 인터넷으로 공개</b>해야 합니다.<br>
      제32조 ⑤ · 회계감사 결과는 종료일부터 15일 이내에
      강북구청장에게 보고하고 조합사무소에 비치합니다.<br>
      ★ <b>「적정」이 아닌 의견이 나왔을 때도 올리십시오.</b>
      좋은 것만 올리면 이 자료실이 아무 뜻이 없습니다.<br>
      ★ 거래처 이름과 금액이 그대로 있습니다.

  </div>`;

  return "";
}

/* ═══════════════════════════════════════════════════════════

/* ★ 누른 줄을 그 자리에 둔다 (2026-09-20 · 111절)
