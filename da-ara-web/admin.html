   ★ 위에 「고치는 중」 상자가 생기거나 없어지며 줄이 밀리는 것도 이것으로 되돌린다. */
/* ═══════════════════════════════════════════════════════════
   ★ ④ 올리기 칸 (2026-09-20 · 112절)
   ───────────────────────────────────────────────────────────
   ①②③ 바로 아래에서 올린다. 단추 위에 **무엇을 올리는지** 먼저 보인다.
   ★ 빠진 것은 주황 「!」 — arcUp 이 막는 것과 **같은 조건**이다.
     (파일 없음 · 제목 없음) 다르면 ✓ 인데 막히는 일이 생긴다.
   ★ 제목을 치실 때 **그 자리에서** ✓ 로 바뀐다(arcGoPaint).
     render() 로 다시 그리지 않는다 — 한글 조합이 깨진다.
   ═══════════════════════════════════════════════════════════ */
function arcGoLines(){
  const cats = (typeof ARCHIVE !== "undefined") ? ARCHIVE : [];
  const cn = (cats.find(x=>x.key===ARC.cat)||{}).name || "";
  const d = ARC.edit ? ARC_DOCS.find(x=>x.id===ARC.edit) : null;
  const f = ARC.file;
  const ok = (y, t) => y ? `✓ ${t}` : `<span class="no">! ${t}</span>`;
  return [
    ok(!!cn, "자리 · " + (cn || "고르지 않음")),
    /* ★ 2026-09-23 — 링크 자료는 파일을 찾지 않는다 */
    ...(ARC.link ? [] : [ARC.edit
      ? (f ? `✓ 파일 · <b>${f.name}</b> 로 갈아 끼움` : `✓ 파일 · 그대로 (${d ? d.file : ""})`)
      : ok(!!f, "파일 · " + (f ? f.name + " · " + hubSize(f.size) : "아직 고르지 않음"))]),
    ok(!!(ARC.title||"").trim(), "제목 · " + ((ARC.title||"").trim() || "아직 비어 있음")),
    /* ★ 고소 · 고발은 사건과 방향도 보인다 (2026-09-20 · 119절).
       안 골라도 올라가므로(arcUp 이 막지 않는다) 「!」가 아니라 옅은 주황으로만 짚는다. */
    ...(ARC.link ? [
      urlKind(ARC.url) === "youtube" || urlKind(ARC.url) === "news"
        ? `✓ 주소 · ${URL_LAB[urlKind(ARC.url)]}`
        : `<span class="no">! 주소 · https:// 로 시작하는 주소를 넣으십시오</span>`,
      (ARC.memo||"").trim() ? `✓ 요약 · ${(ARC.memo||"").trim().slice(0,22)}…`
        : `– 요약 · 비어 있습니다 (안 적으셔도 올라갑니다)`
    ] : []),
    ...(ARC.cat === "minu" ? [
      ARC.mkind ? `✓ 회의 갈래 · ${mkName(ARC.mkind)}`
                : `<span class="no">! 회의 갈래 · 이사회 · 대의원회의 · 총회 중에서 고르십시오</span>`
    ] : []),
    ...(ARC.cat === "suit" ? [
      ARC.skind ? `✓ 갈래 · ${skName(ARC.skind)}`
                : `<span class="no">! 갈래 · 각종 민원 · 고소 · 고발 · 핫이슈 중에서 고르십시오</span>`,
      (ARC.sCase||"").trim() ? `✓ 사건 · ${(ARC.sCase||"").trim()}`
        : `<span class="soft">– 사건 · 비어 있음 → 「사건 없음」으로 올라갑니다</span>`,
      ARC.sSide ? `✓ 조합이 · ${ARC.sSide==="in"?"받은 것":"낸 것"}${ARC.sEnd?" · 이 문서로 끝남":""}`
        : `<span class="soft">– 조합이 · 받은 것 · 낸 것을 고르지 않으셨습니다 (안 골라도 올라갑니다)</span>`
    ] : []),
    "✓ 자료 날짜 · " + (ARC.day || "오늘")
  ].map(x=>`<div>${x}</div>`).join("");
}
function arcGoBox(){

/* ═══════════════════════════════════════════════════════════
   ★ 줄에서 제목만 바로 수정 (2026-09-21 · 121절)
   ───────────────────────────────────────────────────────────
   111절에서 「누른 줄에 머물게」 고친 뒤로, 아래쪽 자료를 고르면
   왼쪽 제목 칸이 **화면 위로 2,000px 넘게** 벗어났다(자료 24건 기준).
   제목 하나 바꾸려고 위로 올라갔다 내려와야 했다.
   ★ 제목만 바꾸실 때는 줄에서 끝낸다. 파일 · 자리는 건드리지 않는다.
   ★ 왼쪽 수정 칸은 ②로 화면에 따라온다(.arcstick).
   ═══════════════════════════════════════════════════════════ */
/* ④ 칸이 화면 밖으로 나가면 떠 있는 막대를 켠다 */
function arcBarPaint(){
  const bar = document.getElementById("arcbar"); if(!bar) return;
  const box = document.querySelector(".arcgo");
  const out = !box || box.getBoundingClientRect().bottom < 60;
  bar.classList.toggle("on", out);
  const b = bar.querySelector(".btn");
  if(b && !ARC.busy) b.classList.toggle("off", !arcDirty());
  const t = bar.querySelector("b");
  if(t) t.textContent = "수정 중 · " + (ARC.title || "제목 없음");
}
addEventListener("scroll", arcBarPaint, {passive:true});
addEventListener("resize", arcBarPaint);

function arcTitleBox(d){
  const v = String(d.title||"").replace(/"/g,"&quot;");
  return `<div onclick="event.stopPropagation()" style="display:flex;gap:6px;align-items:center">
    <input id="arc-te" value="${v}" autofocus
      onkeydown="if(event.key==='Enter'){event.preventDefault();arcTitleSave('${d.id}')}
                 if(event.key==='Escape'){arcTitleClose()}"
      style="flex:1;min-width:0;border:1.5px solid var(--blue);border-radius:8px;
        padding:5px 9px;font-size:.84rem;font-weight:700;font-family:inherit">
    <button class="btn sm" style="padding:5px 12px;font-size:.74rem"
      onclick="arcTitleSave('${d.id}')">저장</button>
    <button type="button" onclick="arcTitleClose()"
      style="font-size:.74rem;color:var(--muted);text-decoration:underline">취소</button>
  </div>
  <span style="display:block;font-size:.7rem;color:var(--muted);margin-top:3px">
    Enter 로 저장 · Esc 로 취소 · 제목만 바뀝니다</span>`;
}
function arcTitleEdit(id){
  event.stopPropagation();
  arcStay(id, () => { ARC.tEdit = id; render(); });
  const e = document.getElementById("arc-te");
  if(e){ e.focus(); e.select(); }
}
function arcTitleClose(){ const id = ARC.tEdit; ARC.tEdit = null; if(id) arcStay(id, render); else render(); }
async function arcTitleSave(id){
  const d = ARC_DOCS.find(x => x.id === id); if(!d) return;
  const e = document.getElementById("arc-te");
  const v = e ? e.value.trim() : "";
  if(!v){ alert("제목을 적어 주십시오.\n조합원 화면에 이 제목으로 나갑니다."); return; }
  if(v === d.title){ arcTitleClose(); return; }
  const now = (() => { const t = new Date(), z = x => String(x).padStart(2,"0");
    return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())} `
         + `${z(t.getHours())}:${z(t.getMinutes())}`; })();
  d.title = v; d.edAt = now; d.edBy = S.name;
  if(ARC.edit === id) ARC.title = v;      /* 왼쪽 칸도 함께 맞춘다 */
  ARC.tEdit = null;
  arcStay(id, render);
  const r = await arcPut(S.name);
  if(r && r.ok === false) alert("서버에 저장하지 못했습니다.\n\n새로수정한 뒤 다시 해 주십시오.");
}
/* 왼쪽 칸에서 바꾸신 것이 있나 — 없으면 [저장]을 꺼 둔다 */
function arcDirty(){
  const d = ARC_DOCS.find(x => x.id === ARC.edit); if(!d) return false;
  if(ARC.file) return true;
  return (ARC.title||"").trim() !== (d.title||"")
      || (ARC.sub||"").trim()   !== (d.sub||"")
      || ARC.cat                !== d.cat
      || (ARC.day||"")          !== String(d.at||"").slice(0,10)
      || (ARC.cat === "minu" && (ARC.mkind||"") !== (d.mkind||""))
      || (ARC.cat === "suit" && (ARC.skind||"") !== (d.skind||""))
      || (ARC.cat === "suit" && ((ARC.sCase||"").trim() !== (d.sCase||"")
          || (ARC.sSide||"") !== (d.sSide||"") || !!ARC.sEnd !== !!d.sEnd));
}

/* ★★ 저장이 실패하면 말씀드린다 (2026-09-21 · 123절)
   예전에는 `arcPut(S.name);` 를 기다리지도, 결과를 보지도 않았다.
   서버가 거절하거나 인터넷이 끊겨도 화면에는 그대로 남아
   **직원 화면 13개 · 조합원 앱 2개** 처럼 어긋나도 아무도 몰랐다.
   ★ hubPush 가 남긴 사유(HUB_WHY)까지 보여 드린다. */
async function arcSave(what){
  const ok = await arcPut(S.name);
  if(ok) return true;
  alert(`서버에 저장하지 못했습니다.\n\n`
    + (what ? what + `\n` : "")
    + (typeof HUB_WHY !== "undefined" && HUB_WHY ? HUB_WHY + `\n\n` : `\n`)
    + `★ 이 화면에는 남아 있지만 조합원 앱에는 안 나갑니다.\n`
    + `  인터넷을 확인하신 뒤 다시 한 번 눌러 주십시오.`);
  return false;
}

function arcStay(id, fn){
  const sel = `[data-arcpick="${id}"]`;
  const b = document.querySelector(sel);
  const y0 = b ? b.getBoundingClientRect().top : null;
  fn();
  if(y0 === null) return;
  const a = document.querySelector(sel); if(!a) return;
  const dy = a.getBoundingClientRect().top - y0;
  if(dy) scrollBy(0, dy);
}
function arcPick(id){
  const d = ARC_DOCS.find(x => x.id === id); if(!d) return;
  if(ARC.edit === id){ arcStay(id, arcCancel); return; }   /* 같은 것을 또 누르면 그만둔다 */

  /* ★ 쓰시던 것이 있으면 먼저 여쭙는다.
     말없이 갈아 끼우면 고르신 파일과 치신 제목이 사라진다. */
  /* ★★ 2026-09-21 — 물음말을 또렷하게
     예전에는 「올리시려던 것이 있습니다 … 사라집니다」로만 물었다.
     **어느 파일**이 남아 있는지 말하지 않아, [취소]를 누르시면
     화면에 옛 파일 이름이 그대로 남아 「왜 다른 파일이 나오지」가 됐다. */
  const keep = [];
  if(ARC.file) keep.push("파일 · " + ARC.file.name);
  if((ARC.title||"").trim()) keep.push("제목 · " + ARC.title.trim());
  if((ARC.sub||"").trim())   keep.push("덧붙임 · " + ARC.sub.trim());
  if(keep.length && !confirm(
     (ARC.edit ? "지금 수정하던 내용이 있습니다.\n\n" : "지금 등록하려던 내용이 있습니다.\n\n")
   + keep.map(x => "  · " + x).join("\n") + "\n\n"
   + "이것을 치우고 「" + d.title + "」을(를) 수정할까요?\n\n"
   + "[확인] 치우고 수정  ·  [취소] 그대로 두기")) return;

  ARC.edit = id;
  ARC.cat = d.cat;
  ARC.title = d.title || "";
  ARC.sub = d.sub || "";
  ARC.day = String(d.at || "").slice(0, 10);
  ARC.mkind = d.mkind || "";
  ARC.skind = d.skind || "";
  ARC.sCase = d.sCase || "";
  ARC.sSide = d.sSide || "";
  ARC.sEnd  = !!d.sEnd;
  ARC.file = null;
  ARC.newFile = false;
  ARC.tEdit = null;
  arcStay(id, render);             /* ★ 맨 위로 튕기지 않는다 (111절) */
}
/* 고르신 파일만 치운다 — 제목 · 날짜는 그대로 둔다 (2026-09-21) */
function arcDropFile(){

/* 적힌 것만 고친다 — 파일을 새로 고르셨으면 갈아 끼운다 */
async function arcEditSave(){
  const d = ARC_DOCS.find(x => x.id === ARC.edit); if(!d) return;
  arcKeep();
  if(!ARC.title.trim()){ alert("제목을 적어 주십시오."); return; }
  if(ARC.cat === "minu" && !ARC.mkind){
    alert("어떤 회의인지 골라 주십시오.\n\n이사회 · 대의원회의 · 총회 중 하나입니다."); return; }
  if(ARC.cat === "suit" && !ARC.skind){
    alert("어떤 갈래인지 골라 주십시오.\n\n각종 민원 · 고소 · 고발 · 핫이슈 중 하나입니다."); return; }
  if(ARC.busy) return;

  const wasVerified = d.state === "verified";
  if(ARC.file && !confirm(
     `파일을 갈아 끼웁니다.\n\n`
   + `예전 · ${d.file}\n새로 · ${ARC.file.name}\n\n`
   + `★ 조합원이 이미 보신 파일이 바뀝니다.\n`
   + `  바꾸신 사실은 화면에 남습니다.\n\n`
   + (wasVerified ? `★ 검수를 마친 자료입니다. 검수가 풀립니다.\n\n` : "")
   + `계속하시겠습니까?`)) return;

  ARC.busy = true; render();

  /* ① 파일을 바꾸신 경우 — 새것을 먼저 올리고, 된 뒤에 옛것을 지운다.
     ★ 옛것을 먼저 지우면 새것 올리기가 실패했을 때 둘 다 없어진다. */
  let newPath = null, newParts = null, newPartN = 1;
  const oldPath = d.path, oldParts = d.parts, oldSheets = d.sheets;
  if(ARC.file){
    const ext = (ARC.file.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0].toLowerCase();
    ARC_PCT = 0; arcPctPaint();
    const r = await hubUploadBig(ARC.file, hubPath("arc", d.id + "-v2-" + Date.now()),
      p => { ARC_PCT = p; arcPctPaint(); });
    ARC_PCT = null;
    if(!r.ok){ ARC.busy = false; render(); alert(r.why); return; }
    newPath = r.path; newParts = r.parts || null; newPartN = r.partN || 1;
  }

  /* ② 적힌 것을 고친다 */
  const before = {title:d.title, cat:d.cat, at:d.at, file:d.file};
  const now = (() => { const t = new Date(), z = v => String(v).padStart(2,"0");
    return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())} `
         + `${z(t.getHours())}:${z(t.getMinutes())}`; })();

  d.title = ARC.title.trim();
  d.sub = ARC.sub.trim();
  d.cat = ARC.cat;
  /* ★ 갈래를 고소 · 고발이 아닌 것으로 바꾸시면 사건도 함께 지운다.
     남겨 두면 나중에 다시 고소 · 고발로 옮길 때 엉뚱한 사건에 붙는다. */
  d.mkind = ARC.cat === "minu" ? (ARC.mkind||"") : "";
  d.skind = ARC.cat === "suit" ? (ARC.skind||"") : "";
  d.sCase = ARC.cat === "suit" ? (ARC.sCase||"").trim() : "";
  d.sSide = ARC.cat === "suit" ? (ARC.sSide||"") : "";
  d.sEnd  = ARC.cat === "suit" ? !!ARC.sEnd : false;
  if(ARC.day) d.at = ARC.day + " " + String(d.at || now).slice(11, 16);
  d.edAt = now; d.edBy = S.name;
  if(newPath){
    d.path = newPath; d.file = ARC.file.name; d.size = ARC.file.size;
    d.parts = newParts; d.partN = newPartN;
    d.fileSwapped = true;
    /* ★ 파일이 바뀌면 검수가 풀린다. 검수는 그 파일의 숫자를 본 것이다. */
    if(wasVerified){ d.state = "pending"; d.verifiedN = null; d.verifiedBy = null; }
  }

  const saved = await arcPut(S.name);
  if(!saved){
    Object.assign(d, before);                      /* 되돌린다 */
    if(newPath && typeof hubFileDel !== "undefined") await hubFileDel(newPath);
    ARC.busy = false; render();
    alert("서버에 저장하지 못했습니다.\n\n수정하신 것은 반영되지 않았습니다.\n"
      + "인터넷을 확인하시고 다시 눌러 주십시오.");
    return;
  }
  /* ③ 다 된 뒤에 옛 파일을 지운다 */
  /* ★ 옛 파일을 지운다. 조각으로 나뉘어 있었으면 조각을 모두 지운다. */
  if(newPath && typeof hubFileDel !== "undefined"){
    for(const q of arcAllPaths({path:oldPath, parts:oldParts, sheets:oldSheets}))
      await hubFileDel(q);
  }

  ARC.busy = false;
  arcCancel();
  alert("고쳤습니다.\n\n조합원 화면에 바로 반영됩니다."
    + (newPath ? "\n\n★ 파일이 바뀌었습니다."
        + (wasVerified ? " 검수가 풀렸으니 다시 검수해 주십시오." : "") : ""));
}

/* ★ 주간업무보고 제목을 날짜로 채운다 (2026-09-16).
   ───────────────────────────────────────────────────────────
   ★ 제목을 「2026-09-14 주간업무보고」처럼 **날짜로 시작**하게 하면

   ★ 이번 주 월요일을 넣는다. 보고서가 월요일자로 나오기 때문이다.
     보고서에 적힌 날짜와 다르면 고치시면 된다. */
function arcWeekTitle(){

  const back = (d.getDay() + 6) % 7;          /* 월요일까지 며칠 뒤로 */
  d.setDate(d.getDate() - back);

function arcKeep(){

  if(d!==null) ARC.day=d;
  /* ★ 사건 이름도 여기서 읽는다. 빠뜨리면 다시 그릴 때 소리 없이 지워진다. */
  const sc=g("arc-case"); if(sc!==null) ARC.sCase=sc;
}

/* ★ 목록 찾기 — 한 글자 칠 때마다 다시 그리되 커서를 되돌린다.
   안 되돌리면 커서가 맨 앞으로 튀어 아무도 못 쓴다.
   운영자 콘솔에서 이미 겪은 것이다.

   ★★★ 이름을 arcQuery 로 바꿨다 (2026-08-22 밤) ★★★
     처음에 arcFind 로 지었는데 archive-demo.js 480줄에
     **같은 이름이 이미 있었다.** 그쪽은 조합원 질문에서
     자료 자리를 찾아 주는 함수다.

     admin.html 이 archive-demo.js 보다 나중에 읽히므로
     조합원 답변용 arcFind 가 통째로 덮여 있었다.
     직원 화면에서는 티가 안 나고, 조합원이 자료를 찾을 때만
     엉뚱하게 동작한다. 오류도 안 난다.

     function 은 덮어써도 오류가 안 나므로 이름 겹침 검사에
     걸리지 않는다. const 만 검사해서는 부족하다. */
function arcQuery(v){
  ARC.q = v;
  if(IME_ON) return;                 /* 한글 조합 중 */
  const e = document.getElementById("arc-q");
  const pos = e ? e.selectionStart : null;
  render();
  const n = document.getElementById("arc-q");
  if(n && pos !== null){ n.focus(); n.setSelectionRange(pos, pos); }
}
/* ═══════════════════════════════════════════════════════════
   ★★★ 한 자료를 여러 장으로 올린다 (2026-09-16) ★★★
   ───────────────────────────────────────────────────────────
   ★ 회의록을 폰으로 찍으시면 사진이 서너 장 나온다.
     예전에는 한 장씩 세 번 올리셔야 했고,
     조합원 화면에도 세 줄로 따로 떴다.

   ★ 윈도우에서 PDF 로 묶는 길도 있지만 **순서가 엉킨다.**
       KakaoTalk_..._929        ← 번호 없는 것이 맨 앞
       KakaoTalk_..._929_01
       KakaoTalk_..._929_02
     게다가 10장이 넘으면 _10 이 _2 보다 앞에 선다.

   ★ 그래서 여기서 **끌어서 순서를 바꾸실 수 있게** 한다.
     조합원 화면에는 한 줄로 보이고, 누르시면 차례로 넘겨 보신다.

   ★ 담기는 모양 — 조각(parts)과 헷갈리지 않게 sheets 로 부른다.
       parts    한 파일을 45MB 씩 자른 것    (이어 붙여야 원본)
       sheets   여러 장이 모여 한 자료인 것   (각각이 온전한 파일)
   ═══════════════════════════════════════════════════════════ */
/* 고르신 장들을 차례대로 보여 주고 순서를 바꾸실 수 있게 한다 */
/* ★ 한 자료가 저장소에서 쓰는 자리를 모두 모은다 (2026-09-16).
   지우거나 갈아 끼울 때 하나라도 빠뜨리면 찌꺼기가 남아 요금만 나간다. */
function arcAllPaths(d){
  const out = [];
  const add = x => { if(x && out.indexOf(x) < 0) out.push(x); };
  if(d.sheets && d.sheets.length){
    d.sheets.forEach(sh => {
      if(sh.parts && sh.parts.length) sh.parts.forEach(add);
      else add(sh.path);
    });
  }
  if(d.parts && d.parts.length) d.parts.forEach(add);
  else add(d.path);
  return out;
}

function arcChoose(){
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".pdf,.jpg,.jpeg,.png,.hwp,.hwpx,.doc,.docx";
  /* ★ 여러 장을 한꺼번에 고르실 수 있다 */
  inp.multiple = true;
  inp.onchange = () => arcTake(inp.files);
  inp.click();
}

/* 한 장이든 여러 장이든 같은 길로 받는다 */
function arcTake(fs){
  if(!fs) return;
  /* ★ FileList 인지 파일 한 개인지 가린다.
     `fs instanceof FileList` 로 쓰면 그 이름이 없는 자리에서 통째로 멈춘다.
     length 가 있으면 여럿으로 본다. */
  const list = (typeof fs.length === "number" && typeof fs.name !== "string")
    ? Array.prototype.slice.call(fs) : [fs];
  if(!list.length) return;

  for(const f of list){
    if(!ARC_OK.test(f.name)){
      alert("PDF · 한글 · 워드 · 사진만 올리실 수 있습니다.\n\n" + f.name); return; }
    if(f.size > ARC_MAX){
      alert(`파일이 너무 큽니다 (${hubSize(f.size)})\n\n`
        + `${f.name}\n\n한 장에 ${hubSize(ARC_MAX)}까지입니다.`); return; }
  }

  arcKeep();
  /* ★ 이름순으로 한 번 세워 둔다. 대개 그것이 맞는 차례다.
     ★ 숫자를 숫자로 견준다. 글자로 견주면 _10 이 _2 앞에 선다. */
  list.sort((a, b) => a.name.localeCompare(b.name, "ko", {numeric:true}));

  ARC.files = (ARC.files || []).concat(list);
  ARC.file = ARC.files[0];                 /* 옛 코드가 보는 자리 */
  if(!ARC.title){
    ARC.title = ARC.files[0].name.replace(/\.[^.]+$/, "");
  }
  render();
}

/* 장 순서 바꾸기 · 빼기 */
function arcMove(i, d){
  arcKeep();
  const a = ARC.files, j = i + d;
  if(!a || j < 0 || j >= a.length) return;
  const t = a[i]; a[i] = a[j]; a[j] = t;
  ARC.file = a[0];
  render();
}
function arcDrop(i){
  arcKeep();
  ARC.files.splice(i, 1);
  ARC.file = ARC.files[0] || null;
  render();
}
function arcClearFiles(){ arcKeep(); ARC.files = []; ARC.file = null; render(); }
async function arcUp(){

  }

  if(ARC.busy) return;

  if(ARC.link) return arcUpLink();
  ARC.busy = true; render();
  const sheets = (ARC.files && ARC.files.length) ? ARC.files : [ARC.file];
  const f = sheets[0];

  /* ★ 번호를 서버에서 먼저 받아온다 (2026-08-22 오후).

  if(typeof hubPull !== "undefined"){
    const v = await hubPull("arc_seq", null);
    if(typeof v === "number") ARC_SEQ = Math.max(ARC_SEQ, v);
  }

  const zone = (typeof hubTenant !== "undefined") ? hubTenant() : "MIA-002";
  const id  = "AR-" + new Date().getFullYear() + "-" + String(++ARC_SEQ).padStart(3,"0");
  /* ★ 큰 파일은 몇 분이 걸린다. 그동안 「올리는 중입니다…」로만 있으면
     직원은 멈춘 줄 알고 새로고침을 누르신다. 그러면 처음부터 다시다.
     ★ 화면 전체를 다시 그리지 않는다. 숫자만 갈아 끼운다. */
  ARC_PCT = 0; arcPctPaint();

  const up = [];

      for(const u of up)

      alert(sheets.length > 1

    up.push(r1);
  }

  const r = up[0];

  const day = ARC.day

    : now;
  const rec = {
    id, zone,                                  /* ★ 어느 구역 자료인지 함께 담는다 */
    cat:ARC.cat, title:ARC.title.trim(), sub:ARC.sub.trim(),
    file:f.name, path:r.path,
    size:up.reduce((n,u)=>n + (u.size||0), 0),
    /* ★ 조각으로 나뉘었으면 조각 목록을 함께 담는다.

    parts:r.parts || null, partN:r.partN || 1,
    /* ★ 여러 장이면 장마다의 자리를 담는다 (2026-09-16).
       parts 와 다르다 — parts 는 한 파일을 자른 것이고,
       sheets 는 각각이 온전한 파일이다. */
    sheets: (sheets.length > 1)
      ? up.map((u, i) => ({n:i+1, name:sheets[i].name, size:u.size,
                           path:u.path, parts:u.parts || null}))
      : null,
    sheetN: sheets.length,
    at:day, upAt:now, backdated:!!ARC.day,
    /* ★ 고소 · 고발을 사건별로 묶는다 (2026-09-16 밤).
       다른 갈래에는 넣지 않는다. 남는 칸이 있으면 언젠가 잘못 쓰인다. */
    link: !!ARC.link, url: ARC.link ? (ARC.url||"").trim() : "",
    src: ARC.link ? (ARC.src||"").trim() : "",
    memo: ARC.link ? (ARC.memo||"").trim() : "",
    mkind: ARC.cat === "minu" ? (ARC.mkind||"") : "",
    akind: ARC.cat === "acct" ? (ARC.akind||"etc") : "",
    skind: ARC.cat === "suit" ? (ARC.skind||"") : "",
    sCase: ARC.cat === "suit" ? (ARC.sCase||"").trim() : "",
    sSide: ARC.cat === "suit" ? (ARC.sSide||"") : "",
    sEnd:  ARC.cat === "suit" ? !!ARC.sEnd : false,
    by:S.name, state:"pending"
  };
  ARC_DOCS.push(rec);

  /* ★ 목록이 서버에 갔는지 반드시 확인한다.
     파일만 올라가고 목록이 못 가면 아무도 그 파일을 찾을 수 없다. */
  const saved = await arcPut(S.name);
  if(!saved){
    ARC_DOCS = ARC_DOCS.filter(x => x.id !== id);
    ARC_SEQ--;
    if(typeof hubFileDel !== "undefined") await hubFileDel(r.path);  /* 올린 파일도 거둬들인다 */
    ARC.busy = false; render();
    alert("목록을 서버에 저장하지 못했습니다.\n\n"
      + "올리던 파일은 되돌렸습니다. 반쯤 올라간 자료는 남지 않았습니다.\n"
      + "인터넷을 확인하시고 [올리기]를 다시 눌러 주십시오.\n\n"
      + "고르신 파일과 제목은 그대로 있습니다.");
    return;
  }

  if(typeof usageStore !== "undefined") usageStore(r.size / 1024 / 1024);
  ARC.file = null; ARC.files = [];
  ARC.title = ""; ARC.sub = ""; ARC.day = ""; ARC.busy = false;
  const c = ARCHIVE.find(x=>x.key===ARC.cat);

  /* ★ 올리자마자 AI 초안을 만든다 (2026-08-22 밤).
     직원이 [질문 생성] 을 따로 찾아 들어가시게 하면 안 하신다.
     올린 그 자리에서 검수 대기열이 쌓여 있어야 이어서 하신다.
     ★ 초안은 전부 「확인 전」이라 조합원께는 한 글자도 안 나간다. */
  alert(`올렸습니다.\n\n${c?c.name:""} · ${f.name}\n\n`
    + `이어서 AI 가 조합원이 물으실 것을 뽑습니다.\n`
    + `원문과 대조해 확인하신 것만 조합원께 나갑니다.`);
  render();
  await arcDraft(rec);
}

/* ★ 올린 문서에서 초안을 뽑아 검수 대기열에 넣는다 */
async function arcDraft(rec0){
  const r = await aiExtract(rec0, "");
  /* ★ 기다리는 사이 목록이 새로 내려왔을 수 있다 — **지금 목록의 그 자료**에 담는다 */
  let rec = ARC_DOCS.find(x => x.id === rec0.id);
  if(!rec){ rec = rec0; ARC_DOCS.push(rec); }
  if(!r.ok || !r.rows.length){ render(); return; }
  rec.index = rec.index || [];
  /* ★ 올리자마자 뽑은 것도 1번째 뽑기다 (2026-09-20 · 115절).
     113절에서 [질문 뽑기] 쪽에만 도장을 달아 이것은 「기록 이전」이 됐다. */
  rec.aiRuns = (rec.aiRuns||0) + 1;
  const stamp = idxStamp();
  r.rows.forEach(x => rec.index.push({
    q:x.q, a:x.a||"", at:x.at||"", page:x.page||"",
    kw:(x.kw||[]).slice(), by:"ai", ok:false,
    run:rec.aiRuns, made:stamp.made, t:stamp.t
  }));
  /* ★ 2026-09-21 (123절) — **저장 결과를 먼저 확인**하고 말씀드린다.
     「뽑았습니다」 뒤에 「저장 못 했습니다」가 오면 어느 말을 믿어야 할지 모르신다. */
  aiWaitClose();
  const ok = await arcSave(`AI 가 뽑은 질문 ${r.rows.length}개`);
  /* ★ 2026-09-21 (122절) — 뽑은 뒤 **바로 그 질문 화면으로** 넘어간다. */
  idxOpen(rec.id);
  if(ok) alert(`AI 가 ${r.rows.length}개를 뽑았습니다.\n\n`
    + `아직 아무것도 조합원께 나가지 않습니다.\n`
    + `원문과 대조해 확인하신 것만 나갑니다.`);
}
/* ★★ 링크 자료를 담는다 (2026-09-23) — 올릴 파일이 없다 */
async function arcUpLink(){
  ARC.busy = true; render();
  if(typeof hubPull !== "undefined"){
    const v = await hubPull("arc_seq", null);
    ARC_SEQ = Math.max(ARC_SEQ, (+v || 0));
  }
  ARC_SEQ += 1;
  const id = `AR-${new Date().getFullYear()}-${String(ARC_SEQ).padStart(3,"0")}`;
  const d = new Date(), z = x => String(x).padStart(2,"0");
  const now = `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
            + `${z(d.getHours())}:${z(d.getMinutes())}`;
  const rec = {
    id, cat: ARC.cat,
    title: (ARC.title||"").trim(),
    sub: (ARC.sub||"").trim(),
    link: true, url: (ARC.url||"").trim(),
    src: (ARC.src||"").trim(), memo: (ARC.memo||"").trim(),
    file: "", size: 0, path: "",
    at: (ARC.day ? `${ARC.day} 00:00` : now),
    upAt: now, by: S.name,
    state: "verified",          /* ★ 조합이 적은 요약이라 검수가 따로 없다 */
    skind: ARC.cat === "suit" ? (ARC.skind||"") : "",
    sCase: (ARC.sCase||"").trim(),
    sSide: ARC.cat === "suit" ? (ARC.sSide||"") : "",
    index: []
  };
  ARC_DOCS.push(rec);
  ARC.busy = false;
  if(typeof hubPush !== "undefined") await hubPush("arc_seq", ARC_SEQ, S.name);
  const ok = await arcSave("링크 자료");
  arcCancel();
  if(ok) alert(`올렸습니다.\n\n${rec.title}\n\n`
    + `조합원이 누르면 새 창으로 원문이 열립니다.\n`
    + `★ 질문은 [질문 생성]에서 직접 더하시거나,\n`
    + `  조합원 문의에서 옮겨 오십시오. AI 는 파일만 읽습니다.`);
}

async function arcOpen(id){
  const d = ARC_DOCS.find(x=>x.id===id); if(!d) return;
  const u = await hubFileUrl(d.path, 3600);
  if(!u){ alert("파일을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
  window.open(u, "_blank");
}
/* ★ 검수 완료는 자동 검사가 아니다.
     사람이 원문과 대조했다는 표시다.
     누가 무엇을 몇 항목 확인했는지 남겨야
     나중에 "누가 확인한 것이냐"고 물을 때 답할 수 있다. */
function arcVerify(id){
  const d = ARC_DOCS.find(x=>x.id===id); if(!d) return;
  if(d.cat === "law"){
    alert("법령은 검수 대상이 아닙니다.\n\n"
      + "법령은 운영자가 모든 조합에 한 번에 올립니다.\n"
      + "이 건은 감추시고 운영자에게 알려 주십시오."); return; }

  /* ★ 확인하신 개수를 자동으로 쓴다 (2026-08-22 밤).
     예전에는 숫자를 직접 치게 했는데, 무엇을 확인하셨는지는
     아무 데도 남지 않았다. 「65항목」이라고만 적혀 있으면
     나중에 「무엇을 확인한 것이냐」에 답할 수 없다.
     이제 [질문 생성] 에서 「맞습니다」를 누르신 개수가 그대로 들어간다. */
  const okN = (typeof idxOKn !== "undefined") ? idxOKn(d) : 0;
  const all = (d.index||[]).length;

  if(!okN){
    alert(`${d.title}\n\n아직 확인하신 자리가 없습니다.\n\n`
      + `[질문 생성] 에서 조합원이 물으실 것을 뽑고,\n`
      + `원문과 대조해 「맞습니다」를 눌러 주십시오.\n\n`
      + `확인하신 것만 조합원 화면에 나갑니다.`);
    idxOpen(id); return;
  }

  if(!confirm(`${d.title}\n\n`
    + `확인하신 자리 ${okN}개${all>okN?` (아직 ${all-okN}개가 확인 전입니다)`:""}\n\n`
    + `검수 완료로 표시하시겠습니까?\n\n`
    + `표시하시면 AI 가 이 문서를 근거로 답합니다.\n`
    + `틀린 자리가 그대로 조합원께 나갑니다.`)) return;

  const dt = new Date(), z = v => String(v).padStart(2,"0");
  d.state = "verified"; d.verifiedBy = S.name; d.verifiedN = okN;
  d.verifiedAt = `${dt.getFullYear()}-${z(dt.getMonth()+1)}-${z(dt.getDate())} `
    + `${z(dt.getHours())}:${z(dt.getMinutes())}`;
  arcSave("질문 · 확인 표시");
  alert(`검수 완료로 표시했습니다.\n\n${okN}항목 · ${S.name}\n\n`
    + `이제 AI 가 이 문서를 근거로 답합니다.`);
  render();
}

     둘 다 「왜 안 되는지」를 직원께 말로 알려 드린다.
   ═══════════════════════════════════════════════════════════ */
const AI_URL = SB_URL + "/functions/v1/ai-extract";

/* 한 자리를 읽는다. 언제나 {ok:…} 를 돌려주고 예외를 던지지 않는다. */
async function aiCall(body){
  /* ★ 3분에서 끊는다. 300쪽짜리 고시문은 1분 넘게 걸린다.
     그동안 화면이 멈춰 있으면 직원이 다시 누르시고 요금만 두 배로 쓴다. */
  const ac = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = ac ? setTimeout(() => ac.abort(), 180000) : null;
  try{
    const r = await fetch(AI_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json",
                apikey: SB_KEY, Authorization: "Bearer " + SB_KEY },
      body: JSON.stringify(body),
      signal: ac ? ac.signal : undefined
    });
    if(timer) clearTimeout(timer);
    if(!r.ok) return {ok:false, why:`AI 중계가 ${r.status} 를 돌려주었습니다.`};
    return await r.json();
  }catch(e){
    if(timer) clearTimeout(timer);
    return {ok:false, why:(String(e).indexOf("abort")>=0)
      ? "3분이 지나도 답이 없어 끊었습니다.\n\n문서가 아주 길면 그럴 수 있습니다.\n낱말을 넣어 좁혀서 다시 해 보십시오."
      : "AI 를 부르지 못했습니다. 인터넷 연결을 확인해 주십시오."};
  }
}

/* ═══════════════════════════════════════════════════════════
   ★★★ AI 가 읽는 동안 (2026-09-21 · 122절)
   ───────────────────────────────────────────────────────────
   ① ARC_HOLD — 읽는 동안 20초 자동 갱신이 자료 목록을 **서버 것으로
     갈아치우지** 못하게 막는다. 갈아치우면 결과를 담으려던 자료가
     목록에서 빠진 헌 것이 되어 **뽑은 질문이 사라졌다.**
     (자료 등록 직후 「뽑았습니다」라고 하고도 질문 화면이 비어 있던 까닭)
   ② 진행 창 — 「AI 가 질문을 뽑는 중입니다」 + 도는 마름모.
     30초쯤 걸리므로 아무 표시가 없으면 멈춘 줄 아신다.
   ═══════════════════════════════════════════════════════════ */
/* ★ ARC_HOLD 는 archive-demo.js 로 옮겼다 (2026-09-21 · 123절).
   저장하는 동안에도 막아야 해서 arcPut 옆에 두는 것이 맞다. */
function aiWaitOpen(t1, t2){
  if(document.getElementById("aiwait")) return;
  const el = document.createElement("div");
  el.id = "aiwait"; el.className = "aiwait";
  el.innerHTML = `<div class="aiwrap">
    <div class="aidia"></div>
    <b id="aiwait-t">${t1}</b>
    <p id="aiwait-s">${t2||""}</p>
    <span class="aitick" id="aiwait-n">0초</span>
  </div>`;
  document.body.appendChild(el);
  let n = 0;
  el.dataset.timer = setInterval(() => {
    n++;
    const e = document.getElementById("aiwait-n");
    if(e) e.textContent = n + "초" + (n > 45 ? " · 조금만 더 기다려 주십시오" : "");
  }, 1000);
}
function aiWaitSay(t1, t2){
  const a = document.getElementById("aiwait-t"), b = document.getElementById("aiwait-s");
  if(a) a.textContent = t1; if(b && t2 != null) b.textContent = t2;
}
function aiWaitClose(){
  const el = document.getElementById("aiwait"); if(!el) return;
  clearInterval(+el.dataset.timer); el.remove();
}
async function aiExtract(doc, keywords){
  if(!doc) return {ok:false, why:"자료를 찾지 못했습니다."};
  ARC_HOLD++;
  aiWaitOpen(`AI 가 질문을 뽑는 중입니다`,
    `${doc.title ? "「" + doc.title + "」 · " : ""}`
    + (keywords ? `「${keywords}」로 찾는 중 · ` : "") + "원문을 읽고 있습니다 · 30초쯤 걸립니다");
  try{ return await aiExtractRun(doc, keywords); }
  finally{ ARC_HOLD--; if(ARC_HOLD <= 0) aiWaitClose(); }
}
async function aiExtractRun(doc, keywords){

  /* ① 조각난 큰 파일은 읽을 수 없다 */
  if(doc.parts && doc.partN > 1 && !(doc.sheets||[]).length){
    return {ok:false, why:"이 자료는 50MB 가 넘어 조각으로 나뉘어 있습니다.\n\n"
      + "AI 가 읽으려면 한 파일이어야 합니다.\n"
      + "나누어 올리시거나, 질문을 직접 더해 주십시오."};
  }

  /* ② 읽을 자리들 — 여러 장이면 장마다 한 번씩 부른다 */
  const spots = (doc.sheets && doc.sheets.length)
    ? doc.sheets.filter(s => !(s.parts && s.parts.length > 1))
    : [{n:1, path:doc.path, name:doc.file}];
  if(!spots.length) return {ok:false, why:"읽을 수 있는 파일이 없습니다."};

  /* ★ 장이 아주 많으면 앞의 여섯 장만 본다.
     사진 스무 장이면 스무 번을 부르게 되어 요금과 시간이 감당이 안 된다. */
  const use = spots.slice(0, 6);

  const have = (doc.index || []).map(x => x.q);
  let rows = [], why = "", read = 0;

  for(const s of use){
    const u = await hubFileUrl(s.path, 1800);          /* 30분짜리 주소 */
    if(!u){ why = "원문을 여는 주소를 만들지 못했습니다."; continue; }
    const r = await aiCall({
      url:u, cat:doc.cat, title:doc.title || doc.file || "",
      keywords: keywords || "",
      have: have.concat(rows.map(x => x.q))            /* 겹치지 않게 */
    });
    if(!r || !r.ok){ why = (r && r.why) || "질문을 뽑지 못했습니다."; continue; }
    read++;
    (r.rows || []).forEach(x => {
      if(!x || !x.q) return;
      if(have.includes(x.q)) return;
      if(rows.some(y => y.q === x.q)) return;          /* 장끼리도 겹친다 */
      /* ★ 사진 자료는 **몇 번째 장**으로 적는다 (2026-09-20 · 115절).
         AI 가 적은 번호는 버린다. 사진 속 책자에 인쇄된 쪽(200쪽 등)을 적기 때문이다.
         사진 한 장이면 번호가 필요 없다. */
      if(arcIsPic(doc)) x.page = use.length > 1 ? String(s.n) : "";
      rows.push(x);
    });
  }

  /* 한 자리도 못 읽었으면 까닭을 말씀드린다 */
  if(!read && why) return {ok:false, why};
  return {ok:true, rows, kw:keywords || "", read};
}

function idxMove(i, d){
  idxKeep();
  const doc = ARC_DOCS.find(x=>x.id===IDX.id); if(!doc) return;
  const L = doc.index || [];
  const j = i + d;
  if(j < 0 || j >= L.length) return;
  [L[i], L[j]] = [L[j], L[i]];
  /* ★ 고치는 중인 줄이 있으면 그 자리도 따라 옮긴다.
     안 옮기면 **엉뚱한 질문의 답을 고치게** 된다. */
  if(IDX.edit === i) IDX.edit = j;
  else if(IDX.edit === j) IDX.edit = i;
  arcSave("질문 · 확인 표시");
  render();
}

/* ★ 서버에 저장된 질문을 다시 읽는다 (2026-09-21 · 125절)
   AI 를 쓰지 않는다. 「뽑았다는데 화면이 비었다」일 때 쓰신다. */
async function idxReload(){
  if(IDX.busy || ARC_HOLD > 0){ alert("AI 가 읽는 중입니다.\n끝난 뒤에 눌러 주십시오."); return; }
  const id = IDX.id;
  const was = ((ARC_DOCS.find(x=>x.id===id)||{}).index || []).length;
  if(typeof hubPull === "undefined"){ render(); return; }
  const srv = await hubPull("arc_docs");
  if(!Array.isArray(srv)){ alert("서버에서 읽지 못했습니다.\n인터넷을 확인해 주십시오."); return; }
  ARC_DOCS = arcMerge(srv, ARC_DOCS);
  /* ★ arcMerge 는 손댄 때가 같으면 **화면 것**을 남긴다(평소에는 그게 맞다).
     그런데 이 단추는 「서버 것을 가져와라」는 뜻이다.
     이 자료의 질문만큼은 **서버 것을 바탕으로** 하고,
     화면에만 있는 질문은 뒤에 붙여 잃지 않게 한다. */
  const sd = srv.find(x => x.id === id), ld = ARC_DOCS.find(x => x.id === id);
  if(sd && ld){
    const sq = (sd.index || []), lq = (ld.index || []);
    const have = new Set(sq.map(x => String(x.q||"").trim()));
    ld.index = sq.concat(lq.filter(x => !have.has(String(x.q||"").trim())));
  }
  render();
  const now = ((ARC_DOCS.find(x=>x.id===id)||{}).index || []).length;
  alert(now > was ? `${now - was}개를 더 가져왔습니다.\n\n모두 ${now}개입니다.`
      : now ? `새로 온 것이 없습니다.\n\n이 자료에는 질문 ${now}개가 있습니다.`
            : `아직 저장된 질문이 없습니다.\n\n[✦ 새 질문 만들기]를 눌러 주십시오.`);
}

     그런데 칸에 손으로 친 글자는 IDX.kw 에 안 들어가 있었다.
     → 「전자투표」를 쳐도 빈 것으로 보고 **문서 전체**를 뽑았다.
     ★ 이제 칸을 먼저 읽고(idxKeep) 그 값으로 정한다. */
  idxKeep();
  const d0 = ARC_DOCS.find(x=>x.id===IDX.id); if(!d0) return;
  /* ★ 2026-09-21 (125절) — 같은 때에 두 번 돌지 않는다.
     올릴 때 자동으로 시작된 것이 아직 안 끝났는데 또 누르시면
     둘이 같은 자료를 고쳐 **먼저 끝난 쪽이 덮였다.** */
  if(IDX.busy || ARC_HOLD > 0){
    alert("AI 가 이미 읽는 중입니다.\n\n진행 창이 사라진 뒤에 눌러 주십시오.");
    return;
  }
  /* ★ 2026-09-19 — 단추가 하나로 합쳐졌다.
     낱말 칸이 비어 있으면 문서 전체, 적혀 있으면 그 부분만.
     예전처럼 「낱말을 적어 주십시오」로 막지 않는다.
     비우는 것도 뜻이 있는 선택이다. */
  const kw = (IDX.kw || "").trim();

  IDX.busy = true; render();
  const r = await aiExtract(d0, kw);
  IDX.busy = false;

  /* ★ 기다리는 사이 목록이 새로 내려왔을 수 있다 (2026-09-21 · 122절).
     헌 자료에 담으면 화면에도 서버에도 안 남는다. **지금 목록의 그 자료**를 다시 찾는다. */
  /* ★ 2026-09-21 (125절) — **처음 누른 그 자료**(d0.id)로 찾는다.
     IDX.id 로 찾으면, 기다리는 동안 다른 자료를 여셨을 때 **엉뚱한 자료**에 담긴다. */
  let d = ARC_DOCS.find(x => x.id === d0.id);
  if(!d){ d = d0; ARC_DOCS.push(d); }

  if(!r.ok){ render(); alert(r.why || "질문을 뽑지 못했습니다."); return; }

  d.aiRuns = (d.aiRuns || 0) + 1;
  if(!r.rows.length){
    render();
    alert(kw ? `「${kw}」로 찾았습니다.\n\n문서에서 관련 내용을 찾지 못했습니다.\n`
             + `다른 낱말로 해보시거나 직접 더하십시오.`
             : "더 뽑을 것이 없습니다.\n\n빠진 것은 직접 더하십시오.");
    return;
  }

  /* ★ 이미 있는 것 아래에 붙인다. 갈아엎지 않는다.
     통째로 바꾸면 직원이 확인해 두신 것이 사라진다. */
  d.index = d.index || [];
  /* ★ 몇 번째 뽑기 · 언제 (2026-09-20 · 113절)
     「어디까지」로 걸러 보고 엑셀로 받으려면 **언제 생긴 것인지**가 있어야 한다.
     ★ 한 번에 뽑은 것은 **같은 t** 를 받는다. 그래야 한 묶음으로 끊긴다. */
  const stamp = idxStamp();
  r.rows.forEach(x => d.index.push({
    q:x.q, a:x.a||"", at:x.at||"", page:x.page||"",
    kw:(x.kw||[]).slice(),            /* 조합원이 다르게 물으셔도 찾히도록 */
    by:"ai", ok:false, from:kw||null, /* from = 어느 낱말로 찾아낸 것인가 */
    run:d.aiRuns, made:stamp.made, t:stamp.t
  }));
  arcSave(`새로 뽑은 질문 ${r.rows.length}개`);
  IDX.kw = "";
  IDX.upto = null;                    /* ★ 새로 뽑은 것이 가려지면 안 된다 */
  render();
  alert((IDX.id !== d0.id ? `「${d0.title}」에 ` : "")
    + `${r.rows.length}개를 더 뽑았습니다.${kw?`\n찾은 낱말 · ${kw}`:""}\n\n`
    + `★ 이것이 전부는 아닙니다.\n`
    + `쪽수가 맞는지 원문을 열어 확인해 주십시오.\n`
    + `확인하신 것만 조합원 화면에 나갑니다.`
    + (r.demo ? `\n\n(지금은 예시입니다. AI 연결 전입니다)` : ""));
}

/* 직원이 확인했다고 표시 */
function idxOK(i){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index || !d.index[i]) return;
  d.index[i].ok = true;
  d.index[i].okBy = S.name;
  arcSave("질문 · 확인 표시"); render();
}
function idxUndo(i){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index || !d.index[i]) return;
  d.index[i].ok = false; delete d.index[i].okBy;
  arcSave("질문 · 확인 표시"); render();
}
/* 쪽수 수정 */
function idxFix(i){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index || !d.index[i]) return;
  const x = d.index[i];
  /* ★ 사진 자료는 「몇 번째 장」을 묻는다 (2026-09-20 · 115절) */
  if(arcIsPic(d)){
    const N = arcSheetN(d);
    if(N < 2){ alert("사진 한 장짜리 자료라 장 번호가 필요 없습니다.\n번호를 지웁니다.");
      x.page = ""; x.ok = true; x.okBy = S.name; arcSave("질문 · 확인 표시"); render(); return; }
    const v = prompt(`${x.q}\n\n몇 번째 장에 있습니까?\n1 부터 ${N} 사이 숫자로 적어 주십시오.`,
      arcPgOk(d,x) ? String(arcPgN(x)) : "");
    if(v === null) return;
    const n = parseInt(String(v).replace(/[^0-9]/g,""), 10) || 0;
    if(n < 1 || n > N){ alert(`1 부터 ${N} 사이로 적어 주십시오.\n이 자료는 사진 ${N}장입니다.`); return; }
    x.page = String(n); x.ok = true; x.okBy = S.name;
    arcSave("질문 · 확인 표시"); render(); return;
  }
  const v = prompt(`${x.q}\n\n어디에 있습니까?\n조항과 쪽수를 「제23조 · 12」 처럼 적어 주십시오.\n`
    + `★ 쪽수는 PDF 파일의 몇 번째 쪽입니다. 종이에 인쇄된 번호가 아닙니다.\n`
    + `하나만 적으셔도 됩니다.`, [x.at, x.page].filter(Boolean).join(" · "));
  if(v === null) return;
  const parts = String(v).split(/[·,]/).map(s=>s.trim());
  x.at   = parts.find(s => /조|항|호/.test(s)) || "";
  x.page = (parts.find(s => /^\d+$/.test(s.replace(/[^0-9]/g,""))) || "").replace(/[^0-9]/g,"");
  if(!x.at && !x.page){ alert("조항이나 쪽수 중 하나는 적어 주십시오."); return; }
  x.ok = true; x.okBy = S.name;          /* 고치셨으면 확인하신 것이다 */
  arcSave("질문 · 확인 표시"); render();
}
/* ── 검수 화면에서 고치기 ─────────────────────────────────
   ★ AI 초안은 「고쳐서 확인하는 것」이 기본이다.
     그대로 통과시키기만 하면 검수가 아니라 도장 찍기가 된다. */
function idxEdit(i, what){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index[i]) return;
  const x = d.index[i];
  if(what === "q"){
    const v = prompt("조합원이 물으실 말", x.q); if(v===null) return;
    if(!v.trim()){ alert("비워 두실 수 없습니다."); return; }
    x.q = v.trim();
  }
  if(what === "a"){ idxAOpen(i); return; }   /* 답은 화면 안에서 고친다 */
  if(what === "kw"){
    const v = prompt(`${x.q}\n\n조합원이 이렇게도 물으실 수 있습니다.\n`
      + `쉼표로 나눠 적어 주십시오.\n예 · 용적률, 상한용적률, 몇 퍼센트`,
      (x.kw||[]).join(", "));
    if(v===null) return;
    x.kw = v.split(/[,·]/).map(t=>t.trim()).filter(Boolean);
  }
  arcSave("질문 · 확인 표시"); render();
}

/* ── 답 고치기 (2026-08-22 밤) ────────────────────────────
   ★ prompt 로 받지 않는다.
     답은 두세 문장이 되는데 브라우저 prompt 는 한 줄짜리라
     긴 글을 고치실 수가 없다. 줄바꿈도 안 된다.
     줄 안에서 여러 줄 칸을 펴서 고치신다. */
/* ★★ 질문 글을 **줄에서 바로** 고친다 (2026-09-21)
   예전에는 작은 창(prompt)이 떴다. 창이 뜨면 원문도 답도 안 보여
   무엇과 견주어 고치는지 알 수 없었다. 답 고치기와 같은 방식으로 맞췄다. */
function idxQEdit(i){
  IDX.qEdit = i; IDX.edit = null; idxStay(i, render);
  const e = document.getElementById("ix-qe");
  if(e){ e.focus(); try{ e.setSelectionRange(e.value.length, e.value.length); }catch(_){} }
}
function idxQClose(){ const i = IDX.qEdit; IDX.qEdit = null; idxStay(i, render); }
function idxQSave(i){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index[i]) return;
  const e = document.getElementById("ix-qe"); if(!e) return;
  const v = e.value.trim().replace(/\s+/g, " ");
  if(!v){ alert("질문을 비워 두실 수 없습니다."); return; }
  if(v === d.index[i].q){ idxQClose(); return; }
  d.index[i].q = v;
  IDX.qEdit = null;
  idxStay(i, render);
  arcSave("질문 글");
}
/* 다시 그려도 그 줄을 같은 자리에 둔다 (111절과 같은 방법) */
function idxStay(i, fn){
  const sel = `.qrow:nth-of-type(${(i|0) + 1})`;
  const b = document.querySelectorAll(".qrow")[i];
  const y0 = b ? b.getBoundingClientRect().top : null;
  fn();
  if(y0 === null) return;
  const a = document.querySelectorAll(".qrow")[i]; if(!a) return;
  const dy = a.getBoundingClientRect().top - y0;
  if(dy) scrollBy(0, dy);
}

function idxAOpen(i){ IDX.edit = i; IDX.qEdit = null; render();
  const e = document.getElementById("ix-a"); if(e){ e.focus();
    try{ e.setSelectionRange(e.value.length, e.value.length); }catch(_){} } }
function idxAClose(){ IDX.edit = null; render(); }
function idxASave(i){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index[i]) return;
  const e = document.getElementById("ix-a"); if(!e) return;
  d.index[i].a = e.value.trim();
  IDX.edit = null;
  arcSave("질문 · 확인 표시"); render();

/* ★ 답이 비어 있는 옛 항목을 한 번에 채운다.
   낮에 만든 8개는 답 칸 자체가 없던 판이라 「없음」으로 남아 있다.
   버리고 다시 뽑으시면 확인해 두신 것이 날아가므로,
   같은 질문의 답만 찾아 얹는다. */
function idxFillA(){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index) return;
  const pool = AI_DEMO[d.cat] || [];
  let n = 0;
  d.index.forEach(x => {
    if(x.a) return;
    const m = pool.find(p => p.q === x.q);
    if(!m || !m.a) return;
    x.a = m.a;
    if(!(x.kw||[]).length && (m.kw||[]).length) x.kw = m.kw.slice();
    x.ok = false; delete x.okBy;     /* 답이 새로 들어왔으니 다시 확인하셔야 한다 */
    n++;
  });
  if(!n){ alert("채울 것이 없습니다.\n\n답이 빈 항목은 [답] 을 눌러 직접 적어 주십시오."); return; }
  arcSave("질문 · 확인 표시"); render();
  alert(`${n}개에 답을 채웠습니다.\n\n`
    + `★ 답이 새로 들어왔으므로 확인 표시를 풀었습니다.\n`
    + `원문과 대조하시고 다시 확인해 주십시오.`);
}

/* 한 번에 확인 / 한 번에 되돌리기 */
/* ★★ 2026-09-20 — 「모두」는 **보이는 것만** (113절)
   예전에는 걸러 보는 중에도 목록 전체를 확인했다.
   「2번째까지」만 보시다 누르면 **가려진 것까지** 확인되어 조합원께 나갔다. */
function idxAllOK(){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index) return;
  const V = idxVisible(d).map(o=>o.x);
  const n = V.filter(x=>!x.ok).length;
  if(!n){ alert("보이는 것은 이미 모두 확인하셨습니다."); return; }
  if(!confirm(`보이는 ${V.length}개 중 확인 전인 ${n}개를 한 번에 확인 표시합니다.\n\n`
    + `★ 원문과 대조하지 않고 누르시면 안 됩니다.\n`
    + `쪽수가 틀린 채로 조합원께 나갑니다.\n\n`
    + `정말 모두 확인하셨습니까?`)) return;
  V.forEach(x => { if(!x.ok){ x.ok = true; x.okBy = S.name; } });
  arcSave("질문 · 확인 표시"); render();
}
function idxAllUndo(){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d || !d.index) return;
  const V = idxVisible(d).map(o=>o.x);
  const n = V.filter(x=>x.ok).length;
  if(!n){ alert("보이는 것 중 확인한 것이 없습니다."); return; }
  if(!confirm(`보이는 ${V.length}개 중 확인한 ${n}개를 되돌립니다.\n조합원 화면에서 사라집니다.`)) return;
  V.forEach(x => { x.ok = false; delete x.okBy; });
  arcSave("질문 · 확인 표시"); render();
}
/* 목록 머리의 전체 선택 — 하나라도 안 본 것이 있으면 확인, 다 봤으면 되돌리기 */
function idxVisAll(){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d) return;
  idxVisible(d).some(o=>!o.x.ok) ? idxAllOK() : idxAllUndo();
}

/* ═══════════════════════════════════════════════════════════
   ★ 어디까지 · 엑셀로 (2026-09-20 · 113절)
   ───────────────────────────────────────────────────────────
   run   몇 번째 [질문 뽑기]로 나왔나 (AI 만)
   made  「2026-09-20 15:21」  · 사람이 읽는 것
   t     1789876...           · 견주는 것
   ★ 도장이 없는 것은 이 기능 **전에** 생긴 것이다 → 「기록 이전」.
     언제 생겼는지 모르므로 어느 시점을 고르셔도 **늘 들어간다.**
   ★ 「○번째까지」 = 그 뽑기의 시각(t) 이하. 직접 더한 것도 시각으로 함께 끊긴다.
   ═══════════════════════════════════════════════════════════ */
function idxStamp(){
  const n = new Date(), z = v => String(v).padStart(2,"0");
  return {t:n.getTime(), made:`${n.getFullYear()}-${z(n.getMonth()+1)}-${z(n.getDate())} `
    + `${z(n.getHours())}:${z(n.getMinutes())}`};
}
/* 이 자료의 뽑기 회차들 — 차례대로 */
function idxRuns(d){
  const m = {};
  (d.index||[]).forEach(x => { if(x.run && x.t){
    const r = m[x.run] || (m[x.run] = {run:x.run, t:0, made:"", kw:x.from||""});
    if(x.t > r.t){ r.t = x.t; r.made = x.made || ""; }
  }});
  return Object.values(m).sort((a,b)=>a.run-b.run);
}
/* 고른 시점의 끝 시각 · null 이면 전체 */
function idxCutT(d){
  if(IDX.upto === null || IDX.upto === undefined || IDX.upto === "") return null;
  if(+IDX.upto === 0) return 0;
  const r = idxRuns(d).find(x=>x.run === +IDX.upto);
  return r ? r.t : null;
}
const idxInCut = (x, T) => T === null || !x.t || x.t <= T;
const idxInTab = x => { const t = IDX.tab || "all";
  return t==="all" || (t==="ai" && x.by!=="staff") || (t==="mine" && x.by==="staff")
      || (t==="left" && !x.ok); };
/* 화면에 보이는 것 — 갈래 딱지 + 어디까지. 실제 자리(i)를 함께 돌려준다 */
function idxVisible(d){
  const T = idxCutT(d);
  return (d.index||[]).map((x,i)=>({x,i})).filter(({x}) => idxInTab(x) && idxInCut(x,T));
}
function idxUpto(v){ idxKeep(); IDX.upto = (v === "" ? null : +v); render(); }
function idxRunLabel(x){
  if(!x.t) return `<span class="qrn old" title="시점 기록을 붙이기 전에 생긴 질문입니다">기록 이전</span>`;
  const hm = String(x.made||"").slice(5).replace(" ", " ");
  return x.by === "staff"
    ? `<span class="qrn me" title="직접 더한 때 · ${x.made||""}">직접 · ${hm}</span>`
    : `<span class="qrn" title="${x.from?`「${x.from}」로 찾음 · `:""}${x.made||""}">${x.run}번째 · ${hm}</span>`;
}
function idxCutBar(d){
  const L = d.index || []; if(!L.length) return "";
  const runs = idxRuns(d), T = idxCutT(d);
  const tabN = L.filter(idxInTab).length;
  const V = idxVisible(d);
  const oldN = L.filter(x=>!x.t).length;
  const upto = (IDX.upto === null || IDX.upto === undefined) ? "" : String(IDX.upto);
  const cnt = t => L.filter(x=>idxInTab(x) && idxInCut(x,t)).length;
  const sel = runs.length ? `
    <span class="cn">어디까지</span>
    <select onchange="idxUpto(this.value)">
      <option value="" ${upto===""?"selected":""}>전체 보기 · ${tabN}개</option>
      ${oldN ? `<option value="0" ${upto==="0"?"selected":""}>기록 이전까지 · ${cnt(0)}개</option>` : ""}
      ${runs.map(r=>`<option value="${r.run}" ${upto===String(r.run)?"selected":""}>${r.run}번째 뽑기까지 · ${
        String(r.made).slice(5)}${r.kw?` · ${r.kw}`:""} · ${cnt(r.t)}개</option>`).join("")}
    </select>
    ${T !== null ? `<span class="cn">${tabN}개 중 <b>${V.length}개</b></span>` : ""}`
    : `<span class="cn">질문마다 뽑은 시점이 붙습니다 · 이 기능 전에 생긴 ${oldN}개는 「기록 이전」입니다</span>`;
  return `<div class="qcut">${sel}
    <button class="btn ghost sm" style="margin-left:auto;padding:5px 12px;font-size:.76rem"
      ${V.length?"":"disabled"} onclick="idxCSV()">⬇ 보이는 ${V.length}개 엑셀로</button></div>`;
}

function idxCSV(){
  const d = ARC_DOCS.find(x=>x.id===IDX.id); if(!d) return;
  const V = idxVisible(d); if(!V.length){ alert("내려받을 질문이 없습니다."); return; }
  const rows = [["차례","질문","답","조항","쪽 · 장","찾은 낱말","만든 쪽","확인","확인한 사람","몇 번째 뽑기","뽑은 때"]];
  V.forEach(({x,i}) => rows.push([i+1, x.q||"", x.a||"", x.at||"",
    arcPgBad(d,x) ? `${arcPgN(x)}쪽(고칠 것)` : arcPgLabel(d,x),
    x.from||"", x.by==="staff"?"직접":"AI", x.ok?"확인":"안 봄", x.okBy||"",
    x.run ? x.run+"번째" : (x.by==="staff" ? "" : (x.t ? "" : "기록 이전")), x.made||""]));
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    const s=String(v==null?"":v);
    return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(",")).join(String.fromCharCode(13,10)) + String.fromCharCode(13,10);
  const cut = (IDX.upto===null||IDX.upto===undefined) ? "전체"
            : (+IDX.upto===0 ? "기록이전까지" : `${IDX.upto}번째까지`);
  const tab = {ai:"_AI", mine:"_직접", left:"_안본것"}[IDX.tab] || "";
  const name = String(d.title||d.id).replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"").slice(0,30);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `질문목록_${name}_${cut}${tab}_${idxStamp().made.slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

function hbDead(){
  if(typeof HB === "undefined" || !HB || !HB.faq) return [];
  const same = t => String(t||"").replace(/\s+/g,"").toLowerCase();
  return (HB.faq.rows || []).map((r,i) => {
    if(!r.docId) return null;
    if(ARC_DOCS.some(d => d.id === r.docId)) return null;
    const alt = ARC_DOCS.find(d => same(d.title) === same(r.q));
    return {i, row:r, alt};
  }).filter(Boolean);
}
function hbDeadBox(){
  const L = hbDead();
  if(!L.length) return "";
  return `<div class="warn hard" style="margin-bottom:14px">
    <b>홈 「궁금한 것」에 걸린 줄 ${L.length}개가 자료를 찾지 못합니다</b>

      자료를 지웠다 다시 올리시면 번호가 새로 매겨져 이렇게 됩니다.</p>

        <button class="btn sm" style="padding:4px 11px;font-size:.74rem"
          onclick="hbDeadFix(${x.i},'${x.alt.id}')">이 자료로 잇기</button>`
        : `<span style="font-size:.76rem;color:var(--muted)">이을 자료가 없습니다</span>`}
      <button class="btn ghost sm" style="padding:4px 11px;font-size:.74rem"
        onclick="hbDeadDrop(${x.i})">홈에서 내리기</button>
    </div>`).join("")}
  </div>`;
}
function hbDeadFix(i, id){
  const r = HB.faq.rows[i], d = ARC_DOCS.find(x => x.id === id);

function hbDeadDrop(i){
  if(!confirm("홈 「궁금한 것」에서 이 줄을 내립니다.\n\n자료는 지워지지 않습니다.")) return;

function arcHomeToggle(id){
  const d = ARC_DOCS.find(x => x.id === id); if(!d) return;
  hbInit();
  const rows = HB.faq.rows;

  /* 내리기 */
  if(at >= 0){
    rows.splice(at, 1);
    hbPut(S.name); render();
    return;
  }

  /* ★ 손으로 넣은 것과 **합쳐서** 센다.

    + `  번호를 앞으로 옮기시거나 보일 개수를 늘리시면 나갑니다.`)) return;

  /* ★ 홈에 쓸 이름을 물어본다.
     자료 제목은 딱딱해서 조합원이 안 누르신다.

`

확인한 질문 ${n}개

`

`
    + `  비우시면 자료 제목을 그대로 씁니다.`,
    d.title || d.file || "");
  if(name === null) return;          /* 그만두기 */

  const cc = ARCHIVE.find(x => x.key === d.cat);
  rows.push({
    docId: id,
    q: (name || "").trim() || d.title || d.file || "자료",
    sub: `${cc ? cc.name : ""} · 질문 ${n}개`,

/* ★ 원문을 그 쪽에서 연다.
   PDF 주소 뒤에 #page=245 를 붙이면 브라우저가 그 쪽을 펴서 보여 준다.
   직원이 64쪽을 손으로 넘겨 찾으시게 하면 아무도 확인 안 하신다. */
async function idxSee(id, page){
  const d = ARC_DOCS.find(x=>x.id===id); if(!d || !d.path) {
    alert("원문 파일이 없습니다."); return; }
  /* ★ 사진 여러 장이면 그 장을 연다 (2026-09-20 · 115절) */
  if(arcIsPic(d)){
    const s = (d.sheets && d.sheets.length > 1)
      ? (d.sheets[(page >= 1 && page <= d.sheets.length) ? page - 1 : 0] || {}) : {path:d.path};
    const u = await hubFileUrl(s.path || d.path, 3600);
    if(!u){ alert("원문을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
    window.open(u, "_blank"); return;
  }
  const u = await hubFileUrl(d.path, 3600);
  if(!u){ alert("원문을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
  window.open(u + (page ? "#page=" + page : ""), "_blank");
}

async function arcDel(id){
  const d = ARC_DOCS.find(x=>x.id===id); if(!d) return;
  if(!confirm(`${d.title}\n${d.file}\n\n`
    + `이 자료를 지우시겠습니까?\n\n`
    + `조합원 화면에서 사라지고 올린 파일도 함께 지워집니다.\n`
    + `되돌릴 수 없습니다.`
    + (d.state === "verified"
       ? `\n\n★ 검수를 마친 자료입니다. AI 답변 근거에서도 빠집니다.` : ""))) return;
  /* ★ 장과 조각을 모두 지운다 (2026-09-16).
     하나만 지우면 나머지가 저장소에 남아 요금만 나간다.
       sheets  여러 장이 모여 한 자료인 것
       parts   한 파일을 45MB 씩 자른 것 */
  if(typeof hubFileDel !== "undefined") for(const q of arcAllPaths(d)) await hubFileDel(q);
  ARC_DOCS = ARC_DOCS.filter(x => x.id !== id);
  /* ★ 지운 것으로 표시해 둔다. 안 하면 합칠 때 서버에서 되살아난다. */
  if(typeof arcForget !== "undefined") arcForget(id);
  arcSave("질문 · 확인 표시");
  render();
}

/* 법령이 잘못 올라간 것들을 한 번에 정리한다 */
async function arcDelLaws(){
  const rows = ARC_DOCS.filter(d => d.cat === "law");
  if(!rows.length) return;
  if(!confirm(`법령 자리에 올라간 ${rows.length}건을 모두 지웁니다.\n\n`
    + rows.map(d=>"· " + d.title).join("\n")
    + `\n\n법령은 운영자 콘솔의 [전역 법령]에서 올리시면\n`
    + `모든 조합 자료실에 함께 나타납니다.\n\n계속하시겠습니까?`)) return;
  for(const d of rows){
    if(d.path && typeof hubFileDel !== "undefined") await hubFileDel(d.path);
  }
  if(typeof arcForget !== "undefined")
    ARC_DOCS.filter(d => d.cat === "law").forEach(d => arcForget(d.id));
  ARC_DOCS = ARC_DOCS.filter(d => d.cat !== "law");
  arcSave("질문 · 확인 표시");
  alert(`${rows.length}건을 지웠습니다.\n\n`
    + `운영자 콘솔 · 전역 법령에서 다시 올려 주십시오.`);
  render();
}

/* 왼쪽 입력 · 오른쪽 목록으로 두 칸을 쓰는 화면 */
/* ★ myhome 을 더했다 (2026-09-17). 안에 표가 여럿이라 넓어야 한다. */
const WIDE_V = ["upload","consent","roster","decide","desk","office",
  "meeting","mtg1","mtg2","del","brd","myhome"];

/* ── 자료 등록 ─────────────────────────────────────────────
   ★ 두 칸으로 바꿨다 (2026-08-22 오후).

     예전에도 <div class="g2"> 로 왼쪽·오른쪽이 나뉘어 있었다.
     그런데 admin.html 에 .g2 규칙이 아예 없어서(위 CSS 참고)
     전부 위아래로 흘러내렸고 오른쪽 절반이 내내 비어 있었다.
     규칙을 되살리고, 이 화면은 폭까지 넓혀 제대로 두 칸으로 만든다.

   ★ 왼쪽 460px 고정 · 오른쪽은 남는 폭 전부.
     입력칸은 넓어질 이유가 없고, 목록은 넓을수록 좋다.
     예전에는 「처리」 칸이 좁아 단추 다섯 개가 두 줄로 접혀 있었다.

   ★ 긴 안내문 둘을 접었다. 지우지는 않았다.
     왜 그렇게 했는지가 사라지면 다음 사람이 같은 실수를 한다. */
V.upload = () => {
  if(IDX.on) return idxView();
  const cats = (typeof ARCHIVE !== "undefined") ? ARCHIVE : [];
  const c = cats.find(x=>x.key===ARC.cat) || cats[0] || {name:"", desc:"", note:""};
  /* ★ 한글을 골라서 본다 (hub.js hubKeyOf) */
  const K = (typeof hubKeyOf !== "undefined")
    ? hubKeyOf : (v => String(v||"").normalize("NFC").trim().replace(/\s+/g,"").toLowerCase());
  const q = K(ARC.q);
  /* ★ 자료 날짜 순으로 세운다 (2026-09-16).
     예전에는 올린 차례를 뒤집었다. 지난 자료를 몰아 올리시면
     8월 것이 맨 위에 올라가 직원도 헷갈렸다. */
  /* ★ 조합원 화면과 같은 차례로 — 자료 날짜 순 (2026-09-16) */
  const all = ARC_DOCS.slice()
    .sort((a,b) => (b.at||"").slice(0,10).localeCompare((a.at||"").slice(0,10))
                || (b.upAt||b.at||"").localeCompare(a.upAt||a.at||""));
  /* ★★ 2026-09-21 (126절) — 왼쪽에서 고르신 **자리**로 목록을 거른다.
     자료가 39건이 되니 주간업무보고 하나 찾는 데도 한참 내려야 했다.
     ARC.lcat — 목록에 보일 자리. "" 면 전체. 기본은 고르신 자리와 같다. */
  const lc = (ARC.lcat === undefined) ? ARC.cat : ARC.lcat;
  /* ★ 회의록은 갈래로 한 번 더 거른다 (2026-09-21) */
  const lmk = (lc === "minu") ? ((ARC.lmk === undefined) ? ARC.mkind : ARC.lmk) : "";
  const lsk = (lc === "suit") ? ((ARC.lsk === undefined) ? ARC.skind : ARC.lsk) : "";
  /* ★ 회계 · 지출도 갈래로 거른다 (2026-09-23) */
  const lak = (lc === "acct") ? ((ARC.lak === undefined) ? ARC.akind : ARC.lak) : "";
  const inCat = (lc ? all.filter(d => d.cat === lc) : all)

  {k:"warn",  t:"주의", bg:"#F26419", w:"마감이 있는 것"}
];
const NEWS_TAG = k => NEWS_TAGS.find(x => x.k === k) || null;

/* 지금 보여 줄 딱지 — NEW 는 사흘이 지나면 안 보인다 */
function newsTag(x){
  if(!x || !x.tag) return null;
  if(x.tag === "new"){
    const d = new Date(x.d || "");
    if(isNaN(d)) return NEWS_TAG("new");
    const days = Math.floor((Date.now() - d.getTime()) / 86400000);
    if(days > 3) return null;
  }
  return NEWS_TAG(x.tag);
}

}

       다른 화면과 같은 방식이다. 넣은 숫자가 폰에 어떻게 나가는지
       직원이 **따로 앱을 열지 않고** 바로 본다. */""}
  ${(FIN.tab!=="op" && FIN.tab!=="biz") || FIN.pv ? `
  <div class="pv-side">
    <div class="cap"><span>조합원 폰 미리보기</span>
      <span style="color:var(--blue);font-weight:700">${Y
        ? `${Y.y}년 · ${FIN.tab === "biz" ? "사업비" : FIN.tab === "loans" ? "빌린 돈"
            : FIN.tab === "cash" ? "한눈 살림" : "운영비"}` : "예산"}</span></div>
    <div class="phone">
      <div class="ph-h">예산<em>미아2구역</em></div>
      <div class="ph-b">${finPhone(Y)}</div>
    </div>
    ${Y && Y.open === false ? `<p class="note" style="margin-top:9px">
      ★ 아직 <b>비공개</b>입니다. 조합원 화면에는 이 해가 안 보입니다.</p>` : ""}
  </div>` : ""}
  </div>`;
};

/* 폰 미리보기 — 조합원 예산 화면과 같은 모양으로 그린다 */
function finPhone(Y){
  if(!Y) return `<p class="note" style="padding:14px">넣으신 해가 없습니다.</p>`;
  const won2 = v => { const n = +v||0;
    if(n >= 100000000) return (n/100000000).toFixed(1).replace(/\.0$/,"") + "억";
    if(n >= 10000) return Math.round(n/10000).toLocaleString("ko-KR") + "만";
    return n.toLocaleString("ko-KR"); };
  if(FIN.tab === "loans"){
    const L = (Y.loans||[]).filter(x => +x.amt);
    if(!L.length) return `<p class="note" style="padding:14px">차입금을 아직 안 넣으셨습니다.</p>`;
    return `<div style="padding:12px">
      <div style="background:#3B4A5E;color:#fff;border-radius:12px;padding:12px">
        <div style="font-size:.7rem;opacity:.75">차입금 합계</div>
        <div style="font-size:1.3rem;font-weight:800">${won2(finSum(L,"amt"))}원</div>
        <div style="font-size:.7rem;opacity:.8;margin-top:3px">
          한 해 이자 약 ${won2(Math.round(finLoanInt(Y)))}원</div></div>
      ${L.map(x => `<div style="border-top:1px solid #EEF1F5;padding:9px 2px">
        <b style="font-size:.82rem">${x.who || "금융기관"}</b>
        <span style="font-size:.68rem;border-radius:9px;padding:1px 7px;margin-left:5px;
          background:${x.kind==="단기"?"#FFF6EC":"#EAF2FC"};
          color:${x.kind==="단기"?"var(--amber)":"var(--blue)"}">${x.kind||""}${
          x.due?" · "+x.due:""}</span>
        <div style="font-size:.72rem;color:var(--muted);margin-top:2px">
          ${won2(x.amt)}원${x.rate?` · 연 ${x.rate}%`:""}${x.use?` · ${x.use}`:""}</div>
      </div>`).join("")}</div>`;
  }
  if(FIN.tab === "cash"){
    const C = Y.cash || {};
    const F = [["통장 잔액",C.bank],["아직 낼 돈 (미지급금)",C.unpaid],
               ["올해 손실 (당기순손실)",C.loss],["쌓인 손실 (누적 결손금)",C.deficit]]
      .filter(x => +x[1]);
    if(!F.length) return `<p class="note" style="padding:14px">한눈 살림을 아직 안 넣으셨습니다.</p>`;
    return `<div style="padding:12px">
      ${F.map(([t,v]) => `<div style="display:flex;justify-content:space-between;
        padding:8px 0;border-bottom:1px solid #EEF1F5;font-size:.8rem">
        <span style="color:var(--muted)">${t}</span>
        <b>${(+v).toLocaleString("ko-KR")}원</b></div>`).join("")}
      ${Y.note ? `<div style="background:#FFF6EC;border-radius:9px;padding:9px 10px;
        margin-top:10px;font-size:.72rem;line-height:1.6;color:#8A5A12">
        <b>이 돈은 어디서 나오나요</b><br>${Y.note}</div>` : ""}</div>`;
  }
  const side = FIN.tab === "biz" ? "biz" : "op";
  const rows = (Y[side]||[]).filter(r => (r.k||"").trim());
  if(!rows.length) return `<p class="note" style="padding:14px">
    ${side==="biz"?"사업비":"운영비"} 항목을 아직 안 넣으셨습니다.</p>`;
  const B = finSum(rows,"bud"), U = finSum(rows,"use"), pc = B ? U/B*100 : 0;
  return `<div style="padding:12px">
    <div style="background:#12365F;color:#fff;border-radius:12px;padding:12px">
      <div style="font-size:.7rem;opacity:.75">${Y.y}년 총회 승인 ${
        side==="biz"?"사업비":"운영비"} 예산</div>
      <div style="font-size:1.35rem;font-weight:800">${won2(B)}원</div>
      <div style="font-size:.7rem;opacity:.8;margin-top:2px">
        그중 ${won2(U)}원을 썼습니다 · 집행률 ${pc.toFixed(1)}%</div>
      <div style="height:8px;border-radius:8px;background:rgba(255,255,255,.22);
        margin-top:9px;overflow:hidden">
        <i style="display:block;height:100%;width:${Math.min(pc,100)}%;background:#7FB3F0"></i></div>
    </div>
    ${rows.slice(0,8).map(r => { const b=+r.bud||0, u=+r.use||0, rt=b?u/b*100:0;
      const sub=(r.sub||[]).filter(x=>(x.k||"").trim());
      return `<div style="border-top:1px solid #EEF1F5;padding:8px 2px">
        <div style="display:flex;justify-content:space-between;font-size:.8rem">
          <b>${r.k}${r.ko?`<span style="font-weight:400;color:var(--muted);
            font-size:.68rem"> · ${r.ko}</span>`:""}</b><b>${b?rt.toFixed(0)+"%":"—"}</b></div>
        <div style="height:6px;border-radius:6px;background:#EEF1F5;margin-top:4px;overflow:hidden">
          <i style="display:block;height:100%;width:${Math.min(rt,100)}%;background:#12365F"></i></div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;
          color:var(--muted);margin-top:3px">
          <span>${won2(u)} / ${won2(b)}원</span>
          <span>${sub.length?`자세히 ${sub.length}줄 ▾`:`남은 ${won2(b-u)}원`}</span></div>
      </div>`; }).join("")}
    ${rows.length > 8 ? `<p class="note" style="margin-top:8px">… 아래로 ${rows.length-8}개 더</p>` : ""}
  </div>`;
}

/* 운영비 · 사업비 표 */
function finTable(Y, tab){
  const rows = Y[tab] || [];
  const lab  = tab === "op" ? "운영비" : "사업비";
  const sumB = finSum(rows,"bud"), sumU = finSum(rows,"use");
  const chk  = tab === "op" ? Y.opChk : Y.bizChk;   /* 결산서에 적힌 합계 */
  const bad  = (+chk && +chk !== sumU);
  const anySub = rows.some(r => (r.sub||[]).length);
  return `
  <div class="box">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <b style="font-size:.9rem;color:var(--navy)">${lab} 예산 · 결산 대비표</b>
      ${anySub ? `<button class="finfold" style="margin-left:auto"
        onclick="finFoldAll(${FIN.sub === "all" ? "false" : "true"})">${
        FIN.sub === "all" ? "세목 모두 접기 ▴" : "세목 모두 펼치기 ▾"}</button>` : ""}
    </div>
    ${finImportBar(Y)}
    <p class="note" style="margin:4px 0 10px">결산서에 적힌 항목 이름 그대로 적으십시오.
      쉬운 말은 옆 칸에 넣으시면 조합원 화면에 작게 붙습니다.</p>

    ${/* ★★ 2026-09-23 — 표를 정돈했다.
         ① 세목은 접어 둔다 (평소에는 「세목 6 · 펼치기」 한 줄)
         ② 칸 테두리를 없애고 밑줄만 둔다 — 격자무늬가 사라진다
         ③ 줄마다 있던 [삭제] 큰 단추를 작은 ✕ 로
         ④ 합계는 남색 띠 */""}
    <div class="fintbl">
      <div class="finhd">
        <span>항목 (결산서 그대로)</span><span>쉬운 말</span>
        <span class="r">예산액</span><span class="r">집행액</span>
        <span class="r">집행률 · 잔액</span><span></span>
      </div>
      ${rows.map((r,i)=>{ const ai = !!r.ai, sub = r.sub || [];
        const open = FIN.sub === "all" || FIN.sub === i;
        const rt = (+r.bud) ? ((+r.use||0)/(+r.bud)*100) : null;
        const subU = finSum(sub,"use"), same = sub.length && subU === (+r.use||0);
        return `
      <div class="finrw ${ai?"ai":""}">
        <input value="${(r.k||"").replace(/"/g,"&quot;")}" placeholder="예) 인건비"
          onchange="finRow(${i},'k',this.value)">
        <input value="${(r.ko||"").replace(/"/g,"&quot;")}" placeholder="예) 직원 급여 등"
          onchange="finRow(${i},'ko',this.value)">
        <input class="r" value="${finCm(r.bud)}" inputmode="numeric"
          oninput="this.value=finCm(this.value)" onchange="finRow(${i},'bud',this.value)">
        <input class="r" value="${finCm(r.use)}" inputmode="numeric"
          oninput="this.value=finCm(this.value)" onchange="finRow(${i},'use',this.value)">
        <span class="fincalc">${rt === null ? `<b class="off">—</b>`
          : `<b>${rt.toFixed(1)}%</b>`}
          <span>${won((+r.bud||0)-(+r.use||0))}</span></span>
        <span class="finact">
          ${ai ? `<button class="btn sm" style="padding:3px 9px;font-size:.72rem"
                    onclick="finOK(${i})">확인</button>` : ""}
          ${(!sub.length && !open) ? `<button class="finx" title="세목을 넣습니다"
            onclick="finSubOpen(${i},true)">＋</button>` : ""}
          <button class="finx" title="이 줄을 지웁니다" onclick="finDelRow(${i})">✕</button>
        </span>
      </div>
      ${/* ★ 세목이 없고 펼치지도 않은 항목은 줄을 만들지 않는다 (2026-09-23).
           「세목 없음」이 항목마다 끼어 있으면 줄이 두 배가 된다.
           세목을 넣으실 때는 항목 줄 오른쪽 [＋세목] 을 누르신다. */""}
      ${(sub.length || open) ? `
      <div class="finsb">
        <div class="t">
          ${sub.length ? `세목 ${sub.length}` : `세목`}
          <button class="finfold" onclick="finSubOpen(${i},${open?"false":"true"})">
            · ${open ? "접기 ▴" : (sub.length ? "펼치기 ▾" : "넣기 ▾")}</button>
          ${sub.length ? `<span style="margin-left:7px;color:${same?"var(--ok)":"var(--amber)"}">
            ${same ? "✓ 세목 합 = 집행액" : `세목 합 ${won(subU)} · 집행액 ${won(+r.use||0)}`}</span>` : ""}
        </div>
        ${open ? `
        ${sub.map((x,j)=>`<div class="finsrw">
          <input value="${(x.k||"").replace(/"/g,"&quot;")}" placeholder="예) 상근임원 급여"
            onchange="finSub(${i},${j},'k',this.value)">
          <input class="r" value="${finCm(x.bud)}" inputmode="numeric" placeholder="예산"
            oninput="this.value=finCm(this.value)" onchange="finSub(${i},${j},'bud',this.value)">
          <input class="r" value="${finCm(x.use)}" inputmode="numeric" placeholder="집행"
            oninput="this.value=finCm(this.value)" onchange="finSub(${i},${j},'use',this.value)">
          <button class="finx" onclick="finDelSub(${i},${j})">✕</button>
        </div>`).join("")}
        <div class="finsrw"><button class="finfold" onclick="finAddSub(${i})">+ 세목 추가</button></div>
        ` : ""}
      </div>` : ""}`; }).join("")}
      <div class="fintot">
        <span>합계 <span style="font-weight:400;opacity:.72">· 저절로 계산</span></span>
        <span class="n">${won(sumB)}</span>
        <span class="n">${won(sumU)}</span>
        <span class="n">${sumB ? (sumU/sumB*100).toFixed(1)+"%" : "—"}</span>
        <span></span>
      </div>
    </div>

    <div style="display:flex;gap:10px;align-items:center;margin-top:11px;flex-wrap:wrap">
      <button class="btn ghost sm" style="padding:5px 13px;border-style:dashed"
        onclick="finAddRow()">+ 항목 추가</button>
      ${(+chk && !bad) ? `<span style="font-size:.78rem;color:var(--ok)">
        ✓ 결산서 합계(${won(+chk)})와 같습니다</span>` : ""}
    </div>

    <div class="f" style="margin-top:13px;max-width:420px">
      <label>결산서에 적힌 ${lab} 집행 합계 <span class="sm">· 맞게 옮겼는지 맞춰 봅니다</span></label>
      <input value="${finCm(chk)}" inputmode="numeric" placeholder="예) 311,708,520"
        oninput="this.value=finCm(this.value)" onchange="finChk('${tab}',this.value)">
    </div>
    ${bad ? `<div class="warn hard" style="margin-top:10px">
      <b>합계가 다릅니다</b>
      <p>적으신 항목을 더하면 <b>${won(sumU)}원</b>인데,
        결산서에는 <b>${won(+chk)}원</b>으로 적혀 있습니다.
        <br>차이 <b>${won(Math.abs(sumU - (+chk)))}원</b> · 빠뜨린 항목이 없는지 보십시오.</p></div>` : ""}
  </div>`;
}

/* 세목 펼치기 · 접기 (2026-09-23) */
function finSubOpen(i, on){ FIN.sub = on ? i : null; render(); }
function finFoldAll(on){ FIN.sub = on ? "all" : null; render(); }

/* 차입금 */
/* ★★ 결산서에서 불러오기 (2026-09-22)
   직원이 30줄을 손으로 옮기면 반드시 틀린다. AI 가 옮기고 **사람이 대조**한다.
   ★ AI 가 채운 칸은 ai:true 로 두고 주황으로 보인다. 확인하셔야 풀린다.
   ★ 확인이 남아 있으면 조합원께 공개되지 않는다. */
function finAiLeft(Y){
  const c = (rows) => (rows||[]).filter(r => r.ai).length;
  return c(Y.op) + c(Y.biz) + c(Y.loans) + (Y.cashAi ? 1 : 0);
}
function finImportBar(Y){
  const d = Y.docId ? ARC_DOCS.find(x => x.id === Y.docId) : null;
  const left = finAiLeft(Y);
  return `<div style="margin:9px 0 0;padding:10px 12px;border:1.5px solid var(--blue);
    border-radius:10px;background:#F7FBFF">
    <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
      <button class="btn sm ${FIN.busy||!d?"off":""}" onclick="finImport()">✦ 결산서에서 불러오기</button>
      <span style="font-size:.76rem;color:var(--muted)">${d
        ? "붙여 둔 원문을 AI 가 읽어 아래 칸을 채웁니다 · 40초쯤"
        : "먼저 아래에서 결산서 원문을 올리시거나 고르십시오"}</span>
    </div>
    ${left ? `<div class="warn" style="margin:10px 0 0">
      <b>AI 가 채운 칸이 ${left}개 있습니다 · 주황색</b>
      <p>원문과 맞춰 보시고 [확인]을 눌러 주십시오.
        <b>확인이 끝나야 조합원께 공개됩니다.</b></p>
      <button class="btn sm" style="margin-top:8px" onclick="finOKAll()">전부 확인</button>
    </div>` : ""}
  </div>`;
}

/* ★ 개인 이름으로 보이는 차입처 (2026-09-22)
   부채명세서에는 조합원 개인이 빌려준 것도 적혀 있다.
   총회 책자로 이미 나간 자료라 **그대로 두어도 된다.**
   다만 조합원 화면이 길어지고 이름이 그대로 나가므로 알려만 드린다.
   ★ 바꾸는 것은 직원이 정한다. 우리가 임의로 고치지 않는다. */
function finIsPerson(w){
  const t = String(w||"").trim();
  if(!t) return false;
  if(/주식회사|㈜|\(주\)|\(유\)|유한|법인|공사|공단|은행|캐피탈|저축|사무소|건축사|엔지니어링|컨설팅|산업|물산|보증|증권|조합|センター|외$/.test(t)) return false;
  return /^[가-힣A-Za-z()\s]{2,12}$/.test(t);
}
function finLoanBox(Y){
  const L = Y.loans || [];
  const sum = finSum(L,"amt");
  const per = L.map((x,i)=>({x,i})).filter(o => finIsPerson(o.x.who));
  return `
  <div class="box">
    <b style="font-size:.9rem;color:var(--navy)">차입금 현황</b>
    <p class="note" style="margin:4px 0 10px">조합원 화면에 합계 · 한 해 이자 · 건별 내역으로 나갑니다.
      이율과 갚기로 한 날도 함께 공개됩니다.</p>
    ${per.length ? `<div class="warn" style="margin:0 0 12px">
      <b>개인 이름으로 보이는 차입처가 ${per.length}건 있습니다</b>
      <p>${per.slice(0,6).map(o=>o.x.who).join(" · ")}${per.length>6?` 외 ${per.length-6}명`:""}<br>
        총회 책자에 이미 나간 자료라 <b>그대로 두셔도 됩니다.</b>
        조합 판단에 따라 아래 단추로 정리하실 수 있습니다.</p>
      <div style="margin-top:9px;display:flex;gap:7px;flex-wrap:wrap">
        <button class="btn ghost sm" style="padding:4px 11px;font-size:.74rem"
          onclick="finHideNames()">이름만 「조합원 개인」으로</button>
        <button class="btn ghost sm" style="padding:4px 11px;font-size:.74rem"
          onclick="finMergePersons()">${per.length}건을 한 줄로 합치기</button>
      </div></div>` : ""}
    <table class="tbl" style="font-size:.8rem">
      <thead><tr>
        <th style="width:20%">빌린 곳</th><th style="width:10%">종류</th>
        <th style="width:18%">금액</th><th style="width:10%">이율(%)</th>
        <th style="width:13%">빌린 날</th><th style="width:13%">갚기로 한 날</th>
        <th style="width:11%">쓴 곳</th><th style="width:5%"></th>
      </tr></thead>
      <tbody>
      ${L.map((r,i)=>`<tr class="${r.ai?"finai":""}${finIsPerson(r.who)?" finper":""}">
        <td><input value="${(r.who||"").replace(/"/g,"&quot;")}" placeholder="예) ○○저축은행"
          onchange="finLoan(${i},'who',this.value)"></td>
        <td><select onchange="finLoan(${i},'kind',this.value)">
          ${["장기","단기"].map(k=>`<option ${r.kind===k?"selected":""}>${k}</option>`).join("")}
        </select></td>
        <td><input value="${finCm(r.amt)}" inputmode="numeric" style="text-align:right"
          oninput="this.value=finCm(this.value)" onchange="finLoan(${i},'amt',this.value)"></td>
        <td><input value="${r.rate||""}" inputmode="decimal" style="text-align:right"
          onchange="finLoan(${i},'rate',this.value)"></td>
        <td><input value="${r.from||""}" placeholder="2021-06"
          onchange="finLoan(${i},'from',this.value)"></td>
        <td><input value="${r.due||""}" placeholder="인가 후 / 2026-03"
          onchange="finLoan(${i},'due',this.value)"></td>
        <td><input value="${(r.use||"").replace(/"/g,"&quot;")}" placeholder="사업비"

    })()}

    <p class="hint" style="margin-top:10px">
      ★ <b>체크</b>하시면 조합원 홈에 올라갑니다. 체크를 풀면 내려갑니다.<br>
      ★ <b>제목을 누르시면</b> 왼쪽 칸에서 수정하실 수 있습니다.<br>
      ★ 소식 탭에는 <b>체크와 상관없이 전부</b> 나갑니다.</p>
  </div></div>

  ${/* ═══════════════════════════════════════════════════════
       ★ 2026-09-18 — 목록을 오른쪽으로 옮겼다
       ───────────────────────────────────────────────────────
       예전에는 폰 미리보기 **아래**에 있었다.
       오른쪽이 텅 비어 있는데 목록은 저 아래에 있어,
       수정하시려면 한참 내려가야 했다.

       ★ 날짜순으로 둔다. 긴급을 위로 올리지 않는다.
         목록은 **찾는 자리**다. 긴급이 먼저면 방금 올린 것이
         어디 있는지 눈으로 좇아야 한다.

       ★ 줄을 누르면 곧바로 수정로 들어간다.
         [수정] 석 자를 겨누실 까닭이 없다.
       ═══════════════════════════════════════════════════════ */""}
  <p class="note">긴급 공지는 맨 위 주황 상자로, 나머지는 시간순으로 놓입니다.</p>`;
};

/* 폰 미리보기 — 지금 쓰고 있는 것을 맨 위에 얹어 보여 준다 */
function newsPhone(){
  const draft = (NW.t.trim() || NW.body.trim())
    ? [{id:0, tag:NW.tag, sub:NW.sub, kind:NW.kind, t:NW.t.trim()||"제목을 적어 주십시오",
        d:NW.d||new Date().toISOString().slice(0,10),
        body:NW.body, urgent:NW.urgent, draft:true}]
    : [];
  const rows = draft.concat(NEWS_LIST.filter(x => x.id !== NW.edit));
  /* ★ 최신이 맨 위로.
     날짜가 같으면 나중에 올린 것(번호가 큰 것)이 위다.
     작성 중인 것은 늘 맨 앞에 둔다. */
  const byNew = (a,b) => (b.draft?1:0)-(a.draft?1:0)
    || (a.d < b.d ? 1 : a.d > b.d ? -1 : (b.id||0)-(a.id||0));
  const urg  = rows.filter(x=>x.urgent).sort(byNew);
  const rest = rows.filter(x=>!x.urgent).sort(byNew);
  if(!rows.length) return `<p class="note" style="margin:0">등록된 소식이 없습니다.</p>`;

  /* ═══════════════════════════════════════════════════════════
     ★★★ 2026-09-19 — 쓰고 있는 것이 안 보이던 까닭 ★★★
     ───────────────────────────────────────────────────────────
     긴급 공지의 본문이 길면 미리보기를 가득 채운다.
     미리보기는 520px 에서 잘리므로 **쓰고 계신 것이 아래로 밀린다.**
     제목을 쳐도 오른쪽 폰에 아무 변화가 없어 「안 된다」고 여기신다.

     ★ 쓰고 계신 것은 **맨 위**에 둔다. 지금 보셔야 하는 것이다.
     ★ 그 아래에 「조합원 폰에서는 이 자리에 나옵니다」를 적어
       실제 차례와 다르다는 것을 알려 드린다.
     ═══════════════════════════════════════════════════════════ */
  const dr = rows.find(x => x.draft);
  const draftTop = dr ? `
  <div class="pn-draft">
    <div class="pn-dh">지금 쓰고 계신 것</div>
    ${dr.urgent ? `<div class="pn-urgent">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b>${newsTagHtml(dr)}긴급 공지</b>
        <span style="font-size:.72rem;color:#A85B33">${(dr.d||"").slice(5).replace("-",".")}</span></div>
      <p>${dr.t}</p>
      ${dr.body?`<div style="font-size:.78rem;color:#A85B33;line-height:1.7;margin-top:6px;
        white-space:pre-wrap;word-break:keep-all">${dr.body}</div>`:""}
    </div>` : `<div class="pn-row">
      <div class="pn-line"><span class="pn-dot"
        style="background:${NEWS_COLOR[dr.kind]||"var(--muted)"}"></span></div>
      <div class="pn-b">
        <div class="h"><em style="color:${NEWS_COLOR[dr.kind]||"var(--muted)"}">
          ${newsTagHtml(dr)}${dr.kind}</em>
          <span>${(dr.d||"").slice(5).replace("-",".")}</span></div>
        <div class="t">${dr.t}</div>
        ${dr.body?`<div class="d">${dr.body}</div>`:""}
        ${/* ★ 표 사진도 폰 미리보기에 보여 드린다 (2026-09-19).
             「본문 어디에 들어가는지」를 여기서 확인하신다. */""}
        ${(NW.pics||[]).map((p,i)=>`<div class="pnpic">
          <img data-nwadm="${p.path}" alt=""
            onerror="this.closest('.pnpic').classList.add('bad')">
          <span>[사진${i+1}]</span></div>`).join("")}
      </div></div>`}
    <p class="pn-dn">조합원 폰에서는
      ${dr.urgent ? "<b>맨 위 주황 상자</b>에 나옵니다"
        : "<b>날짜 차례</b>에 맞춰 아래에 놓입니다"}</p>
  </div>` : "";

  /* 아래 목록에서는 쓰고 계신 것을 뺀다. 두 번 보이면 헷갈린다. */
  const urg2  = urg.filter(x => !x.draft);
  const rest2 = rest.filter(x => !x.draft);

  return `
  ${draftTop}
  ${urg2.map(x=>`<div class="pn-urgent" ${x.draft
      ?'style="outline:2px dashed var(--amber);outline-offset:2px"'
      :`data-nwpick="${x.id}" style="cursor:pointer"`}>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <b>${newsTagHtml(x)}긴급 공지${x.draft?" · 작성 중":""}</b>
      <span style="font-size:.72rem;color:#A85B33">${(x.d||"").slice(5).replace("-",".")}</span></div>
    <p>${x.t}</p>
    ${/* ★ 본문이 길면 미리보기를 가득 채워 아래가 안 보인다 (2026-09-19).
         넉 줄까지만 보여 드린다. 조합원 폰에서는 다 나온다. */""}
    ${x.body?`<div class="pn-cut" style="font-size:.78rem;color:#A85B33;line-height:1.7;
      margin-top:6px;white-space:pre-wrap;word-break:keep-all">${x.body}</div>`:""}
    ${x.draft?"":`<div style="font-size:.71rem;color:#A85B33;margin-top:7px;
      border-top:1px dashed #E0BFA8;padding-top:6px">눌러서 수정 ›</div>`}</div>`).join("")}
  ${rest2.slice(0,5).map(x=>`<div class="pn-row">
    <div class="pn-line"><span class="pn-dot"
      style="background:${NEWS_COLOR[x.kind]||"var(--muted)"}"></span></div>
    <div class="pn-b" ${x.draft
        ?'style="outline:2px dashed var(--blue);outline-offset:3px;border-radius:6px"'
        :`data-nwpick="${x.id}" style="cursor:pointer"`}>
      <div class="h"><em style="color:${NEWS_COLOR[x.kind]||"var(--muted)"}">
        ${newsTagHtml(x)}${x.kind}${x.draft?" · 작성 중":""}</em>
        <span>${(x.d||"").slice(5).replace("-",".")}</span></div>
      <div class="t">${x.t}</div>
      ${x.body?`<div class="d">${x.body}</div>`:""}
      ${x.draft?"":`<div style="font-size:.71rem;color:var(--blue);margin-top:5px">
        눌러서 수정 ›</div>`}
    </div></div>`).join("")}
  ${rest2.length>5?`<p class="note" style="margin:9px 0 0;font-size:.73rem">
    앞의 5건만 보입니다. 나머지는 아래 목록에서 수정하실 수 있습니다.</p>`:""}`;
}

/* ★ 미리보기에서 바로 고치기 (2026-09-16)
   ───────────────────────────────────────────────────────────
   ★ 폰 미리보기가 바로 옆에 있는데, 고치려면 아래 표까지
     내려가서 [수정]을 찾아야 했다. 앞뒤가 맞지 않는다.

   ★ 보이는 것을 누르면 그것이 폼에 올라온다.
     보고 계시던 자리에서 손이 옮겨 가지 않는다.

   ★ 고치던 것이 있으면 먼저 여쭙는다.
     말없이 갈아 끼우면 치시던 글이 사라진다. */
function nwPick(id){
  const x = NEWS_LIST.find(y => y.id === +id); if(!x) return;
  if(NW.edit === +id){ nwCancel(); return; }   /* 같은 것을 또 누르면 그만둔다 */
  const dirty = (NW.t||"").trim() || (NW.body||"").trim() || (NW.sub||"").trim();
  if(dirty && !confirm(
     (NW.edit ? "수정하던 것이 있습니다.\n\n" : "쓰시던 글이 있습니다.\n\n")
   + "「" + x.t + "」\n을(를) 수정하시겠습니까?\n\n"
   + "★ 지금 쓰시던 내용은 사라집니다.")) return;
  nwEdit(+id);
}

/* ★ 글자를 칠 때마다 화면 전체를 다시 그리면 커서가 튄다.
   미리보기 자리만 갈아 끼운다. */
function nwLive(k, v){
  NW[k] = v;
  const box = document.querySelector('.pv-side .ph-b');
  if(box) box.innerHTML = newsPhone();
}
function nwKeep(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const t=g('nw-t'), d=g('nw-date'), b=g('nw-body'), k=g('nw-kind'), u=g('nw-sub');
  if(t!==null) NW.t=t; if(d!==null) NW.d=d; if(b!==null) NW.body=b; if(k!==null) NW.kind=k;
  /* ★ 한 줄 요약을 여기서 함께 읽는다.
     빠뜨리면 다시 그릴 때 치신 것이 소리 없이 지워진다.
     (2026-08-31 대의원 명단이 그렇게 사라졌다) */
  if(u!==null) NW.sub=u;
}
/* 딱지 — 같은 것을 다시 누르면 떼진다 */
function nwTag(k){ nwKeep(); NW.tag = (NW.tag === k) ? "" : k; render(); }
function nwSet(k,v){ nwKeep(); NW[k]=v; render(); }
function nwCancel(){ NW.edit=null; NW.t=""; NW.body=""; NW.d="";
  NW.urgent=false; NW.tag=""; NW.sub=""; NW.home=true;
  NW.pics=[]; render(); }

/* ═══════════════════════════════════════════════════════════
   ★★ 자료실에서 소식 만들기 (2026-09-21)
   ───────────────────────────────────────────────────────────
   검수를 마친 자료를 고르면, **확인된 질문과 답**으로 소식 초안을 짓는다.
   ★ AI 를 새로 부르지 않는다. 직원이 이미 원문과 대조해 확인한 문장이라
     틀린 숫자가 들어갈 길이 거의 없고 1초면 된다.
   ★ 올리는 것은 지금 쓰시던 [수정하고 알림 보내기] · [수정만 하기] 그대로다.
     따로 「완료」 단추를 만들지 않는다 — 문자 나가는 길이 둘이 되면 위험하다.
   ★ 홈 노출은 **꺼진 채**로 만든다. 홈은 네 줄뿐이라 자동으로 올리면 다른 소식이 밀린다.
   ═══════════════════════════════════════════════════════════ */
/* ═══════════ 연도별 결산 — 값 고치기 · 저장 (2026-09-22) ═══════════ */
function finInit(){ ACCT_FIN = ACCT_FIN || {years:[]}; ACCT_FIN.years = ACCT_FIN.years || []; return ACCT_FIN; }
function finCur(){
  finInit();
  let y = finYears().find(x => x.y === FIN.y) || finYears()[0];
  return y || null;
}
/* ★ 칸에는 1,234,567 로 보여 드리고 담을 때는 쉼표를 뗀다 (2026-09-22).
   0 이 몇 개인지 세다가 자리를 잘못 보시는 일이 많다. */
const finNum = v => String(v||"").replace(/[^0-9.]/g, "");
const finCm  = v => { const t = finNum(v); if(!t) return "";
  const [a,b] = t.split("."); 
  return (+a || 0).toLocaleString("ko-KR") + (b !== undefined ? "." + b : ""); };
function finAddYear(){
  finInit();
  const v = prompt("어느 해의 결산입니까?\n\n예) 2024", String(new Date().getFullYear() - 1));
  if(v === null) return;
  const y = parseInt(String(v).replace(/[^0-9]/g,""), 10);
  if(!y || y < 2000 || y > 2100){ alert("연도를 네 자리로 적어 주십시오. 예) 2024"); return; }
  if(ACCT_FIN.years.some(x => x.y === y)){ alert(`${y}년은 이미 있습니다.`); FIN.y = y; render(); return; }
  ACCT_FIN.years.push({y, open:false, op:[], biz:[], loans:[], cash:{}, note:
    "이 돈은 조합이 사업을 위해 빌린 돈입니다. 이자를 포함해 나중에 분양 수입과 분담금으로 갚습니다. "
    + "재개발 조합은 사업이 끝날 때까지 수입이 없어 손실이 쌓이는 것이 정상입니다.", docId:""});
  FIN.y = y; FIN.tab = "op"; render();
}
function finToggleOpen(){
  const Y = finCur(); if(!Y) return;
  if(Y.open === false && finAiLeft(Y)){
    alert(`AI 가 채운 칸 ${finAiLeft(Y)}개를 아직 확인하지 않으셨습니다.\n\n`
      + `원문과 맞춰 보시고 [확인]을 눌러 주십시오.\n`
      + `확인 안 된 숫자는 조합원께 내보내지 않습니다.`);
    return;
  }
  if(Y.open === false && !confirm(`${Y.y}년 결산을 조합원께 공개합니다.\n\n`
    + `총회에서 승인된 숫자가 맞는지 확인하셨습니까?`)) return;
  Y.open = (Y.open === false); render();
}
function finRow(i, f, v){
  const Y = finCur(); if(!Y) return;
  const rows = Y[FIN.tab] || []; if(!rows[i]) return;
  rows[i][f] = (f === "bud" || f === "use") ? finNum(v) : v;
  render();
}
function finAddRow(){ const Y = finCur(); if(!Y) return;
  (Y[FIN.tab] = Y[FIN.tab] || []).push({k:"", ko:"", bud:"", use:""}); render(); }
function finDelRow(i){ const Y = finCur(); if(!Y) return;
  if(!confirm("이 줄을 지울까요?")) return; Y[FIN.tab].splice(i,1); render(); }
function finChk(tab, v){ const Y = finCur(); if(!Y) return;
  Y[tab === "op" ? "opChk" : "bizChk"] = finNum(v); render(); }
function finLoan(i, f, v){ const Y = finCur(); if(!Y) return;
  if(!Y.loans[i]) return;
  Y.loans[i][f] = (f === "amt" || f === "rate") ? finNum(v) : v; render(); }
/* 이름만 가린다 — 금액과 줄은 그대로 */
function finHideNames(){
  const Y = finCur(); if(!Y) return;
  const P = (Y.loans||[]).filter(x => finIsPerson(x.who));
  if(!P.length) return;
  if(!confirm(`${P.length}건의 차입처 이름을 「조합원 개인」으로 바꿉니다.\n\n`
    + `금액과 줄 수는 그대로입니다. 되돌리시려면 손으로 다시 적으셔야 합니다.`)) return;
  P.forEach(x => { x.who = "조합원 개인"; });
  render();
}
/* 여러 줄을 한 줄로 합친다 */
function finMergePersons(){
  const Y = finCur(); if(!Y) return;
  const P = (Y.loans||[]).filter(x => finIsPerson(x.who));
  if(P.length < 2) return;
  const sum = finSum(P,"amt");
  const kinds = [...new Set(P.map(x => x.kind || "단기"))];
  if(kinds.length > 1){
    alert("장기와 단기가 섞여 있습니다.\n\n종류가 같은 것끼리만 합칠 수 있습니다.\n"
      + "먼저 종류를 맞추신 뒤 다시 눌러 주십시오.");
    return;
  }
  if(!confirm(`${P.length}건을 한 줄로 합칩니다.\n\n`
    + `「조합원 개인 ${P.length}명」 · ${won(sum)}원\n\n`
    + `★ 건별 금액은 사라집니다. 결산서 원문에는 그대로 남아 있습니다.`)) return;
  const first = P[0];
  first.who = `조합원 개인 ${P.length}명`;
  first.amt = String(sum);
  first.rate = ""; first.from = ""; first.due = first.due || "";
  Y.loans = (Y.loans||[]).filter(x => x === first || !finIsPerson(x.who));
  render();
}
function finAddLoan(){ const Y = finCur(); if(!Y) return;
  (Y.loans = Y.loans || []).push({who:"", kind:"장기", amt:"", rate:"", from:"", due:"", use:""}); render(); }
function finDelLoan(i){ const Y = finCur(); if(!Y) return;
  if(!confirm("이 차입금을 지울까요?")) return; Y.loans.splice(i,1); render(); }
function finCash(k, v){ const Y = finCur(); if(!Y) return;
  Y.cash = Y.cash || {}; Y.cash[k] = finNum(v); render(); }
function finNote(v){ const Y = finCur(); if(!Y) return; Y.note = v; }
/* 세목 */
function finSub(i,j,f,v){ const Y=finCur(); if(!Y) return;
  const r=(Y[FIN.tab]||[])[i]; if(!r||!r.sub||!r.sub[j]) return;
  r.sub[j][f] = (f==="k") ? v : finNum(v); render(); }
function finAddSub(i){ const Y=finCur(); if(!Y) return;
  const r=(Y[FIN.tab]||[])[i]; if(!r) return;
  (r.sub = r.sub || []).push({k:"",bud:"",use:""}); FIN.sub=i; render(); }
function finDelSub(i,j){ const Y=finCur(); if(!Y) return;
  const r=(Y[FIN.tab]||[])[i]; if(!r||!r.sub) return;
  r.sub.splice(j,1); render(); }
/* 확인 */
function finOK(i){ const Y=finCur(); if(!Y) return;
  const r=(Y[FIN.tab]||[])[i]; if(!r) return; delete r.ai; render(); }
function finOKLoan(i){ const Y=finCur(); if(!Y) return;
  if(!Y.loans[i]) return; delete Y.loans[i].ai; render(); }
function finOKAll(){
  const Y=finCur(); if(!Y) return;
  if(!confirm("AI 가 채운 칸을 모두 확인한 것으로 표시합니다.\n\n"
    + "원문과 맞춰 보셨습니까?\n★ 숫자가 한 번 조합원께 나가면 되돌리기 어렵습니다.")) return;
  ["op","biz","loans"].forEach(k => (Y[k]||[]).forEach(r => { delete r.ai; }));
  delete Y.cashAi;
  render();
}
/* ★★ 결산서를 AI 가 읽어 칸을 채운다 (2026-09-22) */
async function finImport(){
  const Y = finCur(); if(!Y) return;
  const d = Y.docId ? ARC_DOCS.find(x => x.id === Y.docId) : null;
  if(!d){ alert("먼저 결산서 원문을 올리시거나 자료실에서 골라 주십시오."); return; }
  const has = (Y.op||[]).length || (Y.biz||[]).length || (Y.loans||[]).length;
  if(has && !confirm("이미 적어 두신 것이 있습니다.\n\n"
    + "AI 가 읽은 것으로 **모두 바꿉니다.**\n그래도 부를까요?")) return;
  if(FIN.busy) return;
  FIN.busy = true; render();
  ARC_HOLD++;
  aiWaitOpen("AI 가 결산서를 읽는 중입니다",
    `「${d.title}」 · 운영비 · 사업비 · 차입금 표를 칸으로 옮깁니다 · 40초쯤 걸립니다`);
  try{
    const u = await hubFileUrl(d.path, 900);
    if(!u){ alert("원문을 열지 못했습니다."); return; }
    /* ★ 질문 뽑기와 같은 길로 부른다 (aiCall) — 3분에서 끊고, 까닭을 말로 돌려준다 */
    const r = await aiCall({url:u, mode:"fin", year:Y.y});
    if(!r || !r.ok || !r.fin){ alert((r && r.why) || "읽지 못했습니다."); return; }
    const F = r.fin;
    const rows = a => (Array.isArray(a) ? a : []).filter(x => String(x.k||"").trim())
      .map(x => ({k:String(x.k).trim(), ko:String(x.ko||"").trim(),
        bud:finNum(x.bud), use:finNum(x.use), ai:true,
        sub:(Array.isArray(x.sub)?x.sub:[]).filter(y=>String(y.k||"").trim())
          .map(y => ({k:String(y.k).trim(), bud:finNum(y.bud), use:finNum(y.use)}))}));
    Y.op  = rows(F.op);
    Y.biz = rows(F.biz);
    if(F.opChk)  Y.opChk  = finNum(F.opChk);
    if(F.bizChk) Y.bizChk = finNum(F.bizChk);
    Y.loans = (Array.isArray(F.loans)?F.loans:[]).filter(x => +finNum(x.amt))
      .map(x => ({who:String(x.who||"").trim(), kind:(x.kind==="단기"?"단기":"장기"),
        amt:finNum(x.amt), rate:finNum(x.rate), from:String(x.from||"").trim(),
        due:String(x.due||"").trim(), use:String(x.use||"").trim(), ai:true}));
    const C = F.cash || {};
    Y.cash = {bank:finNum(C.bank), unpaid:finNum(C.unpaid),
              loss:finNum(C.loss), deficit:finNum(C.deficit)};
    Y.cashAi = true;
    FIN.tab = "op";
    render();
    const gapOp  = Y.opChk  && finSum(Y.op,"use")  !== +Y.opChk;
    const gapBiz = Y.bizChk && finSum(Y.biz,"use") !== +Y.bizChk;
    alert(`읽었습니다.\n\n`
      + `운영비 ${Y.op.length}줄 · 사업비 ${Y.biz.length}줄 · 차입금 ${Y.loans.length}건\n\n`
      + (gapOp || gapBiz
         ? `★ 합계가 결산서와 다릅니다. AI 가 한 줄을 잘못 읽었을 수 있습니다.\n`
           + `  빨간 알림이 있는 탭을 보시고 고쳐 주십시오.`
         : `★ 합계는 결산서와 같습니다.`)
      + `\n★ 주황색 칸을 원문과 맞춰 보시고 [확인]을 눌러 주십시오.`);
  } finally {
    ARC_HOLD--; aiWaitClose(); FIN.busy = false; render();
  }
}
