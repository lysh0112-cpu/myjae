      </tr>`;}).join("")}
    <tr style="background:var(--mist)">
      <td><b>합계</b></td><td></td>
      <td class="mono" style="text-align:right;font-weight:800;padding-right:12px">${wonKR(total)}</td>
      <td class="mono" style="text-align:right;font-weight:800">${wonKR(used)}</td>
      <td class="mono" style="text-align:right">${wonKR(total-used)}</td>
      <td style="text-align:right"><b>${total?(used/total*100).toFixed(1):0}%</b></td>
    </tr>
    </tbody></table>
  </div>
  <p class="note"><b>지금 수정하시는 것은 제${rev.ord}차 금액입니다.</b>
    총회에서 새로 의결하신 것이면 금액을 덮어쓰지 마시고
    아래에서 <b>새 차수</b>를 만드십시오. 앞 차수가 그대로 남아야
    "언제 얼마였다"에 답할 수 있습니다.</p>

  ${diff && diff.list.length?`
  <div class="sec">직전 차수 대비 <em>제${diff.prev.ord}차 → 제${rev.ord}차</em></div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th>예산과목</th><th style="width:140px">제${diff.prev.ord}차</th>
      <th style="width:140px">제${rev.ord}차</th><th style="width:130px">증감</th>
    </tr></thead><tbody>
    ${diff.list.map(d=>`<tr>
      <td><b>${d.item}</b></td>
      <td class="mono" style="text-align:right;color:var(--muted)">${wonKR(d.from)}</td>
      <td class="mono" style="text-align:right;font-weight:700">${wonKR(d.to)}</td>
      <td class="mono" style="text-align:right;font-weight:700;
        color:${d.gap>0?'var(--amber)':'var(--blue)'}">
        ${d.gap>0?"+":""}${wonKR(d.gap)}</td></tr>`).join("")}
    <tr style="background:var(--mist)"><td><b>총액</b></td><td></td><td></td>
      <td class="mono" style="text-align:right;font-weight:800;
        color:${diff.gap>0?'var(--amber)':'var(--blue)'}">
        ${diff.gap>0?"+":""}${wonKR(diff.gap)}</td></tr>
    </tbody></table>
  </div>`:""}

  <div class="sec">예산 의결 이력 <em>${revs.length}차수 · 지워지지 않습니다</em></div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th style="width:56px">차수</th><th style="width:64px">구분</th>
      <th style="width:88px">총회일</th><th>회의 · 안건</th>
      <th style="width:130px">예산 총액</th><th style="width:110px">증감</th>
    </tr></thead><tbody>
    ${revs.slice().reverse().map(r=>{
      const d = budDiff(r), now = r.id === rev.id;
      return `<tr style="background:${now?'#F0F5FB':'#fff'}">
      <td><b>제${r.ord}차</b>${now?`<span class="tiny" style="display:block;color:var(--navy)">지금 적용</span>`:""}</td>
      <td><span class="pill ${BUDGET_KIND[r.kind].cls}">${r.kind}</span></td>
      <td class="mono" style="color:var(--muted)">${r.date}</td>
      <td>${r.meet} ${r.agenda}
        ${r.note?`<span class="tiny" style="display:block">${r.note}</span>`:""}
        ${r.decKey?`<span class="pill p-ok" style="margin-top:3px">의결 기록 연결됨</span>`
          :`<span class="tiny" style="display:block;color:var(--amber)">의결 기록에 없음</span>`}</td>
      <td class="mono" style="text-align:right;font-weight:700">${wonKR(budTotalOf(r.plan))}</td>
      <td class="mono" style="text-align:right;color:${!d?'var(--muted)':d.gap>0?'var(--amber)':'var(--blue)'}">
        ${d?(d.gap>0?"+":"")+wonKR(d.gap):"—"}</td>
    </tr>`;}).join("")}
    </tbody></table>
  </div>

  <div class="box" style="margin-top:12px">
    <b style="font-size:.84rem">총회에서 새로 의결하셨으면</b>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px">
      <button class="btn sm pickbtn" onclick="budPickDec()">의결 기록에서 가져오기</button>
      <span class="tiny">날짜 · 회의 · 안건번호를 그대로 가져옵니다</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;
      padding-top:12px;border-top:1px dashed var(--line)">
      <span class="tiny">직접 적으실 때</span>
      <button class="btn ghost sm pickbtn" onclick="budNew('변경')">예산 변경 차수 추가</button>
      <button class="btn ghost sm pickbtn" onclick="budNew('추인')"
        style="color:var(--amber);border-color:#F3C7AC">추인 차수 추가</button>
    </div>
  </div>

  <p class="note"><b>의결 기록에 먼저 올리시는 편이 낫습니다.</b>
    예산 안건은 어차피 [의결 기록] 화면에 올라갑니다.
    거기서 가져오면 총회일 · 안건번호를 두 번 치지 않으셔도 되고,
    두 화면의 숫자가 어긋날 일도 없습니다.
    가결된 안건만 가져올 수 있고, 한 의결로 차수를 두 번 만들 수는 없습니다.</p>

  <div class="warn"><b>변경과 추인은 다릅니다</b>
    <p><b>변경</b> — 집행하기 전에 총회에서 예산을 늘리거나 과목 사이를 옮기는 것입니다.
       정상적인 순서입니다.<br>
       <b>추인</b> — 이미 집행한 것을 총회에서 뒤늦게 인정하는 것입니다.
       집행일이 총회일보다 앞섭니다. 긴급한 사정이 있으면 실무상 그렇게 하지만,
       <b>기록에 추인이라고 남아 있어야</b> 나중에 다투지 않습니다.
       변경이라고 적어 두면 감사에서 집행일과 총회일이 어긋난 것이 그대로 드러납니다.</p></div>

  <p class="note">이 이력은 <b>예산 대비 집행</b> 파일에 그대로 담겨 구청에 나갑니다.
    구청이 "이 예산은 무슨 근거로 세웠느냐"고 물을 때 답이 됩니다.</p>`;
}

/* ═══ 갈래 ② 조합원 공개 ═══════════════════════════════════
   ★ 예산과 집행 대기 사이에 둔다.
     예산을 정하고 나면 「이게 조합원께 어떻게 보이나」가 바로 궁금해진다.
     집행을 입력하기 전에 한 번 눈으로 보고 넘어가게 한다.

   ★ 목업이 아니라 실제 자료다.
     acctPubData() 가 지금 화면의 EXPENSE · BUDGET_PLAN 에서 계산한다.
     따로 만들면 직원이 보는 숫자와 조합원이 보는 숫자가 어긋난다.

   ★ 담기지 않는 칸을 함께 보여 준다.
     "무엇이 안 나가는지"를 직원이 알아야 조합원 문의에 답할 수 있다. */
function actPublic(rows){
  const P = acctPubData();
  const B = BUDGET.reduce((a,k)=>a + (P.budget[k]||0), 0);
  const U = BUDGET.reduce((a,k)=>a + (P.used[k]||0), 0);
  const W = BUDGET.reduce((a,k)=>a + (P.plan[k]||0), 0);
  const L = Math.max(B - U - W, 0);
  const pc = v => B ? v/B*100 : 0;

  /* 도넛 — 집행액 기준 과목 비율 */
  const share = BUDGET.filter(k=>(P.used[k]||0) > 0)
    .map(k=>({k, v:P.used[k], r:U ? P.used[k]/U*100 : 0}))
    .sort((a,b)=>b.v-a.v);
  let acc = 0;
  const stops = share.map((s,i)=>{ const f = acc; acc += s.r;
    return `${PUB_RAMP[i%PUB_RAMP.length]} ${f.toFixed(2)}% ${acc.toFixed(2)}%`; }).join(",");
  const bars = BUDGET.slice().sort((a,b)=>(P.used[b]||0)-(P.used[a]||0));

  /* ★ 시연 모드로 그려진 것은 「올린 것」이 아니다.
     demo 표시가 붙어 있으면 아직 서버에 아무것도 없다는 뜻이다. */
  const isDemo = !!(ACCT_PUB && ACCT_PUB.demo);
  const pubbed = (ACCT_PUB && !isDemo) ? ACCT_PUB.updated : null;
  const stale  = !ACCT_PUB || isDemo
    || JSON.stringify(ACCT_PUB.used) !== JSON.stringify(P.used)
    || JSON.stringify(ACCT_PUB.budget) !== JSON.stringify(P.budget);

  return `
  <div class="sec" style="margin-top:0">조합원 앱에 이렇게 보입니다
    <em>지금 이 화면의 숫자로 그린 것입니다</em></div>

  ${stale?`<div class="warn" style="margin-top:0"><b>앱에 올린 것과 지금 숫자가 다릅니다</b>
    <p>${pubbed?`마지막으로 올리신 것은 <b>${pubbed}</b>입니다. `
      :isDemo?`아직 한 번도 올리지 않으셨습니다. 지금 조합원 폰에는 <b>예시 자료</b>가
        「예시입니다」라는 안내와 함께 나오고 있습니다. `
      :`아직 한 번도 올리지 않으셨습니다. `}
       아래 <b>조합원 앱에 올리기</b>를 누르셔야 조합원 폰에 반영됩니다.
       올리기 전까지 조합원은 예전 숫자를 봅니다.</p></div>`
   :`<div class="box" style="border:1.5px solid var(--ok);margin-bottom:16px">
      <div class="row"><span>조합원 앱</span>
        <b style="color:var(--ok)">지금 숫자와 같습니다 · ${pubbed} 올림</b></div></div>`}

  <div class="pv-wrap">
    <div class="pv-main">
      <div class="sec" style="margin-top:0">앱에 담기는 것</div>
      <div class="box" style="padding:0;overflow:hidden">
        <table><thead><tr>
          <th style="width:150px">칸</th><th>담기는 값</th>
        </tr></thead><tbody>
          <tr><td><b>예산과목별</b></td><td>예산액 · 집행액 · 건수 · 집행 예정</td></tr>
          <tr><td><b>의결 근거</b></td><td>총회일 · 회의 · 안건번호 · 차수</td></tr>
          <tr><td><b>건별</b></td><td>집행일 · 적요 · 예산과목 · 금액 <span class="tiny">(네 칸뿐)</span></td></tr>
        </tbody></table>
      </div>

      <div class="sec">앱에 담기지 <em>않는</em> 것</div>
      <div class="box" style="padding:0;overflow:hidden">
        <table><thead><tr>
          <th style="width:150px">칸</th><th>왜 안 담는가</th>
        </tr></thead><tbody>
          <tr><td><b>거래처 실명</b><span class="tiny" style="display:block">payee</span></td>
            <td>거래 상대방의 영업 정보입니다</td></tr>
          <tr><td><b>사업자등록번호</b><span class="tiny" style="display:block">bizNo</span></td>
            <td>개인정보입니다</td></tr>
          <tr><td><b>원천세</b><span class="tiny" style="display:block">wht · whtManual</span></td>
            <td>상대방의 소득 정보입니다</td></tr>
          <tr><td><b>계정코드 · 기장상태</b><span class="tiny" style="display:block">acct · book</span></td>
            <td>내부 관리값이라 조합원이 알 이유가 없습니다</td></tr>
          <tr><td><b>담당 직원 이름</b><span class="tiny" style="display:block">bookBy</span></td>
            <td>개인 사안입니다</td></tr>
          <tr><td><b>날인대장번호</b><span class="tiny" style="display:block">seal</span></td>
            <td>인감 관리 기록이라 감사 대상입니다</td></tr>
        </tbody></table>
      </div>

      <div class="warn"><b>가리는 것이 아니라 보내지 않습니다</b>
        <p>지출 원장을 통째로 올리고 화면에서만 가리면
           <b>개발자 도구를 여는 순간 그대로 보입니다.</b>
           조합원 앱으로 가는 자료에는 위 칸들이 애초에 들어가지 않습니다.
           올리기를 누르셔도 거래처 이름은 서버에 담기지 않습니다.</p></div>

      <button class="btn sm pickbtn" style="margin-top:14px" onclick="pubSend()">
        조합원 앱에 올리기</button>
      <p class="note">누르시면 조합원 폰에 20초 안에 반영됩니다.
        올린 뒤에도 이 화면에서 언제든 다시 올리실 수 있습니다.</p>
    </div>

    <div class="pv-side">
      <div class="cap"><span>조합원 폰 미리보기</span><span>${P.items.length}건 반영</span></div>
      <div class="phone">
        <div class="ph-h"><b>조합 회계 · 예산</b><em>집행 완료 기준</em></div>
        <div class="ph-b" style="background:#F5F7FA;padding:12px 11px">

          <div style="background:#fff;border-radius:16px;padding:14px 15px;
            box-shadow:0 1px 2px rgba(11,31,58,.04),0 8px 22px rgba(11,31,58,.06)">
            <div style="font-size:.7rem;color:var(--muted)">${P.year}년도 총회 승인 예산</div>
            <div style="font-size:1.5rem;font-weight:800;letter-spacing:-.5px;margin-top:1px">
              ${eokKR(B)}<span style="font-size:.78rem;font-weight:700;color:var(--muted);margin-left:3px">원</span></div>
            <div style="font-size:.72rem;color:var(--muted);margin-top:4px">
              그중 ${eokKR(U)}원을 썼습니다</div>
            <div style="display:flex;height:20px;border-radius:7px;overflow:hidden;
              margin:12px 0 9px;background:#EDF1F6">
              <i style="display:block;height:20px;width:${pc(U)}%;background:#12365F"></i>
              <i style="display:block;height:20px;width:${pc(W)}%;background:#9BB2CC"></i>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;font-size:.72rem">
              ${[["집행 완료","#12365F",U],["집행 예정","#9BB2CC",W],["남은 예산","#EDF1F6",L]]
                .map(([l,c,v])=>`<div style="display:flex;align-items:center;gap:7px">
                  <i style="width:9px;height:9px;border-radius:2px;background:${c};
                    ${c==="#EDF1F6"?"border:1px solid #DCE3EC;":""}flex:none"></i>${l}
                  <span style="margin-left:auto;color:var(--muted)">${pc(v).toFixed(1)}%</span>
                  <b class="mono" style="min-width:48px;text-align:right;font-size:.72rem">${eokKR(v)}</b>
                </div>`).join("")}
            </div>
          </div>

          ${share.length?`
          <div style="font-size:.76rem;font-weight:800;margin:16px 0 8px">무엇에 쓰였나</div>
          <div style="background:#fff;border-radius:16px;padding:14px;
            box-shadow:0 1px 2px rgba(11,31,58,.04),0 8px 22px rgba(11,31,58,.06);
            display:flex;gap:12px;align-items:center">
            <div style="width:96px;height:96px;flex:none;border-radius:50%;position:relative;
              background:conic-gradient(${stops})">
              <div style="position:absolute;inset:20px;background:#fff;border-radius:50%"></div>
              <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
                <div><b style="display:block;font-size:.95rem;font-weight:800">${pc(U).toFixed(1)}%</b>
                  <span style="font-size:.62rem;color:var(--muted)">예산 대비</span></div></div>
            </div>
            <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-size:.72rem">
              ${share.slice(0,6).map((s,i)=>`<div style="display:flex;align-items:center;gap:6px">
                <i style="width:8px;height:8px;border-radius:2px;flex:none;
                  background:${PUB_RAMP[i%PUB_RAMP.length]}"></i>${s.k}
                <b style="margin-left:auto;color:var(--muted);font-size:.7rem">${s.r.toFixed(0)}%</b>
              </div>`).join("")}
            </div>
          </div>`:""}

          <div style="font-size:.76rem;font-weight:800;margin:16px 0 8px">과목별 예산과 집행</div>
          <div style="background:#fff;border-radius:16px;overflow:hidden;
            box-shadow:0 1px 2px rgba(11,31,58,.04),0 8px 22px rgba(11,31,58,.06)">
            ${bars.map(k=>{
              const b = P.budget[k]||0, u = P.used[k]||0, w = P.plan[k]||0, n = P.cnt[k]||0;
              const r = b ? u/b*100 : 0;
              return `<div style="padding:11px 13px;border-bottom:1px solid var(--line)">
                <div style="display:flex;align-items:baseline;gap:7px">
                  <b style="font-size:.76rem;font-weight:750">${k}</b>
                  <span class="mono" style="margin-left:auto;font-size:.74rem;font-weight:800;
                    color:${r>100?'var(--amber)':'var(--ink)'}">${b?r.toFixed(0)+"%":"—"}</span></div>
                <div style="height:8px;background:#EDF1F6;border-radius:99px;margin:8px 0 5px;overflow:hidden">
                  <i style="display:block;height:8px;border-radius:99px;width:${Math.min(r,100)}%;
                    background:${r>100?'var(--amber)':'#12365F'}"></i></div>
                <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted)">
                  <span class="mono" style="font-size:.68rem">${eokKR(u)} / ${eokKR(b)}원</span>
                  <span>${n?n+"건":"집행 없음"}${w?` · 예정 ${eokKR(w)}`:""}</span></div>
              </div>`;}).join("")}
          </div>

          ${P.basis?`
          <div style="font-size:.76rem;font-weight:800;margin:16px 0 8px">이 예산은 언제 정했나</div>
          <div style="background:#fff;border-radius:16px;padding:12px 14px;
            box-shadow:0 1px 2px rgba(11,31,58,.04),0 8px 22px rgba(11,31,58,.06);font-size:.72rem">
            ${[["의결 총회",P.basis.date],["회의",P.basis.meet],["안건",P.basis.agenda],
               ["차수",`제${P.basis.ord}차 · ${P.basis.kind}`]]
              .map(([l,v])=>`<div style="display:flex;justify-content:space-between;gap:10px;
                padding:6px 0;border-bottom:1px dashed var(--line)">
                <span style="color:var(--muted)">${l}</span><b>${v}</b></div>`).join("")}
          </div>`:""}

          <div style="background:#E7F8F1;border:1px solid #A9E0CD;border-radius:14px;
            padding:11px 13px;margin-top:14px">
            <b style="display:block;font-size:.73rem;font-weight:800;color:#0A6E51">
              조합이 유리한 것만 골라 보일 수 없습니다</b>
            <p style="font-size:.68rem;color:#12805F;line-height:1.6;margin-top:3px">
              과목을 감추거나 특정 건을 빼는 기능이 아예 없습니다.
              예산을 수정하려면 총회 의결이 있어야 하고, 수정 이력도 지워지지 않습니다.</p>
          </div>

          <div style="background:#fff;border-radius:14px;padding:11px 13px;margin-top:10px;
            box-shadow:0 1px 2px rgba(11,31,58,.04),0 8px 22px rgba(11,31,58,.06);
            display:flex;align-items:center;gap:8px">
            <b style="font-size:.74rem;font-weight:750">건별 내역 보기</b>
            <span style="margin-left:auto;font-size:.7rem;color:var(--blue);font-weight:700">
              ${P.items.length}건 펼치기</span></div>
          <p style="font-size:.66rem;color:var(--muted);line-height:1.55;margin-top:9px">
            거래처 이름 · 사업자등록번호 · 담당자 이름은 앱에 담지 않습니다.
            확인이 필요하시면 조합 사무실에 정보공개를 청구하실 수 있습니다.</p>

        </div>
      </div>
      <p class="note" style="font-size:.75rem">건별 내역은 접혀 있습니다.
        대시보드에서는 그래프만 보이고, 눌러야 펼쳐집니다.</p>
    </div>
  </div>`;
}

/* ═══ 갈래 ③ 지출 · 집행 대기 ══════════════════════════════
   ★ 결재가 났다고 돈이 나간 것은 아니다.
     실제로 지급한 뒤에 「집행 완료」를 눌러야 집계에 들어간다.
   ★ 여기서 계정과목을 붙여 둔다.
     집행 완료를 누른 뒤에 붙이려면 다시 찾아 들어가야 한다. */
function actWait(wait, nc){
  const fresh = wait.filter(x=>x.acct === "");
  return `
  ${fresh.length?`<div class="warn" style="margin-top:0"><b>전자결재에서 ${fresh.length}건이 계정과목 없이 넘어왔습니다</b>
    <p>조합장 최종 승인이 난 지출 품의입니다.
       계정과목이 없으면 세무사무소 전달 자료에서 <b>빠지거나 잡비로 밀립니다.</b>
       아래에서 지정해 주십시오.</p></div>`:""}

  <div class="sec">집행 대기 <em>결재는 났지만 돈이 아직 안 나간 건</em></div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th style="width:118px">품의서</th>
      <th style="width:210px">계정과목 <span style="font-weight:400">(세무 기장용)</span></th>
      <th>지출 내용 · 지급처</th>
      <th style="width:64px">과세</th>
      <th style="width:116px">금액</th>
      <th style="width:92px">처리</th>
    </tr></thead><tbody>
    ${wait.length ? wait.map(x=>`<tr style="background:#FFFBF7">
      <td class="mono" style="color:var(--navy);font-weight:700">${x.doc}
        <span class="tiny" style="display:block">${x.item} · ${x.approved} 승인</span></td>
      <td>${acctPick(x)}</td>
      <td>${x.title}
        <span class="tiny" style="display:block">${x.payee}${x.bizNo?" · "+x.bizNo:""}</span></td>
      <td>${eviPill(x)}<span class="tiny" style="display:block">${x.tax}</span></td>
      <td class="mono" style="text-align:right;font-weight:700">${wonKR(x.amount)}</td>
      <td><button class="btn sm pickbtn" style="padding:5px 11px;font-size:.76rem"
        onclick="markPaid('${x.id}')">집행 완료</button></td>
    </tr>`).join("")
    : `<tr><td colspan="6" style="color:var(--muted)">집행 대기 중인 건이 없습니다.</td></tr>`}
    </tbody></table>
  </div>

  <p class="note"><b>돈이 실제로 나간 날짜를 적으십시오.</b>
    결재일을 집행일로 적으면 나중에 통장과 대조했을 때 맞지 않습니다.
    계정과목을 고르지 않으면 집행 완료가 되지 않습니다.</p>

  ${nc.length?`<div class="sec">계정과목이 없는 건 <em>집행 완료된 것 포함 ${nc.length}건</em></div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th style="width:118px">품의서</th><th style="width:210px">계정과목</th>
      <th>지출 내용</th><th style="width:116px">금액</th><th style="width:80px">상태</th>
    </tr></thead><tbody>
    ${nc.map(x=>`<tr>
      <td class="mono" style="color:var(--navy)">${x.doc}<span class="tiny" style="display:block">${x.item}</span></td>
      <td>${acctPick(x)}</td>
      <td>${x.title}<span class="tiny" style="display:block">${x.payee}</span></td>
      <td class="mono" style="text-align:right">${wonKR(x.amount)}</td>
      <td><span class="pill ${x.status==="paid"?"p-ok":"p-wait"}">
        ${x.status==="paid"?"집행완료":"집행대기"}</span></td>
    </tr>`).join("")}
    </tbody></table>
  </div>`:`<div class="box" style="margin-top:16px;border:1.5px solid var(--ok)">
    <div class="row"><span>계정과목 미지정</span>
      <b style="color:var(--ok)">없습니다 · 전달 준비가 되었습니다</b></div></div>`}

  <div class="sec">계정과목 코드 <em>${ACCT.length}개 · 세무사무소 표준</em></div>
  <div class="box" style="padding:0;overflow:hidden;max-height:300px;overflow-y:auto">
    <table><thead><tr>
      <th style="width:70px">구분</th><th style="width:64px">코드</th>
      <th>계정과목</th><th style="width:150px">표준 대응</th>
      <th style="width:76px">집행 건수</th>
    </tr></thead><tbody>
    ${ACCT.map(a=>{ const n = EXPENSE.filter(x=>x.acct===a.c).length;
      return `<tr>
      <td><span class="pill ${a.g==="사업비"?"p-blue":"p-wait"}">${a.g}</span></td>
      <td class="mono" style="font-weight:700">${a.c}</td>
      <td>${a.n}</td>
      <td style="color:var(--muted);font-size:.78rem">${a.std}</td>
      <td style="text-align:right" class="mono">${n?n+"건":"—"}</td></tr>`;}).join("")}
    </tbody></table>
  </div>

  <div class="warn"><b>예산과목과 계정과목은 다른 축입니다</b>
    <p>「총회비」한 과목 안에 <b>826 도서인쇄비 · 824 운반비 · 831 지급수수료</b>가 섞입니다.
       예산은 총회가 승인한 통제 단위라 바꿀 수 없고,
       계정과목은 재무제표를 만드는 단위라 세분해야 합니다.
       그래서 예산과목이 아니라 <b>지출 건마다</b> 계정코드를 고릅니다.
       사업비 5xx 는 표준 판관비 코드에 없는 정비사업 고유 계정이라
       조합 자체 코드로 두고 「표준 대응」을 함께 적었습니다.</p></div>`;
}

/* ═══ 갈래 ② 집행 상세 · 기장 처리 ═════════════════════════
   ★ 직원이 가장 오래 머무는 화면이다.
   ★ 기장 완료된 건은 계정과목이 잠긴다.
     장부에 올라간 뒤에 계정이 바뀌면 세무사 쪽 숫자와 어긋난다. */
function actBook(rows){
  const view = ABTAB === "all" ? rows
    : ABTAB === "todo" ? rows.filter(x=>x.book !== "booked")
    : rows.filter(x=>x.book === ABTAB);
  const undo = EXPENSE.filter(x=>x.undoLog);

  return `
  <div class="sec">집행 상세 · 기장 처리 <em>${exPeriod()}</em></div>

  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    ${[["all","전체",rows.length],
       ["todo","기장 미완료",rows.filter(x=>x.book!=="booked").length],
       ["sent","전달함",rows.filter(x=>x.book==="sent").length],
       ["booked","기장완료",rows.filter(x=>x.book==="booked").length]]
      .map(([k,l,n])=>`<button class="pickbtn" onclick="ABTAB='${k}';render()"
        style="border:1px solid ${ABTAB===k?'var(--navy)':'var(--line)'};
        background:${ABTAB===k?'#F0F5FB':'#fff'};color:var(--ink);
        border-radius:8px;padding:6px 13px;font-size:.79rem;font-weight:700">
        ${l} ${n}</button>`).join("")}
  </div>

  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th style="width:30px"><input type="checkbox" onchange="abAll(this.checked)"
        style="width:15px;height:15px;accent-color:#12365F;cursor:pointer"></th>
      <th style="width:76px">집행일</th>
      <th style="width:150px">계정과목</th>
      <th>적요 · 증빙</th>
      <th style="width:92px">공급가액</th>
      <th style="width:66px">부가세</th>
      <th style="width:96px">원천세</th>
      <th style="width:92px">실지급액</th>
      <th style="width:86px">기장</th>
    </tr></thead><tbody>
    ${view.length ? view.map(x=>{
      const t = splitAmt(x), lock = x.book === "booked";
      return `<tr class="${ABOOK_SEL[x.id]?'':''}"
        style="background:${ABOOK_SEL[x.id]?'#F0F5FB':lock?'#FBFDFC':'#fff'}">
      <td>${lock
        ? `<button onclick="abUnlock('${x.id}')" title="기장 완료 · 눌러서 고르기"
             style="color:${ABOOK_SEL[x.id]?'var(--amber)':'#C6CEDA'};font-size:.9rem">🔒</button>`
        : `<input type="checkbox" ${ABOOK_SEL[x.id]?"checked":""}
             onchange="ABOOK_SEL['${x.id}']=this.checked;render()"
             style="width:15px;height:15px;accent-color:#12365F;cursor:pointer">`}</td>
      <td class="mono" style="color:var(--muted)">${(x.paid||"").slice(5)}
        <span class="tiny mono" style="display:block;color:var(--navy)">${x.doc}</span></td>
      <td>${lock
        ? `<b class="mono">${x.acct}</b>
           <span class="tiny" style="display:block">${acctName(x.acct)}</span>`
        : acctPick(x)}</td>
      <td>${x.title}
        <span class="tiny" style="display:block">${x.payee}${x.bizNo?" · "+x.bizNo:""}</span>
        <span style="display:block;margin-top:3px">${eviPill(x)}
          <span class="pill ${x.tax==="불공제"?"p-warn":"p-wait"}">${x.tax}</span></span></td>
      <td class="mono" style="text-align:right">${wonKR(t.supply)}</td>
      <td class="mono" style="text-align:right;color:${x.tax==="불공제"?"var(--amber)":"var(--muted)"}">
        ${t.vat?wonKR(t.vat):"—"}</td>
      <td class="mono" style="text-align:right;color:${t.wht?"var(--amber)":"var(--muted)"}">
        ${t.wht?`− ${wonKR(t.wht)}<span class="tiny" style="display:block">${WHT[x.wht].n}</span>`:"—"}</td>
      <td class="mono" style="text-align:right;font-weight:700">${wonKR(t.net)}</td>
      <td>${bkPill(x.book)}
        ${x.bookBatch?`<span class="tiny" style="display:block">${x.bookBatch}</span>`:""}</td>
    </tr>`;}).join("")
    : `<tr><td colspan="9" style="color:var(--muted)">해당하는 건이 없습니다.</td></tr>`}
    </tbody></table>
  </div>

  <div class="box" style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <b style="font-size:.84rem">고른 ${abSel().length}건을</b>
    <button class="btn ghost sm pickbtn" onclick="abSend()">세무사무소 전달함으로</button>
    <button class="btn sm pickbtn" onclick="abBook()">기장 완료로 표시</button>
    <button class="btn ghost sm pickbtn" onclick="abUndo()"
      style="color:var(--amber);border-color:#F3C7AC">기장 되돌리기</button>
  </div>

  ${undo.length?`<div class="sec">기장을 되돌린 기록 <em>지워지지 않습니다</em></div>
  <div class="box">
    ${undo.map(x=>`<div class="row">
      <span class="mono">${x.doc}</span><b style="font-weight:400">${x.undoLog}</b></div>`).join("")}
  </div>`:""}

  <div class="warn"><b>왜 두 단계인가</b>
    <p>「전달함」은 자료를 넘겼다는 뜻이고 「기장완료」는 세무사가 실제로 장부에 올렸다는 뜻입니다.
       한 단계만 두면 <b>보냈는데 처리되지 않은 건</b>을 찾을 수 없어 분기 말에 통째로 누락됩니다.
       기장 완료된 건은 계정과목이 잠깁니다. 수정해야 하면 되돌리기를 하고 사유를 적으십시오.
       되돌린 기록은 지워지지 않습니다. 회계 감사에서 "누가 언제 왜 고쳤느냐"에 답할 것이 있어야 합니다.</p></div>`;
}

/* ═══ 갈래 ③ 세무 신고 기초 ════════════════════════════════
   ★ 세무사무소에 넘기기 전에 눈으로 보는 자리다.
     넘기고 나서 틀린 것을 찾으면 세무사가 다시 손봐야 하고 비용이 든다. */
function actTax(rows, T){
  /* 증빙 유형별 */
  const evi = {};
  rows.forEach(x=>{ evi[x.evi] = (evi[x.evi]||0) + 1; });
  const bad = rows.filter(x=>!EVI_OK.includes(x.evi));
  /* 원천세 소득구분별 */
  const wm = {};
  rows.filter(x=>x.wht).forEach(x=>{ const t = splitAmt(x), k = WHT[x.wht].n;
    wm[k] = wm[k] || {n:0, pay:0, it:0, lt:0};
    wm[k].n++; wm[k].pay += x.amount; wm[k].it += t.it; wm[k].lt += t.lt; });
  const nodeduct = rows.filter(x=>x.tax==="불공제");
  const ndv = expTotals(nodeduct);

  const R = (l, v, note, strong) => `<div class="row"
    style="${strong?"background:var(--mist);margin:0 -18px;padding:11px 18px":""}">
    <span style="${strong?"color:var(--ink);font-weight:800":""}">${l}</span>
    <b class="mono" style="font-size:${strong?".95rem":".86rem"};
      ${strong?"font-weight:800":""}">${v}
      ${note?`<span class="tiny" style="display:block;text-align:right;font-family:inherit">${note}</span>`:""}</b></div>`;

  return `
  <div class="sec">세무 신고 기초 <em>${exPeriod()} · 집행 완료 ${rows.length}건</em></div>

  <div class="box">
    ${R("공급가액", wonKR(T.supply), "재무제표 · 손익계산서로 갑니다")}
    ${R("부가가치세", wonKR(T.vat), "그중 공제 대상 " + wonKR(T.deduct))}
    ${R("청구 합계", wonKR(T.amount), "", 1)}
    ${R("소득세 (원천)", "− " + wonKR(T.it), "다음 달 10일까지 신고 · 납부")}
    ${R("지방소득세", "− " + wonKR(T.lt), "소득세의 10%")}
    ${R("실지급액", wonKR(T.net), "통장에서 실제로 나간 돈", 1)}
  </div>

  <div class="warn" style="background:#F8FAFD;border-color:#C6CEDA">
    <b style="color:var(--navy)">셋은 가는 신고서가 각각 다릅니다</b>
    <p style="color:#41576B">
      <b style="color:var(--navy)">공급가액</b> → 재무제표 · 결산서<br>
      <b style="color:var(--navy)">부가가치세</b> → 부가가치세 신고서 (1월 · 7월)<br>
      <b style="color:var(--navy)">소득세 · 지방소득세</b> → 원천징수이행상황신고서 (다음 달 10일)<br>
      한 칸에 담아 보내면 세무사가 되돌려 나눠야 하고 그 과정에서 틀립니다.</p></div>

  <div class="sec">부가세 — 공제 · 불공제</div>
  <div class="box" style="padding:0;overflow:hidden">
    <table><thead><tr>
      <th>구분</th><th style="width:80px">건수</th>
      <th style="width:130px">공급가액</th><th style="width:120px">세액</th>
    </tr></thead><tbody>
      <tr><td><b>공제 대상</b>
        <span class="tiny" style="display:block">과세 · 적격증빙</span></td>
        <td>${rows.filter(x=>x.tax==="과세").length}건</td>
        <td class="mono" style="text-align:right">${wonKR(expTotals(rows.filter(x=>x.tax==="과세")).supply)}</td>
        <td class="mono" style="text-align:right;font-weight:700;color:var(--ok)">${wonKR(T.deduct)}</td></tr>
      <tr><td><b>불공제</b>
        <span class="tiny" style="display:block">접대성 경비 등 · 세액은 있으나 공제받지 못합니다</span></td>
        <td>${nodeduct.length}건</td>
        <td class="mono" style="text-align:right">${wonKR(ndv.supply)}</td>
        <td class="mono" style="text-align:right;color:var(--amber)">${wonKR(ndv.vat)}</td></tr>
      <tr><td><b>면세</b>
        <span class="tiny" style="display:block">임차료 · 우편료 등 · 세액이 없습니다</span></td>

function expPreset(k){

/* ★ 의결 기록에서 예산 차수를 만든다 (2026-08-22)
   ★ 예산 안건은 어차피 의결 기록에 올라간다.
     날짜 · 회의 · 안건번호를 거기서 그대로 가져오면
     같은 것을 두 번 치지 않아도 되고, 두 곳의 숫자가 어긋나지 않는다.

   ★ 부결된 안건으로는 차수를 만들 수 없다.
     부결된 예산으로 집행하면 그것이 바로 문제가 된다.

   ★ 한 의결로 두 번 만들 수 없다.
     같은 총회 안건이 차수 둘로 들어가면 예산이 두 번 늘어난다. */
const decKeyOf = d => `${d.date}|${d.no2}|${(d.title||"").trim()}`;
const decUsed  = d => BUDGET_REV.some(r=>r.decKey === decKeyOf(d));

/* 예산과 관련된 안건인지 낱말로 본다 */
const DEC_BUD = /예산|추인|증액|감액|사업비|운영비/;

/* ★★ 의결 근거를 손으로 넣는다 (2026-09-23)
   조합원 예산 화면의 「이 예산은 언제 정했나」에 그대로 나간다.
   ★ 금액은 여기서 못 고친다. 금액은 과목별 칸에서 고친다.
   ★ 마지막 차수만 고친다. */
function budBasisEdit(){
  const rev = budRev(); if(!rev){ alert("등록된 예산이 없습니다."); return; }
  const list = budList();
  if(list.length && list[list.length-1].id !== rev.id){
    alert("마지막 차수만 고칠 수 있습니다."); return;
  }
  const ask = (t, v, h) => {
    const r = prompt(t + (h ? `\n\n${h}` : ""), v || "");
    return r === null ? null : String(r).trim();
  };
  const d = ask("의결 총회 날짜", rev.date, "예) 2026-03-20\n총회에서 이 예산을 의결한 날입니다.");
  if(d === null) return;
  if(d && !/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert("날짜는 2026-03-20 처럼 적어 주십시오."); return; }
  const m = ask("회의 이름", rev.meet, "예) 2026년 정기총회 · 2026년 제1차 임시총회");
  if(m === null) return;
  const a = ask("안건", rev.agenda, "예) 제2호 안건\n없으면 비워 두셔도 됩니다.");
  if(a === null) return;
  const n = ask("적요 (없어도 됩니다)", rev.note, "예) 2026년도 사업비 · 운영비 예산안");
  if(n === null) return;
  const k = ask("구분", rev.kind,
    "원안 · 변경 · 추인 중 하나로 적어 주십시오.\n\n"
    + "원안 — 총회에서 예산을 먼저 정한 것\n"
    + "변경 — 집행 전에 예산을 늘리거나 옮긴 것\n"
    + "추인 — 이미 쓴 것을 총회에서 뒤늦게 인정한 것");
  if(k === null) return;
  if(!BUDGET_KIND[k]){ alert("원안 · 변경 · 추인 중 하나로 적어 주십시오."); return; }

  rev.date = d; rev.meet = m; rev.agenda = a; rev.note = n; rev.kind = k;
  rev.by = (S && S.name) || rev.by; rev.at = new Date().toISOString().slice(0,10);
  budSync(); render();
  if(typeof acctPublish !== "undefined") acctPublish(S.name);   /* 조합원 화면에 바로 */
  alert("고쳤습니다.\n\n조합원 예산 화면의 「이 예산은 언제 정했나」에 바로 나갑니다.");
}

function budNewFromDec(d, kind){
  const list = budList(), prev = list[list.length-1];
  const ord = (prev ? prev.ord : 0) + 1;
  BUDGET_REV.push({
    id: "BR-" + (BUDGET_REV.length + 1),
    year: BUDGET_YEAR, ord, kind,
    date: d.date,
    meet: (d.meeting || "").trim() || "총회",
    agenda: d.no2 ? `제${d.no2}호 안건` : "",
    note: (d.title || "").trim(),
    by: (S && S.name) || "직원",
    at: new Date().toISOString().slice(0,10),
    decKey: decKeyOf(d),
    plan: Object.assign({}, prev ? prev.plan : {})
  });
  budSync();
  ACT = "budget";
  alert(`제${ord}차 · ${kind} 차수를 만들었습니다.\n\n`
    + `${d.date} ${d.meeting} ${d.no2?`제${d.no2}호 안건`:""}\n${d.title}\n\n`
    + `직전 차수 금액을 그대로 옮겨 왔습니다.\n`
    + `예산 갈래에서 바뀐 과목만 수정하십시오.`);
  render();
}

/* 원안 · 변경 · 추인 중 무엇인지 묻는다.
   ★ 셋은 뜻이 다르고, 잘못 적으면 감사에서 집행일과 총회일이
     어긋난 것이 그대로 드러난다. */
function budKindAsk(d){
  const list = budList();
  const first = list.length === 0;
  if(first){
    if(!confirm(`이 의결로 ${BUDGET_YEAR}년도 예산 원안을 만듭니다.\n\n`
      + `${d.date} ${d.meeting}\n${d.title}\n\n계속하시겠습니까?`)) return;
    budNewFromDec(d, "원안"); return;
  }
  /* 이 총회일보다 먼저 집행된 건이 있으면 추인 쪽을 먼저 권한다 */
  const early = EXPENSE.filter(x=>x.status==="paid" && x.paid && x.paid < d.date).length;
  const k = prompt(
    `이 의결이 어느 것입니까? 번호를 적어 주십시오.\n\n`
    + `1  변경 — 집행하기 전에 예산을 늘리거나 과목 사이를 옮기는 것\n`
    + `2  추인 — 이미 집행한 것을 뒤늦게 인정하는 것 (집행일이 총회일보다 앞섭니다)\n\n`
    + (early ? `참고 · 이 총회일(${d.date}) 이전에 집행된 건이 ${early}건 있습니다.\n\n` : "")
    + `${d.title}`, "1");
  if(k === null) return;
  const kind = String(k).trim() === "2" ? "추인" : "변경";
  budNewFromDec(d, kind);
}

/* 의결 기록에서 골라 온다 — 예산 갈래의 버튼 */
function budPickDec(){
  if(typeof DECISION === "undefined" || !DECISION.length){
    alert("올라온 의결 기록이 없습니다.\n\n[의결 기록] 화면에서 총회 결과를 먼저 올려 주십시오."); return; }
  const cand = DECISION
    .filter(d => decCalc(d).ok)          /* 가결된 것만 */
    .filter(d => !decUsed(d))            /* 아직 안 쓴 것만 */
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  if(!cand.length){
    alert("가져올 만한 의결이 없습니다.\n\n"
      + "가결된 안건 중 아직 예산 차수로 쓰지 않은 것만 나옵니다.\n"
      + "부결된 안건으로는 차수를 만들 수 없습니다."); return; }
  const lines = cand.map((d,i)=>
    `${i+1}. ${d.date} ${d.meeting||""} ${d.no2?`제${d.no2}호`:""} · ${d.title}`).join("\n");
  const pick = prompt(`어느 의결로 차수를 만들까요? 번호를 적어 주십시오.\n\n${lines}`, "1");
  if(pick === null) return;
  const d = cand[(+pick||0) - 1];
  if(!d){ alert("목록에 있는 번호를 적어 주십시오."); return; }
  budKindAsk(d);
}

/* 의결 기록을 올린 직후에 여쭙는다 — 그 자리에서 끝내는 편이 낫다 */
function budAskFromDec(rec){
  if(!decCalc(rec).ok) return;                    /* 부결은 묻지 않는다 */
  if(!DEC_BUD.test(rec.title || "")) return;      /* 예산 안건이 아니면 묻지 않는다 */
  if(decUsed(rec)) return;
  if(!confirm(`예산 안건으로 보입니다.\n\n${rec.title}\n\n`
    + `이 의결로 예산 차수를 만들까요?\n`
    + `날짜와 안건 번호를 그대로 가져오므로 다시 치지 않으셔도 됩니다.\n\n`
    + `나중에 예산 갈래에서 만드셔도 됩니다.`)) return;
  budKindAsk(rec);
}

/* ── 조합원 앱에 올리기 ────────────────────────────────
   ★ 담기는 것을 먼저 보여 주고 확인을 받는다.
     한 번 올라가면 조합원 폰에 바로 나간다. */
function pubSend(){
  const P = acctPubData();
  const B = BUDGET.reduce((a,k)=>a+(P.budget[k]||0),0);
  const U = BUDGET.reduce((a,k)=>a+(P.used[k]||0),0);
  if(!confirm(`조합원 앱에 올립니다.\n\n`
    + `예산 ${wonKR(B)}원 · 집행 ${wonKR(U)}원 · 건별 ${P.items.length}건\n`
    + `의결 근거 ${P.basis?`${P.basis.date} ${P.basis.meet} ${P.basis.agenda}`:"미등록"}\n\n`
    + `거래처 이름 · 사업자등록번호 · 원천세 · 계정코드 · 기장상태는\n`
    + `담기지 않습니다.\n\n올리시겠습니까?`)) return;
  acctPublish((S && S.name) || "직원");
  alert(`올렸습니다.\n\n조합원 폰에 20초 안에 반영됩니다.\n`
    + `숫자를 수정하시면 여기서 다시 올려 주십시오.`);
  render();
}

/* ── 예산 ─────────────────────────────────────────────
   ★ 지금 보고 있는 차수의 금액만 고친다.
     앞 차수는 이미 그것을 근거로 집행한 것이 있어 잠긴다. */
function budSet(k, v){
  const r = budRev(); if(!r) return;
  r.plan[k] = Number(v)||0;
  budSync(); render();
}
/* 예전 이름 — 다른 화면에서 부를 수 있어 남겨 둔다 */
function setBudget(k, v){ budSet(k, v); }

/* ★ 새 차수는 직전 차수를 복사해서 시작한다.
   빈 칸에서 시작하면 안 바뀐 과목까지 다시 치셔야 하고, 그러다 틀린다.
   근거(총회일 · 회의 · 안건)는 반드시 받는다.
   구청이 "무슨 근거로 세운 예산이냐"를 묻는데 빈 칸이면 답이 없다. */
function budNew(kind){
  const list = budList(), prev = list[list.length-1];
  const label = kind === "추인" ? "추인" : kind === "변경" ? "변경" : "원안";

  if(kind === "추인"){
    if(!confirm("추인 차수를 만듭니다.\n\n추인은 이미 집행한 것을 총회에서 뒤늦게 인정하는 것입니다.\n집행일이 총회일보다 앞섭니다.\n\n앞으로 쓸 예산을 늘리시는 것이라면 「변경」이 맞습니다.\n계속하시겠습니까?")) return;
  }

  const date = prompt(`${label} 차수 · 총회 개최일을 적어 주십시오.\n(YYYY-MM-DD)`,
    new Date().toISOString().slice(0,10));
  if(date === null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date.trim())){
    alert("날짜는 2026-09-10 처럼 적어 주십시오."); return; }

  const meet = prompt("회의 이름을 적어 주십시오.\n(예 · 2026년 제1차 임시총회)",
    "2026년 제1차 임시총회");
  if(meet === null || !meet.trim()){ alert("회의 이름을 적으셔야 합니다."); return; }

  const agenda = prompt("안건 번호를 적어 주십시오.\n(예 · 제3호 안건)", "제3호 안건");
  if(agenda === null || !agenda.trim()){ alert("안건 번호를 적으셔야 합니다."); return; }

  const note = prompt("적요를 적어 주십시오. (비워 두셔도 됩니다)\n무엇 때문에 예산을 고쳤는지 한 줄이면 됩니다.",
    kind === "추인" ? "기집행분 추인" : "");
  if(note === null) return;

  const ord = (prev ? prev.ord : 0) + 1;
  BUDGET_REV.push({
    id: "BR-" + (BUDGET_REV.length + 1),
    year: BUDGET_YEAR, ord, kind: label,
    date: date.trim(), meet: meet.trim(), agenda: agenda.trim(),
    note: note.trim(),
    by: (S && S.name) || "직원",
    at: new Date().toISOString().slice(0,10),
    plan: Object.assign({}, prev ? prev.plan : {})
  });
  budSync();
  alert(`제${ord}차 · ${label} 차수를 만들었습니다.\n\n직전 차수 금액을 그대로 옮겨 왔습니다.\n바뀐 과목만 수정하십시오.\n앞 차수는 그대로 남습니다.`);
  render();
}

/* ★ 계정과목을 고르지 않으면 집행 완료가 되지 않는다.
   나중에 붙이려면 다시 찾아 들어가야 하고, 그러다 빠뜨린다. */
function markPaid(id){
  const x = EXPENSE.find(e=>e.id===id); if(!x) return;
  if(!x.acct){
    alert("계정과목을 먼저 골라 주십시오.\n계정코드가 없으면 세무사무소 전달 자료에서 빠집니다.");
    return;
  }
  const now=new Date(), z=v=>String(v).padStart(2,"0");
  const today=`${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  const d = prompt(`돈이 실제로 나간 날짜를 적어 주십시오.\n(집계에는 이 날짜가 남습니다)`, today);
  if(d===null) return;
  x.paid = d.trim() || today; x.status = "paid";
  alert(`집행 완료 처리했습니다 (시연)\n${x.doc} · ${x.acct} ${acctName(x.acct)} · ${wonKR(x.amount)}원`);
  render();
}

/* ── 기장 처리 ─────────────────────────────────────────
   ★ 기록은 지우지 않는다. 되돌린 것도 남긴다. */
function abAll(on){
  expRows().forEach(x=>{ if(x.book !== "booked") ABOOK_SEL[x.id] = on; });
  render();
}
function abSend(){
  const ids = abSel();
  if(!ids.length){ alert("전달할 건을 골라 주십시오."); return; }
  const bad = ids.filter(id=>!EXPENSE.find(x=>x.id===id).acct);
  if(bad.length){
    alert(`계정과목이 지정되지 않은 건이 ${bad.length}건 있습니다.\n먼저 지정해 주십시오.`); return; }
  const batch = prompt(
    "전달 회차를 적어 주십시오.\n세무사무소가 어느 달 자료인지 알 수 있어야 합니다.",
    `${EXQ.to.slice(0,7)}월분`);
  if(batch===null) return;
  const now=new Date(), z=v=>String(v).padStart(2,"0");
  const today=`${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  ids.forEach(id=>{ const x = EXPENSE.find(e=>e.id===id);
    x.book="sent"; x.bookBatch = batch.trim() || `${EXQ.to.slice(0,7)}월분`;
    x.bookAt = today; x.bookBy = (S && S.name) || "직원"; });
  ABOOK_SEL = {};
  alert(`${ids.length}건을 전달함으로 옮겼습니다 (시연)\n회차 · ${batch}`);
  render();
}
function abBook(){
  const ids = abSel();
  if(!ids.length){ alert("표시할 건을 골라 주십시오."); return; }
  if(!confirm(`${ids.length}건을 기장 완료로 표시합니다.\n표시한 뒤에는 계정과목을 고칠 수 없습니다.\n계속하시겠습니까?`)) return;
  const now=new Date(), z=v=>String(v).padStart(2,"0");
  const today=`${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  ids.forEach(id=>{ const x = EXPENSE.find(e=>e.id===id);
    x.book="booked"; x.bookAt = today; x.bookBy = (S && S.name) || "직원"; });
  ABOOK_SEL = {}; render();
}
function abUndo(){
  const ids = abSel().filter(id=>EXPENSE.find(x=>x.id===id).book !== "none");
  if(!ids.length){
    alert("되돌릴 건을 골라 주십시오.\n기장 완료된 건은 잠겨 있어 체크할 수 없습니다.\n「기장완료」 탭에서 확인하십시오."); return; }
  const why = prompt("되돌리는 사유를 적어 주십시오.\n이 기록은 지워지지 않고 남습니다.", "");
  if(!why || !why.trim()){ alert("사유를 적으셔야 되돌릴 수 있습니다."); return; }
  const now=new Date(), z=v=>String(v).padStart(2,"0");
  const today=`${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  ids.forEach(id=>{ const x = EXPENSE.find(e=>e.id===id);
    x.undoLog = `${BOOK_ST[x.book].n} → 미처리 · ${today} · ${(S&&S.name)||"직원"} · ${why.trim()}`;
    x.book="none"; x.bookBatch=""; });
  ABOOK_SEL = {}; render();
}

/* ★ 기장 완료된 건은 잠겨 체크가 안 된다.
   되돌리려면 이 버튼으로 잠금을 푼다. 사유는 그대로 묻는다. */
function abUnlock(id){
  const x = EXPENSE.find(e=>e.id===id); if(!x) return;
  ABOOK_SEL[x.id] = true; render();
}

/* ★ 결재 현황 — app_state("docs") 에서 실제로 세어 온다.
   숫자를 손으로 적어 두면 실제와 어긋나고, 어긋난 순간 아무도 안 믿는다.

   ★ 칸 이름을 approval.html 의 실제 문서에 맞춘다.
       status   pending | approved | rejected
       drafted  기안일
       line[]   단계별 결재 기록 · status 가 wait 인 첫 단계가 지금 대기 자리
     이름을 잘못 적으면 조용히 0건으로 나온다. 오류도 안 난다. */
const SITE_URL = "da-ara.pages.dev";
function apCount(){
  const D = (typeof hubLoad !== "undefined") ? hubLoad("docs", null) : null;
  if(!Array.isArray(D)) return {wait:0, done:0, back:0, list:[]};
  const wait = D.filter(x => x.status === "pending");
  const stepOf = x => {
    const l = (x.line || []).find(v => v.status === "wait");
    return l ? l.step : "";
  };
  return {
    wait: wait.length,
    done: D.filter(x => x.status === "approved").length,
    back: D.filter(x => x.status === "rejected").length,
    list: wait
      .slice()
      .sort((a,b) => (b.drafted||"").localeCompare(a.drafted||""))
      .slice(0, 8)
      .map(x => ({no:x.no || "", title:x.title || "",
                  date:x.drafted || "", step:stepOf(x)}))
  };
}

/* ★ 쓰던 글을 먼저 담는다 (2026-09-20 · 110절)
   ───────────────────────────────────────────────────────
   20초 갱신은 「칸에 커서가 있으면」 미룬다. 그런데 글을 쓰다가
   **칸 밖을 한 번 누르시면** 커서가 빠진다. 그때 갱신이 돌면
   아직 저장 안 한 글이 화면을 다시 그리며 지워졌다.
   ★ 갱신으로 다시 그리기 **직전에만** 부른다.
     render() 안에 넣으면 안 된다 — 단추가 값을 바꾸고 render() 할 때
     칸의 옛 값으로 되덮어 버린다(자주 쓰는 말 단추가 그렇게 죽는다). */
function keepAll(){
  const L = [
    () => arcKeep(), () => idxKeep(), () => nwKeep(), () => agKeep(),
    () => deskKeep(), () => cfmKeep(), () => papKeep(), () => dcKeep(),
    () => ofKeep(), () => svKeep(),
    () => { if(typeof mkKeep === "function") mkKeep(); }   /* zone-admin.js */
  ];
  L.forEach(f => { try{ f(); }catch(e){} });
}

   조합장이 휴대폰에서 승인하셔도 직원 화면은 그대로였다.

   ★ 창이 막히면 그 사실을 알려 준다.

     운영자 콘솔에서 겪은 것과 같은 종류의 사고다. */
function apOpen(go){
  try {
    localStorage.setItem("daara_ap_pass",
      JSON.stringify({name:S.name || "", at:Date.now()}));
  } catch(e){ /* 저장이 막혀 있으면 그냥 로그인 창이 뜬다 */ }
  const w = window.open("approval.html?go=" + encodeURIComponent(go), "_blank");
  if(!w){
    alert("새 창이 열리지 않았습니다.\n\n"
      + "브라우저가 팝업을 막고 있습니다.\n"
      + "주소창 오른쪽 끝의 막힘 표시를 누르고\n"

      + "그래도 안 되시면 주소창에 직접 치셔도 됩니다.\n"
      + SITE_URL + "/approval");
  }
}

/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════ */

/* ★ 조합원 찾기 — 이름 · 번호 · 지번 아무거나
   조합원이 찾아와서 "저 614-54요" 라고 하지 "18번이요" 라고 하지 않는다.
   조합원번호를 아예 안 쓰는 조합도 많다. 지번으로 찾는 것이 실무다.

   이미 등록된 명단이므로 버튼을 누를 이유가 없다.
   치는 대로 후보를 보여주고 고르게 한다. */
function findMembers(q){
  /* ★ 한글을 골라서 본다 (2026-08-22 밤 · hub.js hubNorm 참고).
     「서우은」이 여섯 조각(ㅅㅓㅇㅜㅇㅡㄴ)으로 들어오면 못 찾았다.
     찾는 쪽과 찾히는 쪽 양쪽 다 골라야 한다. */
  const N = (typeof hubNorm !== "undefined")
    ? hubNorm : (v => String(v||"").normalize("NFC").trim());
  const K = (typeof hubKeyOf !== "undefined")
    ? hubKeyOf : (v => N(v).replace(/\s+/g,"").toLowerCase());

  const s = N(q);
  if(s.length < 1) return [];
  const sk = K(q);
  const R = (typeof ROSTER!=="undefined") ? ROSTER : [];
  const num = s.replace(/\D/g,"");
  const hit = [];
  R.forEach(r => {
    let why = "";
    if(N(r.name).indexOf(s) >= 0) why = "이름";
    else if(num && String(r.no).padStart(4,"0").indexOf(num) >= 0) why = "번호";
    else if(typeof propsOf !== "undefined"
      && propsOf(r.no).some(p => K(p.addr).indexOf(sk) >= 0)) why = "지번";
    else if(r.addr && K(r.addr).indexOf(sk) >= 0) why = "지번";
    if(why) hit.push({r, why});
  });
  return hit.slice(0, 8);
}

/* ── 표준 서식 ───────────────────────────────────────────
   ★ 서식에는 예시 두 줄만 넣는다.
     실제 조합원 자료가 담긴 파일이 돌아다니는 것 자체가 사고다. */
/* ★ 한 조합원이 필지를 여럿 가진 경우가 흔하다.
   물건마다 줄을 나누고, 앞 칸(조합원번호·성명·연락처·대표)은 비워 둔다.
   비워 두면 위 칸과 같다는 뜻이다. 엑셀에서 익숙한 방식이다.

   시트를 두 장으로 나누면 조합원번호를 맞춰 적다가 실수가 난다.
   한 장으로 받고, 나누는 일은 시스템이 한다. */
const RCOLS = [
  ["조합원번호","필수","숫자. 물건이 여럿이면 첫 줄에만 적고 다음 줄은 비웁니다"],
  ["성명","필수","본인확인 때 대조합니다"],
  ["연락처","필수","010으로 시작. 하이픈은 자동 정리"],
  ["대표조합원","선택","공유 물건은 대표 1인만 Y. 의결권이 갈립니다"],
  ["지번","필수","미아동 000-0 형식. 물건마다 한 줄"],
  ["동","선택","재건축만 · 101동 형식. 재개발은 비웁니다"],
  ["호수","선택","재건축만 · 502호 형식. 재개발은 비웁니다"],
  ["지목","선택","대 · 도로 · 구거 · 잡종지 등"],
  ["대지면적","선택","㎡ 단위 숫자. 재건축은 대지권 지분, 건물만 소유면 0"],
  ["지분","선택","1/1 · 1/2 등. 공유일 때 반드시 적으십시오"],
  ["소유구분","선택","토지+건물 · 토지만 · 건물만"],
  ["건물면적","선택","㎡ 단위 숫자"]
];

/* ── 파일 읽기 · 검증 ───────────────────────────────────── */
function rosterPick(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".csv,text/csv";
  inp.onchange = () => { const f = inp.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { RUP.file = f.name; rosterParse(String(rd.result)); };
    rd.readAsText(f, "utf-8"); };
  inp.click();
}

function rosterParse(text){
  const lines = text.replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length){ alert("빈 파일입니다."); return; }
  const head = lines[0].split(",").map(x=>x.trim());
  const idx = {};
  RCOLS.forEach(c => { idx[c[0]] = head.indexOf(c[0]); });
  const missing = RCOLS.filter(c=>c[1]==="필수" && idx[c[0]] < 0).map(c=>c[0]);
  if(missing.length){
    alert("표준 서식이 아닙니다.\n빠진 열 : " + missing.join(", ")
      + "\n\n열 이름을 바꾸지 마십시오. 순서는 바뀌어도 됩니다.");
    return;
  }

  const R = (typeof ROSTER!=="undefined") ? ROSTER : [];
  const people = [];          /* 조합원 */
  const props  = [];          /* 소유 물건 */
  const errs=[], warns=[], dups=[];
  const seenNo = {}, seenPh = {};
  const jibunOwner = {};      /* 같은 지번의 지분 합을 본다 */
  let cur = null;             /* 앞 줄에서 이어지는 조합원 */

  lines.slice(1).forEach((ln, i) => {
    const c = ln.split(",").map(x=>x.trim());
    const g = k => idx[k] >= 0 ? (c[idx[k]] || "") : "";
    const rowNo = i + 2;
    const no    = g("조합원번호").replace(/\D/g,"");
    const name  = g("성명");
    const ph    = g("연락처").replace(/\D/g,"");
    const repY  = (g("대표조합원") || "").toUpperCase() !== "N";
    const jibun = g("지번");
    const dong  = g("동");
    const ho    = g("호수");
    const jimok = g("지목") || "대";
    const area  = Number(g("대지면적")) || 0;
    const share = g("지분") || "1/1";
    const kind  = g("소유구분") || "토지+건물";
    const bldg  = Number(g("건물면적")) || 0;

    const bad = m => errs.push({row:rowNo, no:no||(cur?String(cur.no):"(빈칸)"),
      name:name||(cur?cur.name:"—"), phone:g("연락처")||"—", msg:m});
    const warn = m => warns.push({row:rowNo, no:no||(cur?String(cur.no):""),
      name:name||(cur?cur.name:""), phone:g("연락처")||"", msg:m});

    /* ── 앞 칸이 비어 있으면 위 줄의 조합원에 이어 붙는다 ── */
    if(!no && !name && !ph){
      if(!cur){ bad("조합원번호가 없습니다. 첫 줄에는 조합원 정보를 적어 주십시오."); return; }
    } else {
      if(!no)   bad("필수 항목 누락 · 조합원번호");
      if(!name) bad("필수 항목 누락 · 성명");
      if(!ph)   bad("필수 항목 누락 · 연락처");
      else if(!/^010\d{7,8}$/.test(ph)) bad("연락처 형식 오류 · 010으로 시작해야 합니다");
      else if(seenPh[ph] && seenPh[ph] !== no) bad(`연락처 중복 · ${seenPh[ph]}번과 같습니다`);

      if(no && seenNo[no] !== undefined){
        bad(`조합원번호 중복 · ${seenNo[no]}행에 이미 있습니다`);
      }

      /* 이미 등록된 조합원 */
      const old = R.find(x => String(x.no) === no);
      if(old){
        if(!RUP.update) bad("조합원번호 중복 · 이미 등록된 번호입니다");
        else {
          const ch = [];
          const fmt = p => p.replace(/(\d{3})(\d{3,4})(\d{4})/,"$1-$2-$3");
          if(old.name !== name)                  ch.push(["성명", old.name, name]);
          if(old.phone.replace(/\D/g,"") !== ph) ch.push(["연락처", old.phone, fmt(ph)]);
          if(!!old.rep !== repY)                 ch.push(["대표조합원", old.rep?"Y":"N", repY?"Y":"N"]);
          if(ch.length) dups.push({row:rowNo, no:Number(no), name, changes:ch});
        }
      }
      const phOwner = R.find(x => x.phone.replace(/\D/g,"") === ph && String(x.no) !== no);
      if(ph && phOwner) bad(`연락처 중복 · 이미 ${String(phOwner.no).padStart(4,"0")}번이 쓰고 있습니다`);

      if(no) seenNo[no] = rowNo;
      if(ph) seenPh[ph] = no;
      cur = {no:Number(no), name, phone:g("연락처"), rep:repY,
             share, joined:false, appraisal:0, want:84,
             addr:jibun, type:kind, land:0, bldg:0};
      people.push(cur);
    }

    /* ── 물건 ── */
    if(!jibun){ bad("필수 항목 누락 · 지번"); return; }
    if(OWN_KINDS.indexOf(kind) < 0)
      warn(`소유구분이 표준값이 아닙니다 · ${kind} (토지+건물 · 토지만 · 건물만)`);
    if(kind !== "건물만" && !area)
      warn("토지를 가진 것으로 되어 있는데 대지면적이 0입니다");
    if(kind === "건물만" && area)
      warn("건물만 소유인데 대지면적이 적혀 있습니다");
    /* ★ 재건축은 동별 과반수를 봐야 하므로 동 정보가 없으면 계산이 안 된다 */
    if(typeof TN !== "undefined" && TN().kind === "주택재건축" && !dong)
      warn("재건축 구역인데 동이 비어 있습니다. 동별 과반수를 셀 수 없습니다");
    if(!/^\d+\s*\/\s*\d+$/.test(share) && isNaN(Number(share)))
      bad(`지분 형식 오류 · ${share} (1/1 · 1/2 형식)`);

    /* 같은 지번의 지분 합 */
    if(jibun && kind !== "건물만"){
      const k = jibun.replace(/\s/g,"");
      jibunOwner[k] = (jibunOwner[k] || 0) + shareVal(share);
    }

    props.push({no:cur.no, addr:jibun, dong, ho, jimok, area, share, kind,
      bldg, public:false, row:rowNo});
    /* 조합원 대표 지번·면적은 첫 물건 기준으로 채운다 */
    if(cur.land === 0 && kind !== "건물만"){ cur.land = area; cur.addr = jibun; }
    if(cur.bldg === 0 && bldg) cur.bldg = bldg;
  });

  /* 지분 합이 1을 넘는 지번 */
  Object.keys(jibunOwner).forEach(k => {
    if(jibunOwner[k] > 1.001){
      const rows = props.filter(p => p.addr.replace(/\s/g,"") === k).map(p => p.row);
      errs.push({row:rows[0], no:"", name:"", phone:"",
        msg:`지번 ${k} 의 지분 합이 ${Math.round(jibunOwner[k]*100)/100} 로 1을 넘습니다 (${rows.join(", ")}행)`});
    }
  });

  /* 공유인데 대표가 없는 지번 */
  const byJibun = {};
  props.forEach(p => { if(shareVal(p.share) < 1){
    (byJibun[p.addr] = byJibun[p.addr] || []).push(p); } });
  Object.keys(byJibun).forEach(a => {
    const owners = [...new Set(byJibun[a].map(p => p.no))];
    const anyRep = owners.some(no => (people.find(x => x.no === no) || {}).rep);
    if(!anyRep) owners.forEach(no => {
      const pp = people.find(x => x.no === no) || {};
      warns.push({row:(byJibun[a][0]||{}).row||"", no:String(no), name:pp.name||"", phone:"",
        msg:`${a} 는 공유인데 대표조합원이 지정되지 않았습니다`});
    });
  });

  RUP.rows = people; RUP.props = props;
  RUP.errs = errs; RUP.warns = warns; RUP.dups = dups;
  RUP.step = "check"; render(); scrollTo(0,0);
}

/* 오류 행만 CSV 로 */
function rosterErrCsv(){
  const csv = "\uFEFF행,조합원번호,성명,연락처,문제\n"
    + RUP.errs.map(e=>`${e.row},${e.no},${e.name},${e.phone},"${e.msg}"`).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = "명부업로드_오류행.csv"; a.click(); URL.revokeObjectURL(a.href);
}

/* ★ 일괄 업로드도 바로 반영되지 않는다.
   결재 문서를 만들고 조합장 승인을 기다린다. */
function rosterCommit(){
  if(RUP.errs.length){ alert("오류를 먼저 수정해 주십시오."); return; }
  /* 물건 목록도 함께 넘긴다. 조합장 승인 후 한꺼번에 반영된다. */
  const items = RUP.rows.map(r => ({op:"add", no:r.no, name:r.name, row:r,
    props: RUP.props.filter(p => p.no === r.no)
      .map(p => ({no:p.no, addr:p.addr, dong:p.dong||"", ho:p.ho||"",
                  jimok:p.jimok, area:p.area, share:p.share, kind:p.kind,
                  bldg:p.bldg, public:false}))}));
  const doc = mbrCreate("bulk", items, S.name,
    [{kind:"업로드 원본", name:RUP.file, required:false}]);
  const c = mbrAfterCount("bulk", items);
  alert(`결재를 올렸습니다 (시연)\n\n${doc.no}\n대상 ${items.length}명\n\n`
    + `승인되면 명부 ${c.all}명 · 의결권자 ${c.voter}명이 됩니다.\n`
    + `총무이사 검토 → 조합장 승인 전까지 반영되지 않습니다.`);
  RUP.step = "idle"; RUP.rows = []; RUP.props = []; RUP.errs = []; RUP.warns = []; RUP.dups = [];
  render();
}

/* ★ 삭제는 더 무겁게 다룬다 (확정)
   매매·상속으로 자격이 넘어가는 중대한 사안이라
   근거 문서를 붙여야 결재가 올라간다.
   잘못 지우면 그분 의결권이 사라진다. */
function rosterDel(no){
  const r = ROSTER.find(x=>x.no===no); if(!r) return;
  const pick = prompt(
    `${mask(r.name)} · ${String(no).padStart(4,"0")}번 삭제\n\n`
    + `근거 문서를 골라 주십시오. 없으면 결재를 올릴 수 없습니다.\n\n`
    + MBR_DEL_DOCS.map((d,i)=>`${i+1}. ${d}`).join("\n"), "1");
  if(pick === null) return;
  const k = Number(pick) - 1;
  if(!(k >= 0 && k < MBR_DEL_DOCS.length)){
    alert("근거 문서를 고르지 않으셨습니다.\n삭제는 근거 없이 진행할 수 없습니다."); return; }
  const why = prompt("삭제 사유를 적어 주십시오 (예: 2026-02-10 매매로 자격 승계)");
  if(why === null || !why.trim()){
    alert("사유를 적어 주십시오. 나중에 다툴 때 이 기록이 근거가 됩니다."); return; }

  const doc = mbrCreate("del",
    [{op:"del", no:r.no, name:r.name, field:"조합원 자격", from:"보유", to:"상실", why:why.trim()}],
    S.name,
    [{kind:MBR_DEL_DOCS[k], name:MBR_DEL_DOCS[k].replace(/\s/g,"")+".pdf", required:true}]);
  if(REDIT === r){ REDIT = null; RBEFORE = null; }
  alert(`결재를 올렸습니다 (시연)\n\n${doc.no}\n근거 · ${MBR_DEL_DOCS[k]}\n`
    + `조합장 승인 전까지 명부에서 지워지지 않습니다.`);
  render();
}

function rSet(k,v){
  if(!REDIT) return;
  REDIT[k] = (k==="no"||k==="land"||k==="bldg") ? Number(v)||0 : v;
}
/* ★ 명부는 직원이 혼자 고칠 수 없다.
   저장을 누르면 값이 바로 바뀌는 것이 아니라 결재 문서가 만들어진다.
   총무이사 검토 → 조합장 승인을 거쳐야 실제로 반영된다. */
function rSave(){
  if(!REDIT) return;
  const d = REDIT, o = RBEFORE;
  if(!d.name.trim()){ alert("성명을 적어 주십시오."); return; }
  const ph = d.phone.replace(/\D/g,"");
  if(!/^010\d{7,8}$/.test(ph)){ alert("연락처는 010으로 시작해야 합니다."); return; }
  const dup = ROSTER.find(x=>x!==d && x.no===d.no);
  if(dup){ alert("같은 조합원번호가 이미 있습니다."); return; }
  const dupPh = ROSTER.find(x=>x!==d && x.phone.replace(/\D/g,"")===ph);
  if(dupPh){ alert(`이 연락처는 ${String(dupPh.no).padStart(4,"0")}번이 쓰고 있습니다.`); return; }

  /* 새 조합원인가, 기존 조합원 수정인가 */
  if(REDIT_NEW){
    const row = JSON.parse(JSON.stringify(d));
    ROSTER.splice(ROSTER.indexOf(d), 1);           /* 승인 전까지는 명부에 넣지 않는다 */
    const doc = mbrCreate("add", [{op:"add", no:row.no, name:row.name, row}], S.name, []);
    REDIT = null; RBEFORE = null; REDIT_NEW = false;
    alert(`결재를 올렸습니다 (시연)\n\n${doc.no}\n`
      + `총무이사 검토 → 조합장 승인 후 명부에 반영됩니다.`);
    render(); return;
  }

  const map = [["성명","name"],["연락처","phone"],["소유부동산","addr"],["물건종류","type"],
               ["대지면적","land"],["건물면적","bldg"],["지분","share"],["대표조합원","rep"]];
  const items = [];
  map.forEach(([label,k])=>{
    const a = k==="rep" ? (o[k]?"Y":"N") : String(o[k]);
    const b = k==="rep" ? (d[k]?"Y":"N") : String(d[k]);
    if(a !== b) items.push({op:"edit", no:o.no, name:o.name, field:label, from:a, to:b});
  });
  if(!items.length){ alert("바뀐 값이 없습니다."); REDIT=null; RBEFORE=null; render(); return; }

  Object.assign(d, o);                              /* 화면 값을 원래대로 되돌린다 */
  const doc = mbrCreate("edit", items, S.name, []);
  REDIT = null; RBEFORE = null;
  alert(`결재를 올렸습니다 (시연)\n\n${doc.no}\n변경 ${items.length}건\n`
    + `총무이사 검토 → 조합장 승인 후 명부에 반영됩니다.`);
  render();
}

  /* ★ 한 화면에서 오류가 나면 그 화면이 통째로 안 그려진다.

     실제로 동의서 서식에서 그런 일이 있었다.
     오류가 나도 화면은 살려 두고 무엇이 문제인지 보여 준다. */
  let html;
  /* ★★★ 2026-09-17 — V[cur] is not a function ★★★
     ─────────────────────────────────────────────────────
     「우리 구역 설정」 네 화면은 zone-admin.js 에 있다.
     그 파일이 아직 안 읽혔거나 못 읽었으면 V.home 이 없다.

     ★ 예전에는 곧바로 「문제가 생겼습니다」가 떴다.
       실제로는 **조금 기다리면 되는 일**인데 고장인 줄 아신다.

     ★ 그래서 세 번까지 기다렸다 다시 그린다 (0.3초 간격).
       그래도 없으면 그때 무엇이 문제인지 말씀드린다. */
  if(typeof V[cur] !== "function"){
    ZW_TRY = (ZW_TRY || 0) + 1;
    if(ZW_TRY <= 3){
      document.getElementById('main').innerHTML =
        `<h2 class="pt">불러오는 중입니다</h2>
         <div class="box"><p class="note" style="margin:0">
           화면을 준비하고 있습니다. 잠시만 기다려 주십시오.</p></div>`;
      setTimeout(render, 300);
      return;
    }
    ZW_TRY = 0;
    document.getElementById('main').innerHTML =
      `<h2 class="pt">이 화면을 불러오지 못했습니다</h2>
       <div class="warn hard"><b>zone-admin.js 를 읽지 못했습니다</b>
         <p>「우리 구역 설정」 네 화면은 이 파일에 들어 있습니다.
            파일이 서버에 올라가지 않았거나 인터넷이 끊겼을 수 있습니다.</p>
         <p>★ <b>Ctrl + Shift + R</b> 로 새로 불러와 보십시오.<br>
            ★ 그래도 같으면 <b>GitHub 에 zone-admin.js 가 올라갔는지</b>
              확인해 주십시오. 새로 만든 파일이라 빠지기 쉽습니다.</p>
         <p>다른 메뉴는 정상입니다. 자료는 그대로 있습니다.</p></div>
       <p class="note">${cur} 화면</p>`;
    return;
  }
  ZW_TRY = 0;
  try { html = V[cur](); }
  catch(e){
    html = `<h2 class="pt">화면을 여는 중 문제가 생겼습니다</h2>
    <div class="warn hard"><b>${(e && e.message) || "알 수 없는 오류"}</b>
      <p>이 화면만 열리지 않는 것이고 자료는 그대로 있습니다.
         다른 메뉴는 정상입니다.</p>
      <p>브라우저에서 <b>Ctrl + Shift + R</b> 를 눌러 새로 불러와 보십시오.
         그래도 같으면 이 문구를 그대로 알려 주십시오.</p></div>
    <p class="note">${cur} 화면</p>`;
  }
  const M = document.getElementById('main');
  /* ★ 왼쪽 입력 · 오른쪽 목록으로 두 칸을 쓰는 화면만 폭을 넓힌다.
     나머지는 920px 그대로 — 글을 읽는 폭이다.
     동의서는 세 칸이라 더 넓다(1760px). */
  /* ★ 소식은 세 칸이다 — 쓰는 칸 · 폰 미리보기 · 목록 (2026-09-18) */
  /* ★ 자료 등록도 세 칸이다 — 쓰는 칸 · 자료 목록 · 폰 (2026-09-20) */
  M.className = (cur === "consent" || cur === "office" || cur === "news"
    || cur === "upload") ? 'xwide'
    : WIDE_V.includes(cur) ? 'wide' : '';
  M.innerHTML = html;
  /* ★ 찾기 칸에 한글 조합 감시를 붙인다 (2026-08-22 밤 · imeWatch 참고).
     화면을 그릴 때마다 칸이 새로 만들어지므로 매번 붙여야 한다. */
  if(typeof imeBind !== "undefined") imeBind();
  /* ★ 소식의 표 사진을 직원 화면에도 보여 드린다 (2026-09-19) */
  if(typeof nwPicShow !== "undefined") nwPicShow();
  /* ★ 우리 구역 설정의 찾기 칸 (zone-admin.js) */
  if(typeof zqBind !== "undefined") zqBind();
  document.getElementById('who-name').textContent = S.name + ' · 조합 직원';

  /* ★ 지금 어느 구역을 보고 있는지 화면에 적는다 (2026-08-22 오후).
     예전에는 「미아2재정비촉진구역」이 글자로 박혀 있었다.
     운영자가 장위1 로 열어도 미아2 라고 쓰여 있어
     자료를 고쳐 두고 어느 구역에 들어갔는지 알 수 없었다.
     ★ 조합 직원은 자기 구역 하나뿐이라 평소에는 이 글자가 바뀌지 않는다. */
  const zn = (typeof TN !== "undefined") ? TN() : null;
  const bz = document.getElementById('brand-zone');
  const wz = document.getElementById('who-zone');
  if(zn && bz) bz.textContent = zn.name;
  if(zn && wz) wz.textContent = zn.code + ' · 구역 전환 불가';
  /* ★ [전자결재 ↗] 는 누르는 즉시 새 창을 연다 (2026-08-22).
     안내 화면에서 버튼을 한 번 더 누르시게 하면 두 걸음이 된다.
     안내 화면도 함께 띄워 둔다 — 새 창이 막혔을 때 다시 누르실 자리가 있어야 하고,
     결재 대기 건수도 여기서 보신다. */
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{
    cur=b.dataset.m; render(); scrollTo(0,0);
    if(cur==='approval') apOpen('box');
  });
  /* ★ 폰 미리보기에서 소식을 눌러 바로 고치기 (2026-09-16).
     화면을 그릴 때마다 카드가 새로 만들어지므로 매번 붙인다. */
  document.querySelectorAll('[data-nwpick]').forEach(b=>b.onclick=()=>{
    if(typeof nwPick !== "undefined") nwPick(b.dataset.nwpick); });
  /* ★ 올린 자료 목록을 눌러 바로 수정 (2026-09-16) */
  document.querySelectorAll('[data-arcpick]').forEach(b=>b.onclick=()=>{
    if(typeof arcPick !== "undefined") arcPick(b.dataset.arcpick); });
}

document.getElementById('g-go').onclick = () => {
  /* ★ 한글은 겉보기가 같아도 담기는 방식이 두 가지다.
     화면에는 똑같이 보이는데 컴퓨터는 다른 것으로 본다.
     모양을 하나로 맞춘 뒤 비교한다. */
  const norm = v => String(v||"").normalize("NFC").trim();
  const n = norm(document.getElementById('g-name').value);
  const p = norm(document.getElementById('g-pw').value);
  const e = document.getElementById('g-err');
  if(!n || !p){ e.textContent='이름과 암호를 입력하세요.'; return; }
  if(!STAFF.includes(hsh(`${n}|${p}`))){ e.textContent='이름 또는 암호가 맞지 않습니다.'; return; }
  S.name = n;
  document.getElementById('gate').style.display='none';
  document.getElementById('wrap').classList.add('on');
  render();
};
document.getElementById('g-pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('g-go').click();
});
document.getElementById('logout').onclick = () => location.reload();
</script>
