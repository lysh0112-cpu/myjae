<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<meta name="robots" content="noindex,nofollow">
<title>다알아 운영 콘솔</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════════════════════════════════════════════════════
   다알아 (Da-Ara) — 운영자 콘솔
   ───────────────────────────────────────────────────────────
   ★ PC 전용. 플랫폼 전체를 관리하는 사람(운영사)만 쓴다.
   ★ index.html(조합원) · admin.html(조합 직원) 과 완전히 분리돼 있다.

   ★ 운영자만 할 수 있는 일
     · 구역 전환 (조합 직원은 자기 구역 고정)
     · 새 구역 추가 · 프로비저닝
     · 계정 생성 및 권한 부여
     · 검산 규칙 관리
     · 감사 로그 열람
     · 요금 · 사용량 확인

   ★ 구역 전환은 반드시 감사 로그를 남긴다.
     조합이 "운영사가 우리 자료를 들여다본 것 아니냐"고 물을 때
     답할 수 있는 유일한 근거다. 로그를 끄는 기능은 만들지 않는다.

   ※ 지금은 시연용이다. 로그인·로그 모두 화면 안에서만 동작한다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#0B1F3A; --navy:#12365F; --blue:#2563EB; --amber:#F26419;
  /* ★ 2026-09-16 밤 — 테두리가 너무 흐려 안 보인다는 말씀.
     #E2E7EE 는 흰 바탕 위에서 거의 사라진다. 특히 밝은 사무실 화면에서.
     ★ 두 단계로 나눈다 —
       --line   칸을 가르는 얇은 줄 (표 · 목록)
       --edge   상자를 두르는 진한 줄 (박스 · 입력칸)
     둘을 같은 색으로 두면 「무엇이 한 덩이인지」가 안 보인다. */
  --paper:#FFF; --mist:#F5F7FA; --line:#A9B7C8; --edge:#8695AA; --muted:#5F6B7A;
  --ok:#0EA97A; --side:#12365F;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate-box{width:360px;background:var(--paper);border-radius:16px;padding:32px 30px;
  border:1px solid var(--line)}
.gate-box h1{font-size:1.15rem;font-weight:800;margin-bottom:4px}
.gate-box p.sub{font-size:.82rem;color:var(--muted);margin-bottom:22px}
.f{margin-bottom:12px}
.f label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.f input,.f select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  font-size:.9rem;font-family:inherit;outline:none;background:#fff}
.f input:focus{border-color:var(--navy)}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border-radius:10px;
  padding:13px;font-size:.9rem;font-weight:700;text-align:center}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:.82rem}
.err{font-size:.78rem;color:var(--amber);margin-top:10px;min-height:18px}

.wrap{display:none;min-height:100vh}
.wrap.on{display:flex}
aside{width:210px;background:var(--side);flex-shrink:0;padding:18px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 18px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{display:block;color:#fff;font-size:1rem;font-weight:800}
.brand span{display:block;color:#F3B99B;font-size:.76rem;margin-top:3px}
nav{padding:10px 0;flex:1}
nav button{display:block;width:100%;text-align:left;color:#C3D3E5;font-size:.85rem;
  padding:10px 18px;border-left:3px solid transparent}
nav button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav button.on{color:#fff;background:rgba(255,255,255,.12);border-left-color:var(--amber);font-weight:700}
.who{padding:14px 18px 0;border-top:1px solid rgba(255,255,255,.14)}
.who b{display:block;color:#DCE7F3;font-size:.8rem;font-weight:700}
.who span{display:block;color:#8FA3BA;font-size:.74rem;margin-top:3px}
.who button{color:#8FA3BA;font-size:.74rem;margin-top:10px;text-decoration:underline}

main{flex:1;padding:26px 30px;min-width:0;max-width:920px}
/* ★ 두 칸으로 쓰는 화면만 폭을 넓힌다 (2026-08-22).
   920px 는 글을 읽는 폭이다. 눈이 왼쪽 끝에서 오른쪽 끝까지 오갈 일이 없어야 한다.
   다만 왼쪽에 설정, 오른쪽에 결과를 놓는 화면은 그 폭으로는 둘 다 못 담는다.
   본문 폭 규칙은 그대로 두고, 이 화면만 예외로 한다. */
main.wide{max-width:1420px}

/* ── 두 칸 (2026-08-22) ─────────────────────────────────
   왼쪽 설정은 폭이 고정이다. 칸 넓이가 정해져 있어 늘어날 이유가 없다.
   오른쪽 결과가 남는 폭을 다 쓴다. 목록은 넓을수록 좋다. */
.two{display:grid;grid-template-columns:390px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:1180px){.two{grid-template-columns:1fr}}
.two > .col{min-width:0}

/* 왼쪽 설정 칸 — 스크롤을 내려도 따라온다 */
.stick{position:sticky;top:20px}

/* ── 홈 화면 관리 두 칸 (2026-08-22 오후) ────────────────
   ★ deal · apt 와 반대로 놓는다.
     저 둘은 왼쪽이 설정(폭 고정)이고 오른쪽이 결과 목록(넓을수록 좋다).
     홈 화면은 반대다. 왼쪽이 입력이고 오른쪽은 폰 모양이라
     폰 폭인 300px 에서 늘어날 이유가 없다.

   ★ 폭을 1420 이 아니라 1180 으로 둔다.
     1420 이면 입력칸이 1,000px 을 넘어간다.
     「보통 입력칸 420px」 규칙(15번 절)이 무너지고
     이름 한 칸이 화면을 가로지른다. */
main.mid{max-width:1180px}
.two.rev{grid-template-columns:minmax(0,1fr) 300px}
@media(max-width:1080px){.two.rev{grid-template-columns:1fr}}

/* ── 고정 머리띠 (2026-08-22 오후) ───────────────────────
   ★ 저장 단추를 찾으러 스크롤을 내리지 않아도 되게 한다.
     main 의 좌우 여백(30px)만큼 음수 여백을 줘서 끝까지 채운다.
     그래야 밑에 글이 지나갈 때 가려 준다. */
.pghd{position:sticky;top:0;z-index:20;background:var(--paper);
  margin:-26px -30px 18px;padding:15px 30px 13px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.pghd .pgL{min-width:0}
.pghd .pgR{display:flex;align-items:center;gap:12px}

/* 저장 상태 — 색으로만 알리지 않는다. 글자로도 적는다 */
.hmS{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.hmS::before{content:"";width:7px;height:7px;border-radius:99px;background:var(--ok)}
.hmS.on{color:var(--amber);font-weight:700}
.hmS.on::before{background:var(--amber)}

/* ── 컴팩트 입력 (2026-08-22 오후) ──────────────────────
   ★ 줄 사이를 좁힌다. 홈 화면은 칸이 넷뿐인데
     .sec 가 22px 씩 벌려 놓아 화면 두 배를 먹고 있었다. */
.tight .sec{margin:16px 0 8px;font-size:.84rem}
.tight .sec:first-child{margin-top:0}
.tight .box{padding:13px 15px}
.tight .f{margin-bottom:11px}
.tight .f:last-child{margin-bottom:0}
.tight .f label{font-size:.74rem;margin-bottom:4px}
.tight .f input{padding:9px 11px;font-size:.85rem}

/* 이미지 고르는 자리 — 높이를 절반으로 */
.hero{border:1.5px dashed var(--navy);background:#F8FAFD;border-radius:11px;
  padding:15px;text-align:center;cursor:pointer;display:flex;
  align-items:center;justify-content:center;gap:11px}
.hero:hover{background:#F1F6FC}
.hero b{font-size:.83rem}
.hero span{font-size:.74rem;color:var(--muted)}

/* 접은 제원 — 요약 줄에 숫자를 그대로 보인다 */
.fold > summary .sm{margin-left:auto;font-weight:600;font-size:.75rem;
  color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.fold.warnf > summary .sm{color:#A9613C}
.lock{font-size:.68rem;font-weight:700;color:#8C3A12;background:#FFE6D6;
  border-radius:99px;padding:2px 8px}

/* ── 접어 두는 설명 ─────────────────────────────────────
   ★ 왜 그렇게 했는지는 지우지 않는다. 접어 둘 뿐이다.
     지우면 다음 사람이 같은 실수를 한다.
     매일 쓰는 사람에게는 방해가 되고, 처음 오는 사람에게는 꼭 필요하다. */
.fold{border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}
.fold > summary{padding:9px 13px;font-size:.79rem;font-weight:700;color:var(--navy);
  cursor:pointer;background:var(--mist);list-style:none;display:flex;align-items:center;gap:7px}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::before{content:"▸";color:var(--muted);font-size:.72rem}
.fold[open] > summary::before{content:"▾"}
.fold > summary:hover{background:#EDF1F6}
.fold .fb{padding:11px 14px 13px;font-size:.77rem;color:#41576B;line-height:1.7}
.fold .fb b{color:var(--navy)}
.fold.warnf > summary{background:#FFF4EC;color:#8C3A12}
.fold.warnf > summary:hover{background:#FFEBDC}
.fold.warnf{border-color:#F3C7AC}

/* ── 컴팩트 입력 줄 ───────────────────────────────────── */
.rowf{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rowf .f{margin:0}
.rowf .f label{font-size:.7rem;margin-bottom:3px}
.rowf .f input,.rowf .f select{padding:8px 10px;font-size:.82rem}
.w90{width:90px}.w110{width:110px}.w150{width:150px}
.btn.go{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:800;
  padding:9px 18px;font-size:.85rem}
.btn.go:disabled{opacity:.5}
.hint{font-size:.72rem;color:var(--muted);margin-top:7px;line-height:1.55}
.hint b{color:var(--navy)}

/* ── 사이드바 갈래 이름 (2026-08-22) ────────────────────
   ★ 갈래 이름은 하위 메뉴보다 밝게 둔다.
     너무 흐리면 표지 노릇을 못 한다. 직원 화면에서 배운 것이다. */
.mg{color:#F3B99B;font-size:.72rem;font-weight:800;letter-spacing:.02em;
  padding:16px 18px 6px;margin-top:8px;border-top:1px solid rgba(255,255,255,.12)}
.mg:first-child{margin-top:0;border-top:0;padding-top:14px}
nav button.sub{padding-left:26px}

/* ── 구 고르기 단추 (2026-08-22) ────────────────────────
   ★ 코드를 외우게 하면 오타가 나고, 오타가 나면 0건이 나온다.
     왜 0건인지 알 수 없어 국토부 탓인 줄 아신다. */
.gubar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.gub{border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:8px 13px;font-size:.82rem;font-weight:700;
  text-align:center;display:flex;align-items:center;gap:6px;cursor:pointer}
.gub:hover{border-color:var(--navy)}
.gub em{font-style:normal;font-family:ui-monospace,Menlo,monospace;
  font-size:.68rem;color:var(--muted);font-weight:600}
.gub.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gub.on em{color:#A9C0DA}
.gub.more{color:var(--blue);border-style:dashed}
.gub.sm2{padding:6px 11px;font-size:.78rem;font-weight:400}
.gub.sm2.on{font-weight:700}

/* ── 비교 아파트 설정 (2026-08-22) ──────────────────────
   ★ 칸 폭은 담기는 것에 맞춘다.
     이름은 넓게, 평형·금액은 좁게. 다 같은 폭이면 눈이 헤맨다. */
.f3{display:grid;grid-template-columns:1fr 130px 1fr;gap:10px}
@media(max-width:760px){.f3{grid-template-columns:1fr}}
input.sm{width:100%;border:1px solid var(--line);border-radius:7px;
  padding:7px 8px;font-size:.8rem;font-family:ui-monospace,Menlo,monospace;
  text-align:right;outline:none}
input.sm:focus{border-color:var(--navy)}

/* ── 운영자 재무 대시보드 (2026-08-22) ──────────────────
   ★ 초록 = 남는다 / 주황 = 밑진다. 색이 곧 뜻이다. */
.card .cnote{font-size:.72rem;color:var(--muted);margin-top:5px;line-height:1.5}
.card b em{font-style:normal;font-size:.8rem;font-weight:700;
  color:var(--muted);margin-left:3px}
.card.good{border-color:#A9E0CD;background:#F4FCF9}
.card.good b{color:var(--ok)}
.card.bad{border-color:#F3C7AC;background:#FFF9F4}
.card.bad b{color:var(--amber)}
.gp{font-style:normal;font-size:.7rem;font-weight:800;margin-left:6px;
  border-radius:99px;padding:2px 7px}
.gp.up{background:rgba(14,169,122,.13);color:var(--ok)}
.gp.dn{background:#FFF0E6;color:var(--amber)}

/* 수입 대비 지출 — 가로 누적 막대 */
.opbar{display:flex;height:26px;border-radius:9px;overflow:hidden;
  background:rgba(14,169,122,.18);margin-bottom:13px}
.opbar i{display:block;height:26px;transition:width .5s ease}
.opbar i.c1{background:var(--navy)}
.opbar i.c2{background:#9BB2CC}
.oplg{display:flex;gap:22px;flex-wrap:wrap;font-size:.82rem}
.oplg > div{display:flex;align-items:center;gap:8px}
.oplg i{width:11px;height:11px;border-radius:3px;flex:none}
.oplg i.c1{background:var(--navy)}
.oplg i.c2{background:#9BB2CC}
.oplg i.c3{background:rgba(14,169,122,.4)}
.oplg b{font-family:ui-monospace,Menlo,monospace;font-weight:800}
.oplg span{font-size:.74rem;color:var(--muted)}

/* 구역별 기여도 막대 */
.shb{height:6px;background:#EDF1F6;border-radius:99px;overflow:hidden;margin-bottom:3px}
.shb i{display:block;height:6px;border-radius:99px;background:var(--navy)}
tr.pick{background:#F0F5FB}
.lnk{background:none;border:0;color:var(--blue);font-size:.78rem;
  font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.tiny{font-size:.72rem;color:var(--muted);display:block;margin-top:2px}

/* ── 구역 탭 ────────────────────────────────────────────
   ★ 지금 어느 조합 자료를 만지고 있는지 화면마다 보여야 한다.
     사이드바 구석의 작은 글자로는 부족하다.
     미아3 자료를 고치면서 미아2인 줄 아는 일이 생긴다. */
.zbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.zbar.off{opacity:.42}
.zt{border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:8px 13px;font-size:.82rem;font-weight:700;color:var(--ink);
  text-align:center;display:flex;align-items:center;gap:7px;cursor:pointer;
  transition:border-color .15s,background .15s}
.zt:hover{border-color:var(--navy)}
.zt em{font-style:normal;font-family:ui-monospace,Menlo,monospace;
  font-size:.7rem;color:var(--muted);font-weight:600}
.zt.on{background:var(--navy);border-color:var(--navy);color:#fff}
.zt.on em{color:#A9C0DA}
.zt .zw{font-style:normal;font-size:.66rem;font-weight:700;
  background:#F0F3F7;color:var(--muted);border-radius:99px;padding:2px 7px}
.zt.on .zw{background:rgba(255,255,255,.2);color:#fff}

/* ── 지금 다루는 구역 띠 ───────────────────────────────── */
.znow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#F0F5FB;border:1px solid #C6D6E8;border-left:4px solid var(--navy);
  border-radius:10px;padding:11px 15px;margin-bottom:20px;font-size:.83rem}
.znow > span:first-child{color:var(--muted);font-size:.76rem}
.znow b{font-weight:800;font-size:.9rem}
.znow em{font-style:normal;font-size:.76rem;color:var(--navy);
  background:#fff;border:1px solid #C6D6E8;border-radius:6px;padding:2px 7px}
.znow .zs{font-style:normal;font-size:.7rem;font-weight:700;
  background:#EEE;color:var(--muted);border-radius:99px;padding:3px 9px}
.znow .zs.ok{background:rgba(14,169,122,.13);color:var(--ok)}
.znow .zh{margin-left:auto;font-size:.75rem;color:var(--muted)}
.znow .zh b{font-size:.75rem;color:var(--navy)}
.znow.all{background:#FFF4EC;border-color:#F3C7AC;border-left-color:var(--amber)}
.znow.all > span:first-child{color:#8C3A12;font-weight:700}
.znow.all b{color:#8C3A12}
.znow.all .zh{color:#A85B33}

/* ★ 계약이 안 된 구역 — 파란 띠와 확실히 갈라 놓는다.
   미아2와 똑같이 보이면 상담 중인 구역을 고쳐 두고 잊으신다. */
.znow.warnz{background:#FFF4EC;border-color:#F3C7AC;border-left-color:var(--amber)}
.znow.warnz > span:first-child{color:#A85B33}
.znow.warnz b{color:#8C3A12}
.znow.warnz em{border-color:#F3C7AC;color:#8C3A12}
.znow.warnz .zh{color:#8C3A12}
.znow.warnz .zh b{color:#8C3A12;font-weight:800}
.znow .zs.hot{background:var(--amber);color:#fff}

/* ★ 입력칸을 내용에 맞게 잡는다.
   한 줄짜리 칸이 화면 끝까지 늘어나면 엉성해 보이고
   눈이 왼쪽 끝에서 오른쪽 끝까지 오가야 해서 읽기도 나쁘다. */
.f input,.f select,.f textarea{max-width:420px}
.f.wide input,.f.wide select,.f.wide textarea{max-width:100%}
.f.mini input,.f.mini select{max-width:170px}
.f.half input,.f.half select{max-width:280px}
.g2 .f input,.g2 .f select,.g3 .f input,.g3 .f select{max-width:100%}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.frow .f{margin-bottom:0}
.frow .grow{flex:1;min-width:220px}
.frow .grow input{max-width:100%}
h2.pt{font-size:1.2rem;font-weight:800;margin-bottom:3px}
p.pd{font-size:.83rem;color:var(--muted);margin-bottom:20px}
.sec{font-size:.9rem;font-weight:800;margin:22px 0 10px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.row{display:flex;justify-content:space-between;gap:14px;padding:9px 0;
  border-bottom:1px dashed var(--line);font-size:.84rem}
.row:last-child{border-bottom:0}
.row span{color:var(--muted)}
.row b{font-weight:700}

table{width:100%;border-collapse:collapse;font-size:.84rem}
th{background:var(--mist);color:var(--muted);font-size:.78rem;font-weight:700;
  text-align:left;padding:10px 12px}
td{padding:11px 12px;border-top:1px solid var(--line)}
tr.tap{cursor:pointer}
tr.tap:hover{background:var(--mist)}
tr.now{background:#F0F5FB}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:999px}
.p-ok{background:rgba(14,169,122,.13);color:var(--ok)}
.p-wait{background:#EEE;color:var(--muted)}
.p-warn{background:#FFF0E6;color:#A85B33}
.p-blue{background:#E8EEF7;color:var(--navy)}
.warn{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;padding:13px 15px;margin-top:16px}
/* ★ 제목만 줄을 바꾼다.
   본문 안의 강조까지 block 이면 문장이 토막 나서 읽기 나쁘다.
       다시 제출하시면 앞의 것은
       대체됨
       으로 남고 …
   이렇게 끊긴다. 강조가 오히려 방해가 된다. */
.warn > b:first-child{display:block;font-size:.84rem;color:#8C3A12;margin-bottom:4px}
.warn p{font-size:.8rem;color:#A85B33;line-height:1.75}
.warn p b{font-weight:800;color:#8C3A12}
.note{font-size:.8rem;color:var(--muted);line-height:1.7;margin-top:12px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.8rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.f{margin-bottom:11px}
.f label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px}
.f input,.f select{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:.86rem;outline:none;background:#fff;color:var(--ink);font-family:inherit}
.f input:focus,.f select:focus{border-color:var(--navy)}
tr.tap{cursor:pointer}
tr.tap:hover{background:var(--mist)}
.sec em{font-style:normal;font-size:.76rem;font-weight:400;color:var(--muted)}
.sample{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;
  padding:12px 15px;margin-bottom:18px}
.sample > b:first-child{display:block;font-size:.84rem;color:#8C3A12;margin-bottom:3px}
.sample p b{font-weight:800;color:#8C3A12}
.sample p{font-size:.8rem;color:#A85B33;line-height:1.6}
/* ── 폰 미리보기 · 조합원 화면 그대로 (2026-09-16 밤) ──────
   ★ 예전에는 「닮은 카드」였다. 운영자가 단계를 바꿔도
     실제로 어떻게 나가는지 알 수 없었다.
   ★ 크기만 줄인 같은 그림을 그린다. 폭 280px. */
.pv{width:330px;margin:0 auto;border:1px solid var(--edge);
  border-radius:16px;overflow:hidden;background:#fff;
  box-shadow:0 3px 14px rgba(11,31,58,.09)}
.pv-hero{height:156px;position:relative;background-size:cover;background-position:center}
.pv-credit{position:absolute;right:9px;bottom:9px;font-size:.6rem;
  color:rgba(255,255,255,.8)}
.pv-txt{position:absolute;left:12px;bottom:12px;color:#fff}
.pv-eye{display:inline-block;font-size:.6rem;background:rgba(255,255,255,.22);
  padding:2px 8px;border-radius:99px}
.pv-h1{font-size:.95rem;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.pv-sub{font-size:.62rem;opacity:.9;margin-top:2px}

.pv-prog{position:relative;z-index:2;margin:-22px 11px 11px;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:12px 12px 11px;
  box-shadow:0 4px 16px rgba(11,31,58,.1)}
.pv-top{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.pv-top>b{font-size:.72rem;font-weight:800;letter-spacing:-.02em;
  word-break:keep-all;flex:1;padding-top:2px}
.pv-dd{text-align:right;flex:none}
.pv-dd b{display:block;font-size:.8rem;font-weight:800;color:var(--amber)}
.pv-dd span{font-size:.55rem;color:var(--muted)}

/* ★ 아홉 칸은 280px 에 안 들어간다. 밀되 막대는 숨긴다. */
.pv-scroll{overflow-x:auto;margin:0 -2px;padding:0 2px;
  scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.pv-scroll::-webkit-scrollbar{display:none}
.pv-line{min-width:100%;position:relative;padding-top:2px}
/* 점 지름 9px → 가운데가 2+4.5=6.5px. 선(3px)의 위를 5px 에 둔다. */
.pv-trk{position:absolute;top:5px;height:3px;background:var(--line);
  border-radius:99px;overflow:hidden}
.pv-trk i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#FFB27A,#F26419)}
.pv-dots{display:flex;position:relative;z-index:2}
.pv-cell{flex:1;display:flex;justify-content:center;min-width:0}
.pv-dot{width:9px;height:9px;border-radius:50%;background:#fff;
  border:2px solid var(--line);display:block}
.pv-dot.done{background:#F26419;border-color:#F26419}
.pv-dot.now{background:#fff;border-color:#F26419;box-shadow:0 0 0 4px rgba(242,100,25,.18)}
.pv-labs{display:flex;margin-top:7px}
.pv-labs span{flex:1;min-width:0;text-align:center;font-size:.52rem;
  color:#98A9BC;font-weight:600;line-height:1.3}
.pv-labs span.on{color:var(--navy)}
.pv-foot{display:flex;gap:14px;margin-top:11px;padding-top:10px;
  border-top:1px solid var(--line)}
.pv-foot b{display:block;font-size:.76rem;font-weight:800;letter-spacing:-.02em}
.pv-foot span{font-size:.55rem;color:var(--muted)}

/* ── 단계 칸 · 좌우로 민다 (2026-09-16 밤) ────────────────
   ★ 아홉 칸이라 한 줄에 안 들어간다.
     줄바꿈(flex-wrap)으로 두 줄이 되면 차례가 흐트러져
     「조합설립 다음이 무엇인가」가 안 보인다.
   ★ 그래서 한 줄로 두고 **좌우로 민다.**
     스크롤바는 숨긴다 — 폰에서는 손가락으로 밀면 그만이고,
     막대가 보이면 칸을 덮어 글자가 가린다. */
.stagerow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.stagerow::-webkit-scrollbar{display:none}
.stagerow{scrollbar-width:none;-ms-overflow-style:none}
.stageb{flex:none;white-space:nowrap;border:1px solid var(--edge);background:#fff;
  color:var(--muted);border-radius:99px;padding:8px 14px;font-size:.8rem;
  font-weight:400;cursor:pointer}
.stageb:hover{border-color:var(--navy);color:var(--navy)}
.stageb.on{border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;
  box-shadow:0 0 0 3px rgba(18,54,95,.14)}
.stagebox{border:2px solid var(--navy) !important}
.stagenow{margin-top:8px;font-size:.79rem;color:var(--muted);
  display:flex;align-items:center;gap:10px}
.stagenow b{color:var(--navy);font-weight:800}
.stagenow em{margin-left:auto;font-style:normal;font-size:.73rem;color:#A9B6C6}

/* ★ 폰 미리보기가 따라다닌다.
   아래로 내려가며 일정을 고치셔도 계속 보여야
   「이렇게 나가는구나」를 그 자리에서 아신다. */
.two.rev > .col:last-child{position:sticky;top:14px;align-self:start}

/* ── 테두리에 힘을 준다 (2026-09-16 밤) ──────────────────
   ★ 「외곽 테두리가 너무 희미해서 안 보인다」는 말씀.
     칸을 가르는 줄(--line)과 상자를 두르는 줄(--edge)을 갈랐다.
     흰 바탕 대비 1.24 : 1 → 상자선 3.05 : 1 (권장 3:1)
   ★ 이 덩이는 맨 아래에 둔다. 위의 규칙을 덮어써야 한다. */
.box,.card,.panel,.warn,.fold{border-color:var(--edge)}
th{border-bottom:2px solid var(--edge)}
td{border-top:1px solid var(--line)}
tbody tr:nth-child(even) > td{background:#FAFCFE}
input,select,textarea{border-color:var(--edge)}
input:focus,select:focus,textarea:focus{
  border-color:var(--navy);box-shadow:0 0 0 3px rgba(18,54,95,.12)}
.btn.ghost,.btn.sm,.chipb{border-color:var(--edge)}

/* ── 사진 자리 잡기 (2026-09-17) ─────────────────────────
   ★ 십자 화살표는 걷어냈다. 사진을 직접 끄는 것으로 바꿨다. */
.heropos{margin-top:10px}
.hpt{font-size:.82rem;font-weight:700;color:var(--navy);
  display:flex;align-items:center;gap:10px}
.hpt span{margin-left:auto;font-weight:400;font-size:.76rem;color:var(--muted)}

/* ── 우리 구역 설정 전용 이름 (2026-09-17) ────────────────
   ★ .two · .lock 은 두 화면에서 **다른 것**을 가리키고 있었다.
     직원 화면의 .lock 은 잠금 안내용 큰 상자(padding:30px)라
     「읽기 전용」 석 자가 큰 상자가 됐다.
   ★ CSS 이름도 겹친다. 자바스크립트 이름만 세면 놓친다.
     → ztwo · zlock 으로 갈라 양쪽에 같은 것을 둔다. */
.ztwo{display:grid;grid-template-columns:390px minmax(0,1fr);gap:20px;align-items:start}
.ztwo.rev{grid-template-columns:minmax(0,1fr) 372px}
@media(max-width:1180px){.ztwo,.ztwo.rev{grid-template-columns:1fr}}
.zlock{font-size:.68rem;font-weight:700;color:#8C3A12;background:#FFE6D6;
  border-radius:99px;padding:2px 8px;margin-left:6px}

/* ── 단계 칸 좌우 화살표 (2026-09-17) ─────────────────────
   ★ 예전에는 「◀ 옆으로 밀어 보십시오 ▶」가 **그냥 글자**였다.
     화살표처럼 생겼으니 눌러 보시는 것이 당연한데 아무 일이 없다. */
.stagear{margin-left:auto;display:flex;align-items:center;gap:7px}
.stagear button{border:1px solid var(--edge);background:#fff;border-radius:7px;
  width:26px;height:24px;font-size:.7rem;color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.stagear button:hover{background:var(--mist);border-color:var(--navy)}
.stagear .sm{font-size:.73rem;color:#A9B6C6}

/* ── 사진을 끌어서 자리 잡기 (2026-09-17 고침) ─────────────
   ★ 화살표 단추 다섯 개를 없애고 사진을 직접 끌게 했다.
     여섯 번 누를 것을 한 번 끌면 된다.
   ★ 밝은 자리가 폰에 나올 데다. 나머지는 어둡게 덮어
     「여기가 잘립니다」가 눈에 보이게 한다. */
.hdwrap{margin-top:10px}
.hdbox{position:relative;width:100%;height:190px;border-radius:12px;
  overflow:hidden;background:#0B1F3A;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none}
.hdbox.dragging{cursor:grabbing}
.hdbox img{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;pointer-events:none}
/* 폰에 나올 자리만 남기고 좌우를 덮는다. 폰은 세로로 길어 가운데가 좁다. */
.hdmask{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(11,31,58,.62) 0%,rgba(11,31,58,.62) 31%,
    rgba(11,31,58,0) 31%,rgba(11,31,58,0) 69%,
    rgba(11,31,58,.62) 69%,rgba(11,31,58,.62) 100%)}
.hdframe{position:absolute;top:0;bottom:0;left:31%;right:31%;
  border:2px solid #fff;border-radius:6px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(11,31,58,.35)}
.hdframe span{position:absolute;left:0;right:0;bottom:6px;text-align:center;
  font-size:.62rem;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hdhand{position:absolute;left:0;right:0;top:8px;text-align:center;
  font-size:.7rem;color:#fff;font-weight:700;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.hdfoot{display:flex;align-items:flex-start;gap:12px;margin-top:10px}
.hdfoot .hint{flex:1;margin:0}

/* ── 사진 확대 · 축소 (2026-09-17 저녁) ───────────────────
   ★ 「좌우 조절이 안 된다」 하셨다. 당길 데가 없어서였다.
     조감도는 가로가 아주 길어 폰 자리에 맞추면 좌우에 남는 데가 없다.
     크기를 키워야 그때 좌우로도 밀 수 있다.
   ★ 막대로 크게 움직이고, ＋ － 로 미세하게 맞춘다. */
.hdzoom{display:flex;align-items:center;gap:9px;margin-top:10px}
.hdzoom input[type=range]{flex:1;min-width:0;height:22px;cursor:pointer;
  accent-color:var(--navy)}
.hzb{flex:none;width:30px;height:28px;border:1px solid var(--edge);background:#fff;
  border-radius:8px;font-size:.9rem;font-weight:700;color:var(--navy);cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hzb:hover{background:var(--mist);border-color:var(--navy)}
.hdzoom #hdZoomT{flex:none;width:44px;text-align:right;
  font-size:.78rem;font-weight:700;color:var(--navy)}
/* 사진은 100%일 때 전체가 보이도록 아래 색을 깐다 */
.hdbox img{transform-origin:center center}

/* ═══════════════════════════════════════════════════════════
   ★★★ 세 곳의 가로세로비를 하나로 (2026-09-17 밤) ★★★
   ───────────────────────────────────────────────────────────
   「폰에 나오는 자리와 실제 폰 화면과 조절 화면이 서로 다르다」

   ★ 재 보니 정말 제각각이었다.

       조합원 화면(실제)   폰마다 달랐다 → 480/300 으로 못 박음
       폰 미리보기          330 x 156  →  2.12   더 납작하다
       조절 상자의 밝은 네모 198 x 190  →  1.04   세로로 길다

     맞춰 놓은 자리가 폰에서 **다른 데**로 나오니 맞출 수가 없다.

   ★ 실제 조합원 화면(1.55)에 나머지 둘을 맞춘다.
     기준은 늘 **조합원이 보는 것**이어야 한다.

   ★ 비율은 aspect-ratio 로 못 박는다. 높이를 손으로 적으면
     폭이 바뀔 때 또 어긋난다.
   ═══════════════════════════════════════════════════════════ */
.pv-hero{height:auto !important;aspect-ratio:480 / 300}
.hdbox{height:auto !important;aspect-ratio:480 / 300}
/* 밝은 네모 = 상자 전체. 조합원 화면이 이 비율 그대로 꽉 채우기 때문이다. */
.hdmask{background:none !important}
.hdframe{left:0 !important;right:0 !important;
  border:2px solid rgba(255,255,255,.9) !important;border-radius:12px !important}

/* ★ 미리보기 조감도도 <img> 로 바꿨다 (2026-09-17 밤).
   조합원 화면 · 조절 상자와 같은 셈법을 쓰려면 같은 방식이어야 한다. */
.pv-bg{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.pv-hero{overflow:hidden}
.pv-credit,.pv-txt{z-index:2}
/* 조합원 화면처럼 위아래를 어둡게 덮어 글자가 읽히게 한다 */
/* ★ 조합원 화면(.shot:before)과 **똑같은 값**을 쓴다 (2026-09-17 밤).
   비슷하게 하면 미리보기가 더 밝아 보여 「사진이 다르다」가 된다. */
.pv-hero:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(11,31,58,.6) 0%,rgba(11,31,58,.1) 34%,rgba(11,31,58,.5) 66%,rgba(11,31,58,.92) 100%)}
/* ★ 조절 상자에도 같은 층을 씌운다. 폰에서 어떻게 보일지 그대로 알 수 있다. */
.hdbox:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,31,58,.6) 0%,rgba(11,31,58,.1) 34%,rgba(11,31,58,.5) 66%,rgba(11,31,58,.92) 100%)}

/* ═══════════════════════════════════════════════════════════
   홈 세 덩이 채우기 (2026-09-17 밤)
   ★ 우리 구역 한눈에 · 이번 고시 변경 · 궁금한 것
   ★ 흐린 글씨(placeholder)가 예시다. 조합원 화면에는 안 나간다.
   ═══════════════════════════════════════════════════════════ */
.hbbox{padding:12px 13px}
.hbhd{display:flex;align-items:center;gap:10px}
.hbt{font-size:.8rem;color:var(--muted);flex:1;min-width:0}
.hbsw{flex:none;width:38px;height:21px;border-radius:99px;border:0;
  background:#C3CEDC;position:relative;cursor:pointer;transition:background .15s}
.hbsw.on{background:var(--navy)}
.hbsw i{position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;
  background:#fff;transition:left .15s;display:block}
.hbsw.on i{left:19px}
.hbst{flex:none;font-size:.74rem;font-weight:700;color:var(--muted);width:30px}
.hbst.on{color:var(--navy)}
.hbcard{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#FAFCFE}
.hbrow2{display:flex;gap:7px}
.hbline{display:flex;align-items:flex-start;gap:9px;padding:9px 0;
  border-top:1px solid var(--line)}
.hbno{flex:none;width:18px;text-align:center;font-size:.74rem;font-weight:700;
  color:var(--muted);padding-top:22px}
.hbgrid{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:7px}
.hbgrid .f{flex:1;min-width:110px;margin-bottom:0}
.hbgrid .f.wide{flex-basis:100%}
.hbact{flex:none;display:flex;gap:4px;padding-top:22px}
.hbact button{width:26px;height:26px;border:1px solid var(--edge);background:#fff;
  border-radius:7px;font-size:.7rem;color:var(--muted);cursor:pointer}
.hbact button:hover{border-color:var(--navy);color:var(--navy)}
.hbact button.del:hover{border-color:var(--red);color:var(--red)}
.hbplus{width:100%;margin-top:9px;border:1px dashed var(--edge);background:#fff;
  border-radius:9px;padding:9px;font-size:.82rem;font-weight:700;
  color:var(--blue);cursor:pointer}
.hbplus:hover{background:#F2F7FD;border-color:var(--blue)}
.hbplus.sm{padding:6px;font-size:.78rem;margin-top:5px}
.hbq{border-top:1px solid var(--line);padding:11px 0}
.hbans{margin:9px 0 0 27px;padding:10px 12px;background:#F6F9FC;
  border:1px solid var(--line);border-radius:10px}
.hbat{font-size:.76rem;font-weight:700;color:var(--navy)}

   숫자로 보이지 않으면 그 사실을 모른 채 지나간다. */
function fxSet(){
  const v = prompt("원/달러 환율을 적어 주십시오.\n\n"
    + "달러로 내는 고정비를 원화로 환산하는 데 씁니다.\n"
    + "환율이 오르면 순수익이 줄어듭니다.", String(FX));
  if(v === null) return;
  const n = Number(String(v).replace(/[^0-9.]/g, ""));
  if(!n || n < 100 || n > 5000){
    alert("환율이 이상합니다.\n100 ~ 5000 사이로 적어 주십시오."); return; }
  FX = Math.round(n); render();
}

function wipeDemo(){
  if(!confirm("시연 중에 올린 자료를 모두 지웁니다.\n\n처음 상태로 되돌리시겠습니까?")) return;
  hubReset();

}
function toggleAcc(i){
  const acc = ACCOUNTS.filter(a=>a.tenant===T().code)[i]; if(!acc) return;
  acc.active = !acc.active;
  logIt(acc.active?"계정 해제":"계정 정지", `${T().code} · ${acc.role} ${acc.name}`);
  render();
}
function issueMaster(){
  const role = prompt("발급할 마스터 계정을 고르십시오\n\n1. 조합장\n2. 총무이사", "1");
  if(role===null) return;
  const r = role.trim()==="2" ? "총무이사" : "조합장";
  const nm = prompt(`${r} 성함을 적어 주십시오`, "○○○"); if(nm===null) return;
  ACCOUNTS.push({tenant:T().code, role:r, name:nm.trim()||"○○○",
    scope:"전체", active:true, byOps:true});
  logIt("계정 발급", `${T().code} · ${r} 마스터 계정`);
  alert(`마스터 계정을 발급했습니다 (시연)\n\n${T().code} · ${r}\n`
    + `직원 계정은 조합장이 직접 만드십니다.`);
  render();
}
function stopTenant(){
  const t = T();
  if(!confirm(`${t.code} ${t.name}\n\n구역 전체를 정지합니다.\n`
    + `조합원 앱과 직원 화면이 모두 막힙니다. 계속하시겠습니까?`)) return;
  t.sub = t.sub === "정지" ? "운영중" : "정지";
  logIt(t.sub==="정지"?"구역 정지":"구역 재개", `${t.code}`);
  render();
}
function logIt(what, detail){
  const d = new Date(), z = v => String(v).padStart(2,"0");
  AUDIT.unshift([`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} `
    + `${z(d.getHours())}:${z(d.getMinutes())}`, S.name, what, detail]);
}

function addLaw(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const name=g('l-name'); if(!name){ alert("법령명을 적어 주십시오."); return; }
  const kind = g('l-kind')||"법률";
  const sc = g('l-scope')||"전국";
  /* ★ 조례를 전국으로 두면 다른 지역 조합원께 남의 조례가 나간다.
     임대주택 의무비율은 지자체마다 다르다. */
  if((kind==="조례" || /조례|자치법규/.test(name)) && sc==="전국"){
    alert("조례는 시·도마다 다릅니다.\n\n"
      + "적용 범위에서 해당 시·도를 골라 주십시오.\n"
      + "전국으로 두시면 다른 지역 조합원께 남의 조례가 나갑니다."); return; }
  LAWS.push({id:"L"+(LAWS.length+1), kind, name, scope:sc,
    eff:g('l-eff')||"", state:"현행", url:g('l-url')||"", note:g('l-note')||""});
  logIt("전역 법령 추가", `${name} · ${sc}`);
  const n = sc === "전국" ? TENANTS.length
    : TENANTS.filter(t => sidoOf(t) === sc).length;
  alert(`법령을 추가했습니다 (시연)\n\n적용 범위 · ${sc}\n`
    + `${n}개 조합 자료실에 반영됩니다.`
    + (sc !== "전국" && !n ? `\n\n★ 지금 ${sc} 조합이 없어 아무 데도 나가지 않습니다.` : ""));
  render();
}

  render();
}

/* ── 법령 원문 올리기 ────────────────────────────────────
   ★ 법은 모든 조합에 똑같이 적용된다.
     조합마다 올리면 개정될 때 조합 수만큼 손이 가고,
     안 고친 조합은 옛 법을 그대로 보게 된다.
     운영자가 한 번 올려 모든 조합이 같은 것을 본다. */
/* ★ LAW_DOCS · LAW_SEQ · lawPut 은 archive-demo.js 에 있다.
     조문 짝짓기(ASK_MAP)를 쓰려고 그 파일을 불러오므로 여기서 또 선언하면
     "이미 선언됨" 오류가 나고 화면이 통째로 안 그려진다. */

const LWU = {title:"", sub:"", file:null, busy:false};
function lwKeep(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const t=g("lw-t"), b=g("lw-s");
  if(t!==null) LWU.title=t; if(b!==null) LWU.sub=b;
}
function lwPick(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept=".pdf,.hwp,.hwpx,.doc,.docx";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    if(f.size > 40*1024*1024){ alert(`파일이 너무 큽니다 (${hubSize(f.size)})\n한 건에 40MB까지입니다.`); return; }
    lwKeep(); LWU.file = f;
    if(!LWU.title) LWU.title = f.name.replace(/\.[^.]+$/, "");
    render();
  };
  inp.click();
}
async function lwUp(){
  lwKeep();
  if(!LWU.file){ alert("올릴 파일을 골라 주십시오."); return; }
  if(!LWU.title.trim()){ alert("법령명을 적어 주십시오."); return; }
  if(LWU.busy) return;
  LWU.busy = true; render();
  const f = LWU.file;
  const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [".pdf"])[0].toLowerCase();
  const id = "LW-" + new Date().getFullYear() + "-" + String(++LAW_SEQ).padStart(3,"0");
  const r = await hubUpload(f, hubPath("law", id) + ext);
  if(!r.ok){ LWU.busy=false; LAW_SEQ--; render(); alert(r.why); return; }
  const d = new Date(), z = v => String(v).padStart(2,"0");
  LAW_DOCS.push({id, cat:"law", title:LWU.title.trim(), sub:LWU.sub.trim(),
    file:f.name, path:r.path, size:r.size,
    at:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`,
    by:"운영자", state:"verified"});
  lawPut("운영자");
  LWU.file=null; LWU.title=""; LWU.sub=""; LWU.busy=false;
  alert(`올렸습니다.\n\n${f.name}\n\n${TENANTS.length}개 조합 자료실에 함께 나타납니다.`);
  render();
}
async function lwOpen(id){
  const d = LAW_DOCS.find(x=>x.id===id); if(!d) return;
  const u = await hubFileUrl(d.path, 3600);
  if(!u){ alert("파일을 열지 못했습니다."); return; }
  window.open(u, "_blank");
}
function lwHide(id){
  const d = LAW_DOCS.find(x=>x.id===id); if(!d) return;
  if(!confirm(`${d.title}\n\n모든 조합 자료실에서 감추시겠습니까?\n`
    + `법이 개정되어 옛 법이 된 경우에 쓰십시오.`)) return;
  d.state="hidden"; lawPut("운영자"); render();
}
function lwShow(id){
  const d = LAW_DOCS.find(x=>x.id===id); if(!d) return;
  d.state="verified"; lawPut("운영자"); render();
}
async function lwDel(id){
  const d = LAW_DOCS.find(x=>x.id===id); if(!d) return;
  if(!confirm(`${d.title}\n${d.file}\n\n`
    + `모든 조합 자료실에서 지웁니다.\n올린 파일도 함께 지워집니다.\n\n`
    + `되돌릴 수 없습니다. 계속하시겠습니까?`)) return;
  if(d.path && typeof hubFileDel !== "undefined") await hubFileDel(d.path);
  LAW_DOCS = LAW_DOCS.filter(x => x.id !== id);
  lawPut("운영자");
  render();
}

function setIdv(i, key, v){
  const p = IDV_PROVIDERS[i]; if(!p) return;
  p[key] = Number(v) || 0;
  /* 요금표의 같은 항목도 함께 고친다. 한쪽만 바뀌면 청구가 어긋난다. */
  const bp = (typeof PRICE !== "undefined") ? PRICE.find(x=>x.k===p.k) : null;
  if(bp) bp[key] = p[key];
  logIt("인증 단가 수정", `${p.name} · ${key}=${p[key]}`);
  render();
}
function toggleIdv(i){

function setPrice(i, key, v){
  const p = PRICE[i]; if(!p) return;
  p[key] = Number(v) || 0;
  /* ★ 본인인증 화면의 같은 항목도 함께 고친다.
     한쪽만 바뀌면 두 화면이 다른 단가를 보여주고,
     어느 쪽으로 청구되는지 알 수 없게 된다. */
  if(typeof IDV_PROVIDERS !== "undefined"){
    const ip = IDV_PROVIDERS.find(x => x.k === p.k);
    if(ip && (key === "cost" || key === "fee")) ip[key] = p[key];
  }
  logIt("단가 수정", `${p.name} · ${key}=${p[key]}`);
  render();
}
function csvBill(){
  const b = billOf(T().code);
  const rows = [
    ["다알아 · 사용량 및 요금 명세"],
    [T().code, T().name, `${BILLQ.from} ~ ${BILLQ.to}`],
    [],
    ["항목","공급처","사용","제공량","초과","청구단가","청구액"]
  ];
  b.lines.forEach(l=>rows.push([l.name,l.from,l.used,l.incl,l.over,l.fee,l.amount]));
  rows.push([], ["기본 이용료","","","","","",b.base], ["초과 사용 요금","","","","","",b.overSum],
    ["공급가액","","","","","",b.supply], ["부가세","","","","","",b.vat],
    ["합계","","","","","",b.total]);
  const csv = "\uFEFF" + rows.map(r=>r.map(v=>{
    const s=String(v==null?"":v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(",")).join("\r\n") + "\r\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download = `요금명세_${T().code}_${BILLQ.from}_${BILLQ.to}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
}

      + "화면을 옮기면 수정하신 내용이 사라집니다.\n그래도 옮기시겠습니까?")) return;
    HOME_DIRTY = false;
    cur=b.dataset.m; render(); scrollTo(0,0); });
  /* ★ 목록 찾기 칸 — 한 글자 칠 때마다 다시 그리되 커서를 되돌린다.
     안 되돌리면 커서가 맨 앞으로 튀어 아무도 못 쓴다. */
  const alq = document.getElementById('alq');
  if(alq){
    const pos = alq.selectionStart;
    alq.focus(); alq.setSelectionRange(pos, pos);
  }
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>switchTenant(b.dataset.t));
}

document.getElementById('g-go').onclick = () => {
  /* ★ 한글은 겉보기가 같아도 담기는 방식이 두 가지다.
     "류승현" 이 세 글자로 들어올 수도, 여덟 조각으로 들어올 수도 있다.
     화면에는 똑같이 보이는데 컴퓨터는 다른 것으로 본다.
     자동 채우기나 복사해 붙여넣기에서 자주 생긴다.
     normalize 로 모양을 하나로 맞춘 뒤 비교한다.

     암호도 뒤에 공백이 붙는 일이 있어 잘라낸다. */
  const norm = v => String(v||"").normalize("NFC").trim();
  const n = norm(document.getElementById('g-name').value);
  const p = norm(document.getElementById('g-pw').value);
  const e = document.getElementById('g-err');
  if(!n || !p){ e.textContent='이름과 암호를 입력하세요.'; return; }
  if(!OPS.includes(hsh(`${n}|${p}`))){
    e.innerHTML = `이름 또는 암호가 맞지 않습니다.<br>
      <span style="font-size:.72rem">넣으신 이름 ${n.length}자 · 암호 ${p.length}자</span>`;
    return; }
  S.name = n;
  /* ★ 감사 로그는 배열 형태다. [시각, 누가, 무엇을, 자세히]
     예전에는 여기만 객체로 넣고 있었고, 없는 stamp() 를 불러
     로그인 자체가 되지 않았다. */
  const _d = new Date(), _z = v => String(v).padStart(2,"0");
  AUDIT.unshift([
    `${_d.getFullYear()}-${_z(_d.getMonth()+1)}-${_z(_d.getDate())} `
      + `${_z(_d.getHours())}:${_z(_d.getMinutes())}`,
    n, "로그인", "운영 콘솔"
  ]);
  document.getElementById('gate').style.display='none';
  document.getElementById('wrap').classList.add('on');
  render();
  /* ★ 로그인한 뒤에 받아온다.
     화면이 그려지기 전에 부르면, 콜백이 없는 화면을 건드려 오류가 난다. */
  if(typeof hubPollCommon !== "undefined"){
    hubPollCommon("law_seq",  v => { LAW_SEQ = Math.max(LAW_SEQ, v || 0); }, 60);
    hubPollCommon("law_docs", v => {
      if(!v || JSON.stringify(v) === JSON.stringify(LAW_DOCS)) return;
      LAW_DOCS = v; render();
    }, 60);
  }
  /* ★ zone-admin.js 는 이 글 뒤에 읽힌다. 있는지 보고 부른다. */
  if(typeof homePullAll !== "undefined") homePullAll();
};

/* ★ homePullAll() 은 zone-admin.js 로 옮겼다 (2026-09-17).
   저장해 둔 홈 화면 설정을 구역마다 받아온다.
   이것이 없으면 저장은 되는데 다음에 열 때 예전 값이 보인다. */
document.getElementById('g-pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('g-go').click();
});
document.getElementById('logout').onclick = () => location.reload();
</script>
