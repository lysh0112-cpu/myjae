<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>다알아 · 전체 화면 목업</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ★ 소식에 딸린 자료 (2026-09-21) */
.nwrel{display:block;width:100%;text-align:left;border:1px solid #BFD8F2;
  background:#F7FBFF;border-radius:11px;padding:10px 12px;margin-top:11px;font-family:inherit}
.nwrel .t{display:block;font-size:.7rem;font-weight:800;color:#2563EB;margin-bottom:3px}
.nwrel b{display:block;font-size:.86rem;color:#12365F;line-height:1.45}
.nwrel i{display:block;font-style:normal;font-size:.74rem;color:#2563EB;margin-top:3px}
.mkhd{font-size:.78rem;font-weight:800;color:#12365F;background:#F2F6FB;
  border-radius:8px;padding:6px 11px;margin:10px 0 4px}
/* ★ 갈래 · 기간 고르개 (2026-09-21) */
.abar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 9px}
.abar .alab{font-size:.74rem;color:#6B7A8C;margin-right:2px}
.abar .acnt{margin-left:auto;font-size:.74rem;color:#6B7A8C}
.achip{border:1px solid #D8DEE6;background:#fff;border-radius:16px;
  padding:5px 12px;font-size:.78rem;color:#33455C;font-family:inherit}
.achip.on{background:#12365F;border-color:#12365F;color:#fff;font-weight:700}
.achip.off{opacity:.4}
.arange{display:flex;align-items:center;gap:6px;width:100%;margin-top:7px}
.arange input{flex:1;min-width:0;border:1px solid #D8DEE6;border-radius:9px;
  padding:7px 9px;font-size:.8rem;font-family:inherit;background:#fff}
.arange .ago{background:#12365F;color:#fff;border-radius:9px;padding:7px 15px;
  font-size:.8rem;font-weight:700;font-family:inherit}
:root{
  --ink:#0B1F3A; --navy:#12365F; --blue:#2563EB; --blue-soft:#EFF5FF;
  --amber:#F26419; --amber-soft:#FFF2EA; --paper:#FFF; --mist:#F5F7FA;
  /* ★ 2026-09-16 밤 — 테두리가 흐려 안 보인다는 말씀.
     조합원 화면은 어르신이 보신다. 밝은 데서는 #E9EEF4 가 사라진다.
     ★ 다만 직원 화면만큼 진하게는 안 한다. 카드에 그림자가 있어
       선까지 진하면 답답해 보인다. */
  --line:#C3CEDC; --edge:#93A3B7; --muted:#6B7C90; --ok:#0EA97A; --ok-soft:#E7F8F1;
  --warn:#B54708; --warn-soft:#FFF6E8;
  /* ★ 2026-08-31 — var(--red) 를 세 곳에서 쓰고 있는데 정의가 없었다.
     값이 없으면 브라우저가 그 줄만 통째로 버려 글자색이 안 바뀐다.
     오류도 안 나서 「왜 안 빨갛지」만 남는다. */
  --red:#D64545; --red-soft:#FBEDED;
  --r:20px; --r-sm:14px;
  --sh:0 1px 2px rgba(11,31,58,.04),0 10px 30px rgba(11,31,58,.07);
  --ease:cubic-bezier(.22,.61,.36,1);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-size:16px;line-height:1.5;
  letter-spacing:-.017em;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  /* ★ 아래 단추만큼 비워 둔다. 동그라미를 넣어 50 → 57px 이 됐다 (2026-09-20).
     ★ 이것을 안 늘리면 **마지막 줄이 단추에 가린다.** */
  padding-bottom:calc(79px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;letter-spacing:0}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;text-align:left}

/* ═══ 헤더 ═══ */
.hd{z-index:30;padding:calc(12px + env(safe-area-inset-top)) 20px 10px;
  display:flex;align-items:center;gap:10px;position:relative}
.hd.over{position:absolute;top:0;left:0;right:0}
.hd.over:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,31,58,.72),rgba(11,31,58,.3) 60%,transparent)}
.hd.over>*{position:relative}
.hd.solid{background:rgba(245,247,250,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0}
.logo{display:flex;align-items:center;gap:7px;font-size:1.08rem;font-weight:800;
  letter-spacing:-.05em;color:var(--navy)}
.logo img{width:29px;height:auto;display:block;filter:drop-shadow(0 1px 4px rgba(0,0,0,.28))}
.logo .wm span{color:var(--amber)}
.hd.over .logo .wm{color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.hd.over .logo .wm span{color:#FFB27A}
.sel{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:.79rem;font-weight:700;
  color:var(--navy);background:var(--paper);border:1px solid var(--line);
  padding:7px 11px 7px 13px;border-radius:999px;box-shadow:var(--sh);white-space:nowrap}
.sel svg{width:13px;height:13px;opacity:.5}
.hd.over .sel{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);
  color:#fff;backdrop-filter:blur(8px);box-shadow:none}
.hd.over .sel svg{opacity:.85}
.bell{width:36px;height:36px;border-radius:50%;background:var(--paper);border:1px solid var(--line);
  display:grid;place-items:center;position:relative;box-shadow:var(--sh);flex:none}
.bell svg{width:17px;height:17px;color:var(--navy)}
.bell i{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;
  background:var(--amber);border:1.5px solid var(--paper)}
.hd.over .bell{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.28);
  backdrop-filter:blur(8px);box-shadow:none}
.hd.over .bell svg{color:#fff}
.hd.over .bell i{border-color:transparent}
.hd h1{margin:0;font-size:1.08rem;font-weight:780;letter-spacing:-.04em}

.wrap{padding:0 20px 34px;max-width:540px;margin:0 auto;position:relative}
.sec{margin:24px 0 11px;display:flex;align-items:baseline;gap:8px}
.sec h2{margin:0;font-size:1rem;font-weight:750;letter-spacing:-.035em}
.sec span{font-size:.75rem;color:var(--muted);font-weight:500}
.sec button.more{margin-left:auto;font-size:.77rem;color:var(--muted);font-weight:600}

/* ═══ 조감도 히어로 ═══ */
/* ★★★ 2026-09-17 밤 — 조감도 칸을 비율로 못 박는다 ★★★
   ─────────────────────────────────────────────────────
   예전에는 **높이만 258px 로 고정**이고 폭은 폰 따라 늘어났다.

       폰 폭 360 → 400 x 258 = 1.55
       폰 폭 412 → 452 x 258 = 1.75

   ★ 즉 **폰마다 잘리는 자리가 달랐다.**
     직원 화면에서 아무리 맞춰도 폰에서 다른 데가 나온다.
     맞출 수 있는 방법이 아예 없었던 것이다.

   ★ 비율을 못 박으면 어느 폰에서나 같은 자리가 나온다.
     480 / 300 = 1.6 — 폰 폭 440(=400+40)에서 높이 275px 쯤.
     예전 258px 과 비슷하면서 계산이 깔끔한 값으로 잡았다.

   ★ 직원 화면의 조절 상자 · 폰 미리보기도 **같은 비율**을 쓴다.
     세 곳이 같아야 맞춘 자리가 그대로 나간다. */
.shot{position:relative;margin:0 -20px;aspect-ratio:480 / 300;
  overflow:hidden;background:#0B1F3A}
.shot>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 38%;display:block;z-index:0}
.shot:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(11,31,58,.6) 0%,rgba(11,31,58,.1) 34%,
    rgba(11,31,58,.5) 66%,rgba(11,31,58,.92) 100%)}
.shot-txt{position:absolute;z-index:2;left:20px;right:20px;bottom:54px;color:#fff}
.shot-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.2);padding:5px 10px;border-radius:999px}
.shot-h1{font-size:1.4rem;font-weight:800;letter-spacing:-.05em;margin-top:11px;
  line-height:1.28;word-break:keep-all;text-shadow:0 2px 14px rgba(0,0,0,.4)}
.shot-sub{font-size:.76rem;color:rgba(255,255,255,.74);margin-top:5px;font-weight:500}
.credit{position:absolute;z-index:2;right:20px;bottom:60px;font-size:.61rem;
  color:rgba(255,255,255,.55);font-weight:600;background:rgba(0,0,0,.24);
  padding:3px 8px;border-radius:6px;backdrop-filter:blur(4px)}

/* ═══ 진행 카드 ═══ */
.prog{position:relative;z-index:3;margin-top:-36px;background:var(--paper);border-radius:22px;
  padding:19px 19px 17px;box-shadow:0 6px 28px rgba(11,31,58,.14);border:1px solid var(--line)}
.prog-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:17px}
.prog-top>b{font-size:.94rem;font-weight:750;letter-spacing:-.03em;padding-top:3px;
  word-break:keep-all}
.prog-top .dd{margin-left:auto;text-align:right}
.prog-top .dd b{display:block;font-size:1.06rem;font-weight:800;color:var(--amber);
  letter-spacing:-.04em;white-space:nowrap}
.prog-top .dd span{font-size:.65rem;color:var(--muted);font-weight:600;white-space:nowrap}
.track{height:3px;background:var(--line);border-radius:99px;position:relative;margin:0 4px 12px}
.track i{position:absolute;left:0;top:0;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#FFB27A,#F26419)}
.dots{display:flex;justify-content:space-between;margin:-19px 0 0}
.dot{width:11px;height:11px;border-radius:50%;background:#fff;border:2.5px solid var(--line)}
.dot.done{background:#F26419;border-color:#F26419}
.dot.now{background:#fff;border-color:#F26419;box-shadow:0 0 0 5px rgba(242,100,25,.18)}
/* ★ 아홉 칸은 폰에 안 들어간다. 좌우로 밀되 막대는 숨긴다.
   ★ 막대가 보이면 아래 글자를 덮어 「준공입주」가 잘린다. */
.progscroll{overflow-x:auto;margin:0 -3px;padding:0 3px;
  scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none}
.progscroll::-webkit-scrollbar{display:none}
.progline{min-width:100%;position:relative;padding-top:2px}
/* ★ 선은 첫 점 가운데 ~ 끝 점 가운데. 점 지름 11px 의 절반이 5.5px 이므로
   선(3px)의 위를 4px 에 둔다. 그래야 점 한가운데를 지난다. */
.ptrk{position:absolute;top:6px;height:3px;background:var(--line);
  border-radius:99px;overflow:hidden}
.ptrk i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,#FFB27A,#F26419)}
.progline .dots{display:flex;margin:0;position:relative;z-index:2}
.dcell{flex:1;display:flex;justify-content:center;min-width:0}
.progline .labels{display:flex;margin-top:9px}
.progline .labels span{flex:1;width:auto;min-width:0;text-align:center}
.labels{display:flex;justify-content:space-between;margin-top:9px}
.labels span{font-size:.62rem;color:#98A9BC;font-weight:600;width:44px;text-align:center;
  line-height:1.35}
.labels span.on{color:var(--navy)}
.prog-foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:20px}
.pf{flex:1}
.pf b{display:block;font-size:.97rem;font-weight:750;letter-spacing:-.03em}
.pf span{font-size:.68rem;color:var(--muted);font-weight:600}

/* ═══ KPI ═══ */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{background:var(--paper);border-radius:var(--r);padding:14px 11px 12px;box-shadow:var(--sh)}
.kpi .k-l{font-size:.68rem;color:var(--muted);font-weight:650;white-space:nowrap}
.kpi .k-v{font-size:1.22rem;font-weight:800;letter-spacing:-.05em;margin-top:5px;
  line-height:1.15;white-space:nowrap}
.kpi .k-v i{font-style:normal;font-size:.65rem;font-weight:650;color:var(--muted)}
.kpi .k-d{font-size:.69rem;font-weight:700;margin-top:5px}
.up{color:var(--amber)} .down{color:var(--blue)} .flat{color:var(--muted)}

/* ═══ 가로 스크롤 ═══ */
.scroller{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 4px;margin:0 -20px;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.hcard{flex:none;width:192px;scroll-snap-align:start;background:var(--paper);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh);border:1px solid var(--line)}
.hcard .h-t{font-size:.78rem;font-weight:650;color:var(--navy)}
.hcard .h-n{display:flex;align-items:baseline;gap:7px;margin-top:9px}
.hcard .h-b{font-size:.85rem;color:#9AABBD;text-decoration:line-through;
  text-decoration-color:#CBD6E2}
.hcard .h-a{font-size:1.2rem;font-weight:800;letter-spacing:-.045em}
.hcard .h-a i{font-style:normal;font-size:.68rem;font-weight:650;color:var(--muted)}
.pill{display:inline-block;margin-top:10px;font-size:.68rem;font-weight:750;
  padding:4px 8px;border-radius:7px}
.p-up{background:var(--amber-soft);color:var(--amber)}
.p-dn{background:var(--blue-soft);color:var(--blue)}
.hcard .h-p{margin-top:10px;color:var(--muted)}

/* ═══ 리스트 ═══ */
.list{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.li{display:flex;align-items:center;gap:13px;padding:15px 17px;width:100%;
  border-bottom:1px solid var(--line)}
.arow{border-bottom-color:var(--line)}
.box,.card,.warnbox{border-color:var(--edge)}
.li:last-child{border-bottom:0}
.li:active{background:var(--mist)}
.li-ic{width:36px;height:36px;border-radius:11px;background:var(--blue-soft);
  display:grid;place-items:center;flex:none}
.li-ic svg{width:18px;height:18px;color:var(--blue)}
.li-ic.amber{background:var(--amber-soft)} .li-ic.amber svg{color:var(--amber)}
.li-ic.ok{background:var(--ok-soft)} .li-ic.ok svg{color:var(--ok)}
.li-ic.gray{background:var(--mist)} .li-ic.gray svg{color:var(--muted)}
.li .tx{min-width:0;flex:1}
.li b{font-size:.9rem;font-weight:650;letter-spacing:-.028em;display:block;
  word-break:keep-all}
.li p{margin:2px 0 0;font-size:.74rem;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ch{color:#C3CFDC;flex:none}
.li .ch svg{width:16px;height:16px;display:block}
.badge{flex:none;font-size:.67rem;font-weight:750;padding:4px 8px;border-radius:7px}

/* ── 내려받기 단추 (2026-08-22 오후) ─────────────────────
   ★ 목록 줄(.li) 은 그 자체가 단추다.
     단추 안에 단추를 넣으면 안 되므로 아래에 한 줄을 따로 둔다.
     줄을 누르면 열리고, 이 단추를 누르면 파일로 떨어진다.

   ★ 폰에서 손가락으로 누를 크기여야 한다.
     글자만 작게 두면 옆의 「열기」와 겹쳐 잘못 눌린다.
     높이 34px · 좌우 여백을 넉넉히 준다.

   ★ 목록 줄과 한 덩어리로 보이게 위쪽 선을 없앤다.
     따로 떨어져 보이면 무엇에 딸린 단추인지 알 수 없다. */
.dlrow{display:flex;justify-content:flex-end;gap:7px;
  padding:0 17px 11px;border-bottom:1px solid var(--line);margin-top:-9px}

/* ── 한 자료를 한 줄로 (2026-09-16 밤) ──────────────────
   ★ 예전에는 한 건이 **두 줄**을 먹었다.
     제목 줄 + 내려받기 줄. 자료가 열 건이면 스무 줄이 되어
     아래쪽이 화면 밖으로 밀려난다. 자료는 앞으로 계속 는다.

   ★ 단추 안에 단추를 넣을 수 없으므로(줄 자체가 단추다)
     겹쳐 놓지 않고 **나란히 놓은 뒤 자리만 겹친다.**
     줄에 오른쪽 여백을 주고, 그 자리에 단추를 얹는다.

   ★ 선(border-bottom)은 바깥 상자가 긋는다.
     안쪽 둘이 각각 그으면 줄이 두 번 나온다. */
.arow{position:relative;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow > .li{border-bottom:0}
.arow > .dlrow{position:absolute;right:11px;top:0;bottom:0;
  align-items:center;padding:0;margin:0;border-bottom:0}

/* ★ 자료 줄은 제목이 한 줄에 들어가야 한다 (2026-09-16 밤).
   ─────────────────────────────────────────────────────
   360px 폰에서 「26-12차 이사회 속기록-260730」이 네 줄이 됐다.
   ① 받기 단추를 걷어 오른쪽을 통째로 비웠다
   ② 아이콘을 36 → 24px, 좌우 여백 17 → 14px
   → 제목에 쓸 폭이 130 → 298px 이 된다.

   ★ 조각난 자료(50MB 초과)만 단추를 남긴다.
     그것은 새 창으로 못 연다. 첫 조각만 열려 깨져 보인다. */
.li.arc{gap:10px;padding:14px}
.arow > .li.arc{padding-right:66px}
.arow.two > .li.arc{padding-right:124px}
.li-ic.sm{width:24px;height:24px;border-radius:8px}
.li-ic.sm svg{width:14px;height:14px}

/* ★ 폰에서 제목이 넉 줄로 쪼개졌다 (2026-09-16 밤).
   ─────────────────────────────────────────────────────
   360px 폰에서 남는 폭이 130px 뿐이라
   「26-12차 이사회 속기록-260730」이 네 줄이 됐다.

   ① 오른쪽에 비워 두는 자리를 104 → 68px
   ② 「검수 완료」 딱지를 아랫줄로 내린다 (70px 되찾음)
   ③ 「속기록-260730」처럼 붙임표로 이어진 긴 말은
      keep-all 때문에 안 쪼개져 넘쳐 나간다. 넘칠 때만 쪼갠다. */
.li b{overflow-wrap:anywhere}
.arow .st{font-style:normal;font-weight:750;color:var(--ok)}
.arow .st.wait{color:var(--muted)}
.dl{display:inline-flex;align-items:center;gap:5px;
  border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:.74rem;font-weight:700;color:var(--navy);
  white-space:nowrap;
  background:#fff}
.dl:hover{background:var(--mist)}
.dl:disabled{color:var(--muted);border-color:var(--line)}
.dl svg{width:15px;height:15px}

/* ── 직원이 확인한 답 (2026-08-22 밤) ────────────────────
   ★ 답 아래에 반드시 원문 단추가 붙는다.
     답만 덩그러니 보이면 「다알아가 그랬다」가 된다.
     조합원이 그 자리에서 원문을 열어 대조하실 수 있어야 한다. */
.qacard{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}
.qa-a{margin:0;padding:12px 14px;font-size:.86rem;line-height:1.7;color:var(--ink);
  border-bottom:1px solid var(--line);background:#F8FAFD}
.qacard > .btn{border:0;border-radius:0}

/* ── 사무실 위치 지도 (2026-08-23) ───────────────────────
   ★ 지금은 그림 한 장이다. 카카오 지도 API 키를 받으시면
     같은 자리에 진짜 지도가 들어간다.
       hub.js 에 KAKAO_JS_KEY 를 넣고 이 자리를 지도로 바꾼다.
     ★ 도메인 제한을 반드시 걸 것. 안 걸면 남이 퍼가서 쓰고
       요금은 조합에 청구된다.

   ★ 그림을 누르면 길찾기 앱이 열린다.
     어르신들은 「지도를 눌러 보시는」 것이 자연스럽다.
     단추를 찾아 누르시라고 하면 안 누르신다. */
.mapbox{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapbox img{display:block;width:100%;height:auto;cursor:pointer}
.mapbtn{display:flex;gap:7px;padding:9px;background:var(--mist)}
.mapbtn button{flex:1;border-radius:9px;padding:10px;font-size:.84rem;font-weight:700;border:0}

/* ── 사무실 줄 (2026-08-23) ──────────────────────────────
   ★ 줄 하나에 두 가지 일이 들어간다.
       줄 전체를 누르면   사무실 화면 (주소 · 지도 · 찾아오는 길)
       전화 단추를 누르면  바로 전화
     그래서 단추 안에 단추를 넣지 않고 나란히 놓는다.

   ★ 「찾아오시는 길」 줄을 따로 두었다가 없앴다.
     같은 화면을 여는 줄이 둘이면 조합원이 「무엇이 다르지」 하신다.
     사무실을 한 번 누르면 주소 · 전화 · 지도가 다 보인다. */
.offli{padding:0;gap:0}
.offmain{display:flex;align-items:flex-start;gap:13px;flex:1;min-width:0;
  padding:15px 6px 15px 17px;text-align:left;background:transparent}
.offmain .tx em{font-style:normal;color:var(--blue);font-weight:700}
.offtel{flex:none;width:44px;height:44px;margin:0 15px 0 4px;align-self:center;
  border:1px solid var(--navy);border-radius:11px;background:#fff;
  display:flex;align-items:center;justify-content:center}
.offtel:hover{background:var(--mist)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-gray{background:var(--mist);color:var(--muted)}
.b-warn{background:var(--warn-soft);color:var(--warn)}

/* ═══ 소식 피드 ═══ */
.filter{display:flex;gap:6px;overflow-x:auto;padding:2px 20px 12px;margin:0 -20px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:999px;padding:7px 14px;font-size:.79rem;font-weight:650;text-align:center}
.filter button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.feed{display:flex;flex-direction:column;gap:10px}
.fi{background:var(--paper);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh);
  border:1px solid var(--line);width:100%;display:block}
.fi-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.fi-date{margin-left:auto;font-size:.72rem;color:var(--muted);font-weight:600}

  line-height:1.42;word-break:keep-all}
.fi p{margin:6px 0 0;font-size:.79rem;color:var(--muted);line-height:1.55;word-break:keep-all}
.fi-foot{margin-top:11px;display:flex;align-items:center;gap:8px}
.dday-chip{font-size:.7rem;font-weight:750;color:#fff;background:var(--amber);
  padding:4px 9px;border-radius:7px}
.sample{background:var(--warn-soft);border:1px solid #F5D9B0;border-radius:var(--r-sm);
  padding:12px 14px;font-size:.77rem;color:var(--warn);line-height:1.6;margin-bottom:12px}
.sample > b:first-child{display:block;font-weight:750;margin-bottom:2px}

/* ═══ 잠금 / 빈 상태 ═══ */
.lock{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:28px 22px;
  text-align:center}
.lock-ic{width:52px;height:52px;border-radius:16px;background:var(--blue-soft);margin:0 auto 14px;
  display:grid;place-items:center}
.lock-ic svg{width:24px;height:24px;color:var(--blue)}
.lock b{display:block;font-size:1.04rem;font-weight:750;letter-spacing:-.03em}
.lock p{margin:7px 0 0;font-size:.81rem;color:var(--muted);line-height:1.65;word-break:keep-all}
.btn{display:block;width:100%;margin-top:16px;background:var(--blue);color:#fff;
  border-radius:13px;padding:14px;font-size:.92rem;font-weight:700;text-align:center}
.btn.ghost{background:var(--paper);color:var(--navy);border:1px solid var(--line)}
.empty{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);padding:30px 22px;

.blur{filter:blur(5px);opacity:.55;pointer-events:none;user-select:none}


/* ═══ 계산기 ═══ */
.calc-note{background:var(--blue-soft);border:1px solid #D9E7FB;border-radius:var(--r-sm);
  padding:13px 15px;font-size:.78rem;color:#2A4E7E;line-height:1.62;margin-bottom:16px;

.calc-note > b:first-child{display:block;font-weight:750;margin-bottom:3px;color:var(--navy)}
.fset{background:var(--paper);border-radius:var(--r);box-shadow:var(--sh);
  padding:17px 17px 15px;margin-bottom:11px}
.fl{display:flex;align-items:center;gap:7px;font-size:.87rem;font-weight:700;
  letter-spacing:-.028em;margin-bottom:9px}
.stepn{width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;
  font-size:.66rem;font-weight:800;display:grid;place-items:center;flex:none}
.stepn.light{background:rgba(255,255,255,.28)}
.qm{width:19px;height:19px;border-radius:50%;background:var(--mist);color:var(--muted);
  font-size:.68rem;font-weight:800;display:grid;place-items:center;flex:none;margin-left:-1px}
.inp{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
  border-radius:12px;padding:0 14px;background:var(--mist);transition:.16s}
.inp:focus-within{border-color:var(--blue);background:var(--paper);

.inp input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;

.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0}
.inp input[type=number]{-moz-appearance:textfield}
.inp span{font-size:.84rem;font-weight:700;color:var(--muted);flex:none}
.fh{margin:8px 0 0;font-size:.74rem;color:var(--muted);line-height:1.55;word-break:keep-all}
.quick{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.qb{border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:8px;padding:6px 11px;font-size:.76rem;font-weight:700}
.qb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mid{background:var(--paper);border:1px dashed #C9D8EA;border-radius:var(--r);
  padding:16px 17px;margin-bottom:11px}
.mid-l{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;
  color:var(--navy)}
.mid-v{font-size:1.62rem;font-weight:800;letter-spacing:-.045em;margin-top:7px;
  color:var(--navy)}
.mid-f{font-size:.73rem;color:var(--muted);margin-top:5px}
.mid.empty-mid{display:flex;align-items:center;gap:8px;color:var(--muted);
  font-size:.82rem;font-weight:600;padding:15px 17px}
.res{border-radius:var(--r);padding:19px 18px;margin-top:4px;color:#fff}
.res.pay{background:linear-gradient(135deg,#F2802F,#E8590C)}
.res.get{background:linear-gradient(135deg,#2C7BE5,#1B5FBF)}
.res-l{display:flex;align-items:center;gap:8px;font-size:.83rem;font-weight:700;
  color:rgba(255,255,255,.86)}
.res-v{font-size:1.95rem;font-weight:800;letter-spacing:-.05em;margin-top:8px;line-height:1.1}
.res-f{font-size:.73rem;color:rgba(255,255,255,.72);margin-top:7px}
.res.idle{background:var(--paper);border:1px dashed #C9D8EA;color:var(--muted);
  display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;padding:16px 17px}
.res-warn{margin-top:11px;background:var(--warn-soft);border:1px solid #F5D9B0;
  border-radius:12px;padding:12px 14px;font-size:.76rem;color:var(--warn);
  line-height:1.6;word-break:keep-all}
.stage{display:flex;align-items:center;gap:11px;padding:13px 0;
  border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage .sn{width:22px;height:22px;border-radius:7px;background:var(--mist);
  color:var(--muted);font-size:.68rem;font-weight:800;display:grid;place-items:center;flex:none}
.stage.done .sn{background:var(--ok-soft);color:var(--ok)}
.stage .tx{flex:1;min-width:0}
.stage b{font-size:.85rem;font-weight:650;display:block}
.stage p{margin:2px 0 0;font-size:.73rem;color:var(--muted)}

/* ═══ 토글 ═══ */
.tg{width:44px;height:26px;border-radius:99px;background:#D8E1EA;position:relative;flex:none;
  transition:.2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s var(--ease)}
.tg.on{background:var(--blue)} .tg.on:after{left:21px}

/* ═══ 문서 ═══ */
.searchbox{position:relative;margin-bottom:14px}
.searchbox input{width:100%;border:1px solid var(--line);background:var(--paper);
  border-radius:13px;padding:13px 15px 13px 42px;font:inherit;font-size:.9rem;
  box-shadow:var(--sh)}
.searchbox input:focus{outline:none;border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:17px;height:17px;color:#9AABBD}

/* ═══ 통계 ═══ */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat div{background:var(--paper);border-radius:var(--r);padding:15px 12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:1.42rem;font-weight:800;letter-spacing:-.045em;line-height:1.15}
.stat span{font-size:.7rem;color:var(--muted);font-weight:650}
.bar{height:6px;background:var(--mist);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.trow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow b{font-size:.83rem;font-weight:650;width:70px;flex:none;color:var(--navy)}
.trow .bar{flex:1} .trow em{font-style:normal;font-size:.76rem;color:var(--muted);
  flex:none;width:52px;text-align:right}

.note{font-size:.73rem;color:var(--muted);line-height:1.65;margin:16px 2px 0}


/* ═══ 회원가입 ═══ */
.auth{position:fixed;inset:0;z-index:80;background:var(--paper);display:none;
  flex-direction:column;overflow:hidden}
.auth.on{display:flex}
.au-hero{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:calc(56px + env(safe-area-inset-top)) 26px calc(26px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 90% at 50% 0%,#F0F5FC 0%,#fff 62%)}
.au-logo{width:74px;height:auto;display:block}
.au-wm{font-size:2rem;font-weight:800;letter-spacing:-.06em;color:var(--navy);margin-top:12px}
.au-wm span{color:var(--amber)}
.au-en{font-size:.78rem;font-weight:800;letter-spacing:.16em;color:#9FB0C4;margin-top:1px}
.au-tag{font-size:.86rem;color:var(--muted);margin:11px 0 0;font-weight:500}
.au-pts{width:100%;margin-top:36px;display:flex;flex-direction:column;gap:13px}
.au-pts div{background:var(--paper);border:1px solid var(--line);border-radius:15px;
  padding:14px 16px;box-shadow:var(--sh)}
.au-pts b{display:block;font-size:.9rem;font-weight:700;letter-spacing:-.03em}
.au-pts span{font-size:.76rem;color:var(--muted)}
.au-btm{width:100%;margin-top:auto;padding-top:26px}
.au-skip{display:block;width:100%;margin-top:12px;padding:12px;font-size:.85rem;
  font-weight:650;color:var(--muted);text-align:center}
.au-head{padding:calc(18px + env(safe-area-inset-top)) 22px 16px;display:flex;gap:12px;
  align-items:flex-start;flex:none}
.au-back{width:32px;height:32px;margin:-4px 0 0 -6px;color:var(--navy);flex:none}
.au-back svg{width:22px;height:22px}
.au-head b{display:block;font-size:1.24rem;font-weight:780;letter-spacing:-.04em;
  line-height:1.35;word-break:keep-all}
.au-head p{margin:6px 0 0;font-size:.82rem;color:var(--muted)}
.au-body{flex:1;overflow-y:auto;padding:6px 22px 20px}
.au-body.center{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px 26px}
.au-big{font-size:1.16rem;font-weight:780;letter-spacing:-.04em;margin-top:18px;
  word-break:keep-all;line-height:1.42}
.au-note{font-size:.76rem;color:var(--muted);line-height:1.65;margin:14px 0 0;word-break:keep-all}
.au-note.center{text-align:center}
.au-foot{flex:none;padding:12px 22px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--paper)}
.au-foot .btn{margin-top:0}
.btn.off{background:#DDE4EC;color:#9FB0C4;pointer-events:none}
/* ★ 인증 전에는 열리지 않는 줄. 눌러 보게 하면 헛걸음이 된다. */
.li.off{opacity:.5;pointer-events:none}
.au-link{font-size:.79rem;font-weight:650;color:var(--muted);padding:8px 0}
.ag{display:flex;align-items:center;gap:11px;width:100%;padding:13px 2px}
.ag.all{border-bottom:1px solid var(--line);padding:15px 2px;margin-bottom:5px}
.ag.all b{font-size:.98rem;font-weight:750;letter-spacing:-.03em}
.ck{width:23px;height:23px;border-radius:50%;background:#E3EAF2;color:#fff;flex:none;
  display:grid;place-items:center}
.ck svg{width:14px;height:14px}
.ag.on .ck{background:var(--blue)}
.ck.ok{background:var(--ok)} .ck.no{background:#D9E1EA;font-size:.72rem;font-weight:800;
  color:#fff;line-height:1}
.ag-l{font-size:.86rem;color:#43566B;flex:1;text-align:left}
.ag-l em{font-style:normal;color:var(--blue);font-weight:700}
.ag-l i{font-style:normal;color:var(--muted);font-weight:600}
.ag-v{font-size:.75rem;color:#A8B7C7;font-weight:600;flex:none}
.carriers{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.carriers span{border:1px solid var(--line);background:var(--paper);border-radius:8px;
  padding:7px 13px;font-size:.78rem;font-weight:650;color:var(--muted)}
.code-wrap{position:relative;margin-top:8px}
.code-wrap input{width:100%;border:1px solid var(--line);background:var(--mist);
  border-radius:14px;padding:19px 62px 19px 20px;font:inherit;font-size:1.7rem;font-weight:800;
  letter-spacing:.34em;font-variant-numeric:tabular-nums;outline:none;color:var(--ink)}
.code-wrap input:focus{border-color:var(--blue);background:var(--paper);
  box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.timer{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:.86rem;
  font-weight:750;color:var(--amber);font-variant-numeric:tabular-nums}
.code-row{display:flex;justify-content:space-between;margin-top:4px}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);
  border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.res-ic{width:66px;height:66px;border-radius:22px;display:grid;place-items:center}
.res-ic.ok{background:var(--ok-soft);color:var(--ok)}
.res-ic.guest{background:var(--blue-soft);color:var(--blue)}
.res-ic svg{width:32px;height:32px}
.au-grant{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:11px;text-align:left}
.au-grant>div{display:flex;align-items:center;gap:10px;font-size:.85rem;font-weight:600;
  color:#43566B}
.au-help{display:block!important;background:var(--mist);border-radius:12px;padding:13px 15px;
  font-size:.78rem;color:var(--muted);line-height:1.6;font-weight:500;margin-top:4px}

/* ═══ 탭바 ═══ */
/* ★ 여섯 갈래다. 폭이 좁아지므로 글자와 아이콘을 함께 줄인다.
   작은 폰(360px)에서 한 칸이 60px이라 「내정보」 네 글자가 겨우 들어간다. */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{padding:5px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:.62rem;font-weight:700;color:#9AABBD;position:relative;
  white-space:nowrap;letter-spacing:-.02em}
.tab svg{width:20px;height:20px}
@media(max-width:340px){.tab{font-size:.58rem}.tab svg{width:18px;height:18px}}
.tab.on{color:var(--blue)}
/* ★ 지금 보는 칸을 동그라미로 알린다 (2026-09-20).
   ★ 연한 바탕이다. 꽉 채우면 소식의 **빨간 점**보다 더 눈에 띄어
     새 소식을 놓치신다.
   ★ 그림만 감싼다. 글자까지 감싸면 칸이 좁아 글자가 접힌다. */
.tic{display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;background:transparent;
  transition:background .15s}
/* ★★★ 2026-09-20 — 동그라미가 안 보이던 것 ★★★
   #E8F0FA 는 흰 바탕과 **1.15:1** 이라 눈에 거의 안 띈다.
   「모양이 안 나온다」 하셨는데 실은 나오고 있었다. **너무 연했다.**

   ★ 색을 눈대중으로 고르면 이렇게 된다. **수치로 재야** 한다.
       1.2:1 아래   거의 안 보임
       1.4:1 쯤     「있구나」 하고 보임
   ★ 색을 정할 때 **둘을 함께** 봐야 한다.
       동그라미 vs 흰 바탕   1.4:1 넘어야 보인다
       그림 vs 동그라미      4.5:1 넘어야 그림이 안 묻힌다
     동그라미만 진하게 하면 **그림이 묻힌다.** 그래서 그림도 진하게 했다.

   ★ #A6C2E8 + 진한 남색 그림
       동그라미 1.83:1 · 그림 6.69:1 — 둘 다 넉넉하다. */
/* ★ 그림은 stroke="currentColor" 라 **글자 색을 따라간다.**
   .tic 에 색을 주면 그림만 바뀌고 아래 글자는 그대로다.

   ★ 동그라미는 **우리집(.mark)에만** 붙는다. 늘 붙어 있다.
     지금 보는 칸은 글자와 그림 색(.tab.on)으로 알린다. */
.tic.mark{background:#A6C2E8;box-shadow:inset 0 0 0 1px #8FB2DE;color:#12365F}

@media(max-width:340px){.tic{width:30px;height:30px}}
.tab .nd{position:absolute;top:4px;right:calc(50% - 17px);width:6px;height:6px;border-radius:50%;
  background:var(--amber)}

     조합원이 13억인지 6,500만원인지 헷갈리신다.

   ★ 평형과 전용을 **한 칸에 위아래로** 담아 넷을 셋으로 줄였다.

   ★★★ 금액은 절대 줄바꿈하지 않는다 ★★★
     nowrap 이 없으면 폭이 조금만 좁아도 다시 끊긴다.
     차라리 글자를 줄이는 편이 낫다. */

/* ═══════════════════════════════════════════════════════════

   ★ 표는 폰에서 깨알같이 작다. 가로 920px 표가 360px 폰에
     들어가면 2.6분의 1이다. **눌러서 크게 보기**가 꼭 필요하다.
   ★ 가로세로를 미리 잡아 둔다(aspect-ratio). 안 그러면
     사진이 뜰 때 **아래 글이 툭 밀린다.**
   ═══════════════════════════════════════════════════════════ */
.nwshot{display:block;width:100%;margin:11px 0;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;background:var(--mist);position:relative;
  padding:0;cursor:zoom-in}

  -webkit-overflow-scrolling:touch}

.nwbad{display:none;position:absolute;inset:0;align-items:center;justify-content:center;

.nwshot.bad .nwbad{display:flex}
.nwshot.bad .nwzoom{display:none}
.nwshot.bad img{display:none}

/* ═══════════════════════════════════════════════════════════
   자료 하나의 질문과 답 (2026-09-19)
   ★ 한글 · 워드는 폰에서 다운로드만 걸리고 안 열린다.
     고시문 PDF 는 21MB · 64쪽이라 열려도 어디를 볼지 모르신다.
     조합이 원문과 대조해 적어 둔 질문과 답을 **먼저** 보여 드린다.
   ★ 질문만 보이고 **눌러야 답이 펼쳐진다.**
     서른 개가 넘으면 다 펼쳐진 것이 되레 못 읽는다.
   ═══════════════════════════════════════════════════════════ */
.qahd{padding-bottom:11px;border-bottom:1px solid var(--line)}
.qahd b{display:block;font-size:.95rem;font-weight:800;line-height:1.5}
.qahd span{display:block;font-size:.76rem;color:var(--muted);margin-top:4px}
.qabtns{display:flex;gap:8px;margin-top:12px}
.qabtn{flex:1;border:1px solid var(--edge);background:#fff;border-radius:11px;
  padding:11px 9px;text-align:center}
.qabtn b{display:block;font-size:.84rem;font-weight:800;color:var(--navy)}
.qabtn em{display:block;font-style:normal;font-size:.7rem;color:var(--muted);margin-top:3px}
.qabtn.on{background:var(--navy);border-color:var(--navy)}
.qabtn.on b{color:#fff}
.qabtn.on em{color:#B9C9DD}
.qawarn{background:#FFF4EC;border:1px solid #F7C9A8;border-radius:11px;
  padding:10px 12px;margin-top:11px}
.qawarn b{display:block;font-size:.83rem;color:#8C3A12}
.qawarn p{margin:4px 0 0;font-size:.78rem;color:#A85B33;line-height:1.7}
.qanote{margin:14px 0 8px;font-size:.78rem;color:var(--muted);line-height:1.7}
.qalist{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qaitem{border-bottom:1px solid var(--line)}
.qaitem:last-child{border-bottom:0}
.qaitem.on{background:#F7FBFF}
.qaq{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:13px 14px;background:transparent;border:0}
.qaq span{flex:1;min-width:0;font-size:.85rem;font-weight:700;line-height:1.6;color:var(--ink)}
.qaq i{flex:none;font-style:normal;color:#A9B6C6;font-size:.9rem;margin-top:2px}
.qaitem.on .qaq span{color:var(--navy)}
.qaa{padding:0 14px 13px}
.qaa p{margin:0;font-size:.83rem;color:#41576B;line-height:1.8;white-space:pre-line}
.qaa p.none{color:var(--muted);font-style:italic}
.qafoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.qago{border:1px solid #BFD8F2;background:#fff;color:#1D5FA8;border-radius:9px;
  padding:6px 13px;font-size:.78rem;font-weight:700}
.qago:hover{background:#EFF5FF}
.qaat{font-size:.72rem;color:var(--muted);background:var(--mist);
  padding:3px 9px;border-radius:99px}
.qaempty{background:var(--mist);border-radius:12px;padding:18px 15px;
  text-align:center;margin-top:14px}
.qaempty b{display:block;font-size:.88rem;color:var(--ink)}
.qaempty p{margin:6px 0 0;font-size:.79rem;color:var(--muted);line-height:1.8}
</style>

const mask = n => {
  const s = String(n ?? "").trim();
  if(!s) return "";
  return s.length <= 2 ? s[0] + "*"
                       : s[0] + "*".repeat(s.length - 2) + s[s.length - 1];
};

/* 억/만원 읽기 쉬운 표기 : 12345 만원 → 1억 2,345만원 */
function krw(man){
  if(man===null||isNaN(man)) return "—";
  const neg = man<0; const v = Math.abs(Math.round(man));
  const eok = Math.floor(v/10000), rest = v%10000;
  let s = eok? `${won(eok)}억${rest?" "+won(rest)+"만":""}` : `${won(rest)}만`;
  return (neg?"−":"")+s+"원";
}

function calcResult(){
  const {appraisal, ratio, price} = CALC;
  if(appraisal===null) return null;
  const right = Math.round(appraisal * (ratio/100));      // ③ 권리가액
  if(price===null) return {right, share:null};
  const share = price - right;                            // ⑤ 분담금
  return {right, share};
}

/* ═══════════════════════════════════════════════════════════
   ★★★ 2026-09-17 밤 — 폰에서 숫자가 안 들어가던 것 ★★★
   ───────────────────────────────────────────────────────────
   예상 감정가액과 예상 분양가에 아무리 쳐도 값이 안 들어갔다.

   ★ 까닭 — <input type="number"> 는 **커서 자리를 못 읽는다.**

       const pos = active.selectionStart;    ← 여기서 오류가 난다
       (Chrome: InvalidStateError)

     치자마자 redrawCalc() 가 커서를 되돌리려고 이 줄을 밟고
     **그 자리에서 멈춘다.** 값이 담기지 않는다.

   ★ 그리고 type="number" 는 **쉼표를 못 받는다.**
     45,000 을 치면 칸이 통째로 비어 버린다.

   ★ 그래서 글자칸(type="text")으로 바꾸고 쉼표를 직접 찍는다.
     inputmode="numeric" 을 두어 폰에서는 **숫자 자판**이 올라온다.

   ★★★ 커서가 튀지 않게 한다 ★★★
     쉼표를 넣으면 글자 수가 달라져 커서가 맨 뒤로 간다.
     **글자 자리가 아니라 숫자 개수**로 세어 되돌린다.
     구역 제원에서 쓴 것과 같은 방법이다 (89-3절).
   ═══════════════════════════════════════════════════════════ */
function cman(v){
  if(v === null || v === undefined || v === "" || isNaN(Number(v))) return "";
  return Number(v).toLocaleString("ko-KR");
}

function calcType(el, key){
  const raw = el.value;
  const pos = el.selectionStart;                 /* 글자칸이라 안전하다 */
  const before = raw.slice(0, pos).replace(/[^0-9]/g, "").length;

  if(key === "ratio"){
    /* 비례율은 소수점이 있다. 쉼표는 안 찍는다. */
    const t = raw.replace(/[^0-9.]/g, "");
    CALC.ratio = t === "" ? 100 : Number(t);
    el.value = t;
    redrawCalc(key, t.length);
    return;
  }

  const digits = raw.replace(/[^0-9]/g, "");
  CALC[key] = digits === "" ? null : Number(digits);
  el.value = cman(digits);

  /* 같은 숫자 개수 자리로 커서를 돌려놓는다 */
  let n = 0, i = 0;
  for(; i < el.value.length && n < before; i++)
    if(/[0-9]/.test(el.value[i])) n++;
  redrawCalc(key, i);
}

/* 평당 금액 — 3.3058㎡ 가 1평 */
function manPy(man, m2){
  const v = Number(man), a = Number(m2);
  if(!v || !a || isNaN(v) || isNaN(a)) return null;
  return Math.round(v / (a / 3.3058));
}

}

/* ── 명부 대조 (목업) ──────────────────────────────────────
   실제로는 CI 해시를 조합원 명부(daara_registry)와 대조한다.
   여기서는 휴대폰 끝자리가 홀수면 조합원, 짝수면 미등록으로 흉내낸다. */
function matchRegistry(){
  /* ★ 한글은 겉보기가 같아도 담기는 방식이 두 가지다.
     "조성은"이 세 글자로 들어올 수도, 여덟 조각으로 들어올 수도 있다.
     화면에는 똑같이 보이는데 컴퓨터는 다른 것으로 보아 명부 대조가 실패한다.
     폰 키보드와 자동완성에서 자주 생긴다.
     모양을 하나로 맞춘 뒤 비교한다. */
  const norm = v => String(v||"").normalize("NFC").trim();
  const nm = norm(AUTH.name);
  const d  = String(AUTH.phone||"").replace(/\D/g,"");
  const cd = norm(AUTH.code);

  /* ★ 명부 대조 (시연)
     이름 + 휴대폰번호가 명부와 맞고 암호가 111111 이면 그 조합원으로 들어간다.
     실제로는 본인확인기관에서 받은 CI 해시를 서버의 명부와 대조해야 한다.
     명부를 화면 파일에 두는 것은 시연이라서 가능한 일이다. */
  if(typeof ROSTER !== "undefined" && cd === ROSTER_PW){
    const hit = ROSTER.find(r =>
      String(r.name||"").normalize("NFC").trim() === nm
      && String(r.phone||"").replace(/\D/g,"") === d);
    if(hit) return {type:"member", memberNo:memberNo(hit.no), name:hit.name, rec:hit};
  }

  /* ★ 테스트 모드 : 명부에 없어도 화면은 볼 수 있게 통과시킨다.
     번호를 비워두면 조합원, 넣었으면 끝자리 홀수=조합원 짝수=일반회원. */
  const isMember = d === "" ? true : (Number(d.slice(-1)) % 2) === 1;
  return isMember
    ? {type:"member", memberNo:"제 1207 호", name:nm||"조합원", rec:null}
    : {type:"guest",  memberNo:null,        name:nm||"방문자", rec:null};
}
const memberNo = n => "제 " + String(n).padStart(4,"0") + " 호";

function renderAuth(){
  const w=document.getElementById('auth');
  w.className = AUTH.on?'auth on':'auth';
  if(!AUTH.on){w.innerHTML='';return;}
  w.innerHTML=authView();
  bindAuth();
  /* ★ 본인확인 화면의 로고도 끼운다 (2026-09-17) */
  try{ if(typeof heroFill !== "undefined") heroFill(); }catch(e){}
}

function bindAuth(){
  const w=document.getElementById('auth');

  w.querySelectorAll('[data-au]').forEach(b=>b.onclick=()=>{
    const v=b.dataset.au;
    if(v==='') return;
    if(v==='skip'){authClose();return}
    if(v==='back'){AUTH.step=Math.max(0,AUTH.step-1);renderAuth();return}
    if(v==='resend'){startTimer();return}
    if(v==='pass'||v==='nice'){ AUTH.how=v; AUTH.step=2; renderAuth(); return }
    if(v==='done'){ME.logged=true;authClose();cur='my';render();return}
    AUTH.step=Number(v);
    if(AUTH.step===3) startTimer();
    if(AUTH.step===4){
      renderAuth();
      setTimeout(()=>{const r=matchRegistry();ME.type=r.type;ME.name=r.name;
        ME.memberNo=r.memberNo;ME.rec=r.rec||null;
        /* 본인확인이 끝나면 세션을 발급한다. 이후 90일은 인증 없이 쓰신다. */
        if(typeof idvIssue!=="undefined" && r.type==="member")
          idvIssue(r.memberNo, r.name, AUTH.how||"pass");
        AUTH.step=5;renderAuth()},1600);
      return;
    }
    renderAuth();
  });

  w.querySelectorAll('[data-ag]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ag;
    if(k==='all'){const v=!AGREE.all;AGREE.all=v;AGREE_ITEMS.forEach(([kk])=>AGREE[kk]=v)}
    else{AGREE[k]=!AGREE[k];AGREE.all=AGREE_ITEMS.every(([kk])=>AGREE[kk])}
    renderAuth();
  });

  const n=document.getElementById('a-name');
  if(n) n.oninput=e=>{AUTH.name=e.target.value;};   /* ★ 테스트 모드 : 검사 없음 */

  const p=document.getElementById('a-phone');
  if(p) p.oninput=e=>{
    const c=e.target.selectionStart; AUTH.phone=phoneFmt(e.target.value);
    e.target.value=AUTH.phone; try{e.target.setSelectionRange(c+1,c+1)}catch(_){}
  };   /* ★ 테스트 모드 : 검사 없음 */

  const c=document.getElementById('a-code');
  if(c){c.oninput=e=>{AUTH.code=e.target.value.replace(/\D/g,'').slice(0,6);
    e.target.value=AUTH.code;};   /* ★ 테스트 모드 : 검사 없음 */
    c.focus();}
}

    표는 저장되지 않고 문자도 실제로 나가지 않습니다.</div>

  <div class="vbox" style="margin-top:0">
    <h4>투표 기간</h4>
    <div class="vrow"><span>시작</span><b>${MEETING.voteOpen}</b></div>
    <div class="vrow"><span>마감</span><b>${MEETING.voteClose}</b></div>
    <div class="vrow"><span>총회 당일</span><b>${MEETING.date} · ${MEETING.place}</b></div>
  </div>

  <div class="sec" style="margin-top:16px"><h2>안건</h2>
    <span>${VOTE.sent?"제출 완료":`투표 ${voteCount()}/${total}`}</span></div>

  ${AGENDA.map(a=>{
    const pk = VOTE.pick[a.no];
    const chip = !a.vote ? `<span class="vchip rep">표결 없음</span>`
      : pk ? `<span class="vchip done">${VLABEL[pk]}</span>`
           : `<span class="vchip">미투표</span>`;
    return `<button class="agenda tap" data-ag2="${a.no}"
      style="${!pk&&a.vote?'border-color:var(--navy)':''}">
      <span class="ag-b">
        <span class="ag-no" style="${a.vote?'':'color:var(--muted)'}">제${a.no}호 의안 · ${a.vote?'의결':'보고'}</span>
        <b style="display:block;margin-top:3px">${a.t}</b>
        <p>${a.s}</p>
      </span>${chip}</button>`;
  }).join('')}

  ${VOTE.sent
    ? `<button class="btn ghost" data-vres="1" style="margin-top:14px">집계 결과 보기</button>`
    : `<button class="btn ${voteDone()?'':'off'}" data-vsend="${voteDone()?'1':''}"
         style="margin-top:14px">전자투표 제출하기</button>`}

  <div style="text-align:center;margin-top:12px">
    <button class="backlink" data-vinfo="1" style="padding:0">전자투표는 어떻게 진행되나요?</button></div>

  <div class="sh-ft">조합에서 등록한 공고만 표시됩니다.<br>
    법적 효력은 조합이 발송한 소집통지서에 있습니다.</div>`,
  n.t, `${n.type} · ${n.date}`);
  bindMeeting(n);
}

function bindMeeting(n){
  sb.querySelectorAll('[data-ag2]').forEach(b=>b.onclick=()=>
    openAgenda(AGENDA.find(a=>a.no===+b.dataset.ag2), n));
  sb.querySelectorAll('[data-vinfo]').forEach(b=>b.onclick=()=>openVoteInfo(n));
  sb.querySelectorAll('[data-vres]').forEach(b=>b.onclick=()=>openTally(n));
  sb.querySelectorAll('[data-vsend]').forEach(b=>b.onclick=()=>{
    if(!b.dataset.vsend) return;
    /* ★ 투표함에 넣기 직전에 한 번 더 확인한다.
       안건 제목에 시공자·해임 같은 말이 있으면 PASS 를 요구한다. */
    if(!memberOnly("전자투표")) return;
    const titles = AGENDA.filter(a=>a.type==='의결').map(a=>a.t).join(" ");
    needReauth("vote", titles, how => {
      VOTE.sent=true;
      VOTE.serial='V-'+MEETING.date.slice(0,4)+'-0428';
      VOTE.how=how;
      openReceipt(n);
    });
  });
}

/* ══ 전자동의서 ═══════════════════════════════════════════
   ★ 동의서는 소송에서 가장 치열하게 다투는 서류다.
     조합설립 인가가 취소되는 사건은 대부분 여기서 시작한다.
     그래서 절차를 일부러 무겁게 잡았다.

       ① 요건 안내를 먼저 읽히고
       ② 서식을 끝까지 내려 본 뒤에야 동의 칸이 열리고
       ③ PASS 본인인증을 반드시 거치고
       ④ 완료증에 시각과 서명값을 남긴다

   ★ PIN · 생체로는 낼 수 없다.
     본인확인기관 식별값을 명부와 대조해야 증거 능력이 선다. */
const CS = {form:null, read:false, choice:null, addr:""};

/* ① 요건 안내 — 진입하면 이것부터 */
function openConsent(){
  const list = (typeof consentOpen!=="undefined") ? consentOpen() : [];
  const N = CONSENT_NOTICE;
  open(`
  <div class="warnbox hard"><b>${N.title}</b><p>${N.sub}</p></div>

  ${N.items.map(x=>`<div class="cs-note">
    <b>${x.h}</b><p>${x.b}</p></div>`).join('')}

  <div class="calc-note" style="border:1.5px solid var(--amber);background:#FFF6F1">
    <b style="color:#8C3A12">${N.caveat}</b>
    지금은 조합에서 확정한 서식이 아니라 뼈대만 담은 화면입니다.
    실제 징구는 조합 자문 변호사 확인을 거친 뒤에 시작됩니다.
  </div>

  <div class="sec" style="margin-top:16px"><h2>징구 중인 동의서</h2>
    <span>${list.length}건</span></div>
  ${list.length ? list.map(f=>{
    const done = ME.rec ? consentDone(f.id, ME.rec.no) : null;
    return `<button class="li" data-csf="${f.id}" style="width:100%;text-align:left">
      <span class="li-ic ${done?'ok':''}">${ic(P.doc)}</span>
      <span class="tx"><b>${f.name}</b>
        <p>${f.law}<br>${f.quorum.desc}</p>
        <p style="color:var(--muted)">${f.from} ~ ${f.to}</p></span>
      <span class="badge ${done?'b-ok':'b-amber'}">${done?'제출함':'미제출'}</span>
    </button>`;}).join('')
   : `<p class="note">지금 징구 중인 동의서가 없습니다.</p>`}

  ${ME.rec ? "" : `<div class="calc-note" style="margin-top:13px">
    <b>명부에서 확인되지 않았습니다</b>
    동의서는 조합원 명부에 등재된 분만 내실 수 있습니다.
    본인확인에 쓰신 이름·휴대폰번호가 명부와 같아야 합니다.<br>
    명부에 계신데도 확인이 안 되면 조합 사무실로 알려 주십시오.</div>`}

  <div class="sh-ft">서면으로도 내실 수 있습니다. 효력은 같습니다.<br>
    조합 사무실로 문의해 주십시오.</div>`,
  '전자동의서', '제출 전 안내');

  sb.querySelectorAll('[data-csf]').forEach(b=>b.onclick=()=>{
    /* ★ 명부에서 확인되지 않은 분은 동의서를 열 수 없다.
       예전에는 9999 라는 가짜 번호를 붙여 제출까지 됐다.
       소유자가 특정되지 않은 동의서는 인가 신청에서 그대로 반려된다.
       완료증이 발급되는 것 자체가 잘못이다. */
    if(!memberOnly("동의서 제출")) return;
    CS.form=b.dataset.csf; CS.read=false; CS.choice=null;
    CS.addr = ME.rec.addr;              /* 명부에 적힌 지번. 직접 고칠 수 없다. */
    openConsentForm();
  });
}

/* ② 서식 열람 → 동의 선택 */
function openConsentForm(){
  const f = consentOf(CS.form);
  const done = ME.rec ? consentDone(f.id, ME.rec.no) : null;
  const draw = () => {
    open(`
    ${done?`<div class="calc-note" style="margin-bottom:13px">
      <b>이미 제출하셨습니다</b>
      접수번호 ${done.serial} · ${done.at}<br>
      다시 제출하시면 앞의 것은 대체되고 두 기록이 모두 남습니다.
      <button class="backlink" data-cscert="${done.serial}" style="padding:0;margin-top:6px">
        완료증 보기 ›</button></div>`:""}

    <div class="vbox" style="margin-bottom:13px">
      <div class="vrow"><span>근거 법령</span><b>${f.law}</b></div>
      <div class="vrow"><span>의결 요건</span><b>${f.quorum.desc}</b></div>
      <div class="vrow"><span>징구 기간</span><b>${f.from} ~ ${f.to}</b></div>
    </div>

    <div class="sec"><h2>${f.name}</h2><span>끝까지 읽어 주세요</span></div>
    <div class="cs-doc" id="cs-doc">
      ${f.body.map(([h,b])=>`<h4>${h}</h4><p>${b}</p>`).join('')}
      <div class="end">— 이상 —</div>
    </div>
    <p class="note">${CS.read
      ? '<b style="color:var(--ok)">끝까지 확인하셨습니다.</b> 아래에서 동의 여부를 골라 주십시오.'
      : '문서를 <b>끝까지 내려서</b> 읽으시면 아래 칸이 열립니다.'}</p>

    <div class="sec" style="margin-top:16px"><h2>소유 부동산</h2></div>
    <div class="vbox">
      <div class="vrow"><span>지번</span><b>${CS.addr || "—"}</b></div>
      <div class="vrow"><span>대지면적 · 지분</span>
        <b>${(ME.rec.land||0)}㎡ · ${ME.rec.share||"1/1"}</b></div>
    </div>
    <p class="note">조합원 명부에 등재된 내용입니다.
      <b>여기서는 고치실 수 없습니다.</b> 명부와 다르면 조합 사무실로 알려 주십시오.
      명부는 조합장 승인을 거쳐야 바뀝니다.</p>

    <div class="sec" style="margin-top:16px"><h2>동의 여부</h2></div>
    ${CS.read ? `<div class="cs-pick">
      <button class="${CS.choice==='동의'?'y':''}" data-csc="동의">동의합니다</button>
      <button class="${CS.choice==='부동의'?'n':''}" data-csc="부동의">동의하지 않습니다</button>
    </div>` : `<div class="cs-pick" style="opacity:.4;pointer-events:none">
      <button>동의합니다</button><button>동의하지 않습니다</button></div>`}

    <button class="btn ${CS.read&&CS.choice?'':'ghost'}" data-cssend="1"
      style="margin-top:6px${CS.read&&CS.choice?'':';opacity:.5'}">
      ${CS.read&&CS.choice?'PASS 인증하고 제출하기':'문서를 끝까지 읽어 주세요'}</button>

    <p class="note">제출하시려면 <b>PASS 또는 NICE 본인인증</b>이 필요합니다.
      지문이나 PIN으로는 내실 수 없습니다.
      본인확인기관이 준 식별값을 조합원 명부와 대조해
      다른 분이 대신 내는 것을 막습니다.</p>

    <div class="sh-ft">${CONSENT_NOTICE.caveat}</div>`,
    f.name, CS.read?'동의 여부 선택':'문서 확인');

    /* 끝까지 내려야 열린다 */
    const doc = sb.querySelector('#cs-doc');
    if(doc && !CS.read){
      doc.onscroll = () => {
        if(doc.scrollTop + doc.clientHeight >= doc.scrollHeight - 12){
          CS.read = true; keepAddr(); draw();
        }
      };
    }
    sb.querySelectorAll('[data-csc]').forEach(b=>b.onclick=()=>{
      keepAddr(); CS.choice=b.dataset.csc; draw(); });
    sb.querySelectorAll('[data-cssend]').forEach(b=>b.onclick=()=>{
      keepAddr();
      if(!CS.read){ alert("문서를 끝까지 읽어 주십시오."); return; }
      if(!CS.choice){ alert("동의 여부를 골라 주십시오."); return; }
      if(!CS.addr || !CS.addr.trim()){
        alert("명부에 소유 부동산이 등재되어 있지 않습니다.\n조합 사무실로 문의해 주십시오."); return; }
      doConsent();
    });
    sb.querySelectorAll('[data-cscert]').forEach(b=>b.onclick=()=>
      openCert(CONSENT_LOG.find(x=>x.serial===b.dataset.cscert)));
  };
  /* 지번은 명부 값으로 고정되므로 화면에서 읽어올 것이 없다 */
  const keepAddr = () => {};
  draw();
}

/* ③ PASS 인증 강제 → 제출 */
function doConsent(){
  const f = consentOf(CS.form);
  /* 동의서는 PASS 필수다. 안건 제목과 무관하게 강제된다. */
  openReauth("pass", "consent", f.name, how => {
    if(how !== "pass" && how !== "nice"){
      alert("동의서는 PASS 또는 NICE 인증으로만 제출하실 수 있습니다."); return; }
    /* ★ 두 겹으로 막는다. 화면을 우회해 들어와도 여기서 걸린다. */
    if(!memberOnly("동의서 제출")) return;
    const me = ME.rec;
    /* 지번은 화면 값이 아니라 명부 값을 쓴다 */
    const r = consentSubmit(CS.form, me, CS.choice, me.addr, how);
    if(!r.ok){ alert(r.why); return; }
    openCert(r.rec);
  });
}

/* ④ 완료증 */
function openCert(rec){
  if(!rec) return;
  open(`
  <div class="cert">
    <div class="cert-h"><b>전자동의서 제출 완료증</b>
      <span>미아2재정비촉진구역 주택재개발정비사업조합</span></div>
    <div class="cert-b">
      <div class="r"><span>접수번호</span><b class="mono">${rec.serial}</b></div>
      <div class="r"><span>서식</span><b>${rec.formName}</b></div>
      <div class="r"><span>제출자</span><b>${rec.name} · 제 ${String(rec.voter).padStart(4,"0")} 호</b></div>
      <div class="r"><span>소유 부동산</span><b>${rec.addr}</b></div>
      <div class="r"><span>동의 여부</span>
        <b style="color:${rec.choice==='동의'?'var(--ok)':'var(--amber)'}">${rec.choice}</b></div>
      <div class="r"><span>본인확인</span><b>${idvOf(rec.how).name}</b></div>
      <div class="r"><span>식별값</span><b class="mono" style="font-size:.74rem">${rec.ci}···</b></div>
      <div class="r"><span>제출 시각</span><b class="mono">${rec.at}</b></div>

      <div style="font-size:.76rem;color:var(--muted);margin-top:12px">인증 서명값</div>
      <div class="cert-sig">${rec.sign}</div>
    </div>
  </div>

  <p class="note">이 완료증은 제출하신 내용으로 만든 것입니다.
    내용이 하나라도 달라지면 서명값이 바뀌므로,
    조합이 임의로 고쳤는지 이 값으로 확인하실 수 있습니다.</p>

  <div class="list" style="margin-top:14px">
    <div class="li"><span class="li-ic ok">${ic(P.shield)}</span>
      <span class="tx"><b>조합에 접수되었습니다</b>
        <p>조합 관리 화면과 감사 기록에 함께 남았습니다</p></span></div>
  </div>

  <button class="btn ghost" style="margin-top:14px" data-csback="1">동의서 목록으로</button>

  <div class="sh-ft">화면을 갈무리해 두시면 나중에 확인하기 좋습니다.<br>
    ${CONSENT_NOTICE.caveat}</div>`,
  '제출 완료', rec.serial);
  sb.querySelectorAll('[data-csback]').forEach(b=>b.onclick=()=>openConsent());
}

/* ══ 재인증 (의결 직전) ═══════════════════════════════════
   ★ 평상시에는 인증 없이 쓰시다가, 투표함에 넣기 직전에만 확인한다.
     대리 투표를 막기 위해서다.

   ★ 등급이 안건마다 다르다
       일반 안건 · 설문        PIN · 생체  (기기 안 · 과금 없음)
       시공자 선정 · 동의서     PASS 필수   (법적 증거 능력)

     시공자 선정은 법이 직접 출석을 요구하는 안건이고,
     동의서는 소송에서 가장 치열하게 다투는 서류다. */
/* ★ 명부에서 확인된 분만 의결에 참여하실 수 있다.
     동의서 · 전자투표 · 설문이 모두 이 잠금을 지난다.
     한 곳만 막고 다른 곳이 뚫려 있으면 막은 의미가 없다.

     본인확인은 "이 휴대폰 주인이 누구인가"를 확인할 뿐이고,
     그 사람이 조합원인지는 명부와 대조해야 안다. 둘은 다른 절차다. */
function memberOnly(what){
  if(ME.rec) return true;
  alert("조합원 명부에서 확인되지 않았습니다.\n\n"
    + what + "은(는) 명부에 등재된 분만 하실 수 있습니다.\n"
    + "본인확인에 쓰신 이름·휴대폰번호가 명부와 같아야 합니다.\n\n"
    + "명부에 계신데도 확인이 안 되면 조합 사무실로 알려 주십시오.");
  return false;
}

function needReauth(kind, title, onOk){
  const lv = (typeof idvLevelFor!=="undefined") ? idvLevelFor(kind, title) : "none";
  if(lv === "none"){ onOk("none"); return; }
  openReauth(lv, kind, title, onOk);
}

function openReauth(lv, kind, title, onOk){
  const hard = lv === "pass";
  const votable = (typeof AGENDA!=="undefined") ? AGENDA.filter(a=>a.type==='의결') : [];
  open(`
  ${hard?`<div class="warnbox hard"><b>이 안건은 PASS 인증이 필요합니다</b>
    <p>${title||"이 건"}은 법이 더 엄격한 확인을 요구합니다.
       나중에 다툼이 생겼을 때 본인이 하셨다는 것을 증명할 수 있어야 합니다.</p></div>`
  :`<div class="calc-note" style="margin-bottom:13px"><b>본인만 투표하실 수 있습니다</b>
    지문이나 여섯 자리 숫자로 한 번만 확인합니다. 추가 비용은 없습니다.</div>`}

  ${kind==="vote"&&votable.length?`
  <div class="vbox" style="margin-bottom:14px">
    <div style="font-size:.78rem;color:var(--muted);padding:2px 0 6px">제출하실 내용</div>
    ${votable.map(a=>`<div class="vrow"><span>제${a.no}호 ${a.t}</span>
      <b>${VOTE.pick[a.no]||'—'}</b></div>`).join('')}
  </div>`:""}

  <div style="text-align:center;padding:10px 0 16px">
    <div style="width:60px;height:60px;border-radius:16px;
      background:${hard?'#FFF0E6':'#F0F5FB'};
      border:1.5px solid ${hard?'var(--amber)':'var(--navy)'};
      display:grid;place-items:center;margin:0 auto;font-size:1.5rem;
      color:${hard?'var(--amber)':'var(--navy)'}">${hard?ic(P.shield):ic(P.my)}</div>
    <b style="display:block;font-size:.92rem;margin-top:11px">
      ${hard?"PASS 앱으로 확인해 주세요":"지문 또는 PIN으로 확인해 주세요"}</b>
    <p style="font-size:.8rem;color:var(--muted);margin-top:4px">
      ${hard?"통신사 앱이 열립니다":"기기 안에서 바로 처리됩니다"}</p>
  </div>

  ${hard
   ? `<div style="display:flex;gap:9px">
        ${idvStrong().map(pv=>`<button class="btn ${pv.k==='pass'?'':'ghost'}"
          style="flex:1" data-rv="${pv.k}">${pv.name.replace(/ .*/,"")}</button>`).join('')}
      </div>`
   : `<button class="btn" data-rv="pin">지문 · PIN으로 확인</button>
      <button class="btn ghost" style="margin-top:9px" data-rv="pass">PASS로 대신하기</button>`}

  <p class="note">${hard
    ? "PASS 인증은 건당 비용이 발생하며 조합 운영비에서 나갑니다."
    : "PIN · 생체 확인은 기기 안에서 끝나므로 비용이 들지 않습니다."}
    인증 정보는 조합에 저장되지 않습니다.</p>`,
  '본인 확인', hard?'PASS 필수':'간편 확인');

  sb.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>{
    const how = b.dataset.rv;
    if(typeof idvLog!=="undefined") idvLog(how, (title||kind)+" 재인증", ME.memberNo||"");
    close();
    onOk(how);
  });
}

  ${DISCLOSE.on&&a.vote?`
  <div class="warnbox hard"><b>이 안건은 찬반 명단이 이름과 함께 공개됩니다</b>
    <p>투표하시기 전에 확인해 주십시오. 총회 종료 후 성명(일부 가림)과
       접수번호가 함께 공개됩니다.</p></div>
  <div class="doccard"><span class="pg">공문</span>
    <span style="flex:1;min-width:0">
      <b>${DISCLOSE.doc.title}</b>

  <div class="vbox">

    <div class="vrow"><span>직접 출석</span><b>${a.attend}</b></div>
    ${a.vote?`<div class="vrow"><span>전자투표</span>
      <b style="color:var(--ok)">출석으로 인정</b></div>`:''}
    ${DISCLOSE.on&&a.vote?`<div class="vrow"><span>명단 공개</span>
      <b style="color:var(--amber)">성명 + 접수번호</b></div>`

      <span>${VOTE.sent?'제출됨':'미제출'}</span></div>
    <div class="vt">
      <button data-v="${a.no}:y" class="${VOTE.pick[a.no]==='y'?'on':''}">찬성</button>
      <button data-v="${a.no}:n" class="no ${VOTE.pick[a.no]==='n'?'on':''}">반대</button>
      <button data-v="${a.no}:a" class="ab ${VOTE.pick[a.no]==='a'?'on':''}">기권</button>
    </div>
    <p class="note">투표 마감(${MEETING.voteClose}) 전까지 몇 번이든 바꿀 수 있습니다.
      마지막 선택만 반영됩니다.</p>`
   :`<div class="warnbox"><b>표결하지 않는 안건입니다</b>
      <p>보고 사항이므로 찬반 투표가 없습니다.</p></div>`}

  ${a.ref?`<div class="sec" style="margin-top:16px"><h2>관련 자료</h2></div>
    <div class="doccard"><span class="pg">자료</span>
      <span style="flex:1;min-width:0"><b>${a.ref}</b>
      <p>다알아에 등록된 실제 자료입니다.</p></span></div>`:''}

  <div class="sh-ft">이 화면은 시연용 예시입니다.<br>
    실제 안건 내용은 조합 소집통지서를 확인하십시오.</div>`,
  `제${a.no}호 의안`, a.t);

  sb.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>openMeeting(n));
  sb.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    const [no,v]=b.dataset.v.split(':');

/* ── 집계 결과 ──
   ★ 숫자는 roster-demo.js 의 투표 기록에서 계산한다.
     관리자 화면(admin.html)이 입력한 서면·현장 표와 같은 자료를 본다.
     실제로는 Supabase 의 votes 테이블에서 읽어와야 한다. */
const tallyNow = () => {
  if(typeof tallyAgenda === "undefined")
    return {yes:0,no:0,abstain:0,join:0,total:0,absent:0,electronic:0,written:0,onsite:0};
  /* ★ 2026-08-31 — 총회가 여러 개가 됐다. 지금 열린 총회를 본다. */
  const m = (typeof mtCur !== "undefined") ? mtCur()
          : (typeof DEMO_MEETING !== "undefined") ? DEMO_MEETING : null;
  const a = m && (m.agendas||[]).find(x=>x.is_vote);
  if(!a) return {yes:0,no:0,abstain:0,join:0,total:0,absent:0,electronic:0,written:0,onsite:0};
  return tallyAgenda(a.agenda_id);
};

function openTally(n){
  const q = tallyNow();
  const T = {total:q.total, join:q.join, y:q.yes, n:q.no, a:q.abstain, absent:q.absent,
             online:q.electronic, paper:q.written, onsite:q.onsite};
  const pc = v => Math.round(v/T.total*1000)/10;
  const names = DISCLOSE.on;
  open(`
  <div class="sample"><b>가상 명부 ${T.total}명 기준입니다</b>
    실제 집계가 아닙니다. 조합이 실제 명부를 등록하면 그 인원으로 계산됩니다.</div>

  <div class="stat">
    <div><b class="num">${T.total}</b><span>총 조합원</span></div>
    <div><b class="num">${T.join}</b><span>참여</span></div>
    <div><b class="num" style="color:var(--muted)">${T.absent}</b><span>불참</span></div>
  </div>

  <div class="tally">
    <i style="width:${pc(T.y)}%;background:var(--navy)"></i>
    <i style="width:${pc(T.n)}%;background:var(--amber)"></i>
    <i style="width:${pc(T.a)}%;background:#B9C0C9"></i>
    <i style="width:${pc(T.absent)}%;background:var(--line)"></i>
  </div>
  <div class="tlg">
    <span style="color:var(--navy)">찬성 ${T.y}</span>
    <span style="color:var(--amber)">반대 ${T.n}</span>
    <span style="color:var(--muted)">기권 ${T.a}</span>
    <span style="color:#B9C0C9">불참 ${T.absent}</span>
  </div>

  <div class="vbox">
    <h4>행사 방법별 구분</h4>
    <div class="vrow"><span>전자투표</span><b>${T.online}명</b></div>
    <div class="vrow"><span>서면결의</span><b>${T.paper}명</b></div>
    <div class="vrow"><span>현장투표</span><b>${T.onsite}명</b></div>
  </div>
  <p class="note">전자·서면·현장 결과를 각각 구분해 관리하는 것은
    도시정비법 제45조 제6항이 요구하는 요건입니다.</p>

  <div class="sec" style="margin-top:16px"><h2>찬성 ${T.y}</h2>
    <span>${names?'가나다순':'접수번호순'}</span></div>
  <div class="slist y">${names
    ? '김*희 (V-2026-0003)　이*희 (V-2026-0007)<br>박*수 (V-2026-0011)　정*민 (V-2026-0014)'
    : 'V-2026-0003　V-2026-0007<br>V-2026-0011　V-2026-0014<br>V-2026-0019　V-2026-0021'}
    <br><span style="color:#8A94A0">… ${Math.max(T.y-4,0)}건 더보기</span></div>

  <div class="sec" style="margin-top:14px"><h2>반대 ${T.n}</h2></div>
  <div class="slist n">${names
    ? '강*희 (V-2026-0002)　최*희 (V-2026-0009)'
    : 'V-2026-0002　V-2026-0009<br>V-2026-0016　V-2026-0028'}
    <br><span style="color:#B5836A">… ${Math.max(T.n-2,0)}건 더보기</span></div>

  <p class="note" style="margin-top:12px">${names
    ? '조합장 공문 '+DISCLOSE.doc.no+'에 따라 성명을 함께 공개하고 있습니다.'
    : '문자로 받으신 접수번호를 위 목록에서 찾으시면 본인 표가 제대로 반영됐는지 확인하실 수 있습니다. 이름은 공개하지 않습니다.'}</p>

  <button class="btn ghost" data-back="1" style="margin-top:12px">안건 목록으로</button>
  ${FT_VOTE}`,
  '집계 결과', `${MEETING.title} · ${MEETING.date}`);
  sb.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>openMeeting(n));

/* ═══════════════════════════════════════════════════════════
   원문 열기 · 내려받기 (2026-08-22 오후)
   ───────────────────────────────────────────────────────────
   ★ 예전에는 「원문 PDF 보기」가 글자만 있는 단추였다.
     onclick 이 아예 안 붙어 있어 **눌러도 아무 일이 없었다.**
     조합원은 눌리지 않는 줄 아시고 여러 번 누르시다 그만두신다.
     오류도 안 나므로 직원도 모른다.

   ★ 자료실에 실제로 올라온 것과 이어 준다.
     자료가 없으면 단추를 아예 안 그린다.
     없는데 단추만 보이면 「고장 났다」가 된다.

   ★ 검수를 마친 것을 먼저 쓴다.
     같은 분류에 여러 건이 있으면 검수 완료 → 최신 차례로 고른다. */
function arcDocOne(cat){
  const list = (typeof ARC_DOCS !== "undefined" ? ARC_DOCS : [])
    .filter(d => d.cat === cat && d.state !== "hidden" && d.path);
  if(!list.length) return null;
  return list.sort((a,b) =>
    (b.state === "verified") - (a.state === "verified")
    || (b.at||"").localeCompare(a.at||""))[0];
}

function arcDocBtns(cat){
  const d = arcDocOne(cat);
  if(!d) return `<p class="note" style="margin-top:16px">
    원문은 조합이 등록하면 여기서 바로 여실 수 있습니다.</p>`;
  return `<div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn ghost" style="flex:1" data-arcopen="${d.id}">원문 보기</button>
    <button class="dl" data-dl="${d.id}">${ic(P.down)} 내려받기</button>
  </div>
  <p class="note" style="margin-top:7px">${d.file} · ${hubSize(d.size)}</p>`;
}

function bindArcBtns(){
  if(typeof sb === "undefined" || !sb) return;
  sb.querySelectorAll('[data-arcopen]').forEach(b=>b.onclick=async()=>{
    const d = ARC_DOCS.find(x=>x.id===b.dataset.arcopen); if(!d) return;
    const back = b.textContent;
    b.disabled = true; b.textContent = "여는 중…";
    const u = await hubFileUrl(d.path, 3600);
    b.disabled = false; b.textContent = back;
    if(!u){ alert("원문을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
    window.open(u, "_blank");
  });
  sb.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>arcDown(b));
}

      <em>잠시 뒤 새로고침해 보십시오</em></span></button>`;

  const used = [];
  /* [사진N] 을 그 자리의 사진으로 바꾼다 */
  let out = txt.split(/(\[사진\s*\d+\])/g).map(seg => {
    const m = seg.match(/^\[사진\s*(\d+)\]$/);
    if(!m) return seg.trim() ? `<p style="white-space:pre-line">${seg}</p>` : "";
    const i = Number(m[1]) - 1;
    if(!ps[i]) return "";        /* 없는 번호면 조용히 넘어간다 */
    used.push(i);
    return shot(ps[i], i);
  }).join("");

  /* 본문에 안 적으신 사진은 맨 아래에 붙인다 */
  const rest = ps.map((p,i)=>i).filter(i => !used.includes(i));
  out += rest.map(i => shot(ps[i], i)).join("");
  return out + nwRel(f);                 /* ★ 관련 자료 (2026-09-21) */
}

/* ── 소식 · 시간순 피드 ────────────────────────────────
   ★ 소식과 자료의 기준은 "시간이 지나면 어떻게 되는가" 다.
     소식 : 지나가면 값이 없어지는 것 (D-3 알림, 장소 변경)
     자료 : 시간이 지나도 남는 것 (고시문, 정관, 회의록)
     지나간 소식은 자료실로 넘어간다. */

/* ★ 직원 화면(admin.html)에서 올린 소식을 함께 본다.
   hub.js 가 브라우저 저장소를 통해 이어 준다.
   저장된 것이 없으면 아래 예시가 그대로 보인다. */
const NEWS_COLOR2 = {고시:"var(--ok)", 정기총회:"var(--amber)", 임시총회:"#D9480F",
  대의원회:"#4A6D96", 이사회:"#8FA8C4", 공고:"var(--blue)",
  진행:"#B9C0C9", 브리핑:"var(--navy)", 자료:"var(--ok)"};

/* 직원이 올린 것을 소식 줄 모양으로 바꾼다 */
function fromAdmin(){
  const rows = (typeof hubLoad !== "undefined") ? hubLoad("news", null) : null;
  if(!rows || !rows.length) return {urgent:null, feed:[]};
  /* 최신이 맨 위. 날짜가 같으면 나중에 올린 것이 위다. */
  const byNew = (a,b) => a.d < b.d ? 1 : a.d > b.d ? -1 : (b.id||0)-(a.id||0);

  /* ★★★ 2026-09-16 고침 — 소식이 사라지던 것 ★★★

     예전에는 이랬다.

       const urg  = rows.filter(x => x.urgent).sort(byNew)[0];   맨 위 하나만
       const feed = rows.filter(x => !x.urgent);                 긴급은 통째로 빠짐

     그래서 **긴급 공지를 두 번째로 올리면 앞서 올린 것이
     어디에도 안 나왔다.** 자료는 그대로 있는데 화면에서만 사라진다.
     조합원은 「조합이 지웠다」고 본다.

     ★ 맨 위에 붙이는 것은 **가장 새 긴급 공지 하나**,
       나머지 긴급 공지는 **목록으로 내려보낸다.** 사라지지 않는다.
     ★ 목록에서도 긴급이었다는 것이 보이도록 pin 을 달아 보낸다. */
  const allUrg = rows.filter(x => x.urgent).sort(byNew);
  const urg = allUrg[0] || null;

  const one = x => ({
    id:x.id, kind:x.kind, color:NEWS_COLOR2[x.kind] || "var(--muted)",
    at:(x.d||"").replace(/-/g,"."), t:x.t, d:x.body || "",
    /* 2026-09-16 — 딱지와 한 줄 요약 */
    tag:x.tag || "", sub:x.sub || "", day:x.d || "",
    /* ★★★ 2026-09-19 — 표 사진을 여기서 빠뜨렸다 ★★★
       직원이 사진을 올려도 이 함수가 안 넘겨 주니
       조합원 화면에는 **[사진1] 이 글자 그대로** 나왔다.
       ★ 담는 쪽 · 넘기는 쪽 · 그리는 쪽 **셋이 다 있어야** 한다.
         하나만 빠져도 조용히 안 나온다. */
    pics:x.pics || [],
    docId:x.docId || "",               /* ★ 관련 자료 (2026-09-21) */
    pin:!!x.urgent
  });
  const feed = rows.filter(x => !x.urgent)
    .concat(allUrg.slice(1))          /* ★ 맨 위 하나만 빼고 목록으로 */
    .sort(byNew).map(one);
  return {urgent: urg ? {on:true, at:(urg.d||"").replace(/-/g,"."),
    t:urg.t, body:urg.body || "", tag:urg.tag || "", sub:urg.sub || "",
    /* ★ 표 사진 (2026-09-19). 긴급 공지에도 표를 붙이신다. */
    pics:urg.pics || [],
    day:urg.d || ""} : null, feed};
}

/* ★★★ 딱지 (2026-09-16) ★★★
   ★ NEW 는 사흘이 지나면 안 보인다.
     한 달 전 소식에 NEW 가 붙어 있으면 그때부터 아무도 안 믿는다.
     담긴 값은 그대로 두고 보이기만 멈춘다. */
const NV_TAGS = {new:["NEW","#2563EB"], celeb:["경축","#C0392B"],
                 done:["확정","#0EA97A"], warn:["주의","#F26419"]};
function nvTag(f){
  if(!f || !f.tag || !NV_TAGS[f.tag]) return "";
  if(f.tag === "new"){
    const d = new Date(f.day || "");
    if(!isNaN(d) && Math.floor((Date.now() - d.getTime()) / 86400000) > 3) return "";
  }
  const [t, bg] = NV_TAGS[f.tag];
  return `<span style="display:inline-block;font-size:.66rem;font-weight:800;color:#fff;
    background:${bg};border-radius:6px;padding:2px 7px;letter-spacing:-.2px;
    white-space:nowrap;margin-right:5px">${t}</span>`;
}

     ★ 이제 직원이 목록에서 **체크한 것만** 올라간다.
       차례도 목록에 보이는 대로(날짜가 새 것부터)다.

  /* ★ 예전에 올린 소식은 home 값이 아예 없을 수 있다 (2026-09-18).
     `=== true` 로만 보면 **홈이 통째로 비어 버린다.**

     직원이 한 번 체크를 푸시면 그때부터 false 가 들어간다. */
  const on = rows.filter(x => x.home !== false);
  if(!on.length) return null;

    .sort((a,b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : (b.id||0)-(a.id||0)))
    .map(x => ({
      id:"h"+x.id, type:x.kind, real:!!x.real, pin:!!x.urgent,
      date:(x.d||"").replace(/-/g,"."), t:x.t,
      d:x.sub || x.body || "", body:x.body || "",
      /* ★ 표 사진 (2026-09-19). 여기도 넘겨야 홈에서 눌러 펼쳤을 때 나온다. */
      pics:x.pics || [],
      docId:x.docId || "",               /* ★ 관련 자료 (2026-09-21) */
      tag:x.tag || "", day:x.d || "", fromAdmin:true
    }));
}

      <p>조합원께서 물으신 것 중 여러 분이 궁금해하실 만한 것을 모아 둘 자리입니다.<br>
         궁금하신 것은 <b>내정보 › 조합 집행진에 문의</b>로 보내 주십시오.</p></div>`) : ""}

  ${(t==="all"||t==="notice") ? `
  ${/* ★ 2026-09-16 — 조합이 올린 소식이 있으면 예시를 걷는다.
       예전에는 「일부는 예시입니다」 안내와 그 아래 분홍 상자(옛 NEWS)가
       늘 나왔다. 그런데 그 분홍 상자에 있는 고시가
       **아래 목록에도 그대로 있어 같은 소식이 두 번** 보였다.

       ★ 조합이 소식을 올리기 시작하면 예시는 걷어야 한다.
         「예시입니다」가 계속 걸려 있으면 조합원이
         **어느 것이 진짜인지 모른다.** */
    ADMIN_NEWS.feed.length ? "" : `
  <div class="sample"><b>일부는 예시입니다</b>
    지금 등록된 실제 자료는 <b style="display:inline">고시 제2026-32호</b> 1건입니다.
    나머지는 조합이 등록하면 채워집니다.</div>`}

  ${(ADMIN_NEWS.feed.length ? [] : NEWS.filter(n=>n.pin)).map((n,i)=>`
    <button class="box" data-news="${NEWS.indexOf(n)}" style="width:100%;text-align:left;
      display:block;margin-bottom:9px;border-color:var(--red);background:#FFF6F5">
      <span style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
        <span class="pill" style="background:#FBEDED;color:var(--red)">중요</span>
        <span style="font-size:.74rem;color:var(--muted)">${n.type} · ${n.date}</span>
      </span>
      <b style="display:block;font-size:.95rem;line-height:1.5">${n.t}</b>
      <span style="display:block;font-size:.82rem;color:var(--muted);line-height:1.7;
        margin-top:3px">${n.d}</span>
    </button>`).join("")}

  ${FEED.map((f,i)=>{
    /* ★ 제목만 보이고 누르면 펼쳐진다 (2026-09-16).
       접혀 있을 때는 한 줄 요약을, 그것도 없으면 본문 앞 두 줄을 보여 준다.
       본문이 「통합심의는 건축·경관…」처럼 시작하면 무슨 소식인지

    const key = "f" + (f.id || i);
    const on  = !!NVO[key];
    const peek = f.sub || String(f.d||"").split("\n").filter(Boolean).slice(0,2).join(" ");
    return `<div class="tl">

    <div class="tl-b" data-nvo="${key}" style="cursor:pointer">
      <div class="tl-h"><em style="color:${f.color}">${nvTag(f)}${
        /* ★ 맨 위에서 내려온 긴급 공지 — 긴급이었다는 것을 남긴다.
           그냥 소식처럼 보이면 조합원은 못 알아본다. */
        f.pin?`<span style="color:var(--amber);font-weight:800">긴급 · </span>`:""
        }${f.dday||f.kind}</em>

      <b>${f.t}</b>
      ${on ? `${nwBody(f)}
        <i style="color:var(--muted)">접기 ▴</i>`

          -webkit-box-orient:vertical;overflow:hidden">${peek}</p>`:""}
        ${f.d?`<i>눌러서 펼쳐 보기 ▾</i>`:""}`}
      ${f.go==="vote"?`<i data-go2="news2">투표하러 가기 ›</i>`:""}
      ${f.go==="arch"?`<i data-go2="doc">자료실에서 보기 ›</i>`:""}
    </div></div>`;}).join('')}` : ""}

  <p class="note">지나간 소식은 자료실에 보관됩니다.
    알림을 켜두시면 새 소식이 올라올 때 바로 받아보실 수 있습니다.</p>
</main>`;
};

/* ══ 설문 응답 ══════════════════════════════════════════
   ★ 설문은 전자투표가 아니다. 맨 위에 그 경고를 고정한다.
     이게 빠지면 "설문에서는 반대가 많았는데 왜 통과됐냐" 는 말이 나온다.

   ★ 답변은 익명이고, 참여 여부만 따로 기록한다.
     둘을 분리해야 솔직한 답이 나오면서 1인 1회도 지켜진다. */
const SVA = {};                        /* 내가 고른 답 (임시) */
const myId = () => ME.rec ? ME.rec.no : 0;
const myAnswered = id => (typeof svDone!=="undefined") && myId() && svDone(id, myId());

function openSurvey(id){
  const s = svById(id); if(!s) return;
  SVA[id] = SVA[id] || {};
  const A = SVA[id];
  const draw = () => {
    open(`
    <div class="warnbox hard"><b>의견을 여쭙는 설문입니다</b>
      <p>법적 효력이 있는 의결이 아닙니다.
         총회 의결은 따로 전자투표로 하십니다.</p></div>

    ${s.note?`<p class="note" style="margin-top:0">${s.note}</p>`:""}

    ${myAnswered(id)?`<div class="calc-note" style="margin-bottom:13px">
      <b>이미 응답하셨습니다</b>
      마감(${s.to}) 전까지는 다시 제출해 고치실 수 있습니다.</div>`:""}

    ${s.items.map((it,i)=>{
      const v = A[it.id];
      return `<div style="margin-bottom:19px">
      <div class="svq">${i+1}. ${it.q}${it.req?' <i>*</i>':''}</div>
      ${it.t==="one"||it.t==="many" ? it.opts.map(o=>{
        const on = it.t==="many" ? (v||[]).indexOf(o)>=0 : v===o;
        return `<button class="svo ${on?'on':''}" data-sva="${it.id}|${o}">
          <span class="rd ${it.t==='many'?'sq':''}"></span>${o}</button>`;}).join('')
      : it.t==="drop" ? `<select class="svin" data-svd="${it.id}">
          <option value="">고르십시오</option>
          ${it.opts.map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join('')}</select>`
      : it.t==="scale" ? `<div class="svsc">${[1,2,3,4,5].map(k=>
          `<button class="${String(v)===String(k)?'on':''}" data-sva="${it.id}|${k}">${k}</button>`).join('')}</div>
          <div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)">
            <span>전혀 아니다</span><span>매우 그렇다</span></div>`
      : it.t==="long" ? `<textarea class="svin" data-svt="${it.id}"
          placeholder="자유롭게 적어 주십시오">${v||""}</textarea>`
      : it.t==="date" ? `<input class="svin" type="month" data-svt="${it.id}" value="${v||""}">`
      : it.t==="num"  ? `<input class="svin" type="number" data-svt="${it.id}"
          placeholder="숫자만" value="${v||""}">`
      : `<input class="svin" type="text" data-svt="${it.id}"
          placeholder="한 줄로 적어 주십시오" value="${v||""}">`}
      </div>`;}).join('')}

    <button class="btn" data-svgo="${id}">제출하기</button>
    <p class="note">제출 후에도 마감 전까지 고치실 수 있습니다.
      답변은 익명으로 처리되어 이름과 연결되지 않습니다.</p>
    ${svCanSee(s)?`<button class="btn ghost" style="margin-top:9px"
      data-svr2="${id}">결과 보기</button>`:`<p class="note">결과는 마감 후에 공개됩니다.</p>`}`,
    s.title, `${s.to}까지 · 익명`);

    sb.querySelectorAll('[data-sva]').forEach(b=>b.onclick=()=>{
      const [q,val] = b.dataset.sva.split('|');
      const it = s.items.find(x=>x.id===q);
      if(it.t==="many"){ const arr = A[q] || [];
        const k = arr.indexOf(val); if(k>=0) arr.splice(k,1); else arr.push(val);
        A[q] = arr; }
      else A[q] = val;
      draw();
    });
    sb.querySelectorAll('[data-svd]').forEach(e=>e.onchange=()=>{ A[e.dataset.svd]=e.value; });
    sb.querySelectorAll('[data-svt]').forEach(e=>e.oninput=()=>{ A[e.dataset.svt]=e.value; });
    sb.querySelectorAll('[data-svgo]').forEach(b=>b.onclick=()=>{
      if(!memberOnly("설문 참여")) return;
      needReauth("survey", s.title, () => svSubmit(id));
    });
    sb.querySelectorAll('[data-svr2]').forEach(b=>b.onclick=()=>openSvResult(id));
  };
  draw();
}

function svSubmit(id){
  const s = svById(id), A = SVA[id] || {};
  const miss = s.items.filter(it=>it.req &&
    (A[it.id]===undefined || A[it.id]==="" || (Array.isArray(A[it.id]) && !A[it.id].length)));
  if(miss.length){ alert("필수 문항에 답해 주십시오.\n\n" +
    miss.map((x,i)=>"· "+x.q).join("\n")); return; }

  /* 답변에는 이름을 남기지 않는다 */
  s.items.forEach(it=>{
    const v = A[it.id]; if(v===undefined||v==="") return;
    SV_ANSWERS.push({survey:id, item:it.id,
      value: Array.isArray(v) ? v.join("|") : String(v)});
  });
  /* 참여 여부만 따로 기록해 1인 1회를 지킨다 */
  const who = myId();
  if(!who) return;                 /* 명부에 없는 분은 기록하지 않는다 */
  if(!svDone(id, who)) SV_VOTERS.push({survey:id, voter:who});

  alert("제출했습니다 (시연)\n\n마감 전까지 다시 제출해 고치실 수 있습니다.");
  close(); render(true);
}

function openSvResult(id){
  const s = svById(id); if(!s) return;
  if(!svCanSee(s)){
    open(`<div class="warnbox"><b>결과는 마감 후에 공개됩니다</b>
      <p>진행 중에 결과가 보이면 나중에 응답하시는 분이 여론에 휩쓸립니다.
         ${s.to}에 마감되면 이 자리에서 보실 수 있습니다.</p></div>`,
      s.title, '결과 비공개'); return; }
  open(`
  <div class="stat">
    <div><b class="num">${svCount(id)}</b><span>응답</span></div>
    <div><b class="num">${svTotal()}</b><span>조합원</span></div>
    <div><b class="num" style="color:var(--ok)">${Math.round(svCount(id)/svTotal()*100)}%</b>
      <span>응답률</span></div>
  </div>

  ${s.items.map((it,i)=>{
    const a = svAgg(id, it.id); if(!a) return "";
    return `<div class="sec"><h2>${i+1}. ${it.q}</h2><span>${a.n}건</span></div>
    ${a.kind==="text"
      ? (a.texts.length ? `<div class="calc-note" style="line-height:1.9">
          ${a.texts.slice(0,5).map(t=>`"${t}"`).join("<br>")}
          ${a.texts.length>5?`<br><span style="color:var(--muted)">… ${a.texts.length-5}건 더</span>`:""}</div>`
        : `<p class="note">응답이 없습니다.</p>`)
      : `${a.kind==="scale"?`<div class="vbox" style="margin-bottom:10px">
          <div class="vrow"><span>평균</span><b>${a.avg} / 5</b></div></div>`:""}
        ${a.rows.map(r=>`
          <div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px">
            <span>${r.label}</span><b>${r.n}명 · ${r.pct}%</b></div>
          <div class="svrb"><i style="width:${r.pct}%"></i></div>`).join('')}`}`;}).join('')}

  <div class="sh-ft">참고용 의견 조사입니다. 법적 효력이 있는 의결이 아닙니다.<br>
    답변은 익명으로 집계되었습니다.</div>`, s.title, '조사 결과');
}

/* ★ 서버에서 소식을 받아온다.
   직원이 컴퓨터에서 올린 것이 조합원 폰에 나타나야 한다.
   화면을 열 때 한 번 받고, 그 뒤로 20초마다 살펴본다.
   보고 있는 중에 새 소식이 올라와도 알 수 있다. */
let HUB_NEW = false;
function pullNews(v){
  const a = fromAdmin();
  if(a.urgent) Object.assign(URGENT, a.urgent, {on:true});
  if(a.feed.length){ FEED.length = 0; a.feed.forEach(x => FEED.push(x)); }
  if(cur === "news") render(true); else HUB_NEW = true;
}
/* ═══════════════════════════════════════════════════════════
   ★★★ 2026-09-19 — 홈 새 소식이 안 바뀌던 까닭 ★★★
   ───────────────────────────────────────────────────────────
   homeNews() 는 hubLoad("news") 를 읽는다. 그것은 **폰 안에
   받아 둔 사본**이다. hubPoll 은 20초마다 서버를 보지만,
   hubPull 은 **값이 달라졌을 때만** 알려 준다 (89-2절과 같은 함정).

   ★ 그래서 직원이 체크를 바꿔도, 폰 안의 사본이 이미 같으면
     **pullNews 가 안 불리고 홈이 그대로**다.

   ★ 켜질 때 한 번은 **직접 받아** 적용한다.
   ═══════════════════════════════════════════════════════════ */
if(typeof hubPoll !== "undefined") hubPoll("news", pullNews, 20);
if(typeof hubPull !== "undefined"){
  hubPull("news").then(v => {
    if(!v) return;
    try{
      pullNews(v);
      if(HOME_READY && cur === "home") render(true);
    }catch(e){}
  }).catch(()=>{});
}

/* ═══════════════════════════════════════════════════════════
   ★★★ 2026-09-17 — 홈 화면 설정을 서버에서 읽는다 ★★★
   ───────────────────────────────────────────────────────────
   ★ 예전에는 이것이 **아예 없었다.**
     직원이 구역 이름 · 주소 · 단계 · 일정 · 조감도를 고치고
     [변경사항 저장]을 눌러도 **조합원 화면은 그대로**였다.
     서버에는 갔는데 읽는 쪽이 없었던 것이다.

   ★ 60초마다 살펴본다. 자주 바뀌는 것이 아니다.
   ★ 홈을 보고 계실 때만 다시 그린다.
     자료를 읽고 계신데 화면이 홈으로 튀면 안 된다.
   ═══════════════════════════════════════════════════════════ */
function pullHome(v){
  if(!v || typeof TN === "undefined") return;
  try{ HOME_LIVE = true; }catch(e){}
  const t = TN();
  if(v.name)  t.name  = v.name;
  if(v.short) t.short = v.short;
  if(v.addr)  t.addr  = v.addr;
  if(v.stage) t.stage = v.stage;
  if(v.hero)  t.home.hero = v.hero;
  t.home.img = v.img || "";
  t.home.src = v.src || "";
  if(v.spec) t.home.spec = v.spec;
  if(v.calc) t.calc = v.calc;
  if(v.pos  !== undefined) t.home.pos  = v.pos;
  if(v.posx !== undefined) t.home.posx = v.posx;
  if(v.zoom !== undefined) t.home.zoom = v.zoom;
  if(typeof v.showPlan === "boolean") t.home.showPlan = v.showPlan;
  if(v.plan){
    if(v.plan.approved) t.plan.approved = v.plan.approved;
    if(v.plan.move)     t.plan.move     = v.plan.move;
    if(v.plan.moveIn)   t.plan.moveIn   = v.plan.moveIn;
  }
  /* ★ D 는 화면이 켜질 때 한 번 만들어진 것이라 함께 고쳐 준다.
     이것을 빼면 글자만 예전 것이 남아 「반만 바뀌었다」가 된다. */
  try{
    const ym = q => q ? `${q.split("-")[0]}년 ${Number(q.split("-")[1])}월` : "";
    D.name = t.name; D.short = t.short; D.addr = t.addr; D.stage = t.stage;
    const sp = (t.home && t.home.spec) ? t.home.spec : {};
    const sv = k => (sp[k] === "" || sp[k] === undefined || isNaN(Number(sp[k]))) ? ""
      : (k === "floors" ? String(sp[k]) : Number(sp[k]).toLocaleString("ko-KR"));
    if(sv("area"))   D.area   = sv("area");
    if(sv("units"))  D.units  = sv("units");
    if(sv("floors")) D.floors = sv("floors");
    if(typeof untilMoveIn !== "undefined")
      D.dday = untilMoveIn(t).replace("약 ","") || D.dday;
    D.move   = ym(t.plan.move)   || D.move;
    D.movein = ym(t.plan.moveIn) || D.movein;
  }catch(e){ /* 못 고쳐도 사진과 단계는 바뀐다 */ }

  /* ★★★ 이 함수는 화면이 다 짜이기 **전에도** 불린다 ★★★
     켜질 때 한 번(2989줄), 그때는 cur(5162줄)이 아직 없다.

     ★ let 으로 선언한 것은 **typeof 로도 막을 수 없다.**
       「Cannot access 'cur' before initialization」 이 난다.
       var 와 다른 점이다. 실제로 돌려 보고 알았다.

     ★ 그래서 HOME_READY 라는 표를 둔다. 화면이 다 짜인 뒤에 세운다.
       그 전에는 값만 담고 그리지 않는다.
       첫 그리기는 어차피 뒤에 한 번 있으니 여기서 안 그려도 된다. */
  try{
    if(HOME_READY && cur === "home" && typeof render === "function") render(true);
  }catch(e){ /* 아직 화면이 없다 — 곧 그려진다 */ }
}
/* ★ var 를 쓴다. 선언 줄에 닿기 전에도 안전하게 읽힌다 (undefined). */
var HOME_READY = false;
/* ═══════════════════════════════════════════════════════════
   ★★★ 2026-09-17 — 홈이 자꾸 「조합설립」으로 돌아가던 것 ★★★
   ───────────────────────────────────────────────────────────
   직원이 「통합심의」로 바꾸고 저장했는데, 조합원 폰을 열면
   자꾸 조합설립으로 보였다.

   ★ 까닭 하나 — hubPull 은 **값이 달라졌을 때만** 알려 준다.

       const before = JSON.stringify(cacheGet(key, …));
       cacheSet(key, v, …);
       if(before !== JSON.stringify(v) && fn) fn(v);   ← 같으면 안 부른다

     한 번 받아 두면 그 다음부터는 **폰 안의 값과 서버 값이 같아서**
     pullHome() 이 아예 안 불린다.
     그런데 D(화면에 쓰는 값)는 화면이 켜질 때 **예시 자료**로 만들어진다.
     → 서버에는 통합심의가 있는데 화면은 조합설립을 보여 준다.

   ★ 까닭 둘 — D 는 933줄에서 한 번 만들어지고 끝이다.
     그 뒤에 무엇이 들어와도 D 는 그대로다.

   ★ 고침 — 켜질 때 **폰 안에 받아 둔 값을 곧바로 적용**한다.
     서버를 기다리지 않는다. 껌뻑임도 없다.

/* ★ 지금 펼쳐 둔 사건 (2026-09-16 밤).
