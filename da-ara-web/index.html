let SUIT_OPEN = -1;
let SUIT_CAT  = -1;

/* 사건 하나를 카드로 그린다 */
function suitCard(k, i){
  const open = (SUIT_OPEN === i);
  const side = k.side === "out" ? "낸 것" : k.side === "in" ? "받은 것" : "";
  const span = (k.first && k.last && k.first !== k.last)
    ? `${k.first} ~ ${String(k.last).slice(5)}` : (k.last || "");
  const head = `
    <button class="li" data-scase="${i}" style="width:100%;text-align:left">
      <span class="tx">
        <b style="${k.done?'color:var(--muted)':''}">${k.name}</b>
        <p>${[side, span].filter(Boolean).join(" · ")}</p>
        <p style="margin-top:3px;color:var(--blue)">
          ${open?"▾":"▸"} 문서 ${k.docs.length}건${open?"":" · 눌러서 펼쳐 보기"}</p>
      </span>
      <span class="badge ${k.done?'b-gray':k.none?'b-gray':'b-warn'}">
        ${k.none?"묶이지 않음":k.done?"끝남":"진행 중"}</span>
    </button>`;
  if(!open) return head;

  /* ★ 펼치면 그 사건의 문서만 날짜순으로 나온다 */
  const rows = k.docs.map(d => `
    ${(d.partN||1) > 1 ? `<div class="arow" style="border-left:3px solid var(--line)">` : ""}
    <button class="li arc" data-arc="${d.id}" style="width:100%;text-align:left;
      border-left:${(d.partN||1)>1?"0":"3px solid var(--line)"};padding-left:20px">
      <span class="tx"><b>${d.title}</b>
        <p>${suitDay(d)}${d.size&&typeof hubSize!=="undefined"?" · "+hubSize(d.size):""}</p>
        ${(d.sheetN||1) > 1
          ? `<p style="margin-top:3px;color:var(--blue)">${d.sheetN}장 · 눌러서 넘겨 보기</p>`
          : ""}</span>
    </button>
    ${(d.partN||1) > 1
      ? `<div class="dlrow"><button class="dl" data-dl="${d.id}">받기</button></div></div>`
      : ""}`).join("");
  return head + rows;
}

/* ═══════════════════════════════════════════════════════════

   ① 회의록은 이사회 · 대의원회의 · 총회 단추로 나눠 본다
   ② 모든 갈래에 기간 고르개 — 전체 · 3개월 · 6개월 · 1년 · 직접
     기준은 **자료에 적힌 날(at)** 이다. 올린 날이 아니다.

   ═══════════════════════════════════════════════════════════ */
const ARCF = {mk:"", sk:"", ak:"", per:"all", from:"", to:""};
const arcDaysAgo = n => {
  const t = new Date(); t.setDate(t.getDate() - n);
  const z = v => String(v).padStart(2,"0");
  return `${t.getFullYear()}-${z(t.getMonth()+1)}-${z(t.getDate())}`;
};
function arcInPer(day){
  if(!day) return true;                       /* 날짜가 없는 줄은 늘 보인다 */
  if(ARCF.per === "all") return true;
  if(ARCF.per === "own") return (!ARCF.from || day >= ARCF.from)
                             && (!ARCF.to   || day <= ARCF.to);
  const n = {"3m":92, "6m":183, "1y":366}[ARCF.per] || 0;
  return !n || day >= arcDaysAgo(n);
}
function arcPerBar(n){
  const p = (v,t) => `<button class="achip ${ARCF.per===v?"on":""}" data-per="${v}">${t}</button>`;
  return `<div class="abar">
    <span class="alab">기간</span>
    ${p("all","전체")}${p("3m","3개월")}${p("6m","6개월")}${p("1y","1년")}${p("own","직접")}
    <span class="acnt">${n}건</span>
    ${ARCF.per==="own" ? `<div class="arange">
      <input type="date" id="arc-f" value="${ARCF.from}">
      <span>~</span>
      <input type="date" id="arc-t" value="${ARCF.to}">
      <button class="ago" data-arcgo="1">조회</button>
    </div>` : ""}
  </div>`;
}

  ${false ? `

/* ═══════════════════════════════════════════════════════════
   자료 하나의 질문과 답   (2026-09-19)
   ───────────────────────────────────────────────────────────
   ★ 질문만 보이고 **눌러야 답이 펼쳐진다.**
     고시문처럼 서른 개가 넘으면 다 펼쳐진 것이 되레 못 읽는다.

   ★ 답마다 「원문 N쪽 보기」를 둔다.
     답을 믿고 끝내는 것이 아니라 **원문으로 갈 길**을 연다.

   ★ 질문이 없는 자료는 **「아직 정리된 질문이 없습니다」**를 적는다.
     아무것도 없으면 고장으로 보인다.

   ★ 조합이 **확인한 것(ok)만** 보여 드린다.
     검수 전인 것은 없는 것과 같다 (직원 화면과 같은 규칙).
   ═══════════════════════════════════════════════════════════ */
const QA_OPEN = {};      /* 어느 질문이 펼쳐져 있나 */

function openDocQA(d){
  const all = (d.index || []).filter(x => x.ok && String(x.q||"").trim());
  const big = (d.size || 0);
  const ext = String(d.file || "").toLowerCase();
  const hard = /\.(hwp|hwpx|doc|docx|xls|xlsx|ppt|pptx)$/.test(ext);

  /* ★ 2026-09-21 (124절) — 제목이 창 머리와 본문에 **두 번** 나왔다.
     본문 칸을 없애고 창 머리 작은 글씨에 한 줄로 모은다.
     그만큼 질문이 두 개쯤 더 먼저 보인다. */
  const sub = [(d.at||"").slice(0,10), big?hubSize(big):"",
    `질문 ${all.length}개`, d.state==="verified"?"검수 완료":""]
    .filter(Boolean).join(" · ");
  open(`
  <div class="qadoc">
    <div class="qabtns">
      <button class="qabtn" data-arcopen2="${d.id}">
        <b>원문 받기</b><em>${(d.file||"").split(".").pop().toUpperCase()}${
          big?` · ${hubSize(big)}`:""}</em></button>
      <div class="qabtn on">
        <b>질문 ${all.length}개</b><em>${all.length?"눌러서 답 보기":"아직 없습니다"}</em></div>
    </div>

    ${hard?`<div class="qawarn">
      <b>이 파일은 폰에서 잘 안 열립니다</b>
      <p>아래 질문과 답으로 내용을 보실 수 있습니다.</p></div>`:""}

    ${all.length ? `
    <p class="qanote">조합원이 자주 물으신 것을
      조합이 <b>원문과 대조해</b> 적어 둔 것입니다.</p>
    <div class="qalist">
      ${all.map((x,i)=>{
        const k = d.id + "-" + i;
        const on = !!QA_OPEN[k];
        const at = [x.at, arcPgLabel(d, x)].filter(Boolean).join(" · ");
        return `<div class="qaitem ${on?"on":""}">
          <button class="qaq" data-qa="${k}">
            <span>${x.q}</span><i>${on?"▴":"▾"}</i></button>
          ${on?`<div class="qaa">
            ${x.a ? `<p>${x.a}</p>` : `<p class="none">답이 아직 적히지 않았습니다.
              원문을 보셔야 합니다.</p>`}
            <div class="qafoot">
              ${arcPgOk(d, x)?`<button class="qago" data-qapage="${d.id}|${arcPgN(x)}">
                원문 ${arcPgLabel(d, x)} 보기</button>`
                :`<button class="qago" data-arcopen2="${d.id}">원문 보기</button>`}
              ${x.at?`<span class="qaat">${x.at}</span>`:""}
            </div>
          </div>`:""}
        </div>`;
      }).join("")}
    </div>` : `
    <div class="qaempty">
      <b>아직 정리된 질문이 없습니다</b>
      <p>조합이 이 자료를 읽고 질문과 답을 정리하는 중입니다.<br>
        지금은 <b>[원문 받기]</b>로 보실 수 있습니다.</p>
    </div>`}

    <p class="note" style="margin-top:14px">
      ★ 여기 없는 것을 물으시면 <b>「아직 답할 자료가 없습니다」</b>라고 나갑니다.
      모르는 것을 지어내지 않기 위해서입니다.<br>
      ★ 법적 효력은 <b>원문</b>에 있습니다.</p>
  </div>`, d.title || "자료", sub);

  /* ★★★ 2026-09-19 — 눌러도 반응이 없던 까닭 ★★★
     ─────────────────────────────────────────────────
     손잡이를 **앞 화면(openCat)에서만** 붙이고 있었다.
     open() 은 sb.innerHTML 을 통째로 갈아 끼울 뿐
     손잡이를 다시 안 붙인다.

     → 새 화면을 열면 **앞 화면의 손잡이가 사라진다.**
       화면은 잘 나오는데 눌러도 아무 일이 없다.

     ★ 화면을 여는 함수가 **자기 손잡이를 직접** 붙여야 한다.
       open() 뒤에 반드시 따라붙는다. */
  qaBind(d);
}

/* 이 화면의 손잡이를 붙인다 */
function qaBind(d){
  /* 질문을 눌러 답을 펼친다 */
  sb.querySelectorAll('[data-qa]').forEach(b => b.onclick = () => {
    qaFlip(b.dataset.qa, d);
  });

  /* 원문 받기 */
  sb.querySelectorAll('[data-arcopen2]').forEach(b => b.onclick = () => {
    arcOpenFile(d);
  });

  /* 원문을 그 쪽에서 연다. PDF 는 #page=N 을 붙이면 그 쪽이 펴진다.
     ★ 한글 · 워드는 쪽으로 못 간다. 그냥 연다. */
  sb.querySelectorAll('[data-qapage]').forEach(b => b.onclick = async () => {
    const pg = b.dataset.qapage.split("|")[1];
    /* ★ 사진 여러 장이면 **그 장**을 펼친다 (2026-09-20 · 115절) */
    if(arcIsPic(d) && d.sheets && d.sheets.length > 1){ openSheets(d, (+pg || 1) - 1); return; }
    if(!/\.pdf$/i.test(String(d.file||""))){ arcOpenFile(d); return; }
    const u = await hubFileUrl(d.path, 3600);
    if(!u){ alert("원문을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
    window.open(u + "#page=" + pg, "_blank");
  });
}

/* 질문을 펼쳤다 접었다
   ★★ 2026-09-20 고침 (114절) ★★
   예전에는 누를 때마다 **첫 질문으로 튕겨 올라갔다.**
   openDocQA → open() 이 sb.scrollTop = 0 으로 맨 위로 올리기 때문이다.
   열 번째 질문을 보시다 누르면 다시 내려와 찾으셔야 했다.
   ★ 누른 질문을 **그 자리에** 둔다(sbStay).
   ★ 펼친 답이 화면 밑으로 숨으면, 질문이 보이는 선에서 조금 올려 답을 보여 드린다. */
function qaFlip(k, d){
  QA_OPEN[k] = !QA_OPEN[k];
  const sel = `[data-qa="${k}"]`;
  sbStay(sel, () => openDocQA(d));
  if(!QA_OPEN[k]) return;                       /* 접을 때는 그 자리 그대로 */
  try{
    const btn = sb.querySelector(sel), box = btn && btn.closest(".qaitem");
    if(!box) return;
    const S = sb.getBoundingClientRect(), B = box.getBoundingClientRect(),
          Q = btn.getBoundingClientRect();
    const over = B.bottom - (S.bottom - 12);      /* 답이 아래로 넘친 만큼 */
    const room = Q.top - (S.top + 12);            /* 질문을 위로 올릴 수 있는 만큼 */
    if(over > 0 && room > 0) sb.scrollTop += Math.min(over, room);
  }catch(e){ /* 못 올려도 답은 펼쳐져 있다 */ }
}

/* ★ 시트 안에서 다시 그려도 누른 것을 그 자리에 둔다 (2026-09-20 · 114절)
   open() 은 늘 맨 위로 올린다. 그 뒤에 **밀린 만큼** 되돌린다. */
function sbStay(sel, fn){
  const b = sb.querySelector(sel);
  const y0 = b ? b.getBoundingClientRect().top : null;
  fn();
  if(y0 === null) return;
  const a = sb.querySelector(sel); if(!a) return;
  sb.scrollTop += a.getBoundingClientRect().top - y0;
}

async function arcOpenFile(d){
  {
    /* ★ 여러 장이 모여 한 자료인 것은 넘겨 보기 화면을 연다 (2026-09-16) */
    if(d.sheets && d.sheets.length > 1){ openSheets(d); return; }
    /* ★ 조각으로 나뉜 것은 새 창으로 못 연다. 첫 조각만 열려 깨져 보인다.
       내려받기로 보내 드린다. 거기서 이어 붙인다. */
    if(d.parts && d.parts.length > 1){
      const dl = document.querySelector(`[data-dl="${d.id}"]`);
      if(dl){ dl.click(); return; }
      alert("큰 자료라 내려받아 보셔야 합니다.\n\n아래 [내려받기]를 눌러 주십시오.");
      return;
    }
    const u = await hubFileUrl(d.path, 3600);
    if(!u){ alert("원문을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오."); return; }
    window.open(u, "_blank");
  }
}

/* ★ 내려받기 (2026-08-22 오후)
   ───────────────────────────────────────────────────────────
   ★ 왜 「열기」와 따로 두는가
     눌러서 열면 브라우저가 PDF 를 띄운다. 화면으로 보기에는 그것으로 되지만
     "이거 어떻게 저장하나요" 하고 사무실에 전화가 온다.
     어르신들껜 브라우저 메뉴를 찾아 들어가시라는 안내가 어렵다.
     단추 하나로 폰에 파일이 떨어지게 한다.

   ★ 주소 끝에 download 를 붙이면 Supabase 가 파일로 내려보낸다.
     이름도 함께 준다. 안 주면 저장소에 담긴 이름
     (MIA-002__arc__AR-2026-001.pdf) 그대로 떨어져
     나중에 무슨 파일인지 알 수 없다.
       2026-08-22_서울특별시고시 제2026-32호.pdf

   ★ 누른 뒤 아무 일이 없으면 안 된다.
     주소를 받아 오는 데 잠깐 걸리는데 그 사이 반응이 없으면
     여러 번 누르시게 되고, 그만큼 요청이 나간다.
     단추 글자를 「받는 중…」으로 바꾸고 잠가 둔다. */
/* ═══════════════════════════════════════════════════════════
   ★ 여러 장을 차례로 넘겨 본다 (2026-09-16)
   ───────────────────────────────────────────────────────────
   ★ 회의록을 폰으로 찍으시면 사진이 서너 장 나온다.
     목록에는 한 줄로 두되, 누르시면 차례로 넘겨 보시게 한다.

   ★ 한 장씩 그때그때 받아 온다.
     세 장을 한꺼번에 받으면 첫 장 보시는 데도 오래 걸린다.

   ★ 주소는 한 시간짜리다. 한 번 받아 둔 것은 다시 안 받는다. */
const SHT = {id:null, i:0, url:{}};

function openSheets(d, at){
  /* ★ at — 몇 번째 장부터 (0부터). 질문의 [원문 2장 보기]에서 온다 (115절) */
  SHT.id = d.id; SHT.i = Math.max(0, Math.min((d.sheets||[]).length - 1, +at || 0)); SHT.url = {};
  shtDraw(d);
}

function shtDraw(d){
  const a = d.sheets, n = a.length, i = SHT.i;
  const u = SHT.url[i];
  const img = /\.(jpe?g|png)$/i.test(a[i].name || "");

  open(`
  <!-- ★★★ 번호 줄을 머리에 붙여 고정한다 (2026-09-16 고침) ★★★

       예전에는 번호 단추가 **맨 아래**에 있었다.
       장이 길면 끝까지 굴려야 다음 장으로 갈 수 있었다.

       ★ 위로 올리고 position:sticky 로 붙여 둔다.
         굴려도 따라오니 어디서든 바로 넘기신다.
       ★ 앞뒤 화살표와 번호를 **한 줄에** 놓았다.
         예전에는 화살표가 위, 번호가 아래로 떨어져 두 군데를 봐야 했다. -->
  <div style="position:sticky;top:0;z-index:5;background:#fff;
    border-bottom:1px solid var(--line);
    /* ★ 시트 본문(.sh-bd)에 좌우 22px · 위 18px 여백이 있다.
       그대로 두면 붙박이 줄 옆으로 글이 비쳐 보이고 위도 뜬다.
       음수 여백으로 그 여백을 되물려 화면 끝까지 덮는다. */
    margin:-18px -22px 0;padding:11px 22px 10px;
    display:flex;align-items:center;gap:7px">
    <button data-sht="prev" ${i===0?'style="opacity:.3"':""}
      style="flex:0 0 auto;border:1px solid var(--line);background:#fff;
      border-radius:8px;width:34px;height:34px;font-size:.95rem;color:var(--navy)">◀</button>
    <!-- ★ 장이 스무 개가 넘으면 번호 줄만 옆으로 굴러간다 -->
    <div id="sht-nums" style="flex:1;display:flex;gap:5px;overflow-x:auto;
      justify-content:center;-webkit-overflow-scrolling:touch">
      ${a.map((sh,k)=>`<button data-shtgo="${k}"
        style="flex:0 0 auto;border:1px solid ${k===i?"var(--navy)":"var(--line)"};
        background:${k===i?"var(--navy)":"#fff"};color:${k===i?"#fff":"var(--muted)"};
        border-radius:8px;min-width:32px;height:34px;padding:0 9px;
        font-size:.82rem;font-weight:${k===i?800:400}">${k+1}</button>`).join("")}
    </div>
    <button data-sht="next" ${i===n-1?'style="opacity:.3"':""}
      style="flex:0 0 auto;border:1px solid var(--line);background:#fff;
      border-radius:8px;width:34px;height:34px;font-size:.95rem;color:var(--navy)">▶</button>
  </div>

  <!-- ★★★ 한 장만 보이게 가둔다 (2026-09-16 고침) ★★★

       예전에는 장 아래로 다른 장이 딸려 나와
       어디까지가 이 장인지 알 수 없었다.
       종이처럼 테두리를 둘러 그 안에 가둔다. -->
  <div style="border:1px solid var(--line);border-radius:12px;background:#fff;
    overflow:hidden;box-shadow:0 1px 4px rgba(11,31,58,.06);margin-top:13px;
    min-height:200px;display:flex;align-items:center;justify-content:center">
    ${u
      ? (img
         ? `<img src="${u}" style="width:100%;display:block" alt="${i+1}번째 장">`
         : `<div style="padding:30px 20px;text-align:center">
              <p style="font-size:.86rem;font-weight:700">${a[i].name}</p>
              <p style="font-size:.79rem;color:var(--muted);margin-top:5px">
                사진이 아니라 여기서 바로 보실 수 없습니다.</p>
              <button class="btn" data-shtopen="${u}"
                style="margin-top:12px">새 창에서 열기</button>
            </div>`)
      : `<p style="padding:40px;color:var(--muted);font-size:.85rem">불러오는 중…</p>`}
  </div>

  <p style="font-size:.74rem;color:var(--muted);text-align:center;margin-top:10px">
    ${i+1}장 / 모두 ${n}장</p>

  <button class="dl" data-dl="${d.id}"
    style="margin-top:12px;width:100%;justify-content:center">
    ${ic(P.down||P.doc)} ${n}장 모두 내려받기</button>

  <p class="note">위 번호를 누르시면 그 장으로 갑니다.
    번호 줄은 굴려도 따라옵니다.</p>
  `, d.title, `${i+1} / ${n}장`);

  /* ★ 시트 본문은 전역 sb 다 (1409줄). */
  sb.querySelectorAll('[data-sht]').forEach(b=>b.onclick=()=>{
    const k = SHT.i + (b.dataset.sht==="next" ? 1 : -1);
    if(k < 0 || k >= n) return;
    SHT.i = k; shtDraw(d);
  });
  sb.querySelectorAll('[data-shtgo]').forEach(b=>b.onclick=()=>{
    SHT.i = +b.dataset.shtgo; shtDraw(d);
  });
  sb.querySelectorAll('[data-shtopen]').forEach(b=>b.onclick=()=>
    window.open(b.dataset.shtopen, "_blank"));
  sb.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>arcDown(b));

  /* ★ 보고 계신 번호를 늘 눈에 보이게 옮겨 준다.
     장이 스무 개면 15번을 누르셨을 때 그 단추가 화면 밖에 있다. */
  /* ★ children · scrollWidth 는 없을 수도 있다.
     없는 것에 기대면 그 줄에서 멈춰 아래 코드가 통째로 안 돈다. */
  try{
    const nm = document.getElementById("sht-nums");
    const c  = nm && nm.children && nm.children[i];
    if(c && nm.scrollWidth > nm.clientWidth)
      nm.scrollLeft = c.offsetLeft - nm.clientWidth / 2 + c.offsetWidth / 2;
  }catch(e){ /* 번호 줄을 못 옮겨도 넘기는 데는 지장이 없다 */ }

  /* ★ 장을 넘기면 맨 위로 올린다.
     앞장 아래쪽을 보고 계셨으면 새 장도 그 자리에서 열려
     「왜 가운데부터 나오지」가 된다. */
  sb.scrollTop = 0;

  /* 아직 안 받아 온 장이면 받아 와서 다시 그린다 */
  if(!u) shtLoad(d, i);
}

async function shtLoad(d, i){
  const sh = d.sheets[i];
  /* ★ 그 장이 또 조각으로 나뉘어 있으면 이어 붙여야 한다. */
  if(sh.parts && sh.parts.length > 1){
    const r = await hubJoinParts(sh.parts);
    if(!r.ok){ alert(`${i+1}번째 장을 불러오지 못했습니다.\n\n${r.why}`); return; }
    SHT.url[i] = URL.createObjectURL(r.blob);
  } else {
    const u = await hubFileUrl(sh.path, 3600);
    if(!u){ alert(`${i+1}번째 장을 불러오지 못했습니다.`); return; }
    SHT.url[i] = u;
  }
  if(SHT.id === d.id) shtDraw(d);
}

async function arcDown(btn){
  const d = ARC_DOCS.concat(typeof LAW_DOCS!=="undefined"?LAW_DOCS:[])
    .find(x=>x.id===btn.dataset.dl);
  if(!d) return;
  const back = btn.innerHTML;
  const name = (typeof hubDownName!=="undefined")
    ? hubDownName(d.title, d.at, d.file) : d.title;

  /* ═══════════════════════════════════════════════════════
     ★ 조각으로 나뉜 자료는 이어 붙여 드린다 (2026-09-16)
     ───────────────────────────────────────────────────────
     Supabase 한 건 한도가 50MB 라, 큰 자료는 45MB 씩 잘려 담긴다.

     ★★★ 조합원은 그것을 몰라야 한다 ★★★
       목록에 한 줄만 보이고, 누르시면 원래 파일 하나가 받아진다.
       1/3 · 2/3 을 따로 받게 하면 쪼갠 뜻이 없다.

     ★ 이어 붙이는 일은 폰이 한다. 그동안 몇 %인지 보여 드린다.
       96MB 를 받는 데 시간이 걸려서, 아무 말이 없으면
       멈춘 줄 알고 다시 누르신다. */
  /* ★ 여러 장이면 한 장씩 차례로 받아 드린다 (2026-09-16).
     ★ 한 파일로 합치지 않는다. 사진 세 장을 하나로 묶을 방법이 없고,
       PDF 라도 폰에서 붙이려면 따로 도구가 있어야 한다.
       대신 파일 이름에 번호를 붙여 차례를 잃지 않게 한다. */
  if(d.sheets && d.sheets.length > 1){
    const n = d.sheets.length;
    btn.disabled = true;
    for(let i = 0; i < n; i++){
      btn.textContent = `받는 중 ${i+1} / ${n}장`;
      const sh = d.sheets[i];
      let href = null, made = false;
      if(sh.parts && sh.parts.length > 1){
        const r = await hubJoinParts(sh.parts);
        if(!r.ok){ btn.disabled = false; btn.innerHTML = back;
          alert(`${i+1}번째 장을 받지 못했습니다.\n\n${r.why}`); return; }
        href = URL.createObjectURL(r.blob); made = true;
      } else {
        const ext = (sh.name.match(/\.[A-Za-z0-9]+$/) || [""])[0];
        href = await hubFileUrl(sh.path, 300,
          `${name.replace(/\.[^.]+$/,"")}_${String(i+1).padStart(2,"0")}${ext}`);
        if(!href){ btn.disabled = false; btn.innerHTML = back;
          alert(`${i+1}번째 장을 받지 못했습니다.`); return; }
      }
      const a3 = document.createElement("a");
      a3.href = href; a3.rel = "noopener";
      if(made) a3.download = `${name.replace(/\.[^.]+$/,"")}_${String(i+1).padStart(2,"0")}`;
      document.body.appendChild(a3); a3.click(); a3.remove();
      if(made) setTimeout(() => URL.revokeObjectURL(href), 60000);
      /* ★ 브라우저가 한꺼번에 여러 개를 받으면 막는다. 조금 쉬어 간다. */
      await new Promise(r => setTimeout(r, 700));
    }
    btn.disabled = false; btn.innerHTML = back;
    return;
  }

  if(d.parts && d.parts.length > 1){
    btn.disabled = true;
    btn.textContent = `받는 중 0% · ${d.parts.length}조각`;
    const r = await hubJoinParts(d.parts,
      p => { btn.textContent = `받는 중 ${p}% · ${d.parts.length}조각`; });
    btn.disabled = false; btn.innerHTML = back;
    if(!r.ok){
      alert("내려받지 못했습니다.\n\n" + r.why
        + "\n\n인터넷이 넉넉한 곳에서 다시 받아 보십시오.");
      return;
    }
    const u2 = URL.createObjectURL(r.blob);
    const a2 = document.createElement("a");
    a2.href = u2; a2.download = name; a2.rel = "noopener";
    document.body.appendChild(a2); a2.click(); a2.remove();
    /* ★ 만든 주소를 거둔다. 안 거두면 폰 메모리에 그대로 남는다. */
    setTimeout(() => URL.revokeObjectURL(u2), 60000);
    return;
  }

  btn.disabled = true; btn.textContent = "받는 중…";
  const u = await hubFileUrl(d.path, 300, name);
  btn.disabled = false; btn.innerHTML = back;
  if(!u){ alert("내려받지 못했습니다.\n\n인터넷을 확인하시고 다시 눌러 주십시오."); return; }
  /* ★ location 을 바꾸지 않는다. 보시던 화면이 그대로 있어야 한다. */
  const a = document.createElement("a");
  a.href = u; a.download = ""; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ── 문의하기 ───────────────────────────────────────────
   ★ 전화로만 주고받으면 "그런 말 한 적 없다"가 된다. */
/* ★ 2026-09-20 (120절) — 「조합 집행진에 문의」 한 창에서 고른다.
   money 일반 문의 · num 내 수치가 이상해요.
   ★ 고르기를 바꿔도 **쓰던 글을 가지고** 다시 연다(keep). */
function openAsk(kind, keep){
  if(!ME.rec) return;
  if(kind !== "num") kind = "money";
  const seg = [["money","일반 문의"],["num","내 수치가 이상해요"]].map(([k,t]) =>
    `<button type="button" data-askkind="${k}" style="flex:1;padding:9px 4px;border-radius:9px;
      font-size:.84rem;font-weight:${k===kind?800:600};
      background:${k===kind?"var(--navy)":"transparent"};color:${k===kind?"#fff":"var(--muted)"}">${t}</button>`).join("");
  open(`
  <div style="display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--mist);margin-bottom:11px">${seg}</div>
  <div class="box" style="background:var(--mist)">
    <p class="note" style="margin-top:0">
      ${kind==="num"
        ? "내 재산 수치가 명부와 다른 것 같으시면 적어 주십시오. 조합이 원문과 대조해 답해 드립니다."
        : "조합이 답한 내용이 여기 그대로 남습니다. 나중에 다시 보실 수 있습니다."}</p>
  </div>

  ${kind==="num"?`<div class="vbox" style="margin-top:11px">
    <div class="vrow"><span>지금 명부의 내용</span><b>${ME.rec.addr||"—"}</b></div>
    <div class="vrow"><span>지분 면적 합계</span>
      <b class="mono">${typeof ownArea!=="undefined"?ownArea(ME.rec.no):0}㎡</b></div>
    <div class="vrow"><span>대표조합원</span>
      <b>${ME.rec.rep?"예":"아니오"}</b></div>
  </div>`:""}

  <div class="f wide" style="margin-top:12px">
    <label>무엇이 궁금하신가요</label>
    <textarea id="ask-body" rows="5"
      placeholder="${kind==="num"
        ? "예 · 등기부에는 193㎡인데 화면에는 185.2㎡로 나옵니다."
        : "예 · 제 분담금이 어떻게 산정되는지 알고 싶습니다."}">${String(keep||"")
        .replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea>
  </div>
  <button class="btn" data-asksend="${kind}">보내기</button>
  <p class="note">답변이 오면 <b>내 문의 내역</b>에서 보실 수 있습니다.
    급하시면 조합 사무실로 전화 주십시오.</p>
  `, "조합 집행진에 문의", mask(ME.rec.name) + ' 님');
  sb.querySelectorAll('[data-askkind]').forEach(b => b.onclick = () => {
    if(b.dataset.askkind === kind) return;
    const t = sb.querySelector('#ask-body');
    openAsk(b.dataset.askkind, t ? t.value : "");
  });

  /* ★ 2026-09-16 — 시트 본문은 전역 sb 다 (1409줄).
     예전에는 여기서 document.getElementById('sheet-body') 로
     **없는 이름**을 찾고 있었다. null 이 와서 그 아래 단추에
     동작이 안 붙었고, 오류도 안 나서 몇 달을 몰랐다. */
  sb.querySelectorAll('[data-asksend]').forEach(b=>b.onclick=()=>{
    const t = sb.querySelector('#ask-body');
    const v = t ? t.value.trim() : "";
    if(v.length < 5){ alert("무엇이 궁금하신지 조금 더 적어 주십시오."); return; }
    const rec = askNew(ME.rec.no, ME.rec.name, b.dataset.asksend, v, ME.rec.name);
    alert(`보냈습니다.\n\n접수번호 ${rec.id}\n\n`
      + `조합이 답하면 [내 문의 내역]에서 보실 수 있습니다.`);
    close(); render();
  });
}

/* ═══════════════════════════════════════════════════════════
   ★ 궁금한 것 — 조합이 채운 답을 펼친다 (2026-09-17 밤)
   ───────────────────────────────────────────────────────────
   예전에는 askFar · askRent · askSizes · askPark 네 함수가
   **미아2 숫자를 안고** 따로 있었다. 조합이 늘어나면 못 쓴다.

   ★ 답은 두 가지다.
       num    이름 · 전 · 후 · 단위 · 쪽수 · 설명   숫자 견주기
       text   그냥 글                              자유롭게
     한 질문에 둘을 섞어 넣으셔도 된다.

   ★ 쪽수(p.245)는 **원문 어디를 보면 되는지**다.
     이것이 있어야 조합원이 스스로 확인하실 수 있다.
   ═══════════════════════════════════════════════════════════ */
function openHbQ(i){
  const F = (typeof hbFaq !== "undefined") ? hbFaq() : null;
  const f = F && F[i];
  if(!f) return;

  /* ★★★ 2026-09-20 — 자료에서 올린 줄은 그 자료로 보낸다 ★★★
     ───────────────────────────────────────────────────────────
     직원이 자료실에서 [★ 홈] 을 누르시면 **링크만** 걸린다.
     질문과 답은 그 자료 안에 있다.

     ★ 한 곳에서만 정리한다. 답을 고치면 **홈에서도 저절로 바뀐다.**
       두 군데 적으면 한쪽만 고쳐져
       **조합원이 다른 답을 두 곳에서** 본다.

     ★ 자료를 못 찾으면(지웠거나 감췄거나) 그대로 알려 드린다.
       빈 화면을 보여 드리면 고장으로 여기신다. */
  if(f.docId){
    const ALL = ARC_DOCS.concat(typeof LAW_DOCS!=="undefined"?LAW_DOCS:[]);
    /* ★ 2026-09-23 — 번호로 못 찾으면 **제목으로 한 번 더** 찾는다.
       자료를 지웠다 다시 올리시면 번호가 새로 매겨지는데,
       홈 줄은 옛 번호를 들고 있어 「자료를 찾지 못했습니다」가 떴다.
       조합원에게는 같은 자료다. 번호가 바뀐 것은 우리 사정이다. */
    const same = t => String(t||"").replace(/\s+/g,"").toLowerCase();
    const d = ALL.find(x => x.id === f.docId)
           || ALL.find(x => same(x.title) && same(x.title) === same(f.q))
           || ALL.find(x => same(x.title) && same(f.q).includes(same(x.title)));
    if(d && d.state !== "hidden"){ openDocQA(d); return; }
    open(`<div class="qaempty">
      <b>이 자료를 지금은 보실 수 없습니다</b>
      <p>조합이 자료를 고치는 중일 수 있습니다.<br>
        <b>자료</b> 탭에서 찾아보시거나 조합 사무실로 문의해 주십시오.</p>
    </div>`, f.q, "자료를 찾지 못했습니다");
    return;
  }
  const rows = (f.rows || []).filter(r => String(r.t||"").trim());
  open(`
  <div class="sh-h"><b>${f.q}</b>${f.sub?`<span>${f.sub}</span>`:""}</div>

  ${rows.length?`<div class="box" style="padding:0;overflow:hidden">
    ${rows.map((r,k)=>`
    <div style="padding:13px 15px${k?";border-top:1px solid var(--line)":""}">
      <div style="display:flex;align-items:baseline;gap:8px">
        <b style="font-size:.88rem;flex:1;min-width:0">${r.t}</b>
        <span class="num" style="font-size:.95rem;font-weight:800;color:var(--navy)">
          ${r.b?`<span style="font-weight:600;color:var(--muted)">${r.b}</span>
            <span style="color:var(--muted);margin:0 3px">→</span>`:""}${r.a||"—"}${
          r.u?`<i style="font-size:.74rem;font-weight:600;color:var(--muted)"> ${r.u}</i>`:""}</span>
      </div>
      ${r.note?`<p style="margin:5px 0 0;font-size:.79rem;color:var(--muted);
        line-height:1.65">${r.note}</p>`:""}
      ${r.p?`<div class="mono" style="margin-top:5px;font-size:.72rem;color:#A9B6C6">
        고시문 p.${r.p}</div>`:""}
    </div>`).join("")}
  </div>`:""}

  ${String(f.body||"").trim()?`<div class="box" style="margin-top:${rows.length?"11px":"0"}">
    <p style="margin:0;font-size:.85rem;line-height:1.8;white-space:pre-line">${f.body}</p>
  </div>`:""}

  <p class="note" style="margin-top:12px">
    다알아의 답변은 참고용입니다. 법적 효력은 원문 고시문에 있습니다.<br>
    개인별 분담금 · 권리가액은 조합 사무실에서 확인하실 수 있습니다.</p>`);
}

/* ── 회의록 · 네 갈래로 보기 (2026-08-31) ───────────────
   ★ 조합원이 실제로 궁금해하는 것은
     「2026년 8월 대의원회에서 무엇을 정했나」이다.
     날짜로 찾으시게 하면 그 회의가 언제였는지부터 기억해 내셔야 한다.

   ★ 정기총회는 1년에 한 번, 대의원회는 두 달에 한 번쯤 열린다.
     섞어 두면 대의원회 넷 사이에 총회 하나가 파묻힌다.

   ★ 회의록 원문(PDF)은 올리지 않는다.
     발언자 실명이 그대로 들어 있어 비식별 처리가 필요하고,
     회의자료는 파일 하나가 90MB를 넘는다.
     안건 이름 · 설명 · 표결 숫자만 남기면 그 문제가 없다.

   ★ 보고 안건도 함께 보여 드린다.
     의결한 것만 보이면 그날 무엇을 다뤘는지 알 수 없다.
   ★ 부결된 것도 그대로 보여 드린다.
     가결된 것만 올리면 「불리한 건 숨겼다」는 말이 나온다. */
const MTL = {kind:"all"};

function openMeetingList(){
  const draw = () => {
    /* ★ 조합원에게는 **알린 것만** 보인다.
       요약을 아직 안 쓴 회의가 제목 없이 나가면
       「제2026-4차 대의원회」라는 빈 줄만 보인다. */
    const all = (typeof mtTold !== "undefined") ? mtTold()
              : (typeof meetingList !== "undefined") ? meetingList() : [];
    const L = MTL.kind === "all" ? all : all.filter(m => m.kind === MTL.kind);
    const C = {all:all.length};
    all.forEach(m => C[m.kind] = (C[m.kind]||0) + 1);
    const KL = (typeof MT_KIND_LIST !== "undefined") ? MT_KIND_LIST : [];

    open(`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${[["all","전체",C.all||0]].concat(KL.map(k=>[k,k,C[k]||0]))
        .map(([k,l,n])=>`<button data-mk="${k}"
        style="border:${MTL.kind===k?"1.5px solid var(--navy)":"1px solid var(--line)"};
        background:${MTL.kind===k?"var(--navy)":"#fff"};
        color:${MTL.kind===k?"#fff":"var(--muted)"};border-radius:99px;
        padding:6px 13px;font-size:.79rem;font-weight:${MTL.kind===k?700:400}">
        ${l} ${n}</button>`).join("")}
    </div>

    ${L.length ? L.map(m => {
      const ags = m.agendas || [];
      const v   = ags.filter(a => a.is_vote);
      const done = v.filter(a => mtDec(m, a)).length;
      const bad  = v.filter(a => { const d = mtDec(m, a); return d && !decCalc(d).ok; }).length;
      /* ★ 소식지다. 한 줄 요약이 제목이고, 회의 이름은 아래로 내린다.
         「제2026-4차 대의원회」는 조합원에게 아무 뜻이 없다.
         「시공자 뽑는 절차가 정해졌습니다」가 조합원이 알고 싶은 것이다. */
      return `<div class="box" data-mt="${m.meeting_id}"
        style="margin-bottom:9px;cursor:pointer${
        bad?";border-left:4px solid var(--red)":done?";border-left:4px solid var(--ok)":""}">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap">
          <span class="pill p-gray">${m.kind||"총회"}</span>
          <span style="font-size:.73rem;color:var(--muted)">${m.meet_date||""}</span>
          ${bad?`<span class="pill p-red">부결 ${bad}건</span>`:""}
        </div>
        <b style="font-size:.94rem;line-height:1.5;display:block">${
          m.headline || m.title || "회의"}</b>
        ${m.meaning?`<p style="font-size:.79rem;color:var(--muted);line-height:1.7;

    `, '회의 소식', (MTL.kind==="all"?"전체":MTL.kind) + ' ' + L.length + '회');

     **없는 이름**을 찾고 있었다. null 이 와서 그 아래 단추에
     동작이 안 붙었고, 오류도 안 나서 몇 달을 몰랐다. */
    sb.querySelectorAll('[data-mk]').forEach(b =>
      b.onclick = () => { MTL.kind = b.dataset.mk; draw(); });
    /* ★ 소식 카드는 button 이 아니라 div 다. onclick 은 그대로 붙는다. */
    sb.querySelectorAll('[data-mt]').forEach(b =>
      b.onclick = () => openMeetingOne(b.dataset.mt));
  };
  draw();
}

/* 이 안건에서 나온 의결 기록 — 안건에 붙은 것이 먼저, 없으면 회의+번호로 */
function mtDec(m, a){
  return DECISION.find(d => d.agId && d.agId === a.agenda_id)
      || DECISION.find(d => d.mtId && d.mtId === m.meeting_id
                         && (d.no2 || 0) === (a.no || 0));
}

  /* ★ 원문은 정보몽땅에 있다. 새 창으로 넘겨 드린다.

/* ── 의결 기록 ──────────────────────────────────────────
   ★ 부결된 것도 함께 보여 드린다.
     가결된 것만 올리면 "불리한 건 숨겼다"는 말이 나온다.
   ★ 누가 어떻게 투표했는지는 남지 않는다. 비밀투표다. */
const DEC = {from:"", to:"", kind:"all"};

function openDecision(){
  const draw = () => {
    const rows = decList(DEC.from, DEC.to, DEC.kind);
    const all  = decList(DEC.from, DEC.to, "all");
    const nOk  = all.filter(d=>decCalc(d).ok).length;
    open(`
    <div class="frow" style="margin-bottom:9px">
      <div class="f mini" style="margin:0"><input id="dc-f" type="date" value="${DEC.from}"></div>
      <span style="flex:0 0 auto;color:var(--muted);align-self:center">~</span>
      <div class="f mini" style="margin:0"><input id="dc-t" type="date" value="${DEC.to}"></div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${[["all","전체",all.length],["ok","가결",nOk],["no","부결",all.length-nOk]]
        .map(([k,l,n])=>`<button data-dk="${k}"
        style="border:${DEC.kind===k?"1.5px solid var(--navy)":"1px solid var(--line)"};
        background:${DEC.kind===k?"var(--navy)":"#fff"};
        color:${DEC.kind===k?"#fff":"var(--muted)"};border-radius:99px;
        padding:6px 14px;font-size:.8rem;font-weight:${DEC.kind===k?700:400};
        text-align:center">${l} ${n}</button>`).join("")}
    </div>

    ${rows.length ? rows.map(d=>{ const c = decCalc(d);
      return `<div class="box" style="margin-bottom:9px;

        <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
          <span class="mono" style="font-size:.74rem;color:var(--muted)">${d.date||""}</span>
          <span class="pill p-gray" style="font-size:.68rem">${c.kindName||"총회"}</span>
          <span class="pill ${c.ok?"p-ok":"p-red"}">${c.ok?"가결":"부결"}</span>
        </div>
        <b style="font-size:.92rem;line-height:1.5;display:block">
          ${d.no2?`제${d.no2}호 · `:""}${d.title||""}</b>
        ${d.meeting?`<p style="font-size:.76rem;color:var(--muted);margin:3px 0 9px">
          ${d.meeting}</p>`:""}

        <div style="display:flex;gap:6px;text-align:center;font-size:.74rem">
          <div style="flex:1;background:var(--mist);border-radius:7px;padding:7px 0">
            <span style="display:block;color:var(--muted);font-size:.68rem">총원</span>
            <b class="mono">${c.total}</b></div>
          <div style="flex:1;background:var(--mist);border-radius:7px;padding:7px 0">
            <span style="display:block;color:var(--muted);font-size:.68rem">참석</span>
            <b class="mono">${c.att}</b></div>
          <div style="flex:1.25;background:${c.ok?"#E9F7F1":"var(--mist)"};
            border-radius:7px;padding:7px 0">
            <span style="display:block;color:${c.ok?"var(--ok)":"var(--muted)"};
              font-size:.68rem">찬성</span>
            <b class="mono" style="${c.ok?"color:var(--ok)":""}">${c.yes} · ${c.yesRate}%</b></div>
          <div style="flex:1.25;background:${c.ok?"var(--mist)":"#FBEDED"};
            border-radius:7px;padding:7px 0">
            <span style="display:block;color:${c.ok?"var(--muted)":"var(--red)"};
              font-size:.68rem">반대</span>
            <b class="mono" style="${c.ok?"":"color:var(--red)"}">${c.no} · ${c.noRate}%</b></div>
          ${c.abs?`<div style="flex:.9;background:var(--mist);border-radius:7px;padding:7px 0">
            <span style="display:block;color:var(--muted);font-size:.68rem">기권</span>
            <b class="mono">${c.abs}</b></div>`:""}
        </div>
        <p style="font-size:.72rem;margin:7px 0 0;
          color:${c.ok?"var(--muted)":"var(--red)"}">

    : `<div class="warnbox"><b>이 기간에 의결한 것이 없습니다</b>
        <p>기간을 넓혀 보시거나, 조합이 아직 올리지 않았을 수 있습니다.</p></div>`}

    <p class="note">숫자는 회의록 원문과 대조를 마친 것입니다.

      <b>누가 어떻게 투표했는지는 비밀투표라 남지 않습니다.</b>
      부결된 것도 그대로 보여 드립니다.</p>
    `, '의결 기록', '표결로 정해진 것들');

    /* ★ 2026-09-16 — 시트 본문은 전역 sb 다 (1409줄).

     **없는 이름**을 찾고 있었다. null 이 와서 그 아래 단추에
     동작이 안 붙었고, 오류도 안 나서 몇 달을 몰랐다. */
    const f = sb.querySelector('#dc-f'), t = sb.querySelector('#dc-t');
    if(f) f.onchange = e => { DEC.from = e.target.value; draw(); };
    if(t) t.onchange = e => { DEC.to   = e.target.value; draw(); };
    sb.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{
      DEC.kind = b.dataset.dk; draw(); });
    /* ★ 의결에 딸린 회의록 원본 — 숫자의 근거를 그 자리에서 보신다 */
    sb.querySelectorAll('[data-decf]').forEach(b=>b.onclick=async()=>{

      b.disabled = false; b.innerHTML = back;

      window.open(u, "_blank");
    });
  };
  draw();
}

            </div>`).join("")}
          </div>
          <p style="margin:11px 0 0;font-size:.76rem;color:var(--muted);line-height:1.7">
            ${AI.a.found.some(f=>f.ans)
              ? "답이 원문과 다르면 <b>내정보 › 조합 집행진에 문의</b>로 알려 주십시오. "
              : ""}법적 효력은 원문에 있습니다.</p>
        </div>` : ""}`
      : AI.a.docs && AI.a.docs.length
      ? `<div class="calc-note"><b>${AI.a.what} 원문이 올라와 있습니다</b>
          내용을 요약해 드리지는 못합니다. 지어내지 않기 위해서입니다.
          원문을 직접 보시겠습니까?
          <div style="margin-top:9px;display:flex;flex-direction:column;gap:6px">
            ${AI.a.docs.map(d=>`<button class="btn ghost" data-aidoc="${d.id}"
              style="text-align:left">${d.title}
              <span style="display:block;font-size:.74rem;color:var(--muted);font-weight:400">
                ${d.sub||""} ${d.at.slice(0,10)}</span></button>`).join("")}
          </div></div>`
      :`<div class="warnbox"><b>${AI.a.what?`아직 ${AI.a.what}이(가) 등록되지 않았습니다`:"이 질문에 답할 자료가 없습니다"}</b>
          <p>${AI.a.what
            ? `조합에서 자료를 받으면 그때부터 답해 드릴 수 있습니다. 모르는 것을 지어내지 않습니다.`
            : `조합이 올린 자료에서 찾지 못했습니다.<br>
               고시문의 확정 수치는 바로 답해 드립니다 — 용적률 · 세대수 · 임대주택 · 기반시설 · 일정.<br>
               그 밖의 것은 조합이 자료를 올리고 찾을 자리를 적어 두어야 찾아 드릴 수 있습니다.<br>
               <span style="color:var(--muted)">필요하신 자료가 있으시면 조합 사무실로 알려 주십시오.</span>`}</p></div>`}
    `}

    <div class="sec" style="margin-top:16px"><h2>이런 것도 물어보실 수 있습니다</h2></div>
    ${AI_SUGGEST.map(q=>`<button class="sug" data-aiq="${q}">${q}</button>`).join('')}

    <div class="sh-ft">확정 수치는 검산을 마친 65항목에서 답해 드리고,<br>
      그 밖의 것은 <b>조합 자료에서 자리를 찾아</b> 원문을 열어 드립니다.<br>
      내용을 지어내지 않습니다.</div>`, '조합 자료 찾기',
    `확정 수치 65항목${(typeof aiScope!=="undefined" && aiScope().docs)
      ? ` · 조합 자료 ${aiScope().docs}건` : ""}`);

    const el = sb.querySelector('#ai-q');
    /* ★ 글자를 칠 때마다 후보를 펼친다.
       화면 전체를 다시 그리면 커서가 튀므로 후보 자리만 갈아 끼운다.
       조합원은 무엇을 물어야 할지 모르신다. 답할 수 있는 것을 보여 드린다. */
    if(el) el.oninput = e => {
      AI.q = e.target.value;
      const box = sb.querySelector('#ai-sug');
      if(box){ box.innerHTML = aiSugHtml(); bindSug(sb); }
    };
    bindSug(sb);
    sb.querySelectorAll('[data-aigo]').forEach(b=>b.onclick=()=>{
      const v = sb.querySelector('#ai-q'); AI.q = v ? v.value : AI.q;
      AI.a = aiAnswer(AI.q); draw();
    });
    sb.querySelectorAll('[data-aiq]').forEach(b=>b.onclick=()=>{
      AI.q = b.dataset.aiq; AI.a = aiAnswer(AI.q); draw();
    });
    /* AI 가 짚어 준 원문 열기 */
    /* 법령은 국가법령정보센터로 보낸다 — 언제나 현행이 나온다 */
    sb.querySelectorAll('[data-law]').forEach(b=>b.onclick=()=>
      window.open(b.dataset.law, "_blank"));
    /* ★ 짚어 준 쪽에서 연다. 조합원이 64쪽을 넘겨 찾으시게 하면 안 된다. */
    sb.querySelectorAll('[data-aidoc]').forEach(b=>b.onclick=async()=>{
      const d = ARC_DOCS.concat(typeof LAW_DOCS!=="undefined"?LAW_DOCS:[])
        .find(x=>x.id===b.dataset.aidoc); if(!d) return;
      const pg = (b.dataset.pg||"").replace(/[^0-9]/g,"");
      /* ★ 사진 여러 장이면 그 장을 펼친다 (115절) */
      if(arcIsPic(d) && d.sheets && d.sheets.length > 1){ openSheets(d, (+pg || 1) - 1); return; }
      const u = await hubFileUrl(d.path, 3600);
      if(!u){ alert("원문을 열지 못했습니다."); return; }
      window.open(u + (pg ? "#page=" + pg : ""), "_blank");
    });
  };
  draw();
}

/* ═══════════════════════════════════════════════════════════
   회계 · 예산 공개 (2026-08-22 대시보드로 전면 개편)
   ───────────────────────────────────────────────────────────
   ★ 서버에서 받아온 공개 자료(app_state "acct_pub")만 그린다.
     조합 직원 화면의 지출 원장을 여기서 읽지 않는다.
     원장에는 거래처 실명 · 사업자등록번호 · 원천세가 들어 있고,
     그것을 앱으로 보내지 않는 것이 이 구조의 핵심이다.

     ACCT_PUB 에 담기는 칸
       budget · used · cnt · plan   과목별 예산 · 집행 · 건수 · 집행 예정
       basis · revs                 의결 근거 · 차수 이력
       items                        {d 집행일 · item 과목 · t 적요 · amt 금액}

     담기지 않는 칸 — 서버에 아예 올라가지 않는다
       payee bizNo wht seal acct book bookBy tax evi doc

   ★ 숫자를 셋으로 나눈다.
       집행 완료   실제로 통장에서 나간 돈
       집행 예정   조합장 결재까지 끝났지만 아직 안 나간 돈
       남은 예산
     결재와 집행을 섞으면 숫자가 부풀려지고,
     조합원이 통장과 대조했을 때 맞지 않는다.
     그렇다고 「집행 예정」을 빼면 나머지가 다 남은 줄 아신다.

   ★ 그래프가 먼저, 건별은 접어 둔다.
     폰에서 스무 줄을 훑게 하면 큰 그림이 안 보인다.
     다만 없애지는 않는다. 「내역을 안 보여준다」는 말이 나오면
     그때부터 그래프 숫자 자체를 믿지 않으신다.
   ═══════════════════════════════════════════════════════════ */
let pubOpen = null;    /* 펼친 과목 */
let pubMore = false;   /* 건별 내역 펼침 */

/* 폰에서 읽기 좋게 — 318,000,000 은 자릿수를 세게 된다 */
function pubEok(v){
  v = Number(v)||0;
  if(v >= 100000000){ const e = v/100000000;
    return (e >= 10 ? e.toFixed(0) : e.toFixed(1)).replace(/\.0$/,"") + "억"; }
  if(v >= 10000) return Math.round(v/10000).toLocaleString("ko-KR") + "만";
  return v.toLocaleString("ko-KR");
}
/* 도넛 색 — 딥네이비 한 갈래.
   무지개로 칠하면 색마다 뜻이 있는 줄 아신다. 진할수록 많이 쓴 것이다. */
/* ★★ 2026-09-23 — 남색 한 갈래에서 갈라지는 색으로 바꿨다.
   예전에는 농담만 달라 다섯째부터 거의 구분이 안 됐다.
   ★ 가장 많이 쓴 과목이 남색(기둥)이고 그 뒤로 갈라진다.
     채도를 낮춰 남색과 부딪히지 않게 했다.
   ★ 빨강은 넣지 않는다. 예산을 넘긴 막대에만 쓴다. */
const PUB_C = ["#173E68","#3E8FA8","#7E8BD1","#C98AAE","#E7B45A",
               "#8FA8C4","#B7C4D4","#D2E0EF"];

/* ★ 본문을 함수로 떼어 둔다 (2026-08-22).
   같은 대시보드를 두 곳에서 쓴다.
     ① 하단 [예산] 탭        — 조합원이 가장 자주 여는 자리
     ② 자료실 → 회계 · 지출  — 자료를 찾아 들어오시는 분
   따로 만들면 한쪽만 고쳐져 두 화면의 숫자가 어긋난다. */
const pubEmpty = () => `<div class="empty">아직 공개된 회계 자료가 없습니다.<br>
  조합이 예산과 집행 내역을 등록하면 이 자리에 나타납니다.</div>
  <div class="sh-ft">집행이 끝난 건만 공개됩니다.<br>
    결재만 나고 아직 돈이 나가지 않은 건은 들어 있지 않습니다.</div>`;

function pubBody(){
  const P = (typeof ACCT_PUB !== "undefined") ? ACCT_PUB : null;
  if(!P || !P.budget) return pubEmpty();

  const KS = Object.keys(P.budget);
  const B = KS.reduce((a,k)=>a + (P.budget[k]||0), 0);
  const U = KS.reduce((a,k)=>a + ((P.used||{})[k]||0), 0);
  const W = KS.reduce((a,k)=>a + ((P.plan||{})[k]||0), 0);
  const L = Math.max(B - U - W, 0);
  const pc = v => B ? v/B*100 : 0;

  /* 도넛 — 집행액 기준 과목 비율 */
  const share = KS.filter(k=>((P.used||{})[k]||0) > 0)
    .map(k=>({k, v:P.used[k], r:U ? P.used[k]/U*100 : 0}))
    .sort((a,b)=>b.v-a.v);
  let acc = 0;
  const stops = share.map((s,i)=>{ const f = acc; acc += s.r;
    return `${PUB_C[i%PUB_C.length]} ${f.toFixed(2)}% ${acc.toFixed(2)}%`; }).join(",");

  /* 막대 — 많이 쓴 과목부터 */
  const bars = KS.slice().sort((a,b)=>((P.used||{})[b]||0)-((P.used||{})[a]||0));
  const items = (P.items||[]);

  return `

  <div class="pubhero">
    <div class="lab">${P.year}년도 총회 승인 예산</div>
    <div class="big">${pubEok(B)}<em>원</em></div>
    <div class="of">그중 ${pubEok(U)}원을 썼습니다</div>

    <div class="pstack">
      <i class="s1" style="width:${pc(U)}%"></i>
      <i class="s2" style="width:${pc(W)}%"></i>
    </div>

    <div class="plg">
      ${[["집행 완료","s1",U],["집행 예정","s2",W],["남은 예산","s3",L]]
        .map(([l,c,v])=>`<div><i class="${c}"></i>${l}
          <span class="p">${pc(v).toFixed(1)}%</span>
          <b>${pubEok(v)}</b></div>`).join("")}
    </div>
  </div>

  <p class="note"><b>집행 예정</b>은 조합장 결재까지 끝났지만
    아직 통장에서 돈이 나가지 않은 금액입니다.
    나갈 것이 정해진 돈이라 함께 보여 드립니다.</p>

  ${share.length?`
  <div class="sec"><h2>무엇에 쓰였나</h2><span>집행 완료 ${pubEok(U)}원</span></div>
  <div class="pubcard pdonut">
    <div class="dnut" style="background:conic-gradient(${stops})">
      <div class="dmid"><div><b>${pc(U).toFixed(1)}%</b><span>예산 대비</span></div></div>
    </div>
    <div class="dlg">
      ${share.slice(0,7).map((s,i)=>`<div>
        <i style="background:${PUB_C[i%PUB_C.length]}"></i>${s.k}
        <b>${s.r.toFixed(0)}%</b></div>`).join("")}
    </div>
  </div>`:""}

  <div class="sec"><h2>과목별 예산과 집행</h2><span>${KS.length}개 과목</span></div>
  <div class="list">
    ${bars.map(k=>{
      const b = P.budget[k]||0, u = (P.used||{})[k]||0;
      const w = (P.plan||{})[k]||0, n = (P.cnt||{})[k]||0;
      const r = b ? u/b*100 : 0, on = pubOpen === k;
      return `<button class="pbar" data-pk="${k}">
        ${/* ★ 2026-09-23 — 넘긴 과목은 빨강 + 「넘김」,
             집행도 예산도 없는 과목은 흐리게 */""}
        <div class="pt"><b${(!u&&!b)?' style="color:var(--muted)"':''}>${k}${r>100
          ? `<span style="color:#C0392B;font-weight:400"> · 넘김</span>`:""}</b>
          <span class="rr" style="color:${r>100?'#C0392B':(!u&&!b)?'var(--muted)':'var(--ink)'}">
            ${b?r.toFixed(0)+"%":"—"}</span></div>
        <div class="ptrack"><i class="${r>100?'over':''}" style="width:${Math.min(r,100)}%"></i></div>
        <div class="pf"><span class="mono">${pubEok(u)} / ${pubEok(b)}원</span>
          <span${r>100?' style="color:#C0392B"':''}>${r>100 ? `${pubEok(u-b)}원 초과`
            : n ? n+"건" : "집행 없음"}${w?` · 예정 ${pubEok(w)}`:""}</span></div>
      </button>
      ${on?`<div class="pdet">
        <div class="vrow"><span>총회 승인 예산</span><b class="mono">${wonKR(b)}원</b></div>
        <div class="vrow"><span>집행 완료</span><b class="mono">${wonKR(u)}원 · ${n}건</b></div>
        ${w?`<div class="vrow"><span>집행 예정</span>
          <b class="mono" style="color:var(--muted)">${wonKR(w)}원</b></div>`:""}
        <div class="vrow"><span>남은 예산</span>
          <b class="mono" style="color:${b-u-w<0?'var(--amber)':'var(--ink)'}">${wonKR(b-u-w)}원</b></div>
      </div>`:""}`;}).join("")}
  </div>
  <p class="note">막대를 누르시면 그 과목의 금액이 자세히 나옵니다.
    집행률이 100%를 넘으면 주황색으로 바뀌고, 초과분은 총회 의결을 받아야 합니다.</p>

  ${P.basis?`
  <div class="sec"><h2>이 예산은 언제 정했나</h2></div>
  <div class="pubcard" style="padding:14px 16px">
    <div class="vrow"><span>의결 총회</span><b>${P.basis.date}</b></div>
    <div class="vrow"><span>회의</span><b>${P.basis.meet}</b></div>
    <div class="vrow"><span>안건</span><b>${P.basis.agenda}</b></div>
    <div class="vrow"><span>차수</span><b>제${P.basis.ord}차 · ${P.basis.kind}</b></div>
  </div>`:""}

  ${(P.revs&&P.revs.length>1)?`
  <div class="list" style="margin-top:10px">
    ${P.revs.slice().reverse().map(r=>`<div class="prev">
      <div class="ord">제${r.ord}차</div>
      <div class="bd"><b>${r.kind}</b><span>${r.date} · ${r.meet} ${r.agenda}</span></div>
      <div class="tot">${pubEok(r.total)}
        ${r.gap!==null&&r.gap!==undefined?`<em style="color:${r.gap>0?'var(--amber)':'var(--blue)'}">
          ${r.gap>0?"+":""}${pubEok(r.gap)}</em>`:""}</div>
    </div>`).join("")}
  </div>
  <p class="note">예산을 고친 이력은 모두 남습니다. 총회에서 의결한 것만 반영됩니다.</p>`:""}

  <div class="sec"><h2>이 숫자를 믿으셔도 되는 까닭</h2></div>
  <div class="okbox">
    <b>조합이 유리한 것만 골라 보일 수 없습니다</b>
    <p>과목을 감추거나 특정 건을 빼는 기능이 아예 없습니다.
       조합장 결재를 거쳐 실제로 지급이 끝난 건은 모두 이 숫자에 들어갑니다.
       예산을 고치려면 총회 의결이 있어야 하고, 고친 이력도 지워지지 않습니다.</p>
  </div>
  <div class="warnbox" style="margin-top:11px">
    <b>결재만 나고 아직 안 나간 돈은 따로 셉니다</b>
    <p>결재와 집행을 섞으면 숫자가 부풀려지고, 나중에 통장과 대조했을 때 맞지 않습니다.
       그래서 「집행 완료」와 「집행 예정」을 나누어 보여 드립니다.</p>
  </div>

  ${items.length?`
  <button class="pfold" data-pmore="1">
    <b>건별 내역 보기</b>
    <span>${pubMore?"접기":`${items.length}건 펼치기`}</span></button>
  ${pubMore?`<div class="list" style="margin-top:10px">
    ${items.map(x=>`<div class="pex">
      <div class="dt">${(x.d||"").slice(5)}</div>
      <div class="tt">${x.t}<span>${x.item}</span></div>
      <div class="aa">${wonKR(x.amt)}</div></div>`).join("")}
  </div>
  <p class="note">거래처 이름 · 사업자등록번호 · 담당자 이름은 앱에 담지 않습니다.
    개인정보이자 거래 상대방의 영업 정보이기 때문입니다.
    확인이 필요하시면 조합 사무실에 정보공개를 청구하실 수 있습니다.</p>`:""}`:""}

  ${P.demo?`<div class="warnbox" style="margin-top:14px">
    <b>지금 보시는 숫자는 예시입니다</b>
    <p>화면이 어떻게 나오는지 보여 드리기 위한 자료입니다.
       조합이 실제 예산과 집행 내역을 등록하면 이 자리에 진짜 숫자가 나옵니다.</p></div>`:""}

  <div class="sh-ft">마지막 갱신 · ${P.updated||"—"}${P.demo?" · 예시 자료":""}<br>
    금액은 부가가치세를 포함한 실제 지급액입니다.<br>
    숫자가 이상하다고 느끼시면 <b>내정보 › 조합 집행진에 문의 → 「내 수치가 이상해요」</b>로 알려 주십시오.
    조합이 확인하고 답변드립니다.</div>`;
}

/* 자료실 → 회계 · 지출 에서 시트로 연다 */
function openExpense(){
  open(pubBody(), '조합 회계 · 예산', '집행 완료 기준');
  /* ★ 다시 그릴 때 있던 자리로 돌아간다.
     과목을 눌렀는데 맨 위로 튀면 어디를 눌렀는지 잃어버리신다. */
  const keep = sb.scrollTop;

/* ── 하단 [예산] 탭 ─────────────────────────────────────
   ★ 조합원이 가장 자주 찾으시는 것이 「내 돈이 어디에 쓰이나」다.
     자료실 안쪽에 두면 세 번을 눌러야 닿는다. 하단 바에서 한 번에 연다.

   ★ 시트가 아니라 한 페이지로 그린다.
     시트는 화면 높이의 86%까지만 열려 도넛 아래가 잘린다. */
/* ★★ 연도별 결산 공개 (2026-09-22)
   올해(지출 원장에서 저절로 나오는 것)와 지난해 결산(총회 승인)을 한 화면에서 고른다. */
const FINV = {y:"now", side:"op", open:null};
const wonEok = v => (typeof pubEok !== "undefined") ? pubEok(v) : String(v);
function finYearTabs(){
  const ys = (typeof finOpenYears !== "undefined") ? finOpenYears() : [];
  if(!ys.length) return "";
  const t = (k, lab) => `<button class="achip ${FINV.y===k?"on":""}" data-finy="${k}">${lab}</button>`;
  return `<div class="abar" style="margin:0 0 11px">
    ${t("now","올해 · 진행 중")}
    ${ys.map(y => t(String(y.y), `${y.y}년 결산`)).join("")}
  </div>`;
}
/* 지난해 결산 한 해를 그린다 */
function finBody(y){

  const rows = (y[side] || []).filter(r => (r.k||"").trim());
  const B = finSum(rows,"bud"), U = finSum(rows,"use");

  const bzB = finSum(y.biz||[],"bud"), bzU = finSum(y.biz||[],"use");

  let acc = 0;
  const stops = share.map((sh,i) => { const f = acc; acc += sh.r;

  const L = y.loans || [], LS = finSum(L,"amt"), LI = Math.round(finLoanInt(y));

  return `

  <div class="pubhero">
    <div class="lab">${y.y}년 총회 승인 ${side==="op"?"운영비":"사업비"} 예산</div>
    <div class="big">${wonEok(B)}<em>원</em></div>

    ${/* ★ 올해 화면과 **같은 3색 띠**를 쓴다 (2026-09-22).

        .map(([l,c,v])=>`<div><i class="${c}"></i>${l}

}

/* ══ 라우팅 ══ */
/* ★ 예산을 하단 바에 상시로 둔다 (2026-08-22).
   조합원이 가장 자주 물으시는 것이 「내 돈이 어디에 쓰이나」다.
   자료실 안쪽에 두면 [자료] → [회계·지출] → [예산 대비 집행]
   세 번을 눌러야 닿는다. 한 번에 열리게 한다.

   ★ 자리는 소식과 우리집 사이다.
     조합 전체 이야기(홈 · 소식 · 예산)를 왼쪽에,
     내 이야기(우리집 · 자료 · 내정보)를 오른쪽에 모은다. */
/* ★ 2026-09-20 — 우리집을 앞으로 옮겼다.
   조합원이 **가장 자주 여는 곳**이라 손가락이 닿기 쉬운 자리여야 한다.
   예전 : 홈 · 소식 · 예산 · 우리집 · 자료 · 내정보
   지금 : 홈 · 소식 · 우리집 · 예산 · 자료 · 내정보 */
const TABS=[['home','홈','home'],['news','소식','news'],['my','우리집','my'],
            ['budget','예산','won'],['doc','자료','doc'],['me','내정보','user']];
let cur='home';
const VIEWS={home:vHome,news:vNews,budget:vBudget,my:vMy,doc:vDoc,me:vMe};

/* ★ 지금 단계를 화면 가운데로 옮겨 드린다 (2026-09-16 밤).
   아홉 칸이라 「시공사 선정」이 화면 밖에 있을 수 있다.
   ★ 없어도 되는 일이라 try 로 감싼다 (절대규칙 ㉒). */
function progCenter(){
  try{
    const w = document.getElementById("progscroll");
    if(!w) return;
    const on = w.querySelectorAll(".dot.now")[0];
    const k  = Array.from(w.querySelectorAll(".dot")).indexOf(on);
    const lb = w.querySelectorAll(".labels span")[k];
    if(!lb || w.scrollWidth <= w.clientWidth) return;
    w.scrollLeft = lb.offsetLeft - w.clientWidth / 2 + lb.offsetWidth / 2;
  }catch(e){ /* 못 옮겨도 미는 데는 지장이 없다 */ }
}

/* ★ 조감도를 다 그린 뒤에 끼워 넣는다 (2026-09-17).
   글자로 이어 붙이면 화면 한 장이 18만 자가 되어 느려진다. */
function heroFill(){
  /* ★ 로고 — 여러 개라 전부 채운다. 이미 채운 것은 건너뛴다. */
  try{
    document.querySelectorAll(".logoImg").forEach(g => { if(!g.src) g.src = LOGO; });
  }catch(e){}
  try{
    const el = document.getElementById("heroImg");
    if(!el || el.src) return;
    /* ★ 조합이 올린 사진이 있으면 그것을, 없으면 코드에 박힌 것을. */
    const h = (typeof TN !== "undefined" && TN().home) ? TN().home : null;
    el.src = (h && h.src) ? h.src : HERO;
  }catch(e){}
}

/* ★ 소식의 표 사진 — 주소를 받아 채운다 (2026-09-18).
   ★ 주소는 10분짜리 서명 URL 이다. 화면을 그릴 때마다 받으면
     느리므로 **한 번 받은 것은 들고 있는다.** */
const NWPIC = {};
async function nwPicFill(){
  try{
    const list = document.querySelectorAll("[data-nwsrc]");
    for(const el of list){
      const p = el.dataset.nwsrc;
      if(!p || el.src) continue;
      if(NWPIC[p]){ el.src = NWPIC[p]; continue; }
      const u = await hubFileUrl(p, 600);
      if(u){ NWPIC[p] = u; el.src = u; }
      /* ★ 주소를 못 받았으면 그 자리에 알려 드린다 (2026-09-19).
         빈 네모만 보이면 조합원은 「고장 났나」 하신다. */
      else { const b = el.closest(".nwshot"); if(b) b.classList.add("bad"); }
    }
  }catch(e){ /* 못 받아도 글은 보인다 */ }
}

/* 눌러서 크게 보기 */
async function nwPicBig(path){
  try{
    const u = NWPIC[path] || await hubFileUrl(path, 600);
    if(!u){ alert("사진을 불러오지 못했습니다.\n잠시 뒤 다시 해보십시오."); return; }
    NWPIC[path] = u;
    open(`<div class="nwbig"><img src="${u}" alt=""></div>
      <p class="note" style="margin-top:10px">
        ★ 손가락으로 벌리시면 더 크게 보실 수 있습니다.<br>
        ★ 표가 가로로 길면 옆으로 밀어 보십시오.</p>`,
      "표 크게 보기", "손가락으로 벌려 보십시오");
  }catch(e){}
}

function render(keepScroll){
  document.getElementById('app').innerHTML=VIEWS[cur]();
  heroFill();
  nwPicFill();
  progCenter();
  /* ★★★ 2026-09-20 — 동그라미는 「우리집」에만 늘 붙는다 ★★★
     ───────────────────────────────────────────────────────────
     ★ 처음에는 **지금 보는 칸**에 붙였다. 홈을 보면 홈에 붙었다.
       그런데 뜻하신 것은 **우리집에만 늘** 붙이는 것이었다.

     ★ 우리집은 조합원이 **자기 재산을 보는 곳**이다.
       늘 표시가 있으면 「내 것은 여기」가 눈에 박힌다.

     ★ 지금 보는 칸은 **글자와 그림 색**으로 알린다 (.tab.on).
       그것으로 충분하다. 둘 다 동그라미를 쓰면 무엇이 무엇인지 모른다.

     ★ 그림만 감싼다. 글자까지 감싸면 칸이 좁아 글자가 접힌다. */
  document.getElementById('tabs').innerHTML=TABS.map(([id,l,i])=>
    `<button class="tab ${cur===id?'on':''}" data-tab="${id}">
       <span class="tic ${id==='my'?'mark':''}">${ic(P[i])}</span>${l}
       ${id==='news'?'<i class="nd"></i>':''}</button>`).join('');
  if(!keepScroll) scrollTo(0,0);

  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cur=b.dataset.tab;render()});
  /* ★ 예산 탭 안에서 과목을 펼치고 접는다.
     시트가 아니라 한 페이지라 sb 가 아닌 document 에서 찾는다.
     화면을 다시 그릴 때 스크롤 자리를 지킨다 — 여덟 번째 과목을 눌렀는데
     맨 위로 튀면 어디를 눌렀는지 잃어버리신다. */
  if(cur === 'budget'){
    const keep = window.scrollY;
    const back = () => { render(true); window.scrollTo(0, keep); };
    document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{
      pubOpen = (pubOpen === b.dataset.pk ? null : b.dataset.pk); back(); });
    document.querySelectorAll('[data-pmore]').forEach(b=>b.onclick=()=>{
      pubMore = !pubMore; back(); });
  }
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cur=b.dataset.go;render()});
  document.querySelectorAll('[data-news]').forEach(b=>b.onclick=()=>openNews(NEWS[+b.dataset.news]));
  /* ★ 직원이 올린 소식은 소식 탭에서 펼쳐 보시게 한다 (2026-09-16).
     홈에 또 하나의 읽는 자리를 만들면 같은 글을 두 군데서 손봐야 한다. */
  /* ═══════════════════════════════════════════════════════════
     ★★★ 2026-09-17 밤 — 누른 소식이 아니라 다른 것이 열리던 것 ★★★
     ───────────────────────────────────────────────────────────
     홈의 새 소식을 누르면 **누른 그 소식**으로 가야 하는데
     엉뚱한 것이 열렸다. 까닭이 셋이었다.

     ① 가장 새 긴급 공지는 **목록(FEED)에 아예 없다.**
        맨 위 띠로만 나간다. 그것을 누르면 「f11」이라는
        **없는 열쇠**를 세우고 아무것도 안 펼친다.

     ② 펼쳐도 **그 자리로 안 간다.** scrollTo(0,0) 로 맨 위만 간다.
        목록이 길면 펼쳐진 글이 화면 밖에 있어
        보시기엔 **다른 소식이 열린 것처럼** 보인다.

     ③ 갈래 칸이 「전체」가 아니면 **그 칸에 없을 수 있다.**
        공지 칸을 보고 계시다 홈에 갔다 오면 안 보인다.

     ★ 고침
       ① 긴급이면 맨 위 띠를 펼친다 (NVO.urg)
       ② 갈래를 「전체」로 되돌린다
       ③ 그린 뒤 **그 줄이 맨 위에 오도록** 굴려 보낸다
     ═══════════════════════════════════════════════════════════ */
  /* ★ 표 사진을 누르면 크게 (2026-09-18).
     ★ 소식 줄 전체가 접혔다 펼쳤다 하므로 stopPropagation 이 꼭 필요하다.
       없으면 사진을 눌렀는데 소식이 접힌다. */
  document.querySelectorAll('[data-nwpic]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); nwPicBig(b.dataset.nwpic); });

  /* ★ 소식에 딸린 자료 (2026-09-21) — 자료실의 그 자료로 들어간다 */
  document.querySelectorAll('[data-nwdoc]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const d = ARC_DOCS.find(x => x.id === b.dataset.nwdoc);
    if(d) openDocQA(d);
  });

  /* ★ 연도별 결산 (2026-09-22) */
  document.querySelectorAll('[data-finy]').forEach(b=>b.onclick=()=>{
    FINV.y = b.dataset.finy; render(); scrollTo(0,0); });
  document.querySelectorAll('[data-finrow]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.finrow;

    FINV.open = (FINV.open === k) ? null : k;
    render();
    const a = document.querySelector(`[data-finrow="${k}"]`);
    if(a) scrollBy(0, a.getBoundingClientRect().top - y0);   /* 누른 줄을 그 자리에 (111절) */
  });
  document.querySelectorAll('[data-finside]').forEach(b=>b.onclick=()=>{
    FINV.side = b.dataset.finside; render(); });
  document.querySelectorAll('[data-findoc]').forEach(b=>b.onclick=()=>{
    const d = ARC_DOCS.find(x => x.id === b.dataset.findoc); if(d) openDocQA(d); });

  document.querySelectorAll('[data-hnews]').forEach(b=>b.onclick=()=>{
    const H = (typeof homeNews !== "undefined") ? homeNews() : null;
    const n = H && H[+b.dataset.hnews];
    cur = 'news';
    NV.tab = "all";                       /* ★ ③ 어느 칸을 보고 계셨든 전체로 */
    let key = null;
    if(n){
      const raw = String(n.id).slice(1);  /* "h11" → "11" */
      /* ★ ① 목록에 있는 것만 펼친다. 없으면 맨 위 긴급 띠다. */
      const inFeed = (typeof FEED !== "undefined")
        && FEED.some(f => String(f.id) === raw);
      if(inFeed){ key = "f" + raw; NVO[key] = true; }
      else { NVO.urg = true; key = "urg"; }
    }
    render();
    /* ★ ② 그 줄로 굴려 보낸다. 그려진 뒤여야 하므로 한 박자 늦춘다. */
    setTimeout(() => {
      try{
        /* ★ 맨 위 긴급 띠도 data-nvo="urg" 를 이미 달고 있다.
           따로 표를 만들지 않고 그것을 그대로 쓴다. */
        const el = document.querySelector(`[data-nvo="${key}"]`);
        if(!el){ scrollTo(0,0); return; }

        /* ★★★ 2026-09-17 밤 — 가운데 말고 **맨 위**로 ★★★
           block:"center" 는 그 글을 화면 한가운데 둔다.
           그러면 **위쪽 절반이 앞 소식**이라 어느 것이 열린 건지 헷갈린다.

           ★ 그렇다고 그냥 위로 붙이면 안 된다.
             화면 맨 위에 **붙박이 머리띠(.hd.solid)** 가 있어
             제목이 그 밑으로 숨는다.

           ★ 머리띠 높이를 재서 그만큼 띄운다. 높이를 손으로 적지 않는다.
             글자 크기 설정에 따라 머리띠 높이가 달라진다. */
        const hd = document.querySelector(".hd.solid");
        const gap = (hd ? hd.getBoundingClientRect().height : 0) + 12;
        const top = el.getBoundingClientRect().top + window.pageYOffset - gap;
        window.scrollTo({top: Math.max(0, top), behavior:"smooth"});
      }catch(e){ scrollTo(0,0); }
    }, 60);
  });
  document.querySelectorAll('[data-hubgo]').forEach(b=>b.onclick=()=>location.reload());
  document.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>openConsent());
  document.querySelectorAll('[data-sess]').forEach(b=>b.onclick=()=>openSession());

  document.querySelectorAll('[data-svr]').forEach(b=>b.onclick=()=>openSvResult(b.dataset.svr));
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>openCat(+b.dataset.cat));

  document.querySelectorAll('[data-dk]').forEach(b=>b.onclick=()=>{
    /* ★ 갈래를 바꾸면 다시 30건부터 (2026-09-17) */
    DQ.kind = b.dataset.dk; DQ.more = 30; render(true); });

  /* ★ 더 보기 — 100건씩 늘린다 (2026-09-17).
     ★ 보시던 자리를 지킨다. 맨 위로 튀면 어디를 읽던 중인지 잃어버리신다. */
  document.querySelectorAll('[data-dmore]').forEach(b=>b.onclick=()=>{
    const keep = window.scrollY;
    DQ.more = (DQ.more || 30) + 100;

  /* ★ 한글이 조합되는 중에는 다시 그리지 않는다 (2026-08-22 밤).

     조합원 앱은 전부 폰이라 이 문제가 더 잘 생긴다. */
  const dq = document.getElementById('dq');
  if(dq){
    const go = () => {
      DQ.q = dq.value;
      /* ★ 찾기 칸을 비우시면 다시 30건부터 (2026-09-17).

      if(!DQ.q.trim()) DQ.more = 30;

  }

    MK.mode = b.dataset.mkmode; render(true); });

  document.querySelectorAll('[data-nv]').forEach(b=>b.onclick=()=>{
    NV.tab = b.dataset.nv; NV.open = null; render(); });
  /* 아코디언 — 눌러서 펼치고 접는다. 화면을 다시 그려도 자리를 지킨다. */

  });
  /* 소식 접기 · 펼치기 (2026-09-16)
     ★ render(true) 로 자리를 지킨다. 맨 위로 튀면 어디를 눌렀는지 잃으신다. */
  document.querySelectorAll('[data-nvo]').forEach(b=>b.onclick=()=>{
    const k = b.dataset.nvo;
    const was = !!NVO[k];
    NVO[k] = !was;
    render(true);
    /* ★ 펼칠 때는 그 줄을 맨 위로 올려 준다 (2026-09-17 밤).
       긴 글을 펼치면 제목이 위로 밀려 무엇을 펼쳤는지 안 보인다.
       접을 때는 그대로 둔다. 읽던 자리가 튀면 안 된다. */
    if(!was) setTimeout(() => {
      try{
        const el = document.querySelector(`[data-nvo="${k}"]`);
        if(!el) return;
        const hd  = document.querySelector(".hd.solid");
        const gap = (hd ? hd.getBoundingClientRect().height : 0) + 12;
        const top = el.getBoundingClientRect().top + window.pageYOffset - gap;
        window.scrollTo({top: Math.max(0, top), behavior:"smooth"});
      }catch(e){}
    }, 60);
  });
  /* 전화 걸기 — 번호를 외워 다시 치실 일이 없다 */
  document.querySelectorAll('[data-tel]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    location.href = "tel:" + b.dataset.tel.replace(/[^0-9+]/g,"");
  });
  document.querySelectorAll('[data-office]').forEach(b=>b.onclick=()=>openOffice());
  document.querySelectorAll('[data-officer]').forEach(b=>b.onclick=()=>openOfficer());
  document.querySelectorAll('[data-dele2]').forEach(b=>b.onclick=()=>openDelegate());
  document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>openCard());
  document.querySelectorAll('[data-asklog]').forEach(b=>b.onclick=()=>openAskLog());
  document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>openAsk(b.dataset.ask));
  document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>openOffice());
  document.querySelectorAll('[data-mylog]').forEach(b=>b.onclick=()=>openMyLog());

  document.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{
    TG[b.dataset.tg]=!TG[b.dataset.tg];render(true)});
  /* ★ 예전 askFar · askRent … 는 미아2 전용이라 쓰지 않는다.
     조합이 채운 것으로 여는 시트 하나(openHbQ)로 바꿨다 (2026-09-17 밤). */
  document.querySelectorAll('[data-hbq]').forEach(b=>b.onclick=()=>openHbQ(+b.dataset.hbq));
  document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>authOpen(Number(b.dataset.auth)||1));
  document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{
    if(ME.logged){ME.logged=false;ME.type=null;ME.name="";ME.memberNo=null;ME.rec=null}
    else{ME.logged=true;ME.type="member";ME.name="류승현";ME.memberNo="제 1207 호";ME.rec=null}
    render(true);});
  document.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{
    if(!ME.rec) return;
    CALC.appraisal = ME.rec.appraisal;
    if(CALC.ratio==null) CALC.ratio = 100;
    cur='my'; render(); scrollTo(0,0);
  });
  document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=()=>{
    ME.logged=false;ME.type=null;ME.name="";ME.memberNo=null;ME.rec=null;
    AUTH.step=0;AUTH.name="";AUTH.phone="";AUTH.code="";
    Object.keys(AGREE).forEach(k=>AGREE[k]=false);
    render(true);});
  bindCalc();
}

/* ── 계산기 이벤트 ── */
/* ★ 다시 그린 뒤 커서를 제자리로 돌려놓는다 (2026-09-17 밤 고침).
   ★ 예전에는 active.selectionStart 를 그냥 읽었다.
     그런데 <input type="number"> 는 그 줄에서 **오류를 낸다.**
     치자마자 멈춰서 **값이 아예 안 담겼다.**
   ★ 이제 부르는 쪽(calcType)이 커서 자리를 건네준다.
     못 건네받으면 try 로 감싸 읽어 본다. 실패해도 그냥 넘어간다. */
function redrawCalc(keepId, keepPos){
  const box=document.getElementById('calcbox');
  if(!box) return;
  let id = keepId ? ("c-" + keepId) : null, pos = keepPos;
  if(!id){
    const active = document.activeElement;
    id = active && active.id;
    try{ pos = active && active.selectionStart; }catch(e){ pos = null; }
  }
  box.innerHTML=calcView(); bindCalc();
  if(id){const el=document.getElementById(id); if(el){el.focus();
    try{ if(pos !== null && pos !== undefined) el.setSelectionRange(pos,pos); }catch(e){}}}
}
function bindCalc(){
  const box=document.getElementById('calcbox'); if(!box) return;
  /* ★ 세 입력칸의 손잡이는 이제 화면(oninput="calcType(…)")에 달려 있다.
     여기서 또 달면 **한 번 칠 때 두 번 돌아** 커서가 튄다.

     ★ 예전에 여기서 달던 것은 두 가지가 잘못돼 있었다.
       ① 칸 이름을 i- 로 찾았다. 새 화면은 c- 다.
          if(a) 로 가려 놓아 **오류도 안 났다.** 그냥 아무 일이 없었다.
       ② type="number" 라 커서 자리를 읽다가 멈췄다.
     ★ 지우지 말고 왜 없앴는지 적어 둔다 (절대규칙 ㊹). */
  box.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{CALC.ratio=Number(b.dataset.r);redrawCalc()});
  /* ★ 조합이 알린 분양가를 그대로 넣는다 (2026-09-17). */
  box.querySelectorAll('[data-useprice]').forEach(b=>b.onclick=()=>{
    CALC.price = Number(b.dataset.useprice) || null; redrawCalc(); });
  box.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{
    CALC.type=CALC.type===b.dataset.ty?null:b.dataset.ty;redrawCalc()});
  box.querySelectorAll('[data-help]').forEach(b=>b.onclick=()=>{
    const [t,d]=HELP[b.dataset.help];
    open(`<div style="font-size:.88rem;line-height:1.72;color:#37495E">${d}</div>
      <div class="sh-ft">정비사업 용어는 조합마다 세부 기준이 다를 수 있습니다.
      정확한 내용은 조합 사무실에서 확인해 주세요.</div>`, t, '용어 설명')});
  /* ★ 희망 평형에서 인근 시세로 건너가기 (2026-09-17 밤).
     고른 평형을 그대로 넘겨 그 평형만 보여 드린다. */
  box.querySelectorAll('[data-goapt]').forEach(b=>b.onclick=()=>{
    try{
      const k = b.dataset.goapt;
      const m2 = {t39:39,t49:49,t59:59,t84:84,t99:99}[k];
      if(m2 && typeof MKF !== "undefined") MKF.want = m2;   /* 있으면 쓴다 */
      MY.tab = "apt"; render(); scrollTo(0,0);
    }catch(e){ MY.tab = "apt"; render(); }
  });

  const rs=document.getElementById('calc-reset');
  if(rs) rs.onclick=()=>{CALC.appraisal=null;CALC.ratio=100;CALC.type=null;CALC.price=null;redrawCalc()};
}

render();
/* ★ 이제부터는 서버 값이 들어오면 다시 그려도 된다 (2026-09-17) */
HOME_READY = true;
</script>
