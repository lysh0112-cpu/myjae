<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>다알아 전자결재</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ═══════════════════════════════════════════════════════════
   다알아 (Da-Ara) — 전자결재
   ───────────────────────────────────────────────────────────
   ★ PC 와 휴대폰에서 모두 쓴다.
     PC   : 왼쪽 메뉴 + 본문
     휴대폰 : 메뉴가 숨고, 결재 대기 목록과 승인/반려만 크게 보인다.

   ★ 조합원 앱(index.html) · 직원 화면(admin.html) · 운영자 콘솔(console.html)
     과 분리돼 있다. 결재는 조합 임원이 쓰는 기능이라 따로 둔다.

   ★ 3단계 순차 결재
       1 담당자 → 2 총무이사 → 3 조합장
     앞 단계가 승인해야 다음 사람에게 넘어간다.
     중간에 반려되면 기안자에게 돌아가고, 뒤 단계는 열리지 않는다.

   ★ Supabase 로 옮길 때
       doc_classes   ← CLASSES   (분류 마스터 · 채번 일련번호 포함)
       doc_templates ← TEMPLATES (표준 품의문 양식)
       documents     ← DOCS      (문서 본문 · 상태)
       doc_approvals ← DOCS[].line (결재선 단계별 상태 · 시각)
       doc_files     ← DOCS[].files(증빙 PDF)

   ★ 지금은 화면 안에서만 돈다. 새로고침하면 초기값으로 돌아간다.
     파일 첨부도 흉내만 낸다. 실제 업로드는 Supabase Storage 로 붙여야 한다.
   ═══════════════════════════════════════════════════════════ */
:root{
  --ink:#0B1F3A; --navy:#12365F; --blue:#2563EB; --amber:#F26419;
  /* ★ 2026-09-16 밤 — 테두리가 너무 흐려 안 보인다는 말씀.
     #E2E7EE 는 흰 바탕 위에서 거의 사라진다. 특히 밝은 사무실 화면에서.
     ★ 두 단계로 나눈다 —
       --line   칸을 가르는 얇은 줄 (표 · 목록)
       --edge   상자를 두르는 진한 줄 (박스 · 입력칸)
     둘을 같은 색으로 두면 「무엇이 한 덩이인지」가 안 보인다. */
  --paper:#FFF; --mist:#F5F7FA; --line:#A9B7C8; --edge:#8695AA; --muted:#5F6B7A;
  --ok:#0EA97A; --red:#A83232;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--mist);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}

.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate-box{width:340px;max-width:100%;background:var(--paper);border-radius:16px;
  padding:30px 26px;border:1px solid var(--line)}
.gate-box h1{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.gate-box p.sub{font-size:.8rem;color:var(--muted);margin-bottom:20px}
.f{margin-bottom:11px}
.f label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font-size:.86rem;outline:none;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy)}
.f textarea{min-height:150px;line-height:1.9;resize:vertical}
.btn{display:block;width:100%;background:var(--navy);color:#fff;border-radius:10px;
  padding:12px;font-size:.88rem;font-weight:700;text-align:center}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #E8C0C0}
.btn.off{background:#B9C0C9;pointer-events:none}
.btn.sm{width:auto;display:inline-block;padding:9px 16px;font-size:.8rem}
.err{font-size:.76rem;color:var(--amber);margin-top:9px;min-height:17px}

.wrap{display:none;min-height:100vh}
.wrap.on{display:flex}
aside{width:200px;background:#0B1F3A;flex-shrink:0;padding:16px 0;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 17px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand b{display:block;color:#fff;font-size:.95rem;font-weight:800}
.brand span{display:block;color:#8FA3BA;font-size:.74rem;margin-top:3px}

/* ── 돌아가는 단추 (2026-08-22 오후) ─────────────────────
   ★ 전자결재는 새 창으로 열린다. 그래서 나갈 길이 없었다.
     브라우저 뒤로가기는 이 창에는 앞 기록이 없어 아무 일도 안 한다.
     결국 창을 닫는 수밖에 없었는데, 처음 오신 분은
     원래 화면이 뒤에 살아 있는 줄도 모르신다.

   ★ 메뉴 위가 아니라 이름표(brand) 바로 아래에 둔다.
     "여기가 어디인가" 다음에 "어디로 나가는가" 가 온다.
     메뉴 사이에 끼워 두면 결재 메뉴 중 하나로 보인다. */
.back{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  margin:12px 12px 0;width:calc(100% - 24px);
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:9px;padding:9px 11px;color:#C3D3E5;font-size:.79rem;font-weight:700}
.back:hover{background:rgba(255,255,255,.13);color:#fff}
.back i{font-style:normal;font-size:.9rem;line-height:1}
.back em{font-style:normal;display:block;font-size:.69rem;font-weight:600;
  color:#7B93AE;margin-top:2px}
.back b{display:block;font-weight:700}
nav{padding:9px 0;flex:1;overflow:auto}
nav button{display:block;width:100%;text-align:left;color:#B9C9DD;font-size:.83rem;
  padding:10px 17px;border-left:3px solid transparent}
nav button.on{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--amber);font-weight:700}
nav .bdg{float:right;background:var(--amber);color:#fff;font-size:.68rem;font-weight:800;
  padding:1px 7px;border-radius:99px}
.who{padding:13px 17px 0;border-top:1px solid rgba(255,255,255,.12)}
.who b{display:block;color:#C3D3E5;font-size:.78rem;font-weight:700}
.who span{display:block;color:#5F7B99;font-size:.72rem;margin-top:3px}
.who button{color:#8FA3BA;font-size:.72rem;margin-top:9px;text-decoration:underline}

main{flex:1;padding:24px 28px;min-width:0;max-width:900px}

/* ★ 입력칸을 내용에 맞게 잡는다.
   한 줄짜리 칸이 화면 끝까지 늘어나면 엉성해 보이고
   눈이 왼쪽 끝에서 오른쪽 끝까지 오가야 해서 읽기도 나쁘다. */
.f input,.f select,.f textarea{max-width:420px}
.f.wide input,.f.wide select,.f.wide textarea{max-width:100%}
.f.mini input,.f.mini select{max-width:170px}
.f.half input,.f.half select{max-width:280px}
.g2 .f input,.g2 .f select,.g3 .f input,.g3 .f select{max-width:100%}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.frow .f{margin-bottom:0}
.frow .grow{flex:1;min-width:220px}
.frow .grow input{max-width:100%}
.topbar{display:none}
h2.pt{font-size:1.15rem;font-weight:800;margin-bottom:3px}
p.pd{font-size:.82rem;color:var(--muted);margin-bottom:18px}
.sec{font-size:.88rem;font-weight:800;margin:20px 0 9px;display:flex;
  justify-content:space-between;align-items:center;gap:10px}
.sec em{font-style:normal;font-size:.76rem;font-weight:400;color:var(--muted)}
.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:1px dashed var(--line);font-size:.82rem}
.row:last-child{border-bottom:0}
.row span{color:var(--muted);flex-shrink:0}
.row b{font-weight:700;text-align:right;word-break:keep-all}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.mono{font-family:ui-monospace,Menlo,monospace}
.note{font-size:.78rem;color:var(--muted);line-height:1.7;margin-top:11px}
.warn{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;padding:12px 14px;margin-top:14px}
.warn > b:first-child{display:block;font-size:.82rem;color:#8C3A12;margin-bottom:3px}
.warn p b{font-weight:800;color:#8C3A12}
.warn p{font-size:.78rem;color:#A85B33;line-height:1.65}
.sample{background:#FFF4EC;border:1px solid #F3C7AC;border-radius:11px;padding:11px 14px;margin-bottom:16px}
.sample > b:first-child{display:block;font-size:.82rem;color:#8C3A12;margin-bottom:3px}
.sample p b{font-weight:800;color:#8C3A12}
.sample p{font-size:.78rem;color:#A85B33;line-height:1.6}

table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:var(--mist);color:var(--muted);font-size:.76rem;font-weight:700;
  text-align:left;padding:9px 11px}
td{padding:10px 11px;border-top:1px solid var(--line)}
tr.tap{cursor:pointer}
tr.tap:hover{background:var(--mist)}
tr.dim{opacity:.5}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:rgba(14,169,122,.13);color:var(--ok)}
.p-wait{background:#EEE;color:var(--muted)}
.p-warn{background:#FFF0E6;color:#8C3A12}
.p-red{background:#FBEBEB;color:var(--red)}
.p-blue{background:#E8EEF7;color:var(--navy)}

.filt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filt input,.filt select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-size:.8rem;background:#fff;outline:none}
.chipb{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:.8rem}
.chipb.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

.line{display:flex;align-items:stretch;gap:8px;margin:12px 0}
.step{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
.step.ok{border:1.5px solid var(--ok)}
.step.now{border:1.5px solid var(--amber);background:#FFFBF7}
.step.no{border:1.5px solid #E8C0C0;background:#FDF6F6}
.step em{font-style:normal;display:block;font-size:.68rem;color:var(--muted);letter-spacing:.02em}
.step b{display:block;font-size:.82rem;font-weight:700;margin-top:3px}
.step i{font-style:normal;display:block;font-size:.74rem;font-weight:700;margin-top:5px}
.arrow{align-self:center;color:#B9C0C9;flex-shrink:0}

.doclist{border-radius:11px;overflow:hidden}
.doclist.pend{border:1px solid #F3C7AC;background:#FFFBF7}
.doclist.done{border:1px solid var(--line);background:#fff}
.docrow{display:flex;gap:11px;align-items:center;padding:11px 13px;font-size:.8rem;cursor:pointer}
.docrow+.docrow{border-top:1px dashed var(--line)}
.doclist.pend .docrow+.docrow{border-top-color:#F0D6C4}
.docrow .no{width:112px;flex-shrink:0}
.docrow .ti{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow .dt{width:86px;flex-shrink:0;color:var(--muted)}
.docrow .st{width:78px;flex-shrink:0;text-align:right}

.ev{display:flex;gap:10px;align-items:center;padding:10px 12px;font-size:.8rem}
.ev+.ev{border-top:1px solid var(--line)}
.ev .ck{width:19px;height:19px;border-radius:5px;flex-shrink:0;display:grid;place-items:center;
  font-size:.7rem;color:#fff;background:var(--ok)}
.ev .ck.miss{background:#fff;border:1.5px solid var(--amber)}
.ev .nm{flex:1;min-width:0}
.ev .fs{width:120px;flex-shrink:0;color:var(--muted);font-size:.74rem}
.ev .ac{width:76px;flex-shrink:0;text-align:right;color:var(--blue);font-weight:700;font-size:.76rem}

.tpl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tplc{border:1px solid var(--line);border-radius:11px;padding:12px 14px;text-align:left;width:100%;
  position:relative;transition:border-color .12s,background .12s}
.tplc:hover{border-color:var(--navy);background:#F8FAFD}
.tplc:active{background:#F0F5FB}
.tplc b{display:block;font-size:.85rem;font-weight:700;padding-right:34px}
.tplc em{font-style:normal;position:absolute;top:12px;right:13px;font-size:.7rem;
  color:var(--muted);font-family:ui-monospace,monospace}
.tplc p{font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.5}
.tplc i{font-style:normal;display:block;font-size:.72rem;color:var(--navy);margin-top:7px}
.tplc .ar{position:absolute;right:13px;bottom:11px;color:#C6CEDA;font-size:.9rem}
/* 고른 양식을 얹어 두는 줄 */
.picked{display:flex;align-items:center;gap:12px;border:1.5px solid var(--navy);
  background:#F0F5FB;border-radius:11px;padding:11px 13px;margin-bottom:16px}
.picked .pc{font-family:ui-monospace,Menlo,monospace;font-size:.72rem;font-weight:700;
  color:#fff;background:var(--navy);padding:3px 8px;border-radius:6px;flex-shrink:0}
.picked b{flex:1;min-width:0;font-size:.86rem;font-weight:700}
.picked button{font-size:.76rem;color:var(--blue);font-weight:700;flex-shrink:0}
.diff{font-family:ui-monospace,Menlo,monospace;font-size:.76rem}
.diff s{color:var(--muted);text-decoration:line-through}
.diff b{color:var(--navy)}

.mask{position:absolute;inset:0;background:rgba(11,31,58,.55);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:40}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:86vh;
  overflow:auto;padding:20px 22px}
.pdfbox{background:#4A5462;border-radius:11px;padding:16px;display:flex;justify-content:center}
.pdfpg{width:230px;min-height:318px;background:#fff;border-radius:2px;padding:18px 16px}
.pdfpg h4{text-align:center;font-size:.78rem;font-weight:800;padding-bottom:8px;
  border-bottom:1.5px solid var(--ink);margin-bottom:10px}
.pdfpg div{font-size:.7rem;color:#41576B;line-height:2.1}

/* ── 알림 배너 (시연) ──────────────────────────────────── */
.noti{position:fixed;right:18px;bottom:18px;width:340px;max-width:calc(100% - 36px);
  z-index:60;display:flex;flex-direction:column;gap:10px}
.ncard{background:#fff;border:1px solid var(--ok);border-radius:12px;padding:13px 14px;
  box-shadow:0 6px 22px rgba(11,31,58,.13)}
.ncard.hold{border-color:var(--amber)}
.ncard .nh{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.ncard .nh b{font-size:.8rem;font-weight:800;color:#0A7A57}
.ncard.hold .nh b{color:#8C3A12}
.ncard .nh button{color:var(--muted);font-size:.9rem;line-height:1}
.ncard .meta{font-size:.76rem;color:#41576B;line-height:1.7;margin-top:6px}
.ncard .msg{background:var(--mist);border-radius:8px;padding:9px 10px;margin-top:9px;
  font-size:.74rem;color:#41576B;line-height:1.75;font-family:ui-monospace,Menlo,monospace;
  white-space:pre-wrap;word-break:break-all}
@media (max-width:760px){ .noti{right:10px;left:10px;bottom:10px;width:auto} }

/* ── A4 인쇄용 ─────────────────────────────────────────── */
.paper{display:none;background:#fff;color:#0B1F3A}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.paper .stamp{display:flex;border:1px solid #0B1F3A}
.paper .stamp>div{width:62px;text-align:center;border-right:1px solid #0B1F3A}
.paper .stamp>div:last-child{border-right:0}
.paper .stamp .lb{font-size:8pt;padding:3px 0;border-bottom:1px solid #0B1F3A}
.paper .stamp .sg{height:46px;display:grid;place-items:center}
.paper .stamp .sg span{width:30px;height:30px;border-radius:50%;border:1.5px solid #A83232;
  color:#A83232;font-size:9pt;display:grid;place-items:center}
.paper .stamp .dt{font-size:7pt;color:#5F6B7A;padding-bottom:3px}
.paper h1{text-align:center;font-size:17pt;font-weight:600;letter-spacing:.25em;
  padding:12px 0;border-top:2px solid #0B1F3A;border-bottom:1px solid #0B1F3A}
.paper .fr{display:flex;font-size:9.5pt;border-bottom:1px solid #D8DEE6}
.paper .fr .k{width:80px;background:#F5F7FA;padding:8px 10px;color:#41576B}
.paper .fr .v{flex:1;padding:8px 10px}
.paper .bd{font-size:9.5pt;line-height:2.1;padding:14px 10px 16px;white-space:pre-wrap}
.paper .att{border-top:1px solid #D8DEE6;padding-top:11px;font-size:9.5pt;line-height:1.95}
.paper .ft{text-align:center;font-size:8pt;color:#8A94A0;margin-top:22px;
  padding-top:9px;border-top:1px solid #E9EDF2}

@media print{
  @page{size:A4;margin:16mm}
  body{background:#fff}
  .gate,.wrap,.mask,.topbar,.noti{display:none !important}
  .paper{display:block !important}
}

/* ── 휴대폰 ────────────────────────────────────────────── */
@media (max-width:760px){
  aside{display:none}
  main{padding:0 0 40px;max-width:100%}
  .topbar{display:block;position:sticky;top:0;z-index:20;background:#0B1F3A;color:#fff;
    padding:13px 16px}
  .topbar b{display:block;font-size:.95rem;font-weight:800}
  .topbar span{display:block;font-size:.74rem;color:#8FA3BA;margin-top:2px}
  .mtabs{display:flex;background:#12365F}
  .mtabs button{flex:1;color:#B9C9DD;font-size:.8rem;padding:11px 0;border-bottom:2px solid transparent}
  .mtabs button.on{color:#fff;font-weight:700;border-bottom-color:var(--amber)}
  .inner{padding:16px}
  h2.pt{font-size:1.05rem}
  .g2,.g3,.tpl{grid-template-columns:1fr}
  .line{flex-direction:row;gap:6px}
  .step{padding:8px 7px;text-align:center}
  .step em{font-size:.64rem}
  .step b{font-size:.74rem}
  .step i{font-size:.7rem}
  .arrow{display:none}
  table{font-size:.76rem}
  th,td{padding:8px 8px}
  .docrow{flex-wrap:wrap}
  .docrow .no{width:100%;font-size:.74rem}
  .docrow .ti{flex-basis:100%;white-space:normal}
  .docrow .dt{width:auto}
  .docrow .st{width:auto;margin-left:auto}
  .actbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:20}
}
@media (min-width:761px){ .mtabs{display:none} .inner{padding:0} }
/* ── 테두리에 힘을 준다 (2026-09-16 밤) ──────────────────
   ★ 「외곽 테두리가 너무 희미해서 안 보인다」는 말씀.
     칸을 가르는 줄(--line)과 상자를 두르는 줄(--edge)을 갈랐다.
     흰 바탕 대비 1.24 : 1 → 상자선 3.05 : 1 (권장 3:1)
   ★ 이 덩이는 맨 아래에 둔다. 위의 규칙을 덮어써야 한다. */
.box,.card,.panel,.warn,.fold{border-color:var(--edge)}
th{border-bottom:2px solid var(--edge)}
td{border-top:1px solid var(--line)}
tbody tr:nth-child(even) > td{background:#FAFCFE}
input,select,textarea{border-color:var(--edge)}

/* ── 계정 ─────────────────────────────────────────────────
   암호를 소스에 그대로 적지 않기 위해 해시로만 둔다.
   화면 안에서만 하는 검사라 진짜 보안이 아니다.
   개발 단계라 암호는 전부 111111 로 통일했다. */
const hsh = t => { let x=5381; for(const c of t){ x=((x*33)^c.codePointAt(0))>>>0 } return x.toString(36); };
const USERS = [
  {hash:hsh("류승현2|111111"), name:"류승현2", role:"담당자",   step:1},
  {hash:hsh("박총무|111111"),   name:"박총무",   role:"총무이사", step:2},
  {hash:hsh("김조합장|111111"), name:"김조합장", role:"조합장",   step:3},
  {hash:hsh("류승현|111111"),   name:"류승현",   role:"운영자",   step:0}
];
const S = {name:"", role:"", step:0};
const isDrafter = () => S.step === 1 || S.step === 0;

/* ── 문서 분류 마스터 (CRUD) ─────────────────────────────
   지우지 않고 active:false 로 둔다. 지우면 옛 문서의 분류번호가 미아가 된다.
   seq 는 연도별 마지막 일련번호. 채번은 [코드]-[연도]-[3자리]. */
const CLASSES = [
  {code:"ADM", name:"조합 행정",  keep:"5년", active:true,  year:2026, seq:14},
  {code:"CON", name:"용역 · 계약", keep:"영구", active:true,  year:2026, seq:8},

  {code:"DOC", name:"공문 발송",  keep:"5년", active:true,  year:2026, seq:5},

  {code:"CSN", name:"동의서 징구", keep:"영구", active:true,  year:2026, seq:0},
  {code:"TMP", name:"임시 서식",  keep:"3년", active:false, year:2025, seq:21}
];
const cls = c => CLASSES.find(x => x.code === c);
const nextNo = code => {          /* 저장하는 순간 확정된다. 이후 바뀌지 않는다. */
  const c = cls(code); if(!c) return "";
  const y = new Date().getFullYear();
  if(c.year !== y){ c.year = y; c.seq = 0; }
  c.seq += 1;
  return `${c.code}-${c.year}-${String(c.seq).padStart(3,"0")}`;
};
const peekNo = code => {
  const c = cls(code); if(!c) return "";
  const y = new Date().getFullYear();
  const seq = (c.year === y ? c.seq : 0) + 1;
  return `${c.code}-${y}-${String(seq).padStart(3,"0")}`;
};

/* ══════════════════════════════════════════════════════════
   알림 발송 (문자 · 카카오 알림톡)
   ──────────────────────────────────────────────────────────
   ★ 지금은 시연 모드다. 실제로 발송하지 않고
     화면 오른쪽 아래 배너 + 브라우저 콘솔에만 남긴다.
     운영으로 바꾸려면 NOTIFY.mode 를 "live" 로 두고
     sendReal() 안에서 Edge Function 을 부르면 된다.

   ★ 발송 시점
       기안 상신    → 2단계 결재자에게
       승인(중간)   → 다음 단계 결재자에게
       승인(최종)   → 기안자에게 완료 알림
       반려         → 기안자에게 사유와 함께

   ★ 알림톡이 실패하면 문자로 대체한다.
     카카오톡을 안 쓰거나 채널을 차단한 분이 조합 임원 중에 꼭 있다.

   ★ 밤 9시~아침 8시에는 보류했다가 아침에 보낸다.
     조합장 폰이 새벽에 울리면 그다음부터 알림을 꺼 버리신다.

   ★ 링크는 1회용이고 24시간 뒤 만료된다.
     문자는 남에게 전달되기 쉽다. 영구 링크면 캡처 한 장으로 아무나 들어온다.

   ★ Supabase 대응
       NOTIFY_LOG      → notify_log        (발송 이력)
       TOKENS          → approval_tokens   (1회용 링크)
       실제 발송        → Edge Function notify-approval
                          (supabase-notify 폴더의 예시 코드 참조)
   ══════════════════════════════════════════════════════════ */

const NOTIFY = {
  mode      : "demo",          /* demo · live */
  quietFrom : 21,              /* 이 시각부터 보류 */
  quietTo   : 8,               /* 이 시각에 발송 */
  remindDays: 3,               /* 미결 독촉 (1회) */
  sender    : "02-000-0000",   /* 발신번호 · 사전등록 필요 */
  base      : location.origin + location.pathname
};

/* 1회용 링크 토큰 */
const TOKENS = [];
function makeToken(docNo, who){
  const t = Math.random().toString(36).slice(2,10).toUpperCase();
  const exp = new Date(Date.now() + 24*60*60*1000);
  TOKENS.push({token:t, doc:docNo, approver:who, expires:exp, used:false});
  return t;
}
const linkOf = (docNo, who) => `${NOTIFY.base}?d=${docNo}&t=${makeToken(docNo,who)}`;

/* 발송 이력 */
let NOTIFY_LOG = [
  {at:"2026-03-11 17:25", to:"류승현2", phone:"010-****-6317", reason:"반려",
   doc:"ADM-2026-013", channel:"알림톡", result:"fail"},
  {at:"2026-03-11 17:26", to:"류승현2", phone:"010-****-6317", reason:"반려",
   doc:"ADM-2026-013", channel:"문자",   result:"fallback"},
  {at:"2026-03-18 09:13", to:"박총무",   phone:"010-****-2841", reason:"신규 기안",
   doc:"MTG-2026-007", channel:"알림톡", result:"ok"},
  {at:"2026-03-20 14:16", to:"박총무",   phone:"010-****-2841", reason:"신규 기안",
   doc:"WDR-2026-004", channel:"알림톡", result:"ok"}
];
const RESULT_LAB  = {ok:"성공", fallback:"대체 발송", fail:"실패", hold:"보류"};
const RESULT_PILL = {ok:"p-ok", fallback:"p-blue", fail:"p-warn", hold:"p-warn"};

const stamp = () => { const d=new Date(), z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`; };
const isQuiet = () => { const h=new Date().getHours();
  return h >= NOTIFY.quietFrom || h < NOTIFY.quietTo; };

/* 메시지 조립 — 알림톡 템플릿과 같은 모양이어야 한다.
   템플릿은 카카오 심사를 받아야 하고, 변수 자리만 채울 수 있다. */
function buildMsg(kind, o){
  const head = "[다알아 전자결재]";
  if(kind === "reject")
    return `${head}\n[${o.to}님] 상신하신 문서가 반려되었습니다.\n`
         + `문서 : ${o.doc}\n제목 : ${o.title}\n반려 : ${o.by}\n사유 : ${o.comment}\n▶ 문서 보기\n${o.link}`;
  if(kind === "done")
    return `${head}\n[${o.to}님] 상신하신 문서의 결재가 완료되었습니다.\n`
         + `문서 : ${o.doc}\n제목 : ${o.title}\n▶ 문서 보기\n${o.link}`;
  if(kind === "final")
    return `${head}\n[${o.to}님] 최종 결재 차례입니다.\n`
         + `문서 : ${o.doc}\n제목 : ${o.title}\n앞 결재 : ${o.prev}\n▶ 바로 결재하기\n${o.link}`;
  return `${head}\n[${o.to}님] 처리해야 할 대기 문서가 있습니다.\n`
       + `문서 : ${o.doc}\n제목 : ${o.title}\n기안 : ${o.drafter}\n▶ 바로 결재하기\n${o.link}`;
}

/* 실제 발송 자리 — 운영으로 바꿀 때 여기만 채우면 된다 */
async function sendReal(payload){
  /* 예시
     const r = await fetch(SUPABASE_URL + "/functions/v1/notify-approval", {
       method:"POST",
       headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + ANON_KEY },
       body: JSON.stringify(payload)
     });
     return r.ok ? "ok" : "fail";
  */
  return "ok";
}

/* 알림 보내기 (시연) */
function notify(kind, o){
  const link = linkOf(o.doc, o.to);
  const msg  = buildMsg(kind, Object.assign({}, o, {link}));
  const hold = isQuiet();

  /* 알림톡을 우선 쓰고, 실패하면 문자로 대체한다.
     시연에서는 이름에 '조합장'이 들어가면 차단된 것으로 가정해 대체 발송을 보여준다. */
  const blocked = /조합장/.test(o.to);
  const channel = hold ? "보류" : blocked ? "문자" : "알림톡";
  const result  = hold ? "hold" : blocked ? "fallback" : "ok";

  NOTIFY_LOG.push({at:stamp(), to:o.to, phone:o.phone||"010-****-0000",
    reason:o.reason, doc:o.doc, channel, result});

  console.log("[다알아 알림 · 시연]", {받는사람:o.to, 사유:o.reason,
    채널:channel, 결과:RESULT_LAB[result], 메시지:msg});

  if(NOTIFY.mode === "live") sendReal({kind, ...o, msg});
  banner({to:o.to, phone:o.phone, reason:o.reason, channel, hold, msg});
}

/* 오른쪽 아래 배너 */
function banner(b){
  const box = document.getElementById('noti'); if(!box) return;
  const el = document.createElement('div');
  el.className = "ncard" + (b.hold ? " hold" : "");
  el.innerHTML = `
    <div class="nh">
      <b>${b.hold ? "야간 · 아침에 발송합니다" : "알림 발송 (시연 · 실제로 나가지 않음)"}</b>
      <button onclick="this.closest('.ncard').remove()">✕</button></div>
    <div class="meta">
      <b style="font-weight:700">받는 사람</b> ${b.to} · ${b.phone||"010-****-0000"}<br>

function preset(k){
  const d=new Date(), z=n=>String(n).padStart(2,"0");
  const fmt=x=>`${x.getFullYear()}-${z(x.getMonth()+1)}-${z(x.getDate())}`;
  if(k==="month"){ LIST.from=fmt(new Date(d.getFullYear(),d.getMonth(),1)); LIST.to=fmt(d); }
  else { const s=new Date(d); s.setDate(d.getDate()-6); LIST.from=fmt(s); LIST.to=fmt(d); }
  render();
}

function openDoc(no){ openDocNo = no; go('doc'); }
function act(no, how){
  const d = DOCS.find(x=>x.no===no); if(!d) return;
  const step = d.line.find(x=>x.status==="wait" && x.step===S.step);
  if(!step){ alert("지금은 결재하실 차례가 아닙니다."); return; }
  const el = document.getElementById('a-cmt');
  const cmt = el ? el.value.trim() : "";
  if(how==="no" && !cmt){ alert("반려하실 때는 사유를 적어 주십시오."); return; }
  const now = new Date(), z=n=>String(n).padStart(2,"0");
  step.status = how==="ok" ? "ok" : "no";
  step.acted_at = `${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())} ${z(now.getHours())}:${z(now.getMinutes())}`;
  step.comment = cmt || null;
  if(typeof docsPut !== "undefined") docsPut(S.name);
  if(how==="no"){
    d.status = "rejected";
    /* 동의서 묶음이면 서면들을 다시 접수 대기로 돌린다.
       보완해서 다시 올리실 수 있어야 한다. */
    if(d.code === "CSN" && d.batch && typeof consentBatchReject !== "undefined")
      consentBatchReject(d.batch, cmt);
    /* 서식이 반려되면 작성 중으로 되돌려 고치실 수 있게 한다 */
    if(d.code === "CSN" && d.formId && typeof CONSENT_MADE !== "undefined"){
      const cf = CONSENT_MADE.find(x => x.id === d.formId);
      if(cf){ cf.state = "draft"; formsPut(S.name); }
    }
    /* 반려 → 기안자에게 사유와 함께 */
    notify("reject", {to:d.drafter, phone:phoneOf(d.drafter), reason:"반려",
      doc:d.no, title:d.title, by:`${S.role} ${S.name}`, comment:cmt});
  } else if(d.line.every(x=>x.status==="ok")){
    d.status = "approved";
    /* ★ 명부 변경 품의면 여기서 실제로 명부에 반영한다.
       단, 투표가 진행 중이면 미뤄 둔다.
       도중에 모수가 바뀌면 이미 던져진 표들의 기준이 달라진다. */
    if(d.mbr){
      const r = mbrApply(d);
      if(r.held){
        alert(`승인했습니다 (시연)\n\n다만 총회 투표가 진행 중이라\n`
          + `명부에는 투표 마감 후에 반영됩니다.\n\n`
          + `도중에 모수가 바뀌면 이미 던져진 표의 기준이 달라집니다.`);
      } else if(r.ok){
        alert(`승인했습니다 (시연)\n\n명부에 반영되었습니다.\n`
          + `추가 ${r.add} · 갱신 ${r.upd} · 삭제 ${r.del}\n`
          + `명부 ${r.all}명 · 의결권자 ${r.voter}명`);
      }
    }

    /* ★ 동의서 징구 명단이면 대장에 확정한다.
       조합장 승인 전까지는 대장이 아니다. 서면 접수만으로는 숫자가 되지 않는다. */
    /* ★ 동의서 서식 승인이면 그 서식을 '승인' 으로 바꾼다.
       승인 전에는 징구를 시작할 수 없다. */
    if(d.code === "CSN" && d.formId && typeof CONSENT_MADE !== "undefined"){
      const cf = CONSENT_MADE.find(x => x.id === d.formId);
      if(cf){ cf.state = "approved"; formsPut(S.name); }
      alert(`승인했습니다 (시연)\n\n${d.title}\n\n`
        + `직원 화면에서 [징구 시작]을 누르시면\n조합원 앱에 나타납니다.`);
    }

    if(d.code === "CSN" && d.batch && typeof consentBatchApprove !== "undefined"){
      const r = consentBatchApprove(d.batch);
      if(r.ok){
        const t = (typeof consentTally !== "undefined")
          ? consentTally((typeof consentOf!=="undefined") ? "C-ESTAB" : "") : null;
        alert(`승인했습니다 (시연)\n\n서면 ${r.n}건이 대장에 확정되었습니다.`
          + (t ? `\n\n대장 ${t.submitted}건 · 동의 ${t.yes}명\n`
               + `사람 수 ${t.yes}/${t.needOwner} ${t.okOwner?"충족":"미달"}\n`
               + `면적 ${t.areaYes}/${t.needArea}㎡ ${t.okArea?"충족":"미달"}` : ""));
      }
    }

    /* ★ 지출 품의면 회계 집계로 자동 등록 (집행 대기)
       결재가 났다고 돈이 나간 것은 아니다.
       실제로 지급한 뒤 직원 화면에서 '집행 완료'를 눌러야 집계에 들어간다. */
    if(typeof EXPENSE !== "undefined" && d.amount && d.item){
      const eid = "E-" + String(EXPENSE.length + 1).padStart(4,"0");
      /* 날인 대장이 함께 만들어졌으면 그 번호를 물려 준다.
         세무사가 이 번호로 인감 사용 기록까지 대조한다. */
      const sealNoOf = (d.seal && d.seal.on)
        ? (SEAL_LEDGER.find(x=>x.doc===d.no)||{}).no || "" : "";
      EXPENSE.push({id:eid, doc:d.no, item:d.item, title:d.title,
        amount: Number(String(d.amount).replace(/[^0-9]/g,"")) || 0,
        approved: step.acted_at.slice(0,10), paid:null, status:"approved",
        payee: d.payee || "—", tax: d.tax || "과세", bizNo: d.bizNo || "", seal: sealNoOf,
        files: d.files.filter(f=>!f.missing).map(f=>({kind:f.kind, name:f.name}))});
    }

    /* ★ 날인이 필요한 문서면 인장날인 대장으로 자동 등록 (날인 대기) */
    if(d.seal && d.seal.on){
      const sn = sealNo();
      SEAL_LEDGER.push({no:sn, doc:d.no, place:d.seal.place, reason:d.seal.reason,
        kind:d.seal.kind, count:d.seal.count, carry:!!d.seal.carry, keep:d.seal.keep,
        approved_at: step.acted_at.slice(0,10), sealed_at:null, sealer:null, status:"pending"});
      d.seal.ledger = sn;
    }
    /* 최종 승인 → 기안자에게 완료 알림 */
    notify("done", {to:d.drafter, phone:phoneOf(d.drafter), reason:"결재 완료",
      doc:d.no, title:d.title});
  } else {
    /* 다음 단계 결재자에게 순차 도래 알림 */
    const nx = d.line.find(x=>x.status==="wait");
    if(nx) notify(nx.step===3 ? "final" : "new", {
      to:nx.approver, phone:phoneOf(nx.approver), reason:"순차 도래",
      doc:d.no, title:d.title, drafter:d.drafter,
      prev:`${S.role} ${S.name} 승인 ${step.acted_at.slice(5)}`});
  }
  alert(how==="ok" ? `승인했습니다 (시연)\n${d.no}` : `반려했습니다 (시연)\n${d.no}`);
  go('box');
}

function backToPick(){ keepWrite(); WSTEP = "pick"; render(); scrollTo(0,0); }
function pickTpl(id){
  const t = TEMPLATES.find(x=>x.id===id); if(!t) return;
  NEWDOC.tpl=id; NEWDOC.code=t.code; NEWDOC.title=t.title; NEWDOC.body=t.body; NEWDOC.amount="";
  NEWDOC.files = t.need.map(k=>({kind:k, name:"", size:"", required:true, missing:true}));
  /* 날인 전용 양식은 날인 칸을 자동으로 켠다 */
  NEWDOC.seal = {on:!!t.seal, kind:"조합 인감", count:1, carry:false,
                 place:"", reason:"", keep:""};
  NEWDOC.item = ""; NEWDOC.payee = ""; NEWDOC.bizNo = ""; NEWDOC.tax = "과세";
  WSTEP = "form";                 /* 작성 화면으로 넘어간다 */
  render(); scrollTo(0,0);
}
function keepWrite(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:null;};
  const a=g('w-title'), b=g('w-body'), c=g('w-amount');
  if(a!==null) NEWDOC.title=a; if(b!==null) NEWDOC.body=b; if(c!==null) NEWDOC.amount=c;
  const it=g('w-item'), py=g('w-payee'), bz=g('w-biz'), tx=g('w-tax');
  if(it!==null) NEWDOC.item=it; if(py!==null) NEWDOC.payee=py;
  if(bz!==null) NEWDOC.bizNo=bz; if(tx!==null) NEWDOC.tax=tx;
  const p=g('s-place'), r=g('s-reason'), k=g('s-keep'), n=g('s-cnt');
  if(p!==null) NEWDOC.seal.place=p; if(r!==null) NEWDOC.seal.reason=r;
  if(k!==null) NEWDOC.seal.keep=k;  if(n!==null) NEWDOC.seal.count=Number(n)||1;
}
function sealOn(v){ keepWrite(); NEWDOC.seal.on=v; render(); }
function sealCarry(v){ keepWrite(); NEWDOC.seal.carry=v; render(); }
function addFile(){
  keepWrite();
  const k = prompt("증빙 종류를 적어 주십시오 (예: 견적서)");
  if(!k) return;
  NEWDOC.files.push({kind:k, name:k.replace(/\s/g,"")+".pdf", size:"0.8MB", required:false, missing:false});
  render();
}
function fillFile(i){
  keepWrite();
  const f = NEWDOC.files[i]; if(!f) return;
  f.missing=false; f.name=f.kind.replace(/\s/g,"")+".pdf"; f.size="1.1MB";
  render();
}
function dropFile(i){ keepWrite(); NEWDOC.files.splice(i,1); render(); }
function submitDoc(){
  keepWrite();
  if(!NEWDOC.title.trim()){ alert("제목을 적어 주십시오."); return; }
  const no = nextNo(NEWDOC.code);
  const line = mkLine();
  line[0].status="ok";
  const now=new Date(), z=n=>String(n).padStart(2,"0");
  const today=`${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  line[0].acted_at=`${today} ${z(now.getHours())}:${z(now.getMinutes())}`;
  if(NEWDOC.seal.on && !NEWDOC.seal.place.trim()){
    alert("날인 사용처를 적어 주십시오. 어디에 찍는지가 대장의 핵심입니다."); return; }
  DOCS.push({no, code:NEWDOC.code, title:NEWDOC.title, amount:NEWDOC.amount,
    drafted:today, drafter:S.name, status:"pending", body:NEWDOC.body,
    files:NEWDOC.files.slice(), line,
    item: NEWDOC.item || null, payee: NEWDOC.payee || null,
    bizNo: NEWDOC.bizNo || "", tax: NEWDOC.tax || "과세",
    seal: NEWDOC.seal.on ? Object.assign({}, NEWDOC.seal) : null});
  /* 신규 기안 → 2단계 결재자에게 */
  notify("new", {to:line[1].approver, phone:phoneOf(line[1].approver), reason:"신규 기안",
    doc:no, title:NEWDOC.title, drafter:S.name});
  alert(`기안 완료 (시연)\n문서 분류번호 ${no}\n${line[1].role} ${line[1].approver}님께 알림이 갑니다.`);
  NEWDOC.tpl=null; NEWDOC.files=[]; NEWDOC.item=""; NEWDOC.payee="";
  NEWDOC.bizNo=""; NEWDOC.tax="과세"; WSTEP="pick";
  NEWDOC.seal={on:false, kind:"조합 인감", count:1, carry:false, place:"", reason:"", keep:""};
  openDocNo=no; go('doc');
}

async function viewPdf(no, i){
  const d = DOCS.find(x=>x.no===no); if(!d) return;
  const f = d.files[i]; if(!f) return;

  /* ★ 실제로 올라간 스캔이면 그것을 연다.
     조합장이 명단만 보고 승인하시는 것과
     스캔을 직접 확인하고 승인하시는 것은 다르다.
     나중에 다투게 되면 "실제로 보고 승인했다"는 기록이 필요하다. */
  if(f.path && typeof hubFileUrl !== "undefined"){
    if(f.path.indexOf("/") >= 0){
      alert("예전 방식으로 올라간 스캔이라 열 수 없습니다.\n\n"
        + "조합 직원에게 다시 올려 달라고 알려 주십시오."); return;
    }
    const u = await hubFileUrl(f.path, 3600);
    if(u){ window.open(u, "_blank"); return; }
    alert("스캔을 열지 못했습니다.\n잠시 뒤 다시 눌러 주십시오.");
    return;
  }

function doSeal(no){
  const x = SEAL_LEDGER.find(y=>y.no===no); if(!x) return;
  const now = new Date(), z=v=>String(v).padStart(2,"0");
  const today = `${now.getFullYear()}-${z(now.getMonth()+1)}-${z(now.getDate())}`;
  const d = prompt(`실제로 도장을 찍은 날짜를 적어 주십시오.\n(대장에는 이 날짜가 남습니다)`, today);
  if(d===null) return;
  const c = prompt(`실제 날인 매수는 몇 매입니까?\n(품의 때 ${x.count}매로 올렸습니다)`, String(x.count));
  if(c===null) return;
  const who = prompt("날인자를 적어 주십시오", "김조합장");
  if(who===null) return;
  x.sealed_at = d.trim() || today;
  x.count = Number(c) || x.count;
  x.sealer = who.trim() || "김조합장";
  x.status = "done";
  alert(`날인 처리했습니다 (시연)\n${x.no} · ${x.sealed_at} · ${x.count}매`);
  render();
}

  <div class="sec">운영으로 바꾸려면</div>

};
function resend(i){
  const x = NOTIFY_LOG[i]; if(!x) return;
  NOTIFY_LOG.push({at:stamp(), to:x.to, phone:x.phone, reason:x.reason,
    doc:x.doc, channel:"문자", result:"fallback"});
  banner({to:x.to, phone:x.phone, reason:x.reason+" · 재발송", channel:"문자", hold:false,
    msg:`[다알아 전자결재]\n[${x.to}님] 알림톡 발송에 실패하여 문자로 다시 보냅니다.\n문서 : ${x.doc}`});
  render();
}
function remindAll(){
  DOCS.filter(d=>d.status==="pending").forEach(d=>{
    const days = (Date.now() - new Date(d.drafted).getTime()) / 86400000;
    if(days < NOTIFY.remindDays) return;
    const nx = d.line.find(x=>x.status==="wait"); if(!nx) return;
    notify("new", {to:nx.approver, phone:phoneOf(nx.approver), reason:"미결 독촉",
      doc:d.no, title:d.title, drafter:d.drafter});
  });
  render();
}

/* ═══════════════════════════════════════════════════════════
   돌아가는 길 (2026-08-22 오후)
   ───────────────────────────────────────────────────────────
   ★ 전자결재는 새 창으로 열린다. 그래서 나갈 길이 없었다.
     브라우저 뒤로가기는 이 창에 앞 기록이 없어 아무 일도 안 한다.
     창을 닫는 수밖에 없었는데, 처음 오신 분은
     원래 화면이 뒤에 살아 있는 줄도 모르신다.

   ★★★ 자리마다 돌아갈 곳이 다르다. 한 곳으로 몰면 안 된다 ★★★

       운영자(0단계)   → 운영자 콘솔
       담당자(1단계)   → 조합 직원 화면
       총무이사(2단계) → 없음
       조합장(3단계)   → 없음

     총무이사와 조합장은 admin · console 계정이 아니다.
     그분들께 단추를 보여 드리면 눌러도 로그인 창만 뜬다.
     "왜 안 들어가지냐" 는 문의가 오고, 답할 것이 없다.

     특히 **조합장을 운영자 콘솔로 보내면 안 된다.**
     콘솔에는 전 구역 자료와 우리 요금 원가가 들어 있다.
     조합장은 우리 고객이지 운영자가 아니다.
     (인수인계서 9번 절 — 운영진과 조합은 보는 것이 다르다)

   ★ 새 창으로 열렸으면 창을 닫아 원래 창으로 돌려보낸다.
     같은 자리로 옮겨 가면 직원 화면이 두 개가 된다.
     어느 쪽에서 고친 것이 맞는지 알 수 없게 된다. */
const BACKS = {
  0: {url:"console.html", label:"운영자 콘솔",   memo:"전 구역 관리"},
  1: {url:"admin.html",   label:"조합 직원 화면", memo:"미아2재정비촉진구역"}
};

function drawBack(){
  const el = document.getElementById('back');
  if(!el) return;
  const b = BACKS[S.step];
  if(!b){                                        /* 총무이사 · 조합장 */
    el.style.display = "none";
    el.innerHTML = ""; el.onclick = null;        /* 안 보여도 남겨 두지 않는다 */
    return;
  }

  /* 원래 창이 아직 살아 있는가 */
  let opened = false;
  try { opened = !!(window.opener && !window.opener.closed); } catch(e){ opened = false; }

  el.style.display = "flex";
  el.innerHTML = `<i>←</i><span><b>${b.label}</b>`
    + `<em>${opened ? "이 창을 닫고 돌아갑니다" : b.memo}</em></span>`;
  el.title = b.label + " 으로 돌아가기";
  el.onclick = () => goBack(b, opened);
}

function goBack(b, opened){
  if(opened){
    try {
      window.opener.focus();
      window.close();
      /* ★ 창이 안 닫히는 브라우저가 있다. 그때는 그냥 옮겨 간다.
         눌렀는데 아무 일이 없으면 무엇이 잘못됐는지 알 수 없다. */
      setTimeout(() => { if(!window.closed) location.href = b.url; }, 250);
      return;
    } catch(e){ /* 아래로 내려가 옮겨 간다 */ }
  }
  location.href = b.url;
}

/* ── 라우팅 ─────────────────────────────────────────── */
const MENU = [
  ["box","결재함"], ["write","문서 기안"], ["seal","인장날인 대장"],
  ["notify","알림 발송 이력"], ["cls","문서 분류 관리"], ["approver","결재자 관리"]
];
const MMENU = [["box","결재함"], ["write","기안"], ["seal","날인"],
  ["notify","알림"], ["cls","분류"]];

function go(k){ cur = k; render(); scrollTo(0,0); }

/* ★ 직원 화면에서 이어서 들어온다 (2026-08-22) ─────────
   admin.html 에서 [결재함 열기]를 누르면 그 직원 계정으로 곧장 들어온다.
   한 번에 로그인을 두 번 치시게 하면 결국 결재를 미루신다.

   ★★ 담당자(1단계)까지만 이어진다. ★★
     총무이사 · 조합장은 아무리 표를 들고 와도 통과시키지 않는다.
     직원 PC에서 조합장 결재를 누를 수 있으면 결재가 아무 의미가 없다.
     결재선을 지키는 것이 이 화면을 따로 만든 이유다.

   ★ 표는 60초만 쓴다. 한 번 쓰면 바로 지운다.
     남겨 두면 나중에 그 PC를 쓰는 사람이 그대로 들어온다.

   ★ 지금은 화면 안에서만 확인한다. 진짜 자물쇠가 아니다.
     Supabase Auth 를 붙일 때 서버에서 발급한 토큰으로 바꾼다.
     → 인수인계서 「배포 전 반드시 ⑱ Supabase Auth 로 관리자 로그인 이전」 */
const AP_PASS = "daara_ap_pass";
function takePass(){
  let raw = null;
  try { raw = localStorage.getItem(AP_PASS); } catch(e){ return false; }
  if(!raw) return false;
  try { localStorage.removeItem(AP_PASS); } catch(e){}   /* 한 번 쓰고 버린다 */

  let t; try { t = JSON.parse(raw); } catch(e){ return false; }
  if(!t || !t.name) return false;
  if(Date.now() - (t.at||0) > 60000) return false;        /* 60초 지나면 버린다 */

  const u = USERS.find(x => x.name === String(t.name).normalize("NFC").trim());
  if(!u) return false;
  if(u.step > 1) return false;                            /* ★ 담당자까지만 */

  S.name = u.name; S.role = u.role; S.step = u.step;
  return true;
}

/* ★ 다른 화면에서 바로 어느 자리로 갈지 정해 준다 (2026-08-22).
   admin.html 의 [전자결재]에서 넘어올 때 쓴다.
     approval.html?go=box      결재함
     approval.html?go=write    문서 기안
     approval.html?go=seal     인장날인 대장
   ★ 없는 이름이 오면 결재함으로 보낸다.
     주소를 손으로 고치다 오타가 나도 빈 화면이 나오면 안 된다. */
function takeGo(){
  const q = new URLSearchParams(location.search);
  const g = (q.get("go") || "").trim();
  if(!g) return false;
  cur = MENU.some(([k]) => k === g) ? g : "box";
  return true;
}

/* ★ 다른 화면에서 넘어온 품의 내용을 받아 기안 칸을 채운다.
   직원이 금액을 손으로 옮겨 적으면 오타가 난다. */
function takeHandoff(){
  const q = new URLSearchParams(location.search);
  if(!q.get("title")) return false;
  const tid = q.get("tpl") || "T1";
  const t = TEMPLATES.find(x => x.id === tid);
  if(t){
    NEWDOC.tpl = t.id; NEWDOC.code = t.code;
    NEWDOC.files = t.need.map(k => ({kind:k, name:"", size:"", required:true, missing:true}));
    NEWDOC.seal = {on:false, kind:"조합 인감", count:1, carry:false, place:"", reason:"", keep:""};
  }
  NEWDOC.title  = q.get("title") || "";
  NEWDOC.body   = q.get("body")  || NEWDOC.body;
  NEWDOC.amount = q.get("amount") ? Number(q.get("amount")).toLocaleString("ko-KR") : "";
  NEWDOC.item   = q.get("item")  || "";
  NEWDOC.payee  = q.get("payee") || "";
  NEWDOC.bizNo  = q.get("biz")   || "";
  NEWDOC.tax    = q.get("tax")   || "과세";
  WSTEP = "form"; cur = "write";
  return true;
}

document.getElementById('g-go').onclick = () => {
  const n = document.getElementById('g-name').value.trim();
  const p = document.getElementById('g-pw').value;
  const e = document.getElementById('g-err');
  if(!n || !p){ e.textContent='이름과 암호를 입력하세요.'; return; }
  const u = USERS.find(x => x.hash === hsh(`${n}|${p}`));
  if(!u){ e.textContent='이름 또는 암호가 맞지 않습니다.'; return; }
  S.name=u.name; S.role=u.role; S.step=u.step;
  document.getElementById('gate').style.display='none';
  document.getElementById('wrap').classList.add('on');
  takeGo();                      /* ?go= 로 지정한 자리로 */
  takeHandoff();                 /* 넘어온 품의가 있으면 기안 화면으로 */
  render();
};
document.getElementById('g-pw').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('g-go').click();
});
document.getElementById('logout').onclick = () => location.reload();
document.getElementById('mask').onclick = e => { if(e.target.id==='mask') closeModal(); };

/* ★ 직원 화면에서 이어서 들어오신 경우 로그인 창을 건너뛴다.
   표가 없거나 담당자 위 자리면 평소대로 로그인 창이 뜬다. */
if(takePass()){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('wrap').classList.add('on');
  takeGo();
  takeHandoff();
  render();
}
